  logic: 定位日主+月支 → 取该组歌诀 → 得顺逆与喜忌方位
  boundary: 属口诀式速查，须与格局喜忌合看
  limits: 与渊海「行运十神断法」可互补，但口径可能不同，须逐组核对
  novelty: new
  relates: [D05]
  tags: [运程, 口诀, 速查]
