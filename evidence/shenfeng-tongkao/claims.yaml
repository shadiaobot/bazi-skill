# 《神峰通考》新主张（第一批：补薄域 + 辟谬）

- id: c-sf-0001
  domain: D01
  title: 起八字后的看命人式（根苗花果、月气浅深）
  source_id: src-shenfeng-tongkao
  location: 第 64 章 · 起八字诀
  quote: |
    "凡看命，排下八字，以日为主，取年为根，为上祖，才知世派之盛衰。取月为苗，为父母，则知亲荫之有无。日干为身，支为妻，时为花实为子息。"
  rule: |
    排定八字后，以日为主：年为根（祖上）、月为苗（父母）、日干为身、日支为妻、时为花实（子息）；
    再分月气浅深与得令与否。
  trigger: 排盘后开始判断时
  logic: 定位四柱角色 → 判月气得令 → 看财官印与身强弱
  boundary: 「身衰财旺，多反破财伤身」；「学者不可执泥」
  limits: 与《渊海子平》第 65 章同源，措辞几乎一致
  novelty: extends
  relates: [D03]
  tags: [排盘, 日主, 同源]

- id: c-sf-0002
  domain: D01
  title: 小运起法：按生时干支顺逆，周岁一易
  source_id: src-shenfeng-tongkao
  location: 第 66 章 · 男女命小运定局
  quote: |
    "此法阳命甲子时生，则行乙丑，二岁丙寅，阴则癸亥，周而复始。"
  rule: |
    小运以生时干支为起点，阳命顺行（甲子→乙丑→丙寅…），阴命逆行（癸亥…），一周岁一易。
  trigger: 需要排小运时
  logic: 生时干支 → 按阴阳顺逆排 → 每年一柱
  boundary: 男命女命取顺逆的口诀分别列在第 66 章两张表
  limits: 与《渊海子平》第 56 章行小运法同源；本书给出完整岁序表
  novelty: extends
  relates: [D07]
  tags: [小运, 起例]

- id: c-sf-0003
  domain: D11
  title: 反纳音与生肖：以年支一字论命是谬说
  source_id: src-shenfeng-tongkao
  location: 第 2 章 · 五星谬说类
  quote: |
    "夫何后世妄以海中炉中无理之说，立为门户。……又以人之生年、十二支生肖所属，论人吉凶，夫何谬也！"
  rule: |
    以纳音（海中金、炉中火）与生年十二生肖论吉凶，皆属谬说；生肖只是禽兽比喻，与八字干支无关。
  trigger: 命局或命书以纳音、生肖断命时
  logic: 回到四柱干支生克与财官旺衰判断
  boundary: 作者举同属龙的两命（一贵一贫）为例，说明一字定命不成立
  limits: 与《渊海子平》纳音、生肖章节正面冲突
  novelty: contradicts
  relates: [D05]
  tags: [纳音, 生肖, 辟谬, 冲突]

- id: c-sf-0004
  domain: D11
  title: 反神煞：贵人之说不根理出
  source_id: src-shenfeng-tongkao
  location: 第 4 章 · 总论子平谬说类
  quote: |
    "虽曰天乙贵人，日主临此贵人之上，或作日贵论其体咎。然贵人之说，名有数端，原取名之不据理出。……且原立诸多贵人之说，只是飘空而立，不根理出。岂可信乎？"
  rule: |
    天乙贵人、日贵等神煞名目来源不明、不根理出；不能不论财官印星而单以贵人断命。
  trigger: 命局以神煞定贵贱时
  logic: 以财官印与日主旺衰为据，神煞不作主判
  boundary: 作者承认其说「名有数端」，但否认其能定体咎
  limits: 与《渊海子平》神煞体系正面冲突；与《子平真诠》同阵营
  novelty: contradicts
  relates: [D05]
  tags: [神煞, 贵人, 冲突]

- id: c-sf-0005
  domain: D05
  title: 反奇格：日德、魁罡、趋乾、趋艮皆无中生有
  source_id: src-shenfeng-tongkao
  location: 第 4 章 · 总论子平谬说类
  quote: |
    "不考原委，不询来历，误以日德名之，岂不是子平中之谬说乎？……六壬趋艮……俱是无中生有之说"
  rule: |
    日德、魁罡、六壬趋艮、六甲趋乾等格，命名无来历、无理论依据，属「无中生有」之说。
  trigger: 命局被套入上述奇格时
  logic: 回到月令与财官旺衰判断，不因格名定贵贱
  boundary: 作者仍承认部分专旺格（见下条），并非全盘否定所有格
  limits: 与《渊海子平》内外十八格直接冲突
  novelty: contradicts
  relates: [D15]
  tags: [奇格, 辟谬, 冲突]

- id: c-sf-0006
  domain: D05
  title: 专旺五格中只有曲直、稼穑多富贵
  source_id: src-shenfeng-tongkao
  location: 第 4 章 · 总论子平谬说类
  quote: |
    "未曾有富贵者，但当以别理推之。止有曲直稼穑二格多富贵，火全巳午未格，亦未见其美。"
  rule: |
    从革、润下等专旺格「多剥杂」「未曾有富贵者」，只有曲直、稼穑两格多富贵；炎上（火全巳午未）亦未见其美。
  trigger: 判从革、润下、炎上等专旺格时
  logic: 先验实际格局是否纯粹，不因成全局就断富贵
  boundary: 曲直、稼穑为例外，可作贵格
  limits: 与《渊海子平》五专旺格平等对待不同；与《子平真诠》顺气势说部分相左
  novelty: contradicts
  relates: [D15]
  tags: [专旺, 曲直, 稼穑, 冲突]

- id: c-sf-0007
  domain: D13
  title: 女命以财官印为旺夫之物
  source_id: src-shenfeng-tongkao
  location: 第 79 章 · 女命歌
  quote: |
    "财官印绶三般物，女命逢之必旺夫。不犯杀多无混杂，身强制伏有称呼。"
  rule: |
    女命见财、官、印三者主旺夫；但须不犯杀多混杂，且身强能制伏，方有称呼（名分）。
  trigger: 分析女命时
  logic: 查财官印是否俱全 → 查七杀是否混杂 → 查身之强弱
  boundary: 身弱不能任财官时，旺夫之力不显
  limits: 与《渊海子平》「官为夫、财生官」同旨，本书强调「财官印三般」
  novelty: extends
  relates: [D08]
  tags: [女命, 财官印]

- id: c-sf-0008
  domain: D13
  title: 女命伤官无财无印则孤贫
  source_id: src-shenfeng-tongkao
  location: 第 79 章 · 女命歌
  quote: |
    "女命伤官福不真，无财无印受孤贫。局中若见伤官透，必作堂前使唤人。"
  rule: |
    女命伤官本不真，若又无财无印，主孤贫；伤官透干者，地位低微（「堂前使唤人」）。
  trigger: 女命见伤官时
  logic: 伤官 + 无财无印 → 孤贫；有财有印则可解（见下条）
  boundary: 带财带印者反为福（第 79 章后句）
  limits: 含明代身份判断，属时代性断言，标 epoch-limit
  novelty: extends
  relates: [D09]
  tags: [女命, 伤官, 时代局限]

- id: c-sf-0009
  domain: D13
  title: 女命有夫带合为正、有合无夫为偏
  source_id: src-shenfeng-tongkao
  location: 第 79 章 · 女命歌
  quote: |
    "有夫带合须还正，有合无夫定是偏。官杀犯重成下格，伤官重合不须言。"
  rule: |
    女命有夫星而带合者仍为正；只有合而无夫星者定为偏；官杀重见成下格；伤官与合并重者不必再论。
  trigger: 女命婚姻判断时
  logic: 查夫星有无 → 查合之有无与轻重 → 定正偏
  boundary: 官杀重见即降格，不必再论其他
  limits: 与《渊海子平》「女命官杀只宜一位」一致，本书给出正偏之别
  novelty: extends
  relates: [D12]
  tags: [女命, 婚姻, 合]

- id: c-sf-0010
  domain: D13
  title: 女命桃花：官带桃花昌、桃花带杀不祥
  source_id: src-shenfeng-tongkao
  location: 第 79 章 · 女命歌
  quote: |
    "官带桃花福寿昌，桃花带杀少祯祥。命中切忌桃花犯，劫比桃花大不良。"
  rule: |
    女命官星带桃花主福寿；桃花与七杀同见则少吉；桃花逢劫财比肩尤不良。
  trigger: 女命见桃花（咸池）时
  logic: 看桃花与官/杀/劫比的组合 → 分吉凶
  boundary: 与《渊海子平》「咸池主淫」的绝对化说法不同，本书分组合而论
  limits: 仍属时代性论断，标 epoch-limit
  novelty: contradicts
  relates: [D11]
  tags: [女命, 桃花, 冲突]

- id: c-sf-0011
  domain: D14
  title: 带疾歌：伤官、火局、杀重、水多、火旺各有其疾
  source_id: src-shenfeng-tongkao
  location: 第 76 章 · 带疾歌
  quote: |
    "戊己生时气不全，月时两处见伤官。必当头面有亏损，脓血之疮苦少年。……壬癸重重叠叠排，时辰设若见天财。纵然头面无斑癞，定是其人眼目灾。"
  rule: |
    按日主与过旺之神的组合断疾：戊己见伤官主头面疮疡；火局熏蒸主残疾脱发目不明；
    杀重三合主残疾；壬癸重叠见财主眼目灾；丙丁火旺休囚见辰巳主哑中风。
  trigger: 推断疾病部位时
  logic: 按日主五行 + 过旺之神/局 → 对应病象
  boundary: 条件均要求「气不全」「重重叠叠」等明显偏枯
  limits: 属古代病名与相术式断言，不作医学判断
  novelty: extends
  relates: [D03]
  tags: [疾病, 断语, 时代局限]

- id: c-sf-0012
  domain: D14
  title: 寿元歌：寿星被憎嫌、岁运逢之则危
  source_id: src-shenfeng-tongkao
  location: 第 77 章 · 寿元歌
  quote: |
    "寿算幽玄识者希，识时须是泄天机。六亲内有憎嫌者，岁运逢之总不宜。"
  rule: |
    寿元难测；命局中六亲位有憎嫌之神，岁运再逢之，即为寿元之忌。
  trigger: 推断寿元时
  logic: 找局中受憎之字 → 看岁运是否再逢
  boundary: 书中另举丙临申位逢壬癸水为「必死无疑」，属绝对化断语
  limits: 无任何效度依据；只作历史断言
  novelty: new
  relates: [D07]
  tags: [寿元, 岁运, 断语]

- id: c-sf-0013
  domain: D14
  title: 疾病先看日干月令，再从重者论
  source_id: src-shenfeng-tongkao
  location: 第 8 章 · 病药说类
  quote: |
    "如八字中看了日干，次看了月令……宜将以上各火做一处看，或为病，或非病。……故曰：从重者论。"
  rule: |
    看命与看病的下手顺序相同：先日干、次月令，把同类之字集中判其为病或非病，从重者论。
  trigger: 判疾病或判命局病神时
  logic: 日干 → 月令 → 集中同类字 → 判病 → 从重
  boundary: 「若再看别物，则混杂不明」
  limits: 与《渊海子平》第 282 章同文，属同源文本
  novelty: extends
  relates: [D06]
  tags: [疾病, 病药, 同源]

# 第二批：运岁（54–55）、神趣八法（53）、从化（37）、六亲（7）

- id: c-sf-0014
  domain: D07
  title: 岁冲运为吉、运冲岁为不利（裁决渊海的两说）
  source_id: src-shenfeng-tongkao
  location: 第 54 章 · 论大运
  quote: |
    "不宜与太岁相克，若岁冲运又吉，运冲岁则甚不利，岁运相生者吉"
  rule: |
    岁与运相冲并非一律为凶：岁冲运反吉，运冲岁则甚不利；岁运相生为吉。
  trigger: 判断岁运关系时
  logic: 看冲的方向（岁冲运 / 运冲岁）与生克方向
  boundary: 前提是「不宜与太岁相克」，相冲仍有条件
  limits: 这条正好支持《渊海子平》第 160 章「岁冲克运者吉」一说，可用来裁决该书内部的矛盾
  novelty: extends
  relates: [D02]
  tags: [岁运, 冲, 裁决]

- id: c-sf-0015
  domain: D07
  title: 太岁不可犯：日犯岁君灾重，有救反为财
  source_id: src-shenfeng-tongkao
  location: 第 55 章 · 论太岁
  quote: |
    "太岁，乃天中天子，甚不可犯之，若犯之则凶，云日犯岁君，灾殃必重，五行有救，其年反必为财。"
  rule: |
    太岁为君，不可犯；日主犯岁君则灾重，但若五行有救（如甲日见戊土太岁），其年反可为财。
  trigger: 流年判断时
  logic: 看日干与太岁的关系 → 有救则转吉、无救则凶
  boundary: 「克重者死」「犯岁者其年必主凶丧」属绝对化断语
  limits: 与渊海第 161 章太岁论同旨，本书强调「有救反为财」
  novelty: extends
  relates: [D06]
  tags: [太岁, 流年, 有救]

- id: c-sf-0016
  domain: D15
  title: 神趣八法之「类象」：一方秀气不可间断
  source_id: src-shenfeng-tongkao
  location: 第 53 章 · 神趣八法
  quote: |
    "夫类象者，乃天地之一类也。如春生或甲乙天干，值志支寅卯辰全，无间断破坏，谓之夺东方一片气秀气。怕引至时上，为死绝之乡，谓之破了秀气"
  rule: |
    类象指四柱取一方之气（春生甲乙、支全寅卯辰），须无间断破坏；若时上引至死绝，则破了秀气；
    引至生旺则秀气加临。
  trigger: 判类象格时
  logic: 查方局是否全 → 查时上是否死绝 → 定成破
  boundary: 时上死绝即不吉，运至死绝亦不吉
  limits: 《渊海子平》第 164 章有类象但判据较简，本书给出完整条件
  novelty: extends
  relates: [D05]
  tags: [神趣八法, 类象]

- id: c-sf-0017
  domain: D15
  title: 神趣八法之「从象」：无根方可从，有根不吉
  source_id: src-shenfeng-tongkao
  location: 第 53 章 · 神趣八法
  quote: |
    "夫从象者，如甲乙日主无根，遇地支纯金，谓之从金。若四柱纯土，谓之从土。……或天干再有甲乙字，或有根者不吉"
  rule: |
    从象要求日主无根而地支纯一（纯金从金、纯土从土、纯水从水、纯木从木）；
    天干再见同类或日主有根者不吉。
  trigger: 判从格时
  logic: 验日主无根 → 验地支纯一 → 从之；有根或再透同类则不成立
  boundary: 从木者须木旺乃吉，死绝地凶
  limits: 与渊海、子平真诠的从格判据一致（无根为要）
  novelty: extends
  relates: [D05]
  tags: [神趣八法, 从象]

- id: c-sf-0018
  domain: D15
  title: 神趣八法之「化象」：争合妒合为破格
  source_id: src-shenfeng-tongkao
  location: 第 53 章 · 神趣八法
  quote: |
    "夫化象者，如甲己生人，在辰戌丑未月，天干有一己字合甲字，谓之甲己化土。喜行火旺运……八字中有二甲字，谓之争合。有一乙字，谓之妒合。皆为破格。"
  rule: |
    化象须生于化神当令之月（甲己化土须辰戌丑未月），天干一对一相合；喜行化神旺运；
    再见同类（争合）或克化神之干（妒合）即破格。
  trigger: 判化气格时
  logic: 验月令 → 验一对一合 → 查争合/妒合 → 定成破
  boundary: 见化神被克之运则「化不成，反为不吉」
  limits: 与子平真诠「化神得时乘令」一致，本书补出争合/妒合的破格条件
  novelty: extends
  relates: [D05]
  tags: [神趣八法, 化象, 争合]

- id: c-sf-0019
  domain: D15
  title: 神趣八法之「返象」：用神引至时上绝乡
  source_id: src-shenfeng-tongkao
  location: 第 53 章 · 神趣八法
  quote: |
    "返象者，所谓值月令用神，引至时上一位为之绝乡，谓之用而不用，皆为返运。返去太甚，则大不吉。"
  rule: |
    月令用神被引到时就落绝乡，等于「用而不用」，称返象；返去太过则大不吉。
  trigger: 判返象或时柱不利时
  logic: 月令用神 → 查时支宫位 → 落绝即返
  boundary: 「返去太甚」为凶的加重条件
  limits: 与子平真诠「返象三义」不同（本书只取时上绝乡一说）
  novelty: new
  relates: [D03]
  tags: [神趣八法, 返象]

- id: c-sf-0020
  domain: D15
  title: 神趣八法之「鬼象」：秋木见纯金，须行鬼旺运
  source_id: src-shenfeng-tongkao
  location: 第 53 章 · 神趣八法
  quote: |
    "鬼象者，乃秋生甲乙曰，地支纯金，谓之鬼象。要行鬼生旺之运则吉，怕见至死绝乡，又得身旺则不吉。"
  rule: |
    秋生甲乙而地支纯金为鬼象：喜行金（鬼）生旺之运，怕鬼至死绝之乡；若日主身旺则反不吉。
  trigger: 判鬼象时
  logic: 验秋生木日 + 地支纯金 → 顺鬼之势，身须不旺
  boundary: 身旺则不吉，与从格「身旺则不从」同理
  limits: 与从杀格判据相近，区别在「鬼象」限秋生甲乙
  novelty: new
  relates: [D04]
  tags: [神趣八法, 鬼象]

- id: c-sf-0021
  domain: D15
  title: 从化格：六阴日主多从化，六阳不能从化
  source_id: src-shenfeng-tongkao
  location: 第 37 章 · 从化格
  quote: |
    "但六阴日主，身弱多作从化，多主富贵。如乙日干庚辰时，地支或全巳酉丑，或见辰戌丑未四字多，亦作乙庚化金看……六阳日干，不能从化也。"
  rule: |
    从化以六阴日主身弱为多，主富贵；六阳日干不能从化。乙日见巳酉丑或辰戌丑未多，作乙庚化金看。
  trigger: 判从化格时
  logic: 验日干阴阳 → 阴干身弱 → 查合化与地支 → 化金则行西方富贵
  boundary: 一见丙丁运破金则死（绝对化断语）
  limits: 与子平真诠「化神得时乘令」略有出入（本书更强调阴干），属流派差异
  novelty: contradicts
  relates: [D05]
  tags: [从化, 阴阳, 冲突]

- id: c-sf-0022
  domain: D12
  title: 年看祖宗、月看父母兄弟：宫位各有主
  source_id: src-shenfeng-tongkao
  location: 第 7 章 · 六亲说
  quote: |
    "年上财官，主祖宗之荣显；月上官杀，主兄弟之凋零。……年看祖宗兴废事，月推父母定留存。"
  rule: |
    年柱看祖宗兴废（年上财官主祖荣），月柱看父母兄弟（月上官杀主兄弟凋零）。
  trigger: 断六亲时
  logic: 年柱 → 祖宗；月柱 → 父母兄弟；再看所临之神
  boundary: 岁月无财官者主根基浅薄、白手成家；月令官杀司权主损兄弟
  limits: 与渊海、子平真诠的宫位法一致
  novelty: extends
  relates: [D02]
  tags: [六亲, 宫位]

- id: c-sf-0023
  domain: D12
  title: 六亲断语是「死格」，须以去病为准
  source_id: src-shenfeng-tongkao
  location: 第 7 章 · 六亲说
  quote: |
    "但只看八字，有病能去其病，由有妻有夫子也。论六亲只是死格"
  rule: |
    六亲的宫星对应只是「死格」；真正断有无，要看命局之病能否被去掉。
  trigger: 断六亲吉凶时
  logic: 先看宫星 → 再以病药定实际有无
  boundary: 与病药说联动：病去则六亲全，病存则六亲缺
  limits: 与渊海、子平真诠的六亲直断不同，本书把它挂到病药上
  novelty: contradicts
  relates: [D06]
  tags: [六亲, 病药, 冲突]

# 第三批：吉凶神类（62–63）、格局生死歌（56）、五星论（57）

- id: c-sf-0024
  domain: D11
  title: 本书的自相矛盾：一面斥神煞，一面编吉神类
  source_id: src-shenfeng-tongkao
  location: 第 62 章 · 吉神类
  quote: |
    "天乙贵人 甲戊兼牛羊，乙己鼠猴乡，丙丁猪鸡位，壬癸兔蛇藏，庚辛逢马虎，此是贵人方。"
  rule: |
    本书第 2、4 章斥神煞「不根理出」，第 62 章却仍完整编纂天乙贵人、天德、月德、学堂的查法与赞语；
    说明作者反对的是「以神煞定成败」，并不否认神煞可作参考。
  trigger: 引用本书的神煞态度时
  logic: 区分「定格局」与「参断语」两个用途
  boundary: 赞语多引自《三车一览赋》《惊神赋》等，属汇编性质，非作者原创判断
  limits: 这是全书最明显的一处内部张力，合并时正可支撑「双轨」方案
  novelty: new
  relates: [D05]
  tags: [神煞, 内部矛盾, 双轨]

- id: c-sf-0025
  domain: D11
  title: 凶神类的取法：丧门吊客勾绞孤寡
  source_id: src-shenfeng-tongkao
  location: 第 63 章 · 凶神类
  quote: |
    "《集说》云：命前三辰为丧门，命后三辰为吊客……命前四辰为勾，命后四辰为绞。"
  rule: |
    神煞多以年支为基准取：前三辰为丧门、后三辰为吊客；前四辰为勾、后四辰为绞；另有孤神、寡宿的固定表。
  trigger: 查凶神时
  logic: 年支 → 按前后辰数推 → 得对应神煞
  boundary: 神煞只在断语层增减，不参与格局成败（承第 2、4 章立场）
  limits: 与渊海第 47–53 章的部分取法可对照，但基准（年支/日支）需逐条核
  novelty: extends
  relates: [D05]
  tags: [神煞, 凶神, 取法]

- id: c-sf-0026
  domain: D05
  title: 认格局生死之歌：四类「必死」组合与「不可拘、须敢断」
  source_id: src-shenfeng-tongkao
  location: 第 56 章 · 认格局生死之歌
  quote: |
    "印绶见财行财运，又见死绝入黄泉。……正官见杀及伤官刑冲破害，岁运相并必死。……其余诸格，并忌煞及填实，岁运并临，此亦具其大概而言，一不可拘，二须敢断。"
  rule: |
    给出四类高风险组合：印见财又行财运并死绝、官见杀与伤官刑冲、财见比肩又岁运冲合、伤官格财旺身弱官杀重见。
    但末句自注「一不可拘，二须敢断」——既是死法，又要求敢下判断。
  trigger: 判格局生死关口时
  logic: 按格找对应的高危组合 → 查岁运是否并临 → 下断但标注为体系内断言
  boundary: 四类「必死」均为绝对化断语，不作事实预测
  limits: 与子平真诠「成中有败、败中有成」的弹性判断形成对照
  novelty: extends
  relates: [D06]
  tags: [生死, 断语, 绝对化]

- id: c-sf-0027
  domain: D03
  title: 五星论：五行随四时改变性情与喜忌
  source_id: src-shenfeng-tongkao
  location: 第 57 章 · 五星论
  quote: |
    "春月见之，性柔体弱，常用日时坐命处，以生旺助其柔性，见木多则反成锉志……夏月之金，性尚在柔，未执方，犹嫌死绝，贵乎旺相"
  rule: |
    同一五行在不同季节性情不同：春金柔弱须生旺助、木多反挫；夏金尚柔嫌死绝、贵旺相。
    论命须按「季节 × 五行」判其喜忌，不能只看五行本名。
  trigger: 判断某五行在命局中的实际性情与喜忌时
  logic: 先定季节 → 再定该行在该季的强弱与喜忌 → 落到取用
  boundary: 属象数式的四时性情描述，与调候说（子平真诠第 16 章）可互证
  limits: 篇幅极长（全书最长章之一），本文只取总则
  novelty: extends
  relates: [D04]
  tags: [五行, 四时, 调候]

# 第四批：格章抽样（12 偏官、19 阳刃建禄、22 飞天禄马）

- id: c-sf-0028
  domain: D08
  title: 有杀须论杀、无杀方论用；制杀太过为尽法无民
  source_id: src-shenfeng-tongkao
  location: 第 12 章 · 偏官格
  quote: |
    "用偏官，如人之畜奴仆，擒制太过，则为尽法无民，则奴仆力衰，不能为我运动。"
  rule: |
    七杀须制，但制之不及则「奴欺主」、制之太过则「尽法无民」，两者都不成；命局有杀时先处置杀，无杀才论常规用神。
  trigger: 命局见七杀时
  logic: 先看杀 → 制之得中 → 再论其余
  boundary: 杀为「克身之刀剑」，不能置之不理
  limits: 与渊海「七杀须制、制太过反为凶」一致，本书给出「奴仆」比喻
  novelty: extends
  relates: [D04]
  tags: [七杀, 制伏, 去留]

- id: c-sf-0029
  domain: D08
  title: 月上官星无可用之理（本书最激进的一说）
  source_id: src-shenfeng-tongkao
  location: 第 12 章 · 偏官格
  quote: |
    "月上逢官无可用之理，但能管束我之身，安肯为我用也？……吾亦未见用月上官星是贵命，只见用杀星，多富贵人也。"
  rule: |
    作者认为月令正官只能「管束我身」，不肯为我所用；所见贵命多用七杀，少见用正官者。
  trigger: 月令为正官时
  logic: 以「能否为我所用」为标准：官只制身、杀可制而为我用
  boundary: 作者仍承认「官星衰则生之，官星太旺则克之」，即官并非全不可用
  limits: 与渊海「正官为贵气」、子平真诠「官不可伤」均相反，属第三本书的特异立场
  novelty: contradicts
  relates: [D05, D04]
  tags: [正官, 七杀, 冲突]

- id: c-sf-0030
  domain: D10
  title: 六阳有刃、六阴无刃；刃可为用亦可为病
  source_id: src-shenfeng-tongkao
  location: 第 19 章 · 阳刃格
  quote: |
    "阳刃格，六阳日干谓之阳刃理也，六阴日干不谓之刃。"
  rule: |
    阳刃只属六阳日干；刃可为用神，也可为病：甲日生卯月，若木气已旺，则刃为病，须用庚金七杀去刃；
    若去刃后财官过重使日主转弱，则刃反为用神。
  trigger: 命局为阳刃格时
  logic: 看日主是否已过旺 → 过旺则刃为病须制；制后转弱则刃为用须扶
  boundary: 冲去刃星（如甲行酉运）可致极凶
  limits: 第三次支持「五阴无刃」，与渊海第 54 章直接冲突
  novelty: contradicts
  relates: [D03, D08]
  tags: [阳刃, 五阴无刃, 用病转换]

- id: c-sf-0031
  domain: D05
  title: 飞天禄马「非造化自然之理」，似无而有
  source_id: src-shenfeng-tongkao
  location: 第 22 章 · 飞天禄马格
  quote: |
    "此数格自非造化自然之理，故作聪明凤取其理。……此理似无而又有，似非而仅有是也。"
  rule: |
    飞天禄马一类的暗冲取官格，并非自然之理，是「作聪明」附会出来的；但作者又承认其「似无而又有」，
    故保留而加限制（忌填实、忌羁绊、忌官星显露）。
  trigger: 命局拟判飞天禄马时
  logic: 先按正理判断；若仍取此格，须逐条核忌（丑栏、午破、官星填露）
  boundary: 作者态度是「存疑但保留」，不是全盘否定
  limits: 与子平真诠「支离附会」的否定态度接近，与渊海的全盘采用不同
  novelty: contradicts
  relates: [D15]
  tags: [飞天禄马, 暗冲, 冲突]

# 第五批：制化之辨（13）、真假伤官（17）

- id: c-sf-0032
  domain: D08
  title: 制杀不如化杀高；制与化不可并立
  source_id: src-shenfeng-tongkao
  location: 第 13 章 · 时上一位贵格
  quote: |
    "杀一也，而驯服为用有二，制与化是也。制杀者，食神也，所谓服之以力也。化杀者，印绶也。所谓服之以德也。与其制之以力，不若化之以德。"
  rule: |
    七杀可用两种方式驯服：食神制杀（服之以力）与印绶化杀（服之以德）；作者认为化杀优于制杀。
  trigger: 命局七杀需要处置时
  logic: 优先考虑印化；无印可用时再以食制
  boundary: 「制化不可并立」——二者不可同时作为主用
  limits: 与渊海「七杀须制」侧重不同，本书明确「制不如化」
  novelty: contradicts
  relates: [D04]
  tags: [七杀, 制化, 冲突]

- id: c-sf-0033
  domain: D08
  title: 制化强弱失衡的两种后果
  source_id: src-shenfeng-tongkao
  location: 第 13 章 · 时上一位贵格
  quote: |
    "倘若化神弱，制神强，施恩有不足之怨，化神旺，制神衰，临事无禁制之能。"
  rule: |
    化弱制强：恩威失衡，施恩不足；化旺制衰：临事缺乏禁制之力。两者都不成完局。
  trigger: 命局同时有化神与制神时
  logic: 比较化神与制神强弱 → 判失衡类型
  boundary: 制化本不可并立，此处是并见时的失衡判断
  limits: 「强弱」仍无量化
  novelty: new
  relates: [D04]
  tags: [制化, 强弱, 失衡]

- id: c-sf-0034
  domain: D09
  title: 伤官见官为祸的机理：不服管而再犯
  source_id: src-shenfeng-tongkao
  location: 第 17 章 · 伤官食神格
  quote: |
    "今则伤官者，则是伤杀其官，不服官管，如弑杀上官之类，则为强贼化外之民。如此格，就要不见官星，如再见官星……则官肯放汝乎？"
  rule: |
    伤官的本义是「不服官管、伤其官」；已成伤官格再见官星，如逃犯再遇官府，故为祸百端。
    这给「伤官见官为祸」提供了机理，而非只是禁忌口号。
  trigger: 伤官格见官星时
  logic: 先确认伤官格成立 → 再见官即为「再犯」
  boundary: 「伤官伤尽最为奇，尤恐伤多反不宜」——伤尽与伤多都不理想
  limits: 比喻式解释，非严格推演
  novelty: extends
  relates: [D04]
  tags: [伤官, 见官, 机理]

- id: c-sf-0035
  domain: D09
  title: 真伤官与假伤官：季节决定见官吉凶
  source_id: src-shenfeng-tongkao
  location: 第 17 章 · 伤官食神格
  quote: |
    "盖木火伤官格，假如甲乙木生正月，见火为假伤官，其火乃虚火，其焰未炽，且木气朴坚，虽见火而木之真性不焚。……若甲乙木生临巳午月，炎火盗甲乙木之气，则谓真伤官也。"
  rule: |
    同是木火伤官，生正月者为「假伤官」——火虚未炽、木气坚，反喜庚金官旺来制木；
    生巳午月者为「真伤官」——火盛盗气，反畏见官。故「木火见官官要旺」只适用于假伤官。
  trigger: 判木火伤官是否宜见官时
  logic: 看生月（正月 vs 巳午月）→ 定真/假 → 定见官吉凶
  boundary: 日主旺、伤官多、比肩多而财弱时，反喜见官制比劫存财
  limits: 与渊海「伤官见官为祸百端」形成条件化修正；与子平真诠「金水伤官见官反秀」互补
  novelty: contradicts
  relates: [D04, D03]
  tags: [伤官, 真假, 见官, 冲突]

# 第六批：节气歌断（84）、病源赋（113）、金不换骨髓歌（58）

- id: c-sf-0036
  domain: D01
  title: 节气歌断：逐节气定五行当令
  source_id: src-shenfeng-tongkao
  location: 第 84 章 · 节气歌断
  quote: |
    "凡看命，要论节气浅深，以分轻重。立春一日火方生，雨水之中木正荣。惊蛰春分皆论木，其中轻重在三旬。"
  rule: |
    按节气分段定当令五行：立春后火始生、雨水后木正荣、惊蛰春分论木，且以三旬分轻重；
    其后立夏论土、小满丙火、夏至阳极为转捩，直至冬至火堪论、大寒金土并存。
  trigger: 需要判定出生时节当令五行时
  logic: 节气 → 该节气主气 → 结合三旬分轻重
  boundary: 「此是五行生旺理，再凭造化定衰兴」——仍须合全局
  limits: 与渊海第 59 章总诀、第 60 章节气歌可对照，三处日数互有出入
  novelty: extends
  relates: [D03]
  tags: [节气, 司令, 起例]

- id: c-sf-0037
  domain: D14
  title: 病源赋：五行刑克对应脏腑与肢体
  source_id: src-shenfeng-tongkao
  location: 第 113 章 · 病源赋
  quote: |
    "甲庚乙辛，气损于肢。戊甲己乙，风中乎体。……木为金制，不无掌手之儿童。火被水刑，未免失明之子弟。"
  rule: |
    疾病按五行相刑相克推：甲庚乙辛主肢体损伤、戊甲己乙主中风；木被金制主手足伤、火被水刑主失明；
    另有土败胃积、木刑面疮、癸逢己内疝、壬遇戊外癃、庚缘丙血下、辛值丁气郁等对应。
  trigger: 推断疾病部位时
  logic: 找受刑克之五行 → 对应脏腑/肢体 → 参以日时衰旺
  boundary: 「主衰鬼制则残疾」「日时居衰，乃大患之不疗」——须合日主强弱
  limits: 古代病名与五行映射，不作医学判断；与渊海第 159 章可互证
  novelty: extends
  relates: [D03]
  tags: [疾病, 五行, 刑克]

