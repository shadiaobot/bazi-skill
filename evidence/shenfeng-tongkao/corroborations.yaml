# 与已有主张的同源/相同记录

- id: r-sf-0001
  domain: D06
  corroborates: cap.D06.bingyao
  source_id: src-shenfeng-tongkao
  location: 第 8 章 · 病药说类
  quote: |
    "有病方为贵，无伤不是奇；格中如去病，财禄两相随。"
  stance: same
  note: 与《渊海子平》第 282 章几乎同文；本书可视为该说的文献源头

