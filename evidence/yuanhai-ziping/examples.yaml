- id: e-yh-001
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 时上偏官格命例（史弥远、李如桂）
  quote: '"甲申丙寅乙卯辛巳，此用日干旺，时上偏官，月上制伏，得其中和，故为贵矣。庚子戊子戊寅甲寅，时上偏官，年上制伏，早年登第，历任尚书，乃先年巡按绣衣李如桂八字也。"'
  outcome: 前例判贵，后例明记「早年登第，历任尚书」
  kind: worked_example
- id: e-yh-002
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 杂气财官格命例（史太师、邵囱、土重金埋例、洪武皇帝）
  quote: '"丙戌戊戌甲午己巳，杂气财官格，此命用辛官，己为财，戌中有辛金余气，戊己土财旺生官，所以富贵两全。辛丑壬辰丙戌乙未，此八字邵囱，行官印运，早年登科，仕至御史。辛未辛丑庚戌庚辰，此人虽亦辰戌丑未全，奈比劫多，又土重金埋……所以刀笔，功名无成，自今鳏独。"'
  outcome: 分别为「富贵两全」「早年登科，仕至御史」「功名无成，自今鳏独」
  kind: worked_example
- id: e-yh-003
  domain: D07
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 四孟凶局与用神受伤例
  quote: '"壬申辛亥己巳丙寅，此命先荣后辱，己用甲为官，亥中有甲木长生，己用壬为财，申中有壬水长生，己用丙为印绶，寅中有丙火长生，此为四孟凶局。壬寅乙巳癸亥庚申，此八字初行丙午未运好，一到酉戌来，巳中丙戊财官死于酉，用神损伤，家自消乏，妻子俱丧。"'
  outcome: 「先荣后辱」「家自消乏，妻子俱丧」
  kind: worked_example
- id: e-yh-004
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 食神专旺格命例（谢丞相与坏格例）
  quote: '"己未壬申戊子庚申，此谢丞相之命。丙子己亥戊辰庚申，此八字为一生员的，缘露了丙字……运行甲辰水土库于辰，用神入墓，卒于北京。"'
  outcome: 一为丞相，一为生员且中途「卒于北京」
  kind: worked_example
- id: e-yh-005
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 印绶逢死绝与贪财坏印例
  quote: '"丙辰甲午己未丁卯，此命月生日干为印绶，系高和尚命，大运丁酉，流年壬午，当年三十岁，至元十九年三月二十四日遭极刑，故谓印生逢死绝之运，又见壬来破印也，此当年用天元，大运用地支。"'
  outcome: 明记年份（至元十九年三月二十四日）与结局（极刑）
  kind: worked_example
- id: e-yh-006
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 归禄格命例（张都统得格、蔡文辉不得格）
  quote: '"甲子丙子癸丑壬子，此是张都统命，乃子多为聚福归禄矣。甲子丁丑乙丑己卯，蔡文辉八字，术士皆许读书有功名之造，后学医，行辛巳运，庚子年不禄，此非日禄归时。"'
  outcome: 一为都统，一则「不禄」，并附《独步》断语
  kind: worked_example
- id: e-yh-007
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 壬骑龙背格与六乙鼠贵的成格分歧
  quote: '"丙子甲午壬辰甲辰，此一生员八字，术士见其早年利考，皆作壬骑龙背格，许其堪青紫。余独以财格看，谓酉戌运不善，至此果不禄，且无嗣…丁卯壬子乙巳丙子，此一禄吏八字，术士皆谓六乙鼠贵，许其功名，行申运颇得办事北京，至未运来为事罢，此只好作印看。"'
  outcome: 前者「果不禄，且无嗣」，后者「至未运来为事罢」
  kind: worked_example
- id: e-yh-008
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 井栏叉格两例（王都统制贵、生员不贵）
  quote: '"庚子庚辰庚申丁丑，此是王都统制命，丁卯出戎边土，得十四官诰。庚申戊子庚辰丙戌，此一生员八字，亦候过癝，后告侍亲，惟生放发些财，而不贵。何也？所谓生江南则为橘，生江北则为柚，土产故也。"'
  outcome: 分别「得十四官诰」与「不贵」
  kind: worked_example
- id: e-yh-009
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 飞天禄马与刑合、遥巳诸格命例
  quote: '"壬辰辛亥癸亥癸亥，都堂王守仁八字，倒飞天禄马格。戊寅癸亥癸亥癸亥，此丐者八字，露出戊字官星，斯为下矣……癸酉辛酉癸卯甲寅，乃娄参政命也。……甲申甲戌甲子甲子，此乃是罗御史之命，虽然是遥巳，但年上有申中庚金冲克甲，运行戊寅，寅刑巳，番成祸矣，流年乙丑则罢官。"'
  outcome: 分别为贵、下、参政、罢官
  kind: worked_example
- id: e-yh-010
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 拱禄拱贵的成与破（王郎中、戴大宝）
  quote: '"丁巳丙午甲寅甲子，此是王郎中之命，此时日来夹丑中癸水余气……后运行辛丑，除通判，入庚子运，庚金克甲木，又是年月冲破甲子，乃天中杀，即空亡，夹贵不住，走了贵人，一旦坏了。……庚戌戊子壬辰壬寅，此乃戴大宝命，十一岁行庚寅中举，十九岁戊辰年中探花，行辛卯运填实卒。"'
  outcome: 「除通判……一旦坏了」「十九岁中探花，行辛卯运填实卒」
  kind: worked_example
- id: e-yh-011
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 劫财羊刃命例（岳飞及两例破财、疾死）
  quote: '"癸未乙卯甲子己巳，此岳飞将军命，此为劫财羊刃，甲以己为财，以乙为刃，见卯羊刃，劫而有损，乙卯正谓劫财阳刃，运行辛亥，流年辛酉，三十九岁死于狱中。戊寅乙卯甲戌甲子，此八字有祖业，有子息，无兄弟，父母早丧……行己未运，甲子年，因官事破财不禄。"'
  outcome: 「三十九岁死于狱中」「因官事破财不禄」「被兄打破疾死」
  kind: worked_example
- id: e-yh-012
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  title: 官旺身弱与制伏太过、胞胎受气诸例
  quote: '"辛巳庚子丙子癸巳，此八字官旺行丙申，丙临申为杀重之位，甲子年十月，不禄。……丙午甲午癸亥乙卯，此乃是钱应宾秀才命，月上偏官，所以伤残，目盲足跛，却有文章秀气，终身贫穷矣。……甲辰壬申丙子己丑，丙子乃胞胎，日支会局，喜甲木生之，己土制之，一交甲戌运，甲子科中式。"'
  outcome: 「不禄」「目盲足跛，终身贫穷」「甲子科中式」
  kind: worked_example
- id: e-yh-013
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 98 章 · 内十八格-正官格
  title: 正官格八例命造
  quote: '"王知府，乙未乙酉甲子丙寅(辛官)金丞相，乙卯戊子丙子庚寅(癸官)薛相公，甲子壬申乙巳戊寅(庚官)范太傅，丁丑壬寅己巳丙寅(甲官"'
  outcome: 书中仅言其为贵命，未交代各人具体际遇
  kind: worked_example
- id: e-yh-014
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 123 章 · 外十八格-炎上格
  title: 炎上格命造（张太保）
  quote: '"张太保，乙未辛巳丙午甲午眉批：火多炎上气冲天，只此无忧富贵全，一路东方行好运，金冠头顶带腰悬"'
  outcome: 书中称「富贵全」，未交代具体官职与应验细节
  kind: worked_example
- id: e-yh-015
  domain: D09
  source_id: src-yuanhai-ziping
  location: 第 86 章 · 论伤官
  title: 伤官命例（乙亥 己丑 丁亥 庚戌）及应验
  quote: '"如乙亥己丑丁亥庚戌，丁以壬为官，丑戌本为伤官，只是丑为金库，又时上有庚字作财，此人行申酉限如意，入金脱气遂死矣，大抵伤了官星，行官运则灾，太岁亦然"'
  outcome: 书中明言「行申酉限如意，入金脱气遂死矣」
  kind: worked_example
- id: e-yh-016
  domain: D06
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  title: 作者自述：从中和法到病药说的方法论转折
  quote: '"愚尝无前未谙病药之说，屡以中和而究人之造化，十无一二有验。又以财官为论，亦俱无归趣。後始得悟病药之旨，再以财官中和参看，则尝八九而得其造化所以然之妙矣"'
  outcome: 作者自评准确率由「十无一二」提升到「八九」，但未给出样本、判准或误判记录
  kind: firsthand
- id: e-yh-017
  domain: D06
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  title: 病药示例：四柱纯土的五行病药对照
  quote: '"假如人八字中，四柱纯土，水日干则为杀重身轻；如金日干，则为土厚埋金；火日干，则为晦火无光；木日干，则为财多身弱；土日干，则为比肩太重。是则土为诸格之病，俱喜木为医药，以去其病也"'
  outcome: 书中给出各日主之病与共同的药（木），未给具体命例与结果
  kind: worked_example
- id: e-yh-018
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 181 章 · 论命细法
  title: 论命细法命例：己酉 庚午 癸酉 丁丑（财入败地）
  quote: '"妻星入败地，主妻不正，如己酉庚午癸酉丁丑是财入败地也"'
  outcome: 未说明
  kind: worked_example
- id: e-yh-019
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 55 章 · 论起大运法
  title: 起大运演算示例（甲子年顺运、乙丑年逆运等）
  quote: '"假如甲子年，甲己之年丙作首，正月建丙寅，初一日立春後一日生男，顺数至二月节惊蛰，且得三十日，起十岁运，顺行丁卯"'
  outcome: 各例给出起运岁数与首步大运干支（如起十岁运、顺行丁卯）
  kind: worked_example
- id: e-yh-020
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 80 章 · 论七杀即偏官
  title: 七杀三例：合杀为贵、杀重身弱、身旺二杀
  quote: '"如辛丑乙未乙卯丙子，此命身旺，生於六月之中，岁干透辛丑为杀，喜得丙子合辛丑七杀，乃贵而有权……又如甲午丙寅庚子丙子，此命身弱，见火局又见月令丙寅七杀……身弱杀旺，又无制伏，宜乎带病贫薄……如丁巳戊申壬子戊申，此命身旺，见二戊为七杀……所以贵也。"'
  outcome: 分别判为「贵而有权」「带病贫薄」「贵」
  kind: worked_example
- id: e-yh-021
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  title: 官印两全例（戊戌 庚申 癸酉 庚申 / 己卯 丁卯 丙辰 壬辰）
  quote: '"且如戊戌庚申癸酉庚申。此命癸日生於七月中气之後，月时皆有庚申，自坐金库，所以印绶为贵。岁干又透出戊官，谓之官印两全，极为贵命……且如己卯丁卯丙辰壬辰。此命用卯为印，癸为官，年月在卯，日时在辰，所以官印两全，少年清贵。至四十二、三岁癸亥运亦不妨，至庚申年，水七杀生於申，乃被庚申破印，故不吉也"'
  outcome: 前者判「极为贵命」；后者少年清贵，庚申年转不吉
  kind: worked_example
- id: e-yh-022
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  title: 财旺任财与财旺身弱两例对照
  quote: '"如辛丑丁酉丁巳丁未，此命丁日身坐财之地，又见巳酉丑金局，故主财旺……运行东南方，宜乎巨富。……又如庚申乙酉丙申丙申。此命丙日见三申为财……盖嫌日弱，火病申死酉，乃为无气，运行酉方金乡，身弱太甚，财旺生鬼，败克其身，故不能胜其财，所以贫也"'
  outcome: 分别判为「巨富」与「贫」
  kind: worked_example
- id: e-yh-023
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 84 章 · 论食神
  title: 食神例对照（己未己巳丁未辛丑 / 乙巳乙酉癸酉乙卯）
  quote: '"如己未己巳丁未辛丑。丁见己为食神，有一丑巳合起金局，得之为财，又喜身不弱，所以有官亦有寿也。如乙巳乙酉癸酉乙卯。此命三见乙为食……癸用乙为食神，被金局来克乙木，再被三乙并卯旺克我官，所以名利都无成也"'
  outcome: 分别判为「有官亦有寿」与「名利都无成」
  kind: worked_example
- id: e-yh-024
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 85 章 · 论倒食
  title: 倒食致祸两例
  quote: '"且如丁未丁未己亥丁卯。此命己亥日……年月时透出三丁倒食……才交乙巳运，为己之七杀，引出亥卯未木局，岁逢癸亥，所以死矣……如甲戌丙寅甲戌壬申。此命甲戌日，甲见丙食，生於正月，甲木旺，身与食神俱旺，本是贵命。不合时上壬申，壬水伤其丙火……行己巳运金生之地，见庚子年，庚金为七杀，又见子水，死於非命"'
  outcome: 分别「死矣」「死于非命」（书中明确给出应验年份）
  kind: worked_example
- id: e-yh-025
  domain: D09
  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  title: 伤官见财格全程推演（戊子 丁巳 甲辰 丙寅）
  quote: '"又如戊子丁巳甲辰丙寅。此命甲日生於四月下旬，并透出丙丁火生其月中之戊土，时又归禄於寅，故财旺矣，然甲木身亦旺。早年行戊午、己未运，运通。行辛酉运，乃见官星则凶。壬戌运有壬克丙，伤官食神之中，失官去财，死丧合家。值五十九岁入癸亥身旺运，稍可安逸。六十五岁逢壬辰年死矣"'
  outcome: 书中逐年给出应验（运通、凶、死丧合家、稍安、死）
  kind: worked_example
- id: e-yh-026
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 88 章 · 论羊刃
  title: 羊刃四例（刃杀俱全、杀刃有印、生杀坏印、两辛太过）
  quote: '"如庚申己卯甲寅丙寅，此命甲日见卯为刃，庚为七杀……其身旺南方运，所以为贵。又如戊午戊午戊午甲寅。此命杀刃全，而又以午火为印，所以为贵……又如辛酉甲午戊子甲寅。此命杀刃两全而有印绶，不合年干伤官透出，运行辛卯……壬辰岁因事投水而死。……又如癸未乙卯甲子己巳。此命卯刃癸印，不合时上己巳破印……辛酉……'
  outcome: 前两例为贵，后两例分别为「投水而死」与「身虽贵亦遭刑」
  kind: worked_example
- id: e-yh-027
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  title: 印绶受克与破印的三种后果（失明、破家、夭寿）
  quote: '"且如甲寅庚午戊戌壬子。此日戊用丁为印绶，有寅午戌火局为好。不合时上壬子水旺，财能冲印，所以失明。生气是丙丁火，属目故也……若伤印主破家，离祖出赘。又临死绝之地，若非降官失职，必夭其寿"'
  outcome: 书中判「所以失明」，并列出破印的通用后果
  kind: worked_example
