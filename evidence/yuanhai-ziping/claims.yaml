  trigger: 需要对命局关系分类时
  logic: 以日干为我，按五行生克与阴阳同异定十神，不再另立关系类型
  boundary: 作者自己仍保留内外三十六格体系，与此处的「妄立格局」批评自相矛盾
  limits: 作者自己仍保留内外三十六格体系，与此处的「妄立格局」批评自相矛盾
