- id: c-yhr-0398
  domain: D08
  title: 贪合忘官与贪合忘杀
  source_id: src-yuanhai-ziping
  location: 第 73 章 · 子平举要歌（含眉批）
  quote: '"贪合忘官荣不足，贪合忘杀为己福"'
  rule: 官星被他干合去，等于官不为我用，荣显有限；七杀被合去，等于去掉凶恶之人，对命主是福。
  trigger: 命局官或杀被他干合时
  logic: 按所合之神的性质（官/杀）判断合是损是益
  boundary: 合而化与合而不化的区别，原书此处未交代
  limits: 合而化与合而不化的区别，原书此处未交代
  novelty: new
