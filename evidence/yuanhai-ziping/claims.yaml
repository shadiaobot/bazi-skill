- id: c-yhr-0276
  domain: D06
  title: 当兴之命的条件：身主专旺、用神带禄权得令、不偏不杂且无刑冲
  source_id: src-yuanhai-ziping
  location: 第 176 章 · 群兴论
  quote: '"盖四柱中身主专旺，而其所用吉神或为财，或为官，或为印绶，或为食神，俱各带禄权得令，不偏不杂，又无刑冲伤损克害，方为富贵，本源不杂也。……又在运上步步皆吉。"'
  rule: 当兴（一生富贵）的充分条件：身主专旺；所用吉神（财/官/印/食）各带禄权得令、不偏不杂、 无刑冲伤损克害；行运步步皆吉。此谓"源清流洁"，本源不杂。
  trigger: 评估是否为一生富贵之命
  logic: 身旺 + 用神得令不杂 + 无刑冲 + 运顺 → 当兴
  boundary: 未给"专旺""不偏不杂"的量化标准
  limits: 未给"专旺""不偏不杂"的量化标准
