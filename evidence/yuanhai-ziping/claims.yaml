  rule: 十干与十二支按方位归五行：甲乙寅卯属木居东，丙丁巳午属火居南，庚辛申酉属金居西，壬癸亥子属水居北， 戊己辰戌丑未属土居中央散四维。 正文以五方之神司四时说明理据（太昊乘震司春生仁和气故木居东；神农乘离司夏；少昊乘兑司秋； 颛帝乘坎司冬；黄帝乘坤司中土），并用括注标出对应的四象（青龙、朱雀、白虎、玄武）与勾陈腾蛇。
