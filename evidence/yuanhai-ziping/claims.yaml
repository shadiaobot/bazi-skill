  title: 羊刃喜杀喜印，忌伏吟魁罡三合
  source_id: src-yuanhai-ziping
  location: 第 88 章 · 论羊刃
  quote: '"夫羊刃者，号天上之凶星，作人间之恶杀，以禄前一位是也。

    (如甲禄在寅，卯为羊刃。

    )喜偏官七杀，喜印绶。

    ……如命中有刃，不可便言凶。

    大率与七杀相似，凡有刃者，多主富贵人"'
  rule: 羊刃为禄前一位（甲禄寅、卯为刃）；喜七杀、喜印绶，忌反伏吟、忌魁罡、忌三合；见刃不可便言凶，多主富贵之人。
  trigger: 命局见羊刃时
  logic: 按喜忌清单核验，重点看有无杀、有无印
  boundary: 「阳刃」之名只属五阳干（乙丁己辛癸五阴无刃），与第 54 章按十干列出羊刃的表述不一致，属待核查
  limits: 「阳刃」之名只属五阳干（乙丁己辛癸五阴无刃），与第 54 章按十干列出羊刃的表述不一致，属待核查
