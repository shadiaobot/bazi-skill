  title: 动只克动、静只克静（天干与地支互不相犯）
  source_id: src-yuanhai-ziping
  location: 第 285 章 · 动静说
  quote: '"是以天干之动，只能攻得天干之动，不能攻地支之静也，明矣……是以地支之静，只能攻得地支之静，不能攻天干之动也，亦明矣"'
  rule: 天干属阳为「动」，地支属阴为「静」；天干只与天干发生实质克制，地支只与地支发生实质克制。 天干克不到地支所藏之干，地支也克不到天干；但被冲动的藏干仍有「摇动震惊之意」，只是不成实祸。
  trigger: 判断某一干支能否真正克到另一个干支（本柱、他柱、岁运）时
  logic: 先看双方是天干还是地支 → 同类才构成实质克 → 异类仅有触动不成实祸
  boundary: 「摇动震惊之意」的后果原书未界定，属待核查
  limits: 「摇动震惊之意」的后果原书未界定，属待核查
  novelty: new
  relates: []
  tags:
