  quote: '"甲戊兼牛羊，乙己鼠猴乡，丙丁猪鸡位，壬癸兔蛇藏，庚辛逢马虎，此是贵人方，命中如遇此，定作紫薇郎"'
  rule: 天乙贵人按日干（或年干）查地支：甲戊见丑未、乙己见子申、丙丁见亥酉、壬癸见卯巳、庚辛见午寅；辰戌二宫贵人不临（魁罡恶曜之地）。
