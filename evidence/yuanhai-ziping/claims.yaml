  title: 戊日午月勿作刃看（阳刃之名与阴阳位）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"戊日午月，勿作刃看，时岁火多，却为印绶……此论羊刃者，非犬羊之羊，乃阴阳之阳，此禄前一位是。推阳位有刃，阴位无刃……乃阴火生阳土，正谓月生日干，若岁干时干又见火，乃是印绶格也。"'
  rule: 戊日午月不作羊刃看：阴火（午中丁）生阳土（戊），实为月生日干之印绶；若岁时再见火则为印绶格。并明确「羊刃」之「羊」即「阳」，阳位有刃、阴位无刃。
  trigger: 戊日生于午月时
  logic: 以五行的阴阳属性判断到底是刃还是印绶
  boundary: 与第 54 章按十干列羊刃（含阴干）的做法不一致，属已知冲突（见 COVERAGE-NOTE）
  limits: 与第 54 章按十干列羊刃（含阴干）的做法不一致，属已知冲突（见 COVERAGE-NOTE）
  novelty: new
  relates: []
  tags:
  - 羊刃
  - 印绶
  - 冲突
  source_ref: S0-x22
- id: c-yhr-0363
