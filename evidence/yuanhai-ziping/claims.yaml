  quote: '"举此二例，则议命切不可专泥於生旺而吉，衰败而凶也，又当以活法推之。"'
  rule: 正文先揭出阴阳家长生表的自相矛盾（「生旺有阴死阳生，阳死阴生」，如甲生于亥死于午、乙生于午死于亥）， 并据此判定「故推命十有九失，又非的法也」；再举两个反例：丙寅属火绝于亥，但亥中有木为印绶生丙， 故丙日亥时「乃多贵格矣」；戊土旺于巳又兼建禄，看似贵格，却因巳为生金之地而成伤官，
