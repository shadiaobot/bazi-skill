- id: c-yhr-0038
  domain: D04
  title: 食神的择取标准（不食空亡羊刃杀，不食休囚死绝，食生食旺食贵神）
  source_id: src-yuanhai-ziping
  location: 第 39 章 · 论十干食禄
  quote: '"不食空亡羊刃杀，不食休囚并死绝。食生食旺食贵神，食印食财别优劣。"'
  rule: 歌诀把食神的可用性分成取舍两类：① 不可食（不作吉论）的情形——落空亡、见羊刃、见杀； 处于休囚、死绝之位。② 可食且有力——食神本身生旺、或所食为贵神；并须分辨食神所食的是印还是财， 二者优劣不同。 眉批补定义与体质断法：「食神者，我生之子也，如甲木生丙火为食神言之，旺者主人体肥能饮食」。
    下游用途：这是判断食神能否作为用神／吉神使用的取舍口径，与第 84 章食神论互为补充。
  trigger: 命局有食神时评估其可用性
  logic: 先查是否落空亡、羊刃、七杀、休囚死绝 → 再查食神自身生旺与所食之神（印／财）
  boundary: 「别优劣」未给出印财二者的优劣次序，须回第 84 章合看；「不食」是否等于破格未明说
  limits: 「别优劣」未给出印财二者的优劣次序，须回第 84 章合看；「不食」是否等于破格未明说
