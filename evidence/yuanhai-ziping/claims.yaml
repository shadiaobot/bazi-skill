  rule: 以辛金为例判官星进退：辛以丙火为官，生于九夏（四五六月，共九十日）为「向官」，主官迁进； 生于八月则气退，官不迁进。结论层：「柱用支神旺相，则有庆荣，若死绝休囚，则无庆荣」—— 即官星能否升迁要看该字在命局中的旺相／死绝状态。
