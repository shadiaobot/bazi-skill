  title: 干克为妻财：财多干旺则称意，干衰则反而致祸
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"干克以为妻财，财多干旺则称意，若干衰则反祸矣—财多干旺者，力能任财则为福。干衰弱力不能任财，反祸矣。"'
  rule: 我克者为妻财；能否享用财要看日干是否有力：财多而日干旺，力能任财则为福、称意； 日干衰弱而财多，力不能任财则反祸，故赋云「财多身弱，正为富室贫人」。 眉批以两个命造对照：己未 戊辰 甲寅 癸酉为财旺身强；乙酉 壬午 壬午 癸卯为财旺身弱
    （后例正文断为「因妻以致祸，卒死牢狱之中」）。 下游用途：这是「财多身弱」这一经典结构的最早明文出处之一，直接用于断财与断妻（task-06、task-14）。
