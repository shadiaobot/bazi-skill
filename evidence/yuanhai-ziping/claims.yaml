  - 伤官
  - 制伏
  source_ref: S0-p43
- id: c-yhr-0419
  domain: D09
  title: 各神喜忌配法（伤官喜财、印绶好杀、羊刃怕冲等）
  source_id: src-yuanhai-ziping
  location: 第 280 章 · 论八字撮要法
  quote: '"伤官最怕为官运，伤官尤喜见财星。

    印绶好杀嫌财旺，羊刃怕冲宜合迎。

    比肩要逢七杀制。

    七杀喜见食神刑。

    有禄怕见官星到。

    食神最喜偏财临"'
  rule: 成组的喜忌配法：伤官怕官喜财；印绶喜杀恶财旺；羊刃怕冲宜合；比肩须七杀制；七杀喜食神制；有禄怕见官；食神喜偏财。
  trigger: 命局具体组合定喜忌时
  logic: 按十神组合查对应喜忌条目
  boundary: 「有禄怕见官星到」与「官轻见财为福利」的适用边界不同，须按格局区分
  limits: 「有禄怕见官星到」与「官轻见财为福利」的适用边界不同，须按格局区分
  novelty: new
  relates: []
  tags:
  - 喜忌
  - 十神
  - 口诀
  source_ref: S0-p44
- id: c-yhr-0420
  domain: D04
  title: 不为用者不必忌（反用规则）
  source_id: src-yuanhai-ziping
  location: 第 280 章 · 论八字撮要法
  quote: '"又不用财星尽可劫。

    不用官星尽可伤。

    不用印绶尽可坏。

    不用食神尽可夺"'
  rule: 上条的镜像规则：某神若不是用神，则它被劫、被伤、被破、被夺都无妨；忌法与用神绑定，不能脱离用神谈吉凶。
  trigger: 命局出现与用神无关的十神受克时
  logic: 先确认该神是否为用神 → 非用神则受克不忌
  boundary: 与「神煞/格局细断」叠加时，原书未说明是否仍可完全无忌
  limits: 与「神煞/格局细断」叠加时，原书未说明是否仍可完全无忌
  novelty: new
  relates: []
  tags:
  - 用神
  - 喜忌
  source_ref: S0-p45
- id: c-yhr-0421
  domain: D06
  title: 病药定义与病药配对
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  quote: '"何以为之病？

    原八字中原有所害之神也；何以为之药？

    如八字原有所害之字，而得一字以去之之谓也"'
  rule: 「病」指八字中克害用神的字，「药」指能去除这个克害的字；判断命局的关键是找出病与药的配对。
  trigger: 判断命局层次与吉凶时
  logic: 找出克害用神之字（病）→ 找出能制化它之字（药）→ 按成药程度定层次
  boundary: 病药与「中和」两套判据并存（下一条为层次判法），二者关系书中未系统化
  limits: 病药与「中和」两套判据并存（下一条为层次判法），二者关系书中未系统化
  novelty: new
  relates: []
  tags:
  - 病药
  - 用神
  - 总纲
  source_ref: S0-p46
- id: c-yhr-0422
  domain: D06
  title: 有病方为贵，无伤不是奇
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  quote: '"故书云：“有病方为贵，无伤不是奇；格中如去病，财禄两相随。

    ”命书万卷，此四句为之括要"'
  rule: 命局有病而能得药，才是大富贵之象；一味中和、无病无药者只是平常人；据此形成层次判断口径。
  trigger: 判断命局层次高低时
  logic: 有病且药得力 → 大富大贵；病轻得药 → 略富贵；无病无药 → 平常
  boundary: 与「命贵中和」（第 77 章）表面矛盾；作者自陈早年用中和法「十无一二有验」，此说为其修正，但两说仍并存于书中
  limits: 与「命贵中和」（第 77 章）表面矛盾；作者自陈早年用中和法「十无一二有验」，此说为其修正，但两说仍并存于书中
  novelty: new
  relates: []
  tags:
  - 病药
  - 层次
  - 判断中枢
  source_ref: S0-p47
- id: c-yhr-0423
  domain: D07
  title: 病重得药与病轻药重的层次判法
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  quote: '"或本身病重而药少，或本身病轻而药重，又宜行运，以取其中和。

    若病重而得药，大富大贵之人也。

    病轻而得药，略富略贵之入也。

    无病而无药，不富不贵之人也"'
  rule: 病与药的配比决定层次：病重得药为大富贵、病轻得药为小富贵、无病无药为平常；病药配比不当则须靠行运补足中和。
  trigger: 断层次或建议行运方向时
  logic: 比较病与药的强度 → 定层次或求运来补
  boundary: 病与药的强度计量方法原书未给
  limits: 病与药的强度计量方法原书未给
  novelty: new
  relates: []
  tags:
  - 病药
  - 层次
  - 大运
  source_ref: S0-p48
- id: c-yhr-0424
  domain: D06
  title: 看命下手顺序：先日干次月令，从重者论
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  quote: '"如八字中先看了日干，次看了月令，且如月令支中所属是火，先看月令中此一火字起……或为病，或非病。

    ……故曰：从重者论。

    此理是看命下手法处"'
  rule: 操作顺序为先日干、次月令；锁定月令所属五行后，把同类之字集中一处判其为病或非病，不与其异类混看；原则是「从重者论」。
  trigger: 开始逐项分析一个命局时
  logic: 日干 → 月令 → 集中同类字判病 → 由重至轻
  boundary: 「重」的判定（数量、位置还是得令）未明确
  limits: 「重」的判定（数量、位置还是得令）未明确
  novelty: new
  relates: []
  tags:
  - 流程
  - 病药
  - 判断中枢
  source_ref: S0-p49
- id: c-yhr-0425
  domain: D12
  title: 六亲取象（十神映射亲属）
  source_id: src-yuanhai-ziping
  location: 第 142 章 · 六亲总论
  quote: '"夫六亲者，父母、兄弟、妻财、子孙是也。

    用日干为主，正印正母，偏印偏母及祖父也。

    偏财是父……正财为妻，偏财为妾，为父是也。

    比肩为兄弟姐妹也。

    七杀是男，正官为女"'
  rule: 以日干为主，将十神映射到亲属：正印为母、偏印为继母或祖父、偏财为父（兼妾）、正财为妻、比肩为兄弟姐妹、七杀为男、正官为女；女命取法不同。
  trigger: 断六亲或判断某亲状态时
  logic: 十神 → 亲属的固定映射，再用该十神的旺衰与受克情况定该亲吉凶
  boundary: 映射表内部有重叠（偏财既是父又是妾），作者未给消解规则
  limits: 映射表内部有重叠（偏财既是父又是妾），作者未给消解规则
  novelty: new
  relates: []
  tags:
  - 六亲
  - 十神
  source_ref: S0-p50
- id: c-yhr-0426
  domain: D12
  title: 六亲受克的条件式
  source_id: src-yuanhai-ziping
  location: 第 142 章 · 六亲总论
  quote: '"且如六亲受克如何？

    印绶见财，克母及祖母也；见比劫羊刃，克妻妾及父也；官杀多者，难为兄弟；伤官食神多难为子息；枭印伤孙克祖母也"'
  rule: 六亲受克按「某神被某神克」判断：印遇财主克母、财遇比劫羊刃主克妻与父、官杀多则兄弟难存、食伤多则子息难养、枭印主伤孙。
  trigger: 断六亲吉凶时
  logic: 该亲所代表的十神是否被克制、被何神克制
  boundary: 「多」的判据未定；且须以岁运所见之字再定克应之年
  limits: 「多」的判据未定；且须以岁运所见之字再定克应之年
  novelty: new
  relates: []
  tags:
  - 六亲
  - 受克
  source_ref: S0-p51
- id: c-yhr-0427
  domain: D11
  title: 空亡按五行分吉凶
  source_id: src-yuanhai-ziping
  location: 第 142 章 · 六亲总论
  quote: '"兼有孤神，寡宿，旬中有空亡者忌，二三反吉。

    金空则鸣，火空则发，水空则流 (此三者上吉)；木空则朽，土空则崩 (二者主凶"'
  rule: 空亡并非一律为凶：金空则鸣、火空则发、水空则流属上吉，木空朽、土空崩主凶；且空亡「二三反吉」。
  trigger: 命局或岁运出现空亡时
  logic: 按所空之神的五行分吉凶，并考虑重复出现的次数
  boundary: 「二三反吉」的计数对象（旬空次数还是同类神出现次数）原书未明
  limits: 「二三反吉」的计数对象（旬空次数还是同类神出现次数）原书未明
  novelty: new
  relates: []
  tags:
  - 空亡
  - 神煞
  - 五行分类
  source_ref: S0-p52
- id: c-yhr-0428
  domain: D13
  title: 女命取用总诀：以官为夫、身柔为宜
  source_id: src-yuanhai-ziping
  location: 第 149 章 · 论妇人总诀
  quote: '"取官为夫星，财旺生官，则夫纳福……女命只要身柔，主性纯粹而温柔，能奉公婆助益夫主。

    身强欺夫，不孝公婆……八字喜贵，不宜驿马、咸池。

    要纯和柔弱，不宜刚健太强"'
  rule: 女命以官星为夫、以财生官为夫福；主张「身柔」为宜、身强则欺夫忤姑；忌驿马（奔波）与咸池（桃花），喜纯和柔弱。
  trigger: 分析女命时
  logic: 以官星状态定夫，以日主柔刚定性情与家庭关系
  boundary: 属明代性别与婚姻制度下的价值判断，含「淫滥」「克夫」等时代偏见，不可作为可移植规则使用
  limits: 属明代性别与婚姻制度下的价值判断，含「淫滥」「克夫」等时代偏见，不可作为可移植规则使用
  novelty: new
  relates: []
  tags:
  - 女命
  - 时代局限
  source_ref: S0-p53
- id: c-yhr-0429
  domain: D13
  title: 女命官杀只宜一位
  source_id: src-yuanhai-ziping
  location: 第 149 章 · 论妇人总诀
  quote: '"七杀正官，只要一位者良，杀多则夫多，宜杀被合……此乃被合取之，余依此，主妇人招嫁不定"'
  rule: 女命官杀以一位为宜，多则主夫多；官星被他干合去，主婚姻不定、招嫁反复。
  trigger: 分析女命婚姻时
  logic: 官杀数量与合去情况 → 婚姻状态断语
  boundary: 同一逻辑在男命（正财偏财）中的对应关系书中未系统给出
  limits: 同一逻辑在男命（正财偏财）中的对应关系书中未系统给出
