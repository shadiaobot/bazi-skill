- id: c-yhr-0270
  domain: D07
  title: 论格局生死引用：各格的"岁运相并必死"条件
  source_id: src-yuanhai-ziping
  location: 第 173 章 · 论格局生死引用
  quote: '"印绶见财行财运又兼死绝，必入黄泉，如柱有比肩，庶几有解。正官见杀及伤官，刑冲破害，岁运相并必死。正财偏财见比肩分夺，劫财羊刃又见岁运冲合，必死。"'
  rule: 逐格的极端凶应条件：印绶见财又行财运并临死绝 → 主死（柱有比肩可解）； 正官见杀及伤官、兼刑冲破害、岁运相并 → 死；正财偏财见比肩分夺、劫财羊刃又逢岁运冲合 → 死； 伤官格财旺身弱、官杀重见、岁运又见 → 死（活则伤残）；拱禄拱贵再见官星之冲、岁运重见
    → 死； 日禄归时逢刑冲破害并见七杀、官星、空亡、冲刃 → 死；杀官大忌，岁运相并 → 死；诸格忌杀与填实， 岁运并临亦死。会诸凶神恶煞（勾绞、空亡、吊客、墓库、病死、官杀）九死一生。 眉批修正：拱禄拱贵见官只是下贱贫薄，不至死，须岁运恶煞相并方可作死断。
  trigger: 特定格局在岁运中并见其破格条件
  logic: 破格条件 + 岁运同临 → 主凶；有比肩、有救则减
  boundary: 死断属体系内极端断言，不作事实预测；眉批已对正文的"即死"作了限缩
  limits: 死断属体系内极端断言，不作事实预测；眉批已对正文的"即死"作了限缩
  novelty: new
  relates: []
  tags:
