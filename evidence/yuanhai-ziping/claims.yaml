  title: 六亲受克的条件句（印见财克母、比劫克妻父等）
  source_id: src-yuanhai-ziping
  location: 第 142 章 · 六亲总论
  quote: '"印绶见财，克母及祖母也；见比劫羊刃，克妻妾及父也；官杀多者，难为兄弟；伤官食神多难为子息；枭印伤孙克祖母也。"'
  rule: 六亲受克以十神的相克关系判定，并落到处方性地看"哪一字出现则克何人"： 印见财 → 克母及祖母（财破印）；见比劫羊刃 → 克妻妾及父；官杀多 → 难为兄弟；伤官食神多 → 难为子息； 枭印伤孙 → 克祖母。原文并强调"此必以运见何字则克何人"，即大运引动之字决定克应的时点与对象。
