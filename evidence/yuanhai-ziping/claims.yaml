- id: c-yhr-0269
  domain: D15
  title: 伏象：财官印杀伏藏不通月气，或身被克伏
  source_id: src-yuanhai-ziping
  location: 第 171 章 · 神趣八法-伏象
  quote: '"伏象者乃寅午戌三合全，又值五月生，逢壬日而天干无气，丁字透露，壬水又无根，乃取月支午中有丁火，合壬水而伏之。所谓伏象，运至木火之乡皆吉，只愁水旺之乡不利也。"'
  rule: 伏象：柱中财官印杀不通月气、不曾透露，隐于地支人元之中，无形而离明，谓之伏； 亦指日干不遇生旺、死绝气多而遇官杀太甚、身被克伏。首解举例：寅午戌三合全又值五月生， 壬日天干无气而丁字透露，取月支午中之丁合壬而伏之；此象运至木火之乡皆吉，水旺之乡不利。
    《王井》："本身不通月气，而伏藏我气于别支之内，有援而起者也。"引经："官鬼皆全，乃遐龄而不遂。" 命例：戊午 甲寅 戊寅 辛酉（戊日被甲寅克之太甚，本身无气，故为手艺之人）。
  trigger: 命局之官财等伏藏于地支而不透，或日主被克制伏
  logic: 伏而不透 → 需有援而起（运至所伏五行之乡则吉）
  boundary: 首解与第二解（伏藏 vs 被克伏）机制不同，未统一
  limits: 首解与第二解（伏藏 vs 被克伏）机制不同，未统一
