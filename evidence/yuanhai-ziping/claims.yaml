  title: 六甲空亡查法与五行空亡之别（与第 142 章口径有冲突）
  source_id: src-yuanhai-ziping
  location: 第 47 章 · 论六甲空亡
  quote: '"甲子旬中无戌亥，甲戌旬中无申酉，甲申旬中无午未，甲午旬中无辰巳，甲辰旬中无寅卯，甲寅旬中无子丑……眉批：空亡对宫孤虚，火空则发，水空则脱，金空则响

    ，木空则折，土空则陷"'
