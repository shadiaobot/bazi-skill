  quote: '"丙丁日坐未宫逢，金水虽凶未必凶，木库火乡应富贵，再行申酉祸灾重。眉批：六月未宫，己土十八日，丁火七日，乙木五日。"'
  rule: 未月己土18日、丁火7日、乙木5日；丙丁日坐未，金水来犯未必为凶，行木火之运主富贵，再见申酉则祸重。
  trigger: 生于未月时
  logic: 未为木库火余，丙丁得之为根 → 喜木火、忌金再旺
