  title: 土居中央、散于四维，五行皆不可无土
  source_id: src-yuanhai-ziping
  location: 第 5 章 · 十干所属方位十二支所属论
  quote: '"中央有神黄帝，乘坤执绳司中土，况木火金水皆不可无土，故将戊己居中央，辰戌丑未散四维，各得所占。"'
  rule: 正文借何公之论给土一个特殊地位：五行中唯土不独占一方，戊己居中央而辰戌丑未散入四季末月， 使木火金水各有所赖（木无土失载培、火无土不能烛照、金无土难施锋锐、水无土不能堤泛滥）。 这是全书处理土行的编码前提：四季末月为土旺之地，土的强弱判断不能只看月令本气，
    还要看四维（辰戌丑未）与土是否得水。 下游用途：解释为何杂气、墓库、四废等多涉辰戌丑未；也是土行论旺的依据。
  trigger: 判断土之旺衰或解释辰戌丑未作用时
  logic: 土主中央、散四维 → 辰戌丑未各占四季之末 → 土于是四时皆有份
