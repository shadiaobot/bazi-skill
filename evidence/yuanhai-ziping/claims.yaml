  title: 小儿关杀例：偏官为关、偏财为杀，按生辰数定应期
  source_id: src-yuanhai-ziping
  location: 第 157 章 · 论小儿关杀例
  quote: '"子平之法，偏官为关，偏财为杀，取生辰之数断之。水一、火二、木三、金四、土五。且如甲日庚杀，乃四、九岁；丙见壬杀，一、六岁；戊日甲杀，三、八岁；庚日丙杀，二、七岁；壬见戊杀，五、十岁见之。"'
  rule: 小儿关杀的取法：以偏官为"关"、偏财为"杀"，用五行生成数定岁数应期—— 水一、火二、木三、金四、土五，再以"逢五加十"的方式取第二个数。 示例：甲日见庚杀（金）= 四岁、九岁；丙日见壬杀（水）= 一岁、六岁； 戊日见甲杀（木）=
    三岁、八岁；庚日见丙杀（火）= 二岁、七岁；壬日见戊杀（土）= 五岁、十岁。 本章另给格局与家世断语：日主强财官旺者"有关无杀"；日干弱财官少者常病可养； 日干弱财官多者"有关有杀"；三会聚杀者难养。八字有财官生于富贵之家，偏官生于平常之家，
    伤官劫财生于贫贱之家；偏官、偏印、偏财主偏生庶出或第三四胎。
  trigger: 见原文条件
  logic: '小儿关杀的取法：以偏官为"关"、偏财为"杀"，用五行生成数定岁数应期——

