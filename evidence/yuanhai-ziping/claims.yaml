  rule: 华盖取三合局的墓支：寅午戌见戌、巳酉丑见丑、申子辰见辰、亥卯未见未。 断法正文说得很直白：「华盖本为吉，凡人命中得之，多主孤寡，纵贵亦不免为孤独也，遇之多为僧道术论」， 并引《壶中子》「华盖为艺术之星，主孤」——即华盖同时是艺术之星与孤寡之象，
