  title: 四生四库四败之局
  source_id: src-yuanhai-ziping
  location: 第 199 章 · 四言独步
  quote: '"寅申巳亥 四生之局 用物身强 遇之发福 辰戌丑未 四库之神 人元三用 透旺为真 子午卯酉 四败之局 男犯兴衰 女犯孤独"'
  rule: 寅申巳亥为四生之局（用神得地则发福）；辰戌丑未为四库（人元三用，须透旺为真）；子午卯酉为四败之局（男犯主兴衰不定，女犯主孤独）。
  trigger: 判断地支四正/四生/四库结构时
  logic: 按支组归类 → 取各自的吉凶口径
  boundary: 「女犯孤独」属时代性断语；四库「人元三用」指藏干，须与第 61 章藏遁歌合看
  limits: 「女犯孤独」属时代性断语；四库「人元三用」指藏干，须与第 61 章藏遁歌合看
  novelty: new
