  quote: '"此格乃谓年月日时连占两干，纯一而不杂也，取两字不乱之类是也，又谓之两干连珠格。经云“两干不杂利名齐”，其斯之谓矣。"'
  rule: 成格：年月日时四柱只用两个天干，且两两相同、纯一不杂（如甲甲、乙乙之类连占）。 又名两干连珠格。引经作"两干不杂利名齐"。 该章原文极短，无喜忌与行运说明，属取象型格局。
