- id: c-yhr-0215
  domain: D12
  title: 岁德扶杀格：甲日见庚年，年柱七杀有制主祖上有要职
  source_id: src-yuanhai-ziping
  location: 第 134 章 · 外十八格-岁德扶杀格
  quote: '"且如甲日见庚年是也。正如年为君位，日为臣位，臣导权。然又以年为祖，日为己身，七杀有制，则祖上曾有要职。"'
  rule: 成格：日干与被年柱所克者相对，如甲日见庚年（庚为甲之七杀）。 机理：年为君位、日为臣位，取"臣导（夺）权"之象；又以年为祖、日为己身。 断语条件：七杀有制，则主祖上曾有要职。眉批"甲为东方岁，居一岁之首，故曰岁德"。
  trigger: 年柱天干为日干之七杀（如甲日见庚年）
  logic: 杀有制 → 祖上有要职；无制则不言此断
  boundary: 该格断语指向祖辈，属体系内取象，不可作事实断言；"有制"的制语判据未列
  limits: 该格断语指向祖辈，属体系内取象，不可作事实断言；"有制"的制语判据未列
