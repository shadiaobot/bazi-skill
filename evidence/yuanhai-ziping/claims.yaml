  - 格局
  - 性情
  source_ref: B3-p10
- id: c-yhr-0210
  domain: D07
  title: 炎上格：丙丁日支全寅午戌或巳午未，忌水乡金地
  source_id: src-yuanhai-ziping
  location: 第 123 章 · 外十八格-炎上格
  quote: '"且如丙丁二日，见寅午戌全或巳午未全亦是。但忌水乡金地，喜行东方运，怕冲，要身旺，岁运同。"'
  rule: 成格：丙丁日主，地支寅午戌三合火局全，或巳午未三会火方全。要身旺。 行运：喜东方木运（木生火）；忌水乡（克火）与金地（制泄）；怕冲（冲散火局）。岁运同。 章内命例为张太保：乙未 辛巳 丙午 甲午（巳午未全）；眉批"火多炎上气冲天……一路东方行好运"。
  trigger: 丙/丁日 + 地支三合火局全或三会火方全 + 身旺
  logic: 行木运助火 → 吉；行水、金运及逢冲 → 破
  boundary: 火局与火方是否等价（三合/三会）未区分；"身旺"无量化
  limits: 火局与火方是否等价（三合/三会）未区分；"身旺"无量化
  novelty: new
  relates: []
  tags:
  - pattern
  - 专旺
  - 行运
  source_ref: B3-p11
- id: c-yhr-0211
  domain: D05
  title: 稼穑格：戊己日支逢辰戌丑未全，忌东方运与北方财运
  source_id: src-yuanhai-ziping
  location: 第 126 章 · 外十八格-稼穑格
  quote: '"以戊己日生，值辰戌丑未是也。忌东方运及北方财运。此命辰戌丑未俱全，得水为财，又无木克，是以为福。此格喜行西南，惟忌东北。"'
  rule: 成格：戊己日主，地支辰戌丑未四季土全（或重见）。得水为财、无木克为福。 行运：喜西南（金、土）；忌东方（木克土）与北方（水为财但壬癸财多则耗身？此处原文归为"北方财运"忌）。 眉批作"戊己生居四季中，辰戌丑未要全逢，喜逢财地兼官杀，运到东方定有凶"。
    命例：张真人 戊戌 己未 戊辰 癸丑。
  trigger: 戊/己日 + 地支辰戌丑未全
  logic: 行西南运 → 吉；行东方木、北方水运 → 忌
  boundary: 正文与眉批对财运的取舍表述相左（正文忌北方财运，眉批"喜逢财地"），须回核
  limits: 正文与眉批对财运的取舍表述相左（正文忌北方财运，眉批"喜逢财地"），须回核
  novelty: new
  relates: []
  tags:
