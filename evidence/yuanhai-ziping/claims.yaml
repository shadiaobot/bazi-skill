  location: 第 205 章 · 三月建辰候诗诀
  quote: '"三月辰宫只论土，杀多金水化为祥，提纲若用财官印，金水相临命有伤。眉批：三月水土墓库之宫，戊土十八日，癸水五日，乙木七日。"'
  rule: 辰月为水土墓库：戊土18日、癸水5日、乙木7日；月令论土为主，杀多而金水旺可化祥；若用财官印则忌金水叠加。
  trigger: 生于辰月时
  logic: 按司令分段取用 → 再按用神性质定喜忌
  boundary: 「杀多金水化为祥」与「用财官印忌金水」并存，须按用神而定
