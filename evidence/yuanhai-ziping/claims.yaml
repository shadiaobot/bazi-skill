  quote: '"甲乙无根 怕逢申酉 杀合逢此 双目定瞽 乙木酉月 见水为奇 有根丑绝 无根寅危 …… 丙火申提 无根从煞 有根南旺 脱根寿促 阳火无根 水乡必忌 阴火无根 水乡必救"'
  rule: 从杀格的逐日主特例：甲乙无根怕申酉（杀合则目瞽）、乙木酉月见水为奇、丙火申月无根从煞有根南旺、阳火无根忌水乡而阴火无根水乡反救。
