  trigger: 命局出现旬中空亡
  logic: 按所空之支的五行取吉凶：金/火/水 — 吉；木/土 — 凶；空亡多处则反吉
  boundary: 与第 47 章的措辞与吉凶取向冲突，未给消解规则；"二三反吉"无精确定义
  limits: 与第 47 章的措辞与吉凶取向冲突，未给消解规则；"二三反吉"无精确定义
