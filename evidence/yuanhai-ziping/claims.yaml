  rule: 三合成局表：申子辰水、亥卯未木、寅午戌火、巳酉丑金，另列辰戌丑未为土局（四库全）。 括注给出使用口径：凡看命以三合取用为局、据以入格——即三合成局是取格与取用的入口之一， 不只是一个查表符号。 眉批补限制条件：「合局者为贵，但得五行相顺」——成局要贵，须五行流通顺遂，不能只看合齐。
