  title: 官杀交差以合杀为贵
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"官星七杀交差，却以合杀为贵……经云：合官星不为贵，合七杀不为凶，乃是五行赖之救助。且如甲日生人得卯时，卯中之乙能合庚字为甲之偏官，是为合杀也。"'
  rule: 官杀并见时，以「合杀」为贵：合去官星不算贵，合去七杀不算凶，因五行得救助。甲日卯时乙合庚杀即为例。
  trigger: 官杀交差并见时
  logic: 判断合的对象是官还是杀 → 合杀为吉、合官则荣不足
