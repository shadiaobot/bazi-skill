  title: 正官须印与身旺方能发
  source_id: src-yuanhai-ziping
  location: 第 77 章 · 论正官（眉批）
  quote: '"正官无印乃非真官，故喜身旺财旺"'
  rule: 正官格若无印绶生扶、日主不旺，只是「假官」，须待印绶与官星旺运方发。
