  title: 太岁不可犯：日犯岁君灾殃必重
  source_id: src-yuanhai-ziping
  location: 第 161 章 · 论太岁吉凶
  quote: '"太岁乃年中天子，故不可犯，犯之则凶。经云：“日犯岁君，灾殃必重，五行有救，其年反必招财。”"'
  rule: 太岁为"年中天子"，不可犯。日干支克太岁（日犯岁君）则灾殃必重；但若五行有救，其年反主招财。 正文示例：甲日见戊土太岁即是犯岁君，克重者死；甲乙日而年月日时见寅卯亥未者犯克岁君，决死无疑。 眉批解其机理："日犯岁君，即君臣相战，必有一死，臣犯刑君之罪必重。"
  trigger: 日柱干支克流年（太岁）干支
  logic: 犯岁君 + 无救 → 凶重；有救 → 反招财
