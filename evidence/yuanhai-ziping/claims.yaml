  title: 纳音得地：行运纳音与本命同类最为上吉
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"又曰：凡行运，看纳音年庚金木水火土是何命人，如土命而行西南方，为西南得朋之庆。木命而行东方，火命而行南方，金命而行西方，水命而行北方，皆为得地。更看所行之运纳音与命相孚同类，最为上吉，财官次之。"'
  rule: 以纳音论行运：先看本命纳音五行，行运到与本命同气之方为"得地"（土命行西南、木命行东、火命行南、 金命行西、水命行北）；再比较所行大运的纳音与本命纳音，同类相孚者最为上吉，财官得地次之； 若泄气或受克重则不吉。
  trigger: 需要以纳音口径校验行运吉凶时
