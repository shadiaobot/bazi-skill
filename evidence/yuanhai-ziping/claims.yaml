- id: c-yhr-0232
  domain: D12
  title: 子息有无的计数法：一杀一子、二杀二子、无杀无子
  source_id: src-yuanhai-ziping
  location: 第 148 章 · 论子息
  quote: '"八字有一杀一子，二杀二子，无杀无子。如柱中身杀两停，而杀逢旺乡就作多子断之。亦看财神何如，逐时增减，多寡推之，无不验矣！"'
  rule: 子息数的简易计数：柱中一七杀则一子、二杀则二子、无杀则无子；身杀两停而杀逢旺乡则作多子断。 另须参看财神（财生杀），随时柱与行运增减。若柱中无子星、时上又不生旺，则运行官杀旺乡主有子， 运过却无；柱中有官杀而行伤食衰绝之运则伤损其子，运过方存。
    时上伤官及空亡者难为子息；伤官见官则子孙凶顽。
  trigger: 计数柱中官杀（男命子星）
  logic: 杀数 ≈ 子数；杀得旺乡则增；行伤食运则损；时上伤官、空亡则子息难
  boundary: 条数式计数法与前面十二宫口诀法并存，两法结果冲突时无优先序
  limits: 条数式计数法与前面十二宫口诀法并存，两法结果冲突时无优先序
