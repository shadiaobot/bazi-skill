  title: 返象：用神被引至时上绝地，用而不用
  source_id: src-yuanhai-ziping
  location: 第 169 章 · 神趣八法-返象
  quote: '"返象者，乃所谓值身主用神，引至时上一位为绝之乡，谓之用而不用，皆为返象。又遇返之太甚者，不吉。"'
  rule: 返象：身主用神被引至时上一位的绝乡，谓"用而不用"。第二解为"绝处逢生之意"或"化中返本倒化"—— 如乙庚化金而生于寅月（金绝地）、柱中木重却化金，是化气失局，故曰返； 《王井》以化中返本、倒化之类为返（如乙庚化金而见亥地木重，非化金而却化木）；
    或身弱而遇官杀，有官则进、有杀则退，亦为返象。性情断语：频迁反复、无成立、心不定。 命例：辛未 壬辰 丙午 癸巳（丙辛化水而柱中辰巳午未为水墓衰绝之地，真返象）； 癸丑 丙辰 丙申 辛卯（一生进退无成）。
  trigger: 用神被引至时上绝乡，或化气失局
  logic: 用而不用 → 返；返之太甚 → 不吉
  boundary: 三种取义（时上绝地、化气返本、身弱遇官杀）并列，无优先序
  limits: 三种取义（时上绝地、化气返本、身弱遇官杀）并列，无优先序
  novelty: new
