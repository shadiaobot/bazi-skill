  title: 十二长生吉凶定位
  source_id: src-yuanhai-ziping
  location: 第 15 章 · 论天干生旺死绝
  quote: '"但逢长生、冠带、临官、帝旺为吉，但逢沐浴、衰、病为不吉也。

    至於死、绝，如无救助者直为凶矣。

    胞胎受气亦为半吉，养亦如之"'
  rule: 十干各有十二宫（长生→养）的固定地支；长生、冠带、临官、帝旺为吉； 沐浴、衰、病不吉；死绝无救助为凶；胎、养半吉。
  trigger: 需要判断某天干在某一地支的强度时
  logic: 查十二长生表（第 15 章给出十天干全表），按宫位断强弱吉凶
  boundary: 表中乙、丁、己、辛、癸逆行排布，作者未解释阴阳干逆行之理
  limits: 表中乙、丁、己、辛、癸逆行排布，作者未解释阴阳干逆行之理
  novelty: new
  relates: []
