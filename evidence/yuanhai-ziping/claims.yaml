  title: 化气怕逢反本
  source_id: src-yuanhai-ziping
  location: 第 181 章 · 论命细法
  quote: '"化气怕逢反本，不化有变局，如化不成者，只可用本日干断"'
  rule: 天干合化若不能化真（逢反本），则按原日干论命；化象不成立时不得强行按化格断。
  trigger: 命局出现天干五合时
  logic: 先验是否化真 → 化不成即回退本日干论命
  boundary: 「化真」的判定条件（月令、时支、有无妒合）在本书散见各处，需汇总
  limits: 「化真」的判定条件（月令、时支、有无妒合）在本书散见各处，需汇总
