  title: 五运化气口诀与"取岁首月建天干所生"的推导法
  source_id: src-yuanhai-ziping
  location: 第 162 章 · 论运化气
  quote: '"夫五运化气者：甲己化土乙庚金，丁壬化木尽成林，丙辛化水分清浊，戊癸南方火焰侵。至於合而化者，取其岁首月建天干五行所生之五行。如甲己之年正月为丙寅，天干丙火生土，所以甲己合就化土。"'
  rule: 五组天干合化：甲己化土、乙庚化金、丙辛化水、丁壬化木、戊癸化火。 化气之"所以然"由年干推月建天干：甲己之年正月建丙寅，丙火生土，故甲己合化土； 乙庚之年正月为戊寅，戊土生金，故乙庚化金；丙辛之年正月为庚寅，庚金生水，故丙辛化水，余仿此。
    眉批另给口诀式推法："其法亦从甲己起庚寅丁卯戊辰，逢龙便化。"
  trigger: 见原文条件
  logic: '五组天干合化：甲己化土、乙庚化金、丙辛化水、丁壬化木、戊癸化火。

