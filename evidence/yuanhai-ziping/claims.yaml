  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"柱中官星太旺，天元羸弱之名……若官星太旺，天元身弱，又行官旺乡，反成其祸……元有制伏则妙。本身弱须行制伏之运乃可发福。若行官旺之乡，乃造化太过，其祸害破财不可胜言。"'
