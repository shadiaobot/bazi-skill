  location: 第 18 章 · 论年上起月例
  quote: '"甲己之年丙作首，乙庚之岁戊为头，丙辛之岁寻庚上，丁壬壬位顺行流，若言戊癸何方发，甲寅之上好追求"'
  rule: 由年干推定正月（寅月）的天干：甲己年正月起丙寅，乙庚年起戊寅，丙辛年起庚寅，丁壬年起壬寅，戊癸年起甲寅，其后各月顺行。
