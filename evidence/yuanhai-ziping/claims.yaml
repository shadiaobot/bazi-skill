- id: c-yhr-0233
  domain: D13
  title: 妇人总诀：取官为夫星，身柔为宜，大忌伤官
  source_id: src-yuanhai-ziping
  location: 第 149 章 · 论妇人总诀
  quote: '"取官为夫星，财旺生官，则夫纳福。印绶食神为名，贵有称呼。生气印绶，难为子息。印绶财官，必生於富贵之家，才貌贤淑。"'
  rule: 女命的总原则：推命与男命大不同，取官星为夫、财旺生官则夫得福；印绶食神主名声； 生气印绶则难为子息；印绶财官俱全者生于富贵之家、才貌贤淑。 行运层面：女命只要身柔（性纯粹温柔、能奉公婆助夫），身强则欺夫、不孝公婆、是非急躁； 喜贵，不宜驿马、咸池；要纯和柔弱、不宜刚健太强，岁运亦然。
