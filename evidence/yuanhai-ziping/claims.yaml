  domain: D08
  title: 行运宜官旺乡、忌伤官地
  source_id: src-yuanhai-ziping
  location: 第 77 章 · 论正官论
  quote: '"大抵要行官旺乡，月令是也……既曰正官，运复行得官旺之乡，凡事有成，却又行不得伤官之地。

    行财旺之乡，皆是作福之处"'
  rule: 正官格行运走官旺之乡与财旺之乡皆吉，忌行伤官之地（克官）。
  trigger: 正官格推大运时
  logic: 以运扶官或生官为吉，运伤官为凶
  boundary: 行运与命局原有冲刑叠加时的优先序未定
