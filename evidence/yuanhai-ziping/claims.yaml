- id: c-yhr-0403
  domain: D11
  title: 羊刃定位表与飞刃
  source_id: src-yuanhai-ziping
  location: 第 54 章 · 论羊刃
  quote: '"羊刃对宫即飞刃。

    甲生人，羊刃在卯，酉飞刃；乙生人，羊刃在辰，戌飞刃；丙生人，羊刃在午，子飞刃……癸生人，羊刃在丑，未飞刃"'
  rule: 十天干各有羊刃地支（甲卯、乙辰、丙戊午、丁己未、庚酉、辛戌、壬子、癸丑），其对冲宫为飞刃。
  trigger: 需要查羊刃、飞刃时
  logic: 按日干查表取羊刃地支，取对冲宫为飞刃
  boundary: 未见缺
  limits: 未见缺
  novelty: new
  relates: []
  tags:
  - 羊刃
  - 查表
  - 神煞
  source_ref: S0-p28
- id: c-yhr-0404
  domain: D10
  title: 禄过则刃生，刃居禄前一辰
  source_id: src-yuanhai-ziping
  location: 第 54 章 · 论羊刃
  quote: '"羊，主刚也。

    刃者，主刑也。

    禄过则刃生，功成当退不退，乃狠而进也……羊刃当居禄前一辰，谓吉极则否矣"'
  rule: 羊刃之义为刚烈与刑伤，取象于「禄至极点」，位置在禄前一辰，属物极则反之位。
  trigger: 解释羊刃性质与取用（制刃还是用刃）时
  logic: 禄极生刃 → 须有制或有合，否则刑伤
  boundary: 「有禄必赖刃以卫之」（眉批引壶中子）与「刃主刑」并见，吉凶须视格局而定，原书未给统一判据
  limits: 「有禄必赖刃以卫之」（眉批引壶中子）与「刃主刑」并见，吉凶须视格局而定，原书未给统一判据
  novelty: new
  relates: []
  tags:
  - 羊刃
  - 禄
  source_ref: S0-p29
- id: c-yhr-0405
  domain: D01
  title: 起大运法（顺逆与三日折一岁）
  source_id: src-yuanhai-ziping
  location: 第 55 章 · 论起大运法
  quote: '"凡起大运，俱从所生之日，阳男阴女顺行，数至未来节。

    阳女阴男逆行，数已过去节，但折除三日为一岁"'
  rule: 起运以大运顺逆为基础：阳男阴女顺数至下一个节气，阳女阴男逆数至上一个节气；所数天数三日折合为一岁，得数即起运岁数。
  trigger: 需要排出大运序列时
  logic: 定顺逆→数节气天数→三日折一岁→按顺逆排干支
  boundary: 书中所举例的算式含糊（如「得四三十二日，起四岁运」），需按文意校正
  limits: 书中所举例的算式含糊（如「得四三十二日，起四岁运」），需按文意校正
  novelty: new
  relates: []
  tags:
  - 大运
  - 计算
  source_ref: S0-p30
- id: c-yhr-0406
  domain: D01
  title: 节气判界与夜子时处理
  source_id: src-yuanhai-ziping
  location: 第 55 章 · 论起大运法（眉批）
  quote: '"如初一日午时生，若卯时立春，便作正月；若寅时生，未还交节，作上提十二月节推命……谓神仙难断夜子时。"'
  rule: 未到交节时刻出生，仍按上一月的节气推命；子时横跨两日，前半刻属前一日、后半刻属本日，是全书自认最易出错之处。
  trigger: 出生时刻接近交节或落在子时时
  logic: 以交节时刻与子时四刻为界，判定月柱与日柱归属
  boundary: 缺精确节气与真太阳时校正，原书亦承认「神仙难断」
  limits: 缺精确节气与真太阳时校正，原书亦承认「神仙难断」
  novelty: new
  relates: []
  tags:
  - 节气
  - 排盘
  - 边界
  source_ref: S0-p31
- id: c-yhr-0407
  domain: D07
  title: 大运重地支、岁君看天干
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"子平之法，大运看支，岁君看干，交运同接木，何也……月令者，运元也，行运就月上起"'
  rule: 大运以地支为主、流年以太岁天干为主；大运从月柱起，喻为「接木」，故交运换步的年份最须细辨。
  trigger: 推演大运与流年时
  logic: 运以支定方位与五行气，岁以干定本年主角
  boundary: 大运天干的作用被显著弱化（「既得时则自然开花结子」），与后世重干流派不同
  limits: 大运天干的作用被显著弱化（「既得时则自然开花结子」），与后世重干流派不同
  novelty: new
  relates: []
  tags:
  - 大运
  - 流年
  source_ref: S0-p32
- id: c-yhr-0408
  domain: D07
  title: 交运换甲与转角接木为险
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"出癸入甲，如返汗之人，多主不吉。

    古语云：伤寒换阳，行运换甲，换过是人，换不过是鬼……丑运交寅，辰交巳、未交申、戌交亥，此乃转角接木……格局凶者死，格局善者灾，老人大忌"'
  rule: 从癸运入甲运（换甲）、以及四维转角交运（丑→寅、辰→巳、未→申、戌→亥）为凶险关口，格局凶者主死、善者亦有灾；同方位一气相承则无此凶。
  trigger: 大运推进至换甲或四维转角处
  logic: 按交运位置与格局吉凶判断危险等级，并考虑年龄
  boundary: 「老人大忌，后生差慢」是经验性描述，无量化判据
  limits: 「老人大忌，后生差慢」是经验性描述，无量化判据
  novelty: new
  relates: []
  tags:
  - 大运
  - 交运
  - 风险
  source_ref: S0-p33
- id: c-yhr-0409
  domain: D07
  title: 干旺宜衰运、干弱宜旺运
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"干旺宜行衰运，干弱宜旺运，正乃“干弱则求气旺之籍，有余则喜不足之营”。

    须要通变"'
  rule: 日主旺者宜行衰运（泄耗）、弱者宜行旺运（生扶），这是行运取舍的基本方向。
  trigger: 判断某步大运对日主是否有利
  logic: 以日主强弱定扶抑方向，再以运之五行判吉凶
  boundary: 作者随即声明「此乃死法」，须随格局喜忌通变，故不可单独使用
  limits: 作者随即声明「此乃死法」，须随格局喜忌通变，故不可单独使用
  novelty: new
  relates: []
  tags:
  - 大运
  - 扶抑
  source_ref: S0-p34
- id: c-yhr-0410
  domain: D07
  title: 行运十神断法（劫财、伤官、七杀、印绶、财运）
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"且如甲乙得寅卯运，名曰劫财、败财，主克父母及克妻，破财争斗之事。

    行丙丁巳午运名伤官，主克子女，讼事囚系。

    行庚申辛酉，七杀官乡，主得名，发越太过则灾病恶疾。

    行壬癸亥子生气印绶运，主吉庆增産。

    辰戌丑未戊己财运主名利皆通"'
  rule: 行运按其十神性质断事：比劫运主克亲破财争斗、伤官运主克子女与讼事、官杀运主得名而太过则病、印绶运主吉庆生产、财运主名利。
  trigger: 判定某步大运的应事类型
  logic: 以运之十神属性对应事业、亲属、健康等事类
  boundary: 书中自称「此乃死法」，须与格局喜忌合看
  limits: 书中自称「此乃死法」，须与格局喜忌合看
  novelty: new
  relates: []
  tags:
  - 大运
  - 十神
  - 断语
  source_ref: S0-p35
- id: c-yhr-0411
  domain: D07
  title: 岁运生克的吉凶方向
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"大运不宜与太岁相克相冲，相冲者凶，更刑冲相克者亦忌。

    岁冲克运者吉，运克岁者凶，格局不吉者死。

    岁运相生者吉，禄马贵人合交互者亦吉"'
  rule: 岁与运相冲相克为忌；其中「岁冲克运」为吉、「运克岁」为凶；岁运相生或与禄马贵人相合则为吉。
  trigger: 逐年判断吉凶时
  logic: 按岁与运的生克方向定吉凶，并叠加格局吉凶与神煞
  boundary: 「岁冲克运者吉」与该段前句「相冲者凶」表面冲突，须按层次理解，属待核查
  limits: 「岁冲克运者吉」与该段前句「相冲者凶」表面冲突，须按层次理解，属待核查
  novelty: new
  relates: []
  tags:
  - 流年
  - 岁运
  source_ref: S0-p36
- id: c-yhr-0412
  domain: D07
  title: 根基决定运势效力
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运（引烛神经）
  quote: '"凡推命之祸福，须先度量基地厚薄，然後定灾福。

    如命有十分福气，行三四分恶运都不觉凶，福力厚故也。

    若五六分恶运，只浮灾细累而已，至七八分恶运，方有重灾"'
  rule: 命局的「基底厚薄」决定恶运的实际杀伤力：福厚者行中低度恶运仅小困扰，须到七八分恶运才致重灾；基底薄者则轻灾即致大祸。
  trigger: 判断大运吉凶的实际强度时
  logic: 先量命局根基，再按分数权衡运势力度
  boundary: 「分数」只是譬喻，无量化方法
  limits: 「分数」只是譬喻，无量化方法
  novelty: new
  relates: []
  tags:
  - 大运
  - 根基
  - 风险
  source_ref: S0-p37
- id: c-yhr-0413
  domain: D14
  title: 行运十二宫应事表
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"凡行运长生，主有创建作新之事。

    到临官帝旺，主兴盛、快乐、发福、进财、生子、骨肉之庆。

    到衰病之乡，多退败、破财、疾病等事。

    到死绝乡，主骨肉死丧、自身衰祸、钝闷百事蹇塞。

    到败运，主落魄、懒惰、酒色、昏迷。

    到胎库成形冠带之乡，百事得中、安康、平易"'
  rule: 大运落在十二长生的哪一宫，对应一类应事：长生主创举、临官帝旺主发福进财、衰病主退败疾病、死绝主丧祸蹇滞、败地主落魄、胎养冠带主平安得中。
  trigger: 按大运宫位断应事时
  logic: 运支与日主的十二长生关系 → 应事类别
  boundary: 各宫应事为经验断语，未给概率或条件限制
  limits: 各宫应事为经验断语，未给概率或条件限制
  novelty: new
  relates: []
  tags:
  - 大运
  - 十二长生
  - 断语
  source_ref: S0-p38
- id: c-yhr-0414
  domain: D07
  title: 年龄与行运宫位相配
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"盖人自生至老，必从微以至少壮，十岁之时方当少年，惟可行胎养生沐浴冠带处，三十四十，当阳强齿壮之时，可行旺处。

    五十六十，天癸枯竭，只可行衰败死绝，反此者谓之一生运背"'
  rule: 行运宜与年龄阶段匹配：少年宜胎养沐浴冠带、壮年宜临官帝旺、老年宜衰败死绝；反此则为「一生运背」。
  trigger: 评估大运与人生阶段的适配度
  logic: 年龄阶段 ↔ 十二长生宫位的对应
  boundary: 属经验模型，作者同时承认「生旺虽吉而未必吉，衰灭虽凶而未必凶」
  limits: 属经验模型，作者同时承认「生旺虽吉而未必吉，衰灭虽凶而未必凶」
  novelty: new
  relates: []
  tags:
  - 大运
  - 年龄
  - 断语
  source_ref: S0-p39
- id: c-yhr-0415
  domain: D07
  title: 行运扶抑的具体方向（官杀财印食各有所欲）
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"损用神者，欲运制之，益用神者，欲运生之。

    身弱欲运引进旺多。

    官欲运生，不欲运伤。

    杀欲运制，不欲运助。

    财欲运扶，不欲运劫。

    印欲运旺，不欲运衰。

    食欲运生，不欲运枭绝"'
  rule: 行运取舍细则：损坏用神之字宜被运制，生助用神之字宜被运生；官喜生恶伤、杀喜制恶助、财喜扶恶劫、印喜旺恶衰、食喜生恶枭绝。
  trigger: 逐步大运定喜忌时
  logic: 先定用神与忌神，再按十神各自的好恶判断运之吉凶
  boundary: 与第 280 章撮要法互为表里，但两处对「食神忌枭」的表述口径略异
  limits: 与第 280 章撮要法互为表里，但两处对「食神忌枭」的表述口径略异
  novelty: new
  relates: []
  tags:
