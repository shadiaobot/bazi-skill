  - 时柱
  - 格局
  source_ref: S0-x19
- id: c-yhr-0360
  domain: D05
  title: 六阴朝阳格（六辛日逢戊子）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"六辛日逢戊子，嫌午未位，运喜西方……辛金至亥为六阴之地，而得子时，故曰：六阴尽处一阳生……只是要子字一位，若多不中。喜戊干，戊来合癸，动巳中暗丙，丙为辛之官星，四柱中忌见午冲破子禄。西方乃金旺之地，故喜也。"'
  rule: 辛日戊子时，取子一位（多则不中），以戊合癸动巳中暗丙为官；忌午冲子、忌未，喜行西方金地，东方财气次之，忌南方火乡。
  trigger: 六辛日生戊子时
  logic: 验子是否只一位、有无午未冲破 → 定成格；按方位定行运
  boundary: 命例「甲寅 甲戌 辛卯 戊子」被告知应作贪财破印论，可见此格常被误用
  limits: 命例「甲寅 甲戌 辛卯 戊子」被告知应作贪财破印论，可见此格常被误用
  novelty: new
  relates: []
  tags:
  - 格局
  - 六阴朝阳
  source_ref: S0-x20
- id: c-yhr-0361
  domain: D08
  title: 月支偏官格：宜制伏、忌官杀混杂
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"五行遇月支偏官，岁月时中宜制伏。类有去官留杀，亦有去杀留宫。四柱纯杂有制，定居一品之尊。略有一位正官，官杀混杂反贱……全要日干生旺，故喜身旺，怕冲动羊刃，只要制伏，不要四柱见正官。"'
  rule: 月支为偏官（七杀）时，岁月时中宜有制伏；纯而制者主贵，若再有一位正官则混杂反贱；须日干生旺、怕冲羊刃。
  trigger: 月支为七杀时
