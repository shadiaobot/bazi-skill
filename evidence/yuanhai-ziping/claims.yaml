- id: c-yhr-0435
  domain: D05
  title: 辰戌丑未为库，须对冲开库（杂气财官喜见冲）
  source_id: src-yuanhai-ziping
  location: 第 285 章 · 动静说
  quote: '"又如辰戍丑未四地支之物，乃天地四方收藏之库，极牢固……真要戍字运来冲开之，就如有了锁匙，开了其锁，而放出戊土乙木癸水出来。

    如丑字就要未字冲，别物不能攻之。

    故曰杂气财官喜见冲，正此意也"'
  rule: 辰戌丑未为四库，库中所藏（如辰藏戊乙癸）外部五行攻不进去，只有对冲之支（辰需戌、丑需未） 才能「开库」放出所藏。这是「杂气财官喜见冲」的原理根据。
  trigger: 命局或岁运逢四库、需要取出库中杂气时
  logic: 库中所藏 → 非冲不开 → 对冲之支出现方可用
  boundary: 冲开之后的吉凶仍取决于所放出的是喜神还是忌神，原书未在此处合并讨论
  limits: 冲开之后的吉凶仍取决于所放出的是喜神还是忌神，原书未在此处合并讨论
  novelty: new
  relates: []
  tags:
  - 墓库
  - 杂气
  - 冲
  source_ref: S0-p60
- id: c-yhr-0436
  domain: D06
  title: 盖头：天干透出者即「头面」，为害不能遮掩
  source_id: src-yuanhai-ziping
  location: 第 286 章 · 盖头说
  quote: '"八字中上四个字是头也，下地支四宇是肚腹四肢也。

    支中所藏之物，是五藏六腑也……凡有所害之物，露出头面，便是动物，就能作害"'
  rule: 以人身取喻：天干四字为头面（外显、不能掩饰），地支为肚腹四肢（隐于内，尚可遮蔽）， 藏干为脏腑。忌神透干即为「头面上已见」，危害立现；忌神仅藏地支，害力较弱。
  trigger: 判断某忌神（如伤官）实际危害大小时
  logic: 透干之忌神 → 危害显著；仅藏于支 → 危害受限
  boundary: 与「官星宜露」并非矛盾：喜神宜透、忌神宜藏，此处未明言但可互推，属待核查
  limits: 与「官星宜露」并非矛盾：喜神宜透、忌神宜藏，此处未明言但可互推，属待核查
  novelty: new
  relates: []
  tags:
  - 盖头
  - 透干
  - 结构细节
  source_ref: S0-p61
- id: c-yhr-0437
  domain: D07
  title: 盖头断流年法：以天干所盖之字定吉凶
  source_id: src-yuanhai-ziping
  location: 第 286 章 · 盖头说
  quote: '"流年行壬申癸酉年，便是不好年。

    盖因壬癸水盖盖在申酉头上，是壬癸水盖了头，便不好也……看八字以此盖头字望见了，就识得人流年好歹，此是真传秘诀也"'
  rule: 断流年时以天干为主：天干为喜神则好（即使地支是忌），天干为忌神则坏（即使地支是喜）， 因为地支之力被天干「盖了头」压制。书中自称此为「真传秘诀」。
  trigger: 逐年判断流年吉凶时
  logic: 流年天干性质 → 决定该年吉凶的大方向 → 地支只作背景
  boundary: 与「大运重地支」构成干支分工：运看支、岁看干，两处的干支权重规则需合并理解
  limits: 与「大运重地支」构成干支分工：运看支、岁看干，两处的干支权重规则需合并理解
  novelty: new
  relates: []
  tags:
  - 盖头
  - 流年
  - 断法
  source_ref: S0-p62
- id: c-yhr-0438
  domain: D07
  title: 四病（雕枯旺弱）之判
  source_id: src-yuanhai-ziping
  location: 第 283 章 · 雕枯旺弱四病说类
  quote: '"如见官星未曾有伤官，见财星未曾有比劫，见印绶未曾有财星，见食伤未曾有印绶，若此纯然无杂，不犹未琢之王，未炼之金乎"'
  rule: 四病为「雕、枯、旺、弱」：① 雕——纯而无杂、无一点牵制克泄，如未琢之玉、未炼之金，有质无用； ② 枯——须是「有根而枯」（官财有根而暂伏，行旺运则发），「无根而枯」则非是； ③ 旺——某神太旺，宜损（官旺行伤官运去官、财旺行比劫运去财、印旺行财运破印、日干旺行官杀运制身）；
    ④ 弱——须是「有根而弱」，弱而有根方能致旺（水至巳为极弱而巳中有庚为水根）。
  trigger: 判断命局偏枯类型与对应处理时
  logic: 先辨属雕/枯/旺/弱，再按类型选行运取舍；「根在苗先」是四病共同的验证条件
  boundary: 原文「王」应为「玉」（版刻/文本讹字），引用时保留原字并加注
  limits: 原文「王」应为「玉」（版刻/文本讹字），引用时保留原字并加注
  novelty: new
  relates: []
  tags:
  - 病药
  - 四病
  - 行运
  source_ref: S0-p63
- id: c-yhr-0439
  domain: D07
  title: 四药（损益生长）与行运喜生喜克之别
  source_id: src-yuanhai-ziping
  location: 第 284 章 · 损益生长四药说类
  quote: '"损者。

    损其有余也。

    ……益者，益其不及也。

    ……如是则贵行金运以克之，则与长生之木理不同也……走以长生二字，衰旺之不同，故行运有喜生喜克之异"'
  rule: 四药为「损、益、生、长」：损＝削其有余（木有余以金制、官旺则损官）； 益＝补其不及（木弱行水运滋根，官弱行官旺乡）；生＝六阳干长生位为真生（甲生亥得壬水生扶）， 六阴干长生位反为弱地（乙生午被丁火泄、己土挠）；长＝帝旺之乡（财官属木长养寅卯辰，此时反而宜行金运克之）。
    结论：同为「长生」二字，衰旺不同则行运有喜生与喜克之别。
  trigger: 依命局偏枯决定行运是生扶还是克制时
  logic: 先定病属损/益/生/长哪一路 → 再定该路喜生还是喜克 → 落到具体行运五行
  boundary: 阴阳干长生吉凶不同（六阴长生反弱）与第 15 章十二长生表并列，须交义理解，属易混处
  limits: 阴阳干长生吉凶不同（六阴长生反弱）与第 15 章十二长生表并列，须交义理解，属易混处
  novelty: new
  relates: []
  tags:
  - 病药
  - 四药
  - 行运
  source_ref: S0-p64
- id: c-yhr-0440
  domain: D08
  title: 七杀须制，制之太过反不作福
  source_id: src-yuanhai-ziping
  location: 第 79 章 · 论偏官即七杀
  quote: '"如有一杀，而制伏二三，复行制伏之运，反不作福。

    何以言之？

    盖尽法无民，虽猛如狼，不能制伏矣，是又不可专言制伏。

    要须轻重得所，不可太甚，亦不可不及"'
  rule: 七杀如小人，须控御得当方能为我所用；制伏不足为祸，制伏过度（一杀而制伏二三，再行制伏运） 亦不成福——「尽法无民」，把可用的力量制死反而不美。标准是轻重得所、不太过不太及。
  trigger: 命局七杀有制伏或准备以食伤制杀时
  logic: 数制伏之神与被制之杀的比例 → 制不足则祸、制太过则无功
  boundary: 「一杀制伏二三」为举例，通用的量化阈值原书未给
  limits: 「一杀制伏二三」为举例，通用的量化阈值原书未给
  novelty: new
  relates: []
  tags:
  - 七杀
  - 制伏
  - 忌法
  source_ref: S0-p65
- id: c-yhr-0441
  domain: D08
  title: 有制伏为偏官，无制伏为七杀
  source_id: src-yuanhai-ziping
  location: 第 79、80 章
  quote: '"又云：有制伏则为偏官，无制伏则为七杀……身旺有气为偏官，身弱无制为七杀"'
  rule: 同一克神，命名称取决于条件：有制伏（或身旺有气）称偏官，可为我用；无制伏而身弱称七杀，为我之害。 名称即判断结论，不能只按干支关系定。
  trigger: 命局出现与日主同阴阳的克神时
  logic: 核验制伏与身旺 → 有制身旺为偏官（贵）→ 无制身弱为七杀（凶）
  boundary: 与「官与鬼一也」同源，属同一思想在七杀上的展开
  limits: 与「官与鬼一也」同源，属同一思想在七杀上的展开
  novelty: new
  relates: []
  tags:
  - 七杀
  - 偏官
  - 命名规则
  source_ref: S0-p66
- id: c-yhr-0442
  domain: D08
  title: 七杀喜忌总纲
  source_id: src-yuanhai-ziping
  location: 第 80 章 · 论七杀即偏官
  quote: '"夫七杀者，亦名偏官。

    喜身旺合杀，喜制伏，喜羊刃；忌身弱，忌见财，忌无制……但忌财旺，财能生杀故也。

    岁运临之，身旺亦多灾，身弱尤甚"'
  rule: 七杀所喜：身旺、合杀、制伏、羊刃；所忌：身弱、见财（财生杀）、无制。 岁运遇财旺，身旺亦多灾，身弱尤凶。
  trigger: 七杀格定喜忌与行运方向时
  logic: 按喜忌清单逐项核验，忌神出现即减分
  boundary: 「合杀」与「制杀」并用时的优先级原书未定
  limits: 「合杀」与「制杀」并用时的优先级原书未定
  novelty: new
  relates: []
  tags:
  - 七杀
  - 喜忌
  source_ref: S0-p67
- id: c-yhr-0443
  domain: D08
  title: 时上七杀可不怕羊刃
  source_id: src-yuanhai-ziping
  location: 第 80 章 · 论七杀即偏官
  quote: '"时上七杀只一位，要本身旺，如年月日时上处有制伏为福，却要行杀旺运，三合得地亦发。

    若无制伏，则要行制伏为福，行杀旺运无制伏，则祸。

    作时上七杀，却不怕羊刃，而亦不畏冲"'
  rule: 时上七杀只宜一位，须身旺；有制伏者宜行杀旺运（或三合得地）方发，无制伏者宜行制伏运。 时上七杀的特殊之处是不怕羊刃、不畏冲。
  trigger: 时柱为七杀时
  logic: 先数位（只一位）→ 验身旺 → 按有无制伏选行运方向
  boundary: 「时上不怕羊刃」与羊刃「忌冲」的普遍规则相抵，未说明理由，属待核查
  limits: 「时上不怕羊刃」与羊刃「忌冲」的普遍规则相抵，未说明理由，属待核查
  novelty: new
  relates: []
  tags:
  - 七杀
  - 时柱
  - 行运
  source_ref: S0-p68
- id: c-yhr-0444
  domain: D04
  title: 印绶即生气，喜官生印、忌财破印
  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  quote: '"所谓印，生我者即印绶也。

    经曰：有官无印，即非真官；有印无官，反成其福……盖印绶畏财，主人括囊。

    故四柱中及运行官贵反成其福，盖官鬼能生印"'
  rule: 印绶是生我之神（一名生气）；有官无印只是假官，有印无官反成其福，因为官能生印。 印最畏财（财破印），命局或岁运遭财乘旺则「括囊」而淹滞。
  trigger: 命局有印绶时定喜忌
  logic: 官生印为吉、财破印为凶 → 按有无官财定印之可用度
  boundary: 与「财官印俱全为贵」（第 149 章女命）并见时，财与印的冲突取舍未给
  limits: 与「财官印俱全为贵」（第 149 章女命）并见时，财与印的冲突取舍未给
  novelty: new
  relates: []
  tags:
  - 印绶
  - 官
  - 财
  source_ref: S0-p69
- id: c-yhr-0445
  domain: D14
  title: 印绶月时见为妙，月上最紧要
  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  quote: '"大凡月与时上见者为妙，而月上最为紧要。

    先论月气之後有生气，必得父母之力；年下有生气，必得祖宗之力；有时上见之有生气，必得子孙之力，寿元耐久，晚景优游"'
  rule: 印绶以月、时两柱出现为佳，其中月柱最重要；月得印主得父母力、年得印主得祖宗力、时得印主得子孙力且寿元耐久。
  trigger: 判断印绶位置优劣时
  logic: 按柱位映射亲属助力与晚景
  boundary: 「月气之后有生气」的次序要求含义含糊（指月令之后节气？），属待核查
  limits: 「月气之后有生气」的次序要求含义含糊（指月令之后节气？），属待核查
  novelty: new
  relates: []
  tags:
  - 印绶
  - 柱位
  - 六亲
  source_ref: S0-p70
- id: c-yhr-0446
  domain: D07
  title: 印绶最怕行死绝运
  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  quote: '"最怕行印绶死绝运或运临死绝，复有物以窃之，即入黄泉，不可疑也"'
  rule: 印绶忌行死绝之运，若行死绝之地又有他物窃气（如财），为极凶之象。
  trigger: 印绶格推大运时
  logic: 印之十二长生宫位落死绝 + 有窃气之物 → 大凶
  boundary: 「入黄泉」为断语式结论，无概率与条件限定
  limits: 「入黄泉」为断语式结论，无概率与条件限定
  novelty: new
  relates: []
  tags:
  - 印绶
  - 大运
  - 凶应
  source_ref: S0-p71
- id: c-yhr-0447
  domain: D04
  title: 正财要得时不要财多
  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  quote: '"故财要得时，不要财多。

    若财多自家日主有力，可以胜任，常化作官。

    天元一气羸弱，贫薄难治，是乐於身旺，不要行克制之乡，克制者，官鬼也"'
  rule: 财星贵在得时（当令），不在数量多；财多而日主有力者可化为官，日主羸弱者则贫薄难治。 财格喜身旺，不喜行克制之乡（官鬼）。
  trigger: 财格定成格条件与行运时
  logic: 财之当令度 + 日主能否任财 → 三等结论（化官、任财、贫薄）
  boundary: 「得时」与「多」的判断标准未量化
  limits: 「得时」与「多」的判断标准未量化
  novelty: new
  relates: []
  tags:
  - 财
  - 身弱
  - 行运
  source_ref: S0-p72
- id: c-yhr-0448
  domain: D04
  title: 正财喜忌清单
  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  quote: '"又云：正财者，喜身旺印绶，忌官星、忌倒食。

    忌身弱、比肩劫财。

    不可见官星，恐盗财之气也；喜印绶能生身，主弱故也"'
  rule: 正财喜身旺与印绶（生身以任财），忌官星（盗财气）、忌倒食、忌身弱、忌比肩劫财（分夺）。
  trigger: 财格定喜忌时
  logic: 按清单核验，喜神出现加分、忌神出现减分
  boundary: 「忌官星」与「财旺生官为吉」并见，两者适用条件（身强身弱）书中未统一说明
  limits: 「忌官星」与「财旺生官为吉」并见，两者适用条件（身强身弱）书中未统一说明
  novelty: new
  relates: []
  tags:
  - 财
  - 喜忌
  source_ref: S0-p73
- id: c-yhr-0449
  domain: D11
  title: 偏财为众人之财，怕分夺与空亡
  source_id: src-yuanhai-ziping
  location: 第 83 章 · 论偏财
  quote: '"而偏财者，乃衆人之财也，只恐兄弟姐妹而夺之，则福不全。

    若无官星，祸患百出。

    故云：偏财好出，亦不惧藏，唯怕有以分夺，及空亡耳"'
  rule: 偏财属众人之财：怕比劫（兄弟）分夺、怕空亡、若无官星则祸患多。 偏财不忌透出亦不忌藏支，重点在「不被分夺」。
  trigger: 命局偏财为用时
  logic: 检查有无比劫夺财、有无空亡、有无官星 → 定福之全缺
  boundary: 「无官星祸患百出」与「用财不见官星为妙」（第 82 章）口径相反，须按正偏财分看
