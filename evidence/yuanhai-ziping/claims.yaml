  title: 寿元取法：以克我之五行论寿
  source_id: src-yuanhai-ziping
  location: 第 183 章 · 心镜歌（眉批）
  quote: '"眉批：甲乙以金为寿元，丙丁以水为寿元，戊己以火为寿元，壬癸以木为寿元，庚辛以土为寿元。"'
  rule: 寿元按「克我者」取：甲乙木以金为寿元、丙丁火以水、戊己土以火、壬癸水以木、庚辛金以土。
  trigger: 推断寿元与寿限时
  logic: 以官杀（克我之神）为寿元，再看其旺衰与受制
  boundary: 此处「寿元」定义与后世（取日主元神）不同，属本书特有用例；且无实证
  limits: 此处「寿元」定义与后世（取日主元神）不同，属本书特有用例；且无实证
