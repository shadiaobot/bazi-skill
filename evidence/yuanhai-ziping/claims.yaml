  quote: '"甲己化土，中正之合。辰戌丑未全曰稼穑，勾陈得位。乙庚化金，仁义之合，巳酉丑全曰从革。戊癸化火，无情之合，得火局曰炎上。丙辛化水得申子辰水局曰润下。丁壬化木，得亥卯未全曰仁寿。"'
