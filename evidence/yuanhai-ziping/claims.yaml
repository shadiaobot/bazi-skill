  title: 行运十二宫断语：长生主作新、临官帝旺主发福、死绝主丧败
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"凡行运长生，主有创建作新之事。到临官帝旺，主兴盛、快乐、发福、进财、生子、骨肉之庆。到衰病之乡，多退败、破财、疾病等事。到死绝乡，主骨肉死丧、自身衰祸、钝闷百事蹇塞。"'
  rule: 以日主所临十二宫位判断行运事件类型：长生主创建作新；临官、帝旺主兴盛发福、进财生子； 衰、病多退败破财疾病；死、绝主骨肉死丧、自身衰祸、百事蹇塞；败运主落魄懒惰酒色昏迷； 胎、库、成形、冠带之乡则百事得中、安康平易。行运至夹贵、华盖、贵人、六合及乘生旺气者皆主善庆，
    但仍须察当生根基："十分则应五分，生时五分则应十分，福与灾同"。
