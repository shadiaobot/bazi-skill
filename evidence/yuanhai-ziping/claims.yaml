  - 藏干
  - 用神
  source_ref: S0-p05
- id: c-yhr-0382
  domain: D03
  title: 生旺常法与土寄母生
  source_id: src-yuanhai-ziping
  location: 第 67 章 · 论生旺
  quote: '"常法以金生巳、木生亥、水生申、火生寅。

    土居中央寄母生，如戊在巳，己在午。

    又土为四季，各旺一十八日，共七十二日"'
  rule: 五行长生位：金巳、木亥、水申、火寅；土无专位，寄母（火）而生， 戊寄巳、己寄午；土不专旺一季，而于四季末各旺十八日，共七十二日。
  trigger: 判五行旺衰与当令时
  logic: 按长生位与季末十八日计算各行的得气程度
  boundary: 「四季各旺十八日」与十二长生表对土的处理不一致（表中戊随丙、己随丁）
  limits: 「四季各旺十八日」与十二长生表对土的处理不一致（表中戊随丙、己随丁）
  novelty: new
  relates: []
  tags:
  - 五行
  - 旺衰
  source_ref: S0-p06
- id: c-yhr-0383
  domain: D04
  title: 旺者须制、强者宜泄
  source_id: src-yuanhai-ziping
  location: 第 71 章 · 论五行生克制化各有所喜所害例
  quote: '"金旺得火，方成器皿。

    火旺得水，方成相济。

    水旺得土，方成池沼。

    土旺得木，方能疏通。

    木旺得金，方成栋梁"'
  rule: 某一行过旺不是吉，须有能制它的那一行才能成材（金得火、火得水、水得土、 土得木、木得金）；旺神有制或出口，命局才成形。
  trigger: 判断日主或某一五行过旺时
  logic: 找克制该旺神的行；有制则成器，无制则壅塞
  boundary: 与「身旺喜泄」并见（眉批：强金得水方挫其锋），制与泄的取舍原书未给优先序
  limits: 与「身旺喜泄」并见（眉批：强金得水方挫其锋），制与泄的取舍原书未给优先序
  novelty: new
  relates: []
  tags:
  - 五行
  - 旺衰
  - 用神
  source_ref: S0-p07
- id: c-yhr-0384
  domain: D06
  title: 生者太盛反害所生
  source_id: src-yuanhai-ziping
  location: 第 71 章 · 论五行生克制化各有所喜所害例
  quote: '"金赖土生，土多金埋。

    土赖火生，火多土焦。

    火赖木生，木多火炽。

    木赖水生，水多木漂。

    水赖金生，金多水浊"'
  rule: 生扶关系并非越多越好：印星过重会埋没日主（土多金埋）， 所以「身弱逢印绶重重，即为所害」（眉批）。
  trigger: 印绶重、生扶过多时
  logic: 生我者过盛则我反受其害，须寻制印之物为药
  boundary: 「重」的量化标准原书未给
  limits: 「重」的量化标准原书未给
  novelty: new
  relates: []
  tags:
  - 五行
  - 印绶
  - 病药
  source_ref: S0-p08
- id: c-yhr-0385
  domain: D08
  title: 身弱遇克必败、身弱遇鬼得物化之则吉
  source_id: src-yuanhai-ziping
  location: 第 71 章 · 论五行生克制化各有所喜所害例
  quote: '"金衰遇火，必见销熔。

    火弱逢水，必为熄灭……此乃身弱遇鬼，得物以化之则吉，如甲日被金杀来伤，若时上一位壬癸水或申子辰解之，即能化凶为吉"'
  rule: 五行本身已衰再遇克制必溃败；但身弱遇官杀若有印（壬癸水）或合局（申子辰） 化解，则可化凶为吉——这是「用药」的基本形态。
  trigger: 日主身弱而官杀旺时
  logic: 先辨是「鬼」还是「官」（身旺为官、身弱为鬼），再找化解之物
  boundary: 化解之物的数量与位置要求（「时上一位」）是否必须，原书未统一
  limits: 化解之物的数量与位置要求（「时上一位」）是否必须，原书未统一
  novelty: new
  relates: []
  tags:
  - 官杀
  - 病药
  - 旺衰
  source_ref: S0-p09
- id: c-yhr-0386
  domain: D08
  title: 官与鬼同体，视身强弱分吉凶
  source_id: src-yuanhai-ziping
  location: 第 71 章 · 论五行生克制化各有所喜所害例（眉批）
  quote: '"官与鬼一也，身旺逢之为官，身弱遇之为鬼"'
  rule: 同一个克制五行的字，身旺时是官（有益）、身弱时是鬼（有害）；吉凶不取决于字本身，而取决于日主强度。
  trigger: 命局见克制日主之五行时
  logic: 先定日主旺衰，再定该字为官或为鬼
  boundary: 「身旺/身弱」的边界原书未量化
  limits: 「身旺/身弱」的边界原书未量化
  novelty: new
  relates: []
  tags:
