  title: 空亡五行吉凶：金空则鸣、火空则发、水空则流（上吉）；木空则朽、土空则崩（主凶）
  source_id: src-yuanhai-ziping
  location: 第 142 章 · 六亲总论
  quote: '"兼有孤神，寡宿，旬中有空亡者忌，二三反吉。金空则鸣，火空则发，水空则流 (此三者上吉)；木空则朽，土空则崩 (二者主凶)。"'
  rule: 空亡的两条判法：孤神、寡宿与旬中空亡同现为忌，但若空亡二三处反主吉。 五行空亡各有吉凶：金空则鸣、火空则发、水空则流为上吉；木空则朽、土空则崩主凶。 此条与第 47 章眉批"火空则发、水空则脱、金空则响、木空则折、土空则陷"在措辞与取向上不一致
