  title: 子平举要歌 · 官星断法组
  source_id: src-yuanhai-ziping
  location: 第 73 章 · 子平举要歌
  quote: '"大抵官星要纯粹，正偏杂乱反无情。

    既用官星，又嫌冲破，谓之无情。

    露官藏杀方为福，露杀藏官是祸胎"'
  rule: 官星贵纯；正偏混杂则无情；用官又遇冲破为无情； 官透而杀藏为福，杀透而官藏为祸源。
  trigger: 官星类格局定喜忌时
  logic: 按纯杂、透藏、冲破三项逐条核验
  boundary: 「露/藏」在月支与年时支上的权重差异未说明
