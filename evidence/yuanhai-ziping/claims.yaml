  rule: 六组地支相合及其所化：子丑化土、寅亥化木、卯戌化火、辰酉化金、巳申化水、午未化火。 末句单列午未：午为太阳、未为太阴，阴阳交汇故化火——这是全书唯一给出理据的一组。 下游用途：合可解冲（第 9 章眉批「相冲者但得有逢合则不能冲」）、合可改性（合去官星则荣不足）、
    合可成局；断六亲时夫妻宫遇合亦据此。 眉批层另有合而不化与争合的判定，本章未展开，须与第 162、163 章化气条合看。
