  - 六亲
  - 七杀
  source_ref: B3-p22
- id: c-yhr-0216
  domain: D05
  title: 夹丘格（拱财格）：日时共拱财库，忌填实牵绊
  source_id: src-yuanhai-ziping
  location: 第 136 章 · 外十八格-夹丘格-拱财格
  quote: '"此格用日支与时支共拱其财。且如甲寅日、甲子时，虚拱丑宫己土为财库。又如丁卯日、丁巳时；甲午日、壬申时；癸酉日、癸亥时是也。要虚拱，不要填实及有牵绊，则拱不得。更要日主自旺或财旺运亦吉。"'
  rule: 成格：日支与时支共同虚拱出财位（如甲寅日甲子时，虚拱丑中己土为财库）。所列组合：丁卯日丁巳时、甲午日壬申时、癸酉日癸亥时。 条件：必须"虚拱"——不要填实、不要有牵绊，否则拱不住；日主自旺或行财旺运亦吉。 歌曰："夹丘之格少人知，拱夹休填塞库中。不犯柱中官杀位，一生清贵显当时。"
    眉批指出章内金丞相命"非夹丘，因年支戌字填实不吉"——即原书自身的成格例存在被否定的情形。
  trigger: 日支与时支相邻且虚拱出财位
  logic: 虚拱且无填实牵绊 → 成；填实、牵绊、见官杀 → 不成
  boundary: 眉批否定了正文所举命例，说明该书本例证与判据之间不严密，卡内须保留此提示
  limits: 眉批否定了正文所举命例，说明该书本例证与判据之间不严密，卡内须保留此提示
  novelty: new
  relates: []
  tags:
