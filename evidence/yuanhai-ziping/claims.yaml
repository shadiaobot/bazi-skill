  - 柱位
  source_ref: B4-p45
- id: c-yhr-0333
  domain: D06
  title: 络绎赋：财生官、官生印、印生身则富贵
  source_id: src-yuanhai-ziping
  location: 第 185 章 · 络绎赋
  quote: '"财生官，官生印，印生身，富贵双全；干党财，财党杀，杀攻身，凶穷两逼。"'
  rule: 顺生链（财→官→印→身）主富贵双全；逆害链（干党财→财党杀→杀攻身）主凶穷。
  trigger: 判断命局整体走向时
  logic: 看五行流是否顺生成身，或是否聚党攻身
  boundary: 「党」的判定（同类聚集）未量化
