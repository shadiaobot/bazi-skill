- id: c-yhr-0417
  domain: D06
  title: 论八字撮要法（用神忌法五条）
  source_id: src-yuanhai-ziping
  location: 第 280 章 · 论八字撮要法
  quote: '"用之为官不可伤。

    用之为财不可劫。

    用之为印不可破。

    用之为食不可夺。

    用之为禄不可冲"'
  rule: 五种用神各有其忌：用官忌伤官、用财忌比劫、用印忌财破、用食忌枭夺、用禄忌冲破。这是全书用神判断的总纲。
  trigger: 用神确定后判断命局与岁运吉凶时
  logic: 用神 → 找出能破坏它的十神/动量 → 该神出现即为凶
  boundary: 仅列五类用神，未覆盖七杀、伤官、羊刃、比劫为用时的忌法（下条另有补充）
  limits: 仅列五类用神，未覆盖七杀、伤官、羊刃、比劫为用时的忌法（下条另有补充）
  novelty: new
  relates: []
  tags:
  - 用神
  - 喜忌
  - 总纲
  source_ref: S0-p42
- id: c-yhr-0418
  domain: D09
  title: 七杀须制、制伏太过反为凶
  source_id: src-yuanhai-ziping
  location: 第 280 章 · 论八字撮要法
  quote: '"若有七杀须要制，制伏太过反为凶。

    若用伤官须要静，此是子平万法宗"'
  rule: 七杀必须有制，但制伏过度同样成凶（把可用之神制死）；用伤官则要求命局安宁不动，此为子平法的根本。
  trigger: 七杀或伤官为用时
  logic: 制杀求「有制而不过」；用伤官求「静」忌动
  boundary: 「太过」的量界原书未给，与病药说「药多药少」呼应但仍需合用
  limits: 「太过」的量界原书未给，与病药说「药多药少」呼应但仍需合用
  novelty: new
  relates: []
  tags:
