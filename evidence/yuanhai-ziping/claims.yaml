  title: 日干旺甚无依，不为僧即道
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"日干旺甚无依，若不为僧即道……既是财官禄马俱无，则欲步于前程，何以施殷，故无依倚，乃持身旺地，盖顺身远害之命。"'
  rule: 日干极旺而命局无财官禄马可用，为「旺而无依」之命，古人断为僧道之流；其人身体康健、寿长。
  trigger: 日干极旺且财官俱无时
  logic: 验财官禄马有无 → 俱无则无可用之地，故曰无依
