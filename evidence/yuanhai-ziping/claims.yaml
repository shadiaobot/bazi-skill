  domain: D07
  title: 论命细法 · 印轻怕行财运
  source_id: src-yuanhai-ziping
  location: 第 181 章 · 论命细法
  quote: '"印轻怕行财运，主恶死或血疾……凡坐杀者，不可行杀旺运"'
  rule: 印星轻弱而遭财运破印，主凶死或血疾；日主坐七杀者不可再行杀旺之运。
  trigger: 行运判断与命局结构组合时
  logic: 以用神（印/杀）的强弱与行运方向的叠加定凶险
  boundary: 「印轻」「坐杀」的判定标准需结合旺衰，原书未量化
  limits: 「印轻」「坐杀」的判定标准需结合旺衰，原书未量化
