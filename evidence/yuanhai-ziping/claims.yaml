  title: 大运重地支：行干兼用支神，行支则弃天干
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"凡行运在干兼用地支之神，在支则弃天干之物，盖大运重地支，故有行东方、南方、西方、北方之辨。"'
  rule: 大运的取用口径：大运重地支，行运走到干上时兼看该干所坐地支之藏神，走到支上时则不取该柱天干之用； 因此本书行运常以"东方/南方/西方/北方"论，即以五方五行之气代替单干支。 章首另立总纲："子平之法，大运看支，岁君看干"，并阐明月令为"运元"，行运自月令起。
  trigger: 已排定大运干支序列
  logic: 取运之气以地支为主；天干仅作辅助参考
  boundary: 与"大运看支、岁君看干"并列使用时，天干是否完全弃用，正文与眉批表述略有出入
  limits: 与"大运看支、岁君看干"并列使用时，天干是否完全弃用，正文与眉批表述略有出入
