  quote: '"五月宫中火正荣，高低贵贱两分明，财官印用直生旺，化杀欣逢要水平。……午宫怕子水来冲，用火逢冲数必凶，日主庚辛如会杀，运中逢此反成功。"'
  rule: 午月火旺（丁22日、丙7日），财官印宜生旺，化杀需水；午宫最怕子水冲，用火而逢冲则凶；庚辛日主会杀者行此反可成功。
  trigger: 生于午月时
  logic: 先定用神（火或水）→ 再判子午冲对用神的影响
  boundary: 「化杀欣逢要水平」与「怕子水冲午」并存，取决于用神为火还是为水
  limits: 「化杀欣逢要水平」与「怕子水冲午」并存，取决于用神为火还是为水
