- id: c-yhr-0349
  domain: D11
  title: 归禄格（日禄居时，号青云得路）及其六忌
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"日禄居时没官星，号青云得路……要四柱中无一点官星，方为此格，为青云得路。最要日干生旺，兼行食神、伤官之乡可发福。但归禄有六忌：一忌刑冲，二忌作合，三忌倒食，四忌官星，五忌日月天元同，六忌岁月天元同，犯此六者，不可一例以为贵矣。"'
  rule: 时支为日干之禄、四柱全无官星者为归禄格（青云得路）；须日干生旺、行食伤运发福；六忌为刑冲、作合、倒食、官星、日月天元同、岁月天元同。
  trigger: 时支为日干禄地时
  logic: 验有无官星与六忌 → 无则成格、有则一例不作贵论
  boundary: 「日月天元同」「岁月天元同」的含义（天干相同？）原书未展开
  limits: 「日月天元同」「岁月天元同」的含义（天干相同？）原书未展开
  novelty: new
  relates: []
  tags:
  - 禄
  - 格局
  - 六忌
  source_ref: S0-x09
- id: c-yhr-0350
  domain: D05
  title: 壬骑龙背格（辰多贵、寅多富）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"阳水叠逢辰位，是壬骑龙背之乡……如壬辰日生，遇辰字多者贵，寅字多者富。盖壬以己土为官星，丁火为财星。辰日暗冲戌中之官库，所以贵也。寅字多能合午中之财，所以富也。"'
  rule: 壬辰日见辰多者贵（辰暗冲戌中官库取官）、见寅多者富（寅合午中丁火为财）；《四言独步》补充「见戌无情、寅多则富、辰多则荣」。
  trigger: 壬辰日且四柱辰多或寅多时
  logic: 辰多取贵、寅多取富；见戌则破（冲实官库）
  boundary: 书中命例（丙子 甲午 壬辰 甲辰）作者不按此格而以财格看，说明成格判定有分歧
  limits: 书中命例（丙子 甲午 壬辰 甲辰）作者不按此格而以财格看，说明成格判定有分歧
  novelty: new
  relates: []
  tags:
  - 格局
  - 壬骑龙背
  - 暗冲
  source_ref: S0-x10
- id: c-yhr-0351
  domain: D05
  title: 六乙鼠贵格（阴木独遇子时）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"阴木独遇子时，为六乙鼠贵之地……大惧午字冲，丙子时尤妙，谓之聚贵也。或四柱中有庚字、辛字、申字、酉字、丑字，内则有庚辛金则减分数，岁君大运亦然。如月内有官星则不用此格。"'
  rule: 乙日遇子时（尤以丙子时）为六乙鼠贵；忌午冲，忌庚辛申酉丑（金），月内见官星则不用此格。
  trigger: 乙日生子时
  logic: 验有无冲、有无庚辛申酉丑、月内有无官星 → 有则减分或弃格
  boundary: 命例中被判「只好作印看」，说明实际取用常与格名不符
  limits: 命例中被判「只好作印看」，说明实际取用常与格名不符
