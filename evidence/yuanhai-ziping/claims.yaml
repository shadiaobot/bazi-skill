  source_id: src-yuanhai-ziping
  location: 第 86 章 · 论伤官
  quote: '"年带伤官，父母不全；月带伤官，兄弟不完；时带伤官，子息为顽；日带伤官，妻妾不完"'
  rule: 伤官落于年/月/日/时各主对应六亲有缺，是柱位与星曜叠加的断语法。
  trigger: 命局见伤官时按柱位断六亲
  logic: 柱位对应亲属 + 伤官属性 → 该亲有损
  boundary: 属明代宗法语境下的断语，未见统计效度，不应作为可移植规则
