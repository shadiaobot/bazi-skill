- id: c-yhr-0399
  domain: D09
  title: 伤官务要伤尽，伤官见官为祸百端
  source_id: src-yuanhai-ziping
  location: 第 86 章 · 论伤官
  quote: '"伤官者，其验如神。

    伤官务要伤尽，伤之不尽，官来乘旺，其祸不可胜言。

    伤官见官，为祸百端"'
  rule: 用伤官之局必须把官星彻底制净；若留有一点官星，一旦岁运官旺反扑， 必生大祸；「伤官见官」是全书反复警告的高危结构。
  trigger: 命局以伤官为主气或见伤官克官时
  logic: 核验官星是否伤尽 → 不尽则忌官运 → 有吉神解亦须防恶疾或官讼
  boundary: 「伤尽」的可操作定义（藏干是否计入）原书未给
  limits: 「伤尽」的可操作定义（藏干是否计入）原书未给
