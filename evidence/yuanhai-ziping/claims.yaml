  rule: 本章给出纳音的真正算法（并借此批评第 14 章的「海中金、炉中火」取象为后出附会）： ① 取大衍之数四十九；② 用天干地支的固定数除减——甲己子午九、乙庚丑未八、丙辛寅申七、丁壬卯酉六、 戊癸辰戌五、巳亥四；③ 余数再按五行数（水一火二木三金四土五）以「相生取用」定五行。
