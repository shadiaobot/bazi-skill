  title: 子平之法不用胎元小运与纳音，专以生日天元为主
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"子平之法，不用胎元小运，不用纳音，专以生日天元为主，配合八字干支并支中所藏者人元，或当生为财，为官，为祸，为福，依此参详。"'
  rule: 方法论宣言：子平之法不用胎元、不用小运、不用纳音，专以生日天元为主，配合八字干支与支中藏干（人元）， 按当生之财官祸福参详。同段并批评以年为主的古法「以甲子年生，便可为本命忌日之戒……则可知万亿同者矣」， 指出以年论命会使「万亿富贵相同者」，故改以日主为坐标。
    这条口径与本书自身收录胎元（第 20 章）、小运（第 56 章）、纳音（第 14 章）并存， 属作者明确的层级取舍：那些是旧法留存，不构成子平主判。 下游用途：交付能力卡时应把这一条写进 B 段——胎元／小运／纳音在本书中是旁支，不覆盖月令格局的主判。
