- id: c-yhr-0272
  domain: D09
  title: 伤官见官为祸百端：元有者重、元无者轻
  source_id: src-yuanhai-ziping
  location: 第 175 章 · 杂论又诀
  quote: '"伤官见官，为祸百端，若非疾病伤躯，必当官讼囚系，子丧妻伤。伤官见官，元有者重，元无者轻。伤官见官，重则迁徙，轻则刑责。伤官见官，心地勾曲、诡谲多诈、傲物气高，常以天下之人不如己，贵人惮之，小人恶之。"'
  rule: 伤官见官的分级判据：总体为祸百端（疾病伤躯、官讼囚系、子丧妻伤）；关键是"元有者重、元无者轻" ——即原局本已伤官见官者重，行运临时遇合者轻。程度分级：重则迁徙、轻则刑责。 并附性情断语（心地勾曲、诡谲多诈、傲物气高）。 相关的用财用印之别：伤官用财者富、伤官劫财者贫；伤官用印去财方可驰名；伤官用财则于伤官处发福。
  trigger: 命局或行运见伤官与官星并现
  logic: 原局本有 → 重；行运偶遇 → 轻；用财则富、劫财则贫
  boundary: 性情断语属体系内断言；"迁徙""刑责"为古代刑罚语境，须标注时代局限
  limits: 性情断语属体系内断言；"迁徙""刑责"为古代刑罚语境，须标注时代局限
  novelty: new
  relates: []
  tags:
