  quote: '"论命者切不可泥之月令消详，故表而出之"'
  rule: 月令虽是提纲，仍须与四柱全局、岁运合看；拘泥月令会失真。
  trigger: 月令结论与其他干支信息冲突时
  logic: 以全局「损益」权衡，不因月令一票定案
  boundary: 与第 77 章「看命先看提纲，方看其余」并列存在，书中未给冲突消解顺序
