- id: c-yhr-0033
  domain: D03
  title: 三元：天元（干）、地元（支）、人元（支中藏干）
  source_id: src-yuanhai-ziping
  location: 第 33 章 · 论三元
  quote: '"假令甲子，以甲木为天元，子为地元，子中所藏癸水为人元。"'
  rule: 三元的分层：天干为天元、地支为地元、地支所藏之干为人元。以甲子为例，甲为天元、子为地元、 子中癸水为人元。 这条定义是全书「天干为显、地支为体、藏干为用」这一读法的编码前提：十神要同时在干与藏干上取， 月令用神取自支中藏干，旺衰要看地支，断事要分天干层与地支层。
    下游用途：第 34、35 章的神煞（禄、驿马）与第 59、61 章的藏遁歌都以此为基础。
  trigger: 排盘后分层读取命局
  logic: 干＝天元（显） → 支＝地元（体） → 支中藏干＝人元（用）
  boundary: 本章只给定义与一例；藏干的完整分配须回第 59、61 章
  limits: 本章只给定义与一例；藏干的完整分配须回第 59、61 章
  novelty: new
