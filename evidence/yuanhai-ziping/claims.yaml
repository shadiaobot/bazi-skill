  quote: '"子怕寅午火，不怕水。寅木不怕金，巳金不怕火，己土不怕木，午火不怕水。未同申金不怕火，己土戊土不怕木，卯木怕酉金，辰土怕寅木，乙日五月不怕杀。"'
  rule: 逐条列出五行相克中的例外：子怕火不怕水、寅木不怕金、巳金不怕火、午火不怕水、戊己土不怕木；而卯木怕酉金、辰土怕寅木。即同一克神对不同地支的杀伤力不同。
  trigger: 判断某克神能否真正伤害日主或某支时
  logic: 按日主五行与地支组合查「怕/不怕」清单
  boundary: 这些例外与十二长生、藏干本气的关系未说明，属口诀式清单
  limits: 这些例外与十二长生、藏干本气的关系未说明，属口诀式清单
  novelty: new
  relates: []
  tags:
