  quote: '"月令有气曰刚，无气曰柔。……故偏阴偏阳之谓疾，此谓之有情无情也。"'
  rule: 刚柔不是泛指性格，而是对月令得气的判定：月令有气为刚、无气为柔；阴阳两股各有刚柔。 正文据此推出「凡推五行，阴阳匹配，上下不相偏者为贵命也」——四柱阴阳匹配、上下不偏者为贵； 偏阴偏阳者则「虽金为木官鬼，妻财不见，反为仁义俱无，刚柔不济」，即格局虽有名目而无实。
    结论句：「故偏阴偏阳之谓疾，此谓之有情无情也」——偏枯即为病，有情（匹配）与无情（偏枯）是断层次的分水岭。 下游用途：与病药说（第 282 章）互证，二者都以「偏而失救」为病；断层次时以匹配为「有情」。
