  title: 干旺宜衰运、干弱宜旺运
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"干旺宜行衰运，干弱宜旺运，正乃“干弱则求气旺之籍，有余则喜不足之营”。须要通变，更兼孤寡、空亡、勾绞、丧门、吊客、宅墓、病死、官符、白虎诸杀推之，其验如神。"'
  rule: 行运的总方向由日干强弱决定：日干旺宜行衰运（泄耗），日干弱宜行旺运（扶助）， 其理为"干弱则求气旺之籍，有余则喜不足之营"。并须结合孤寡、空亡、勾绞、丧门、吊客、 宅墓、病死、官符、白虎诸煞同参。
  trigger: 已定日干旺衰
  logic: 旺 → 行衰运；弱 → 行旺运
  boundary: 未给"旺/弱"的分界标准；与格局喜忌冲突时的优先序未明
  limits: 未给"旺/弱"的分界标准；与格局喜忌冲突时的优先序未明
