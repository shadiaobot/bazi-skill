  quote: '"官杀两停，喜者存之，憎者弃之……是官杀混杂，虽有制伏之运，或去杀用官，或去官用杀，方发福。若混杂之命，岁运更在旺乡，混官杀，其祸不可俱述也。"'
  rule: 官杀力量相当（两停）时，须按喜憎保留一个、弃去一个（去杀用官或去官用杀），方得发福；若岁运再入混杂之地则祸不可言。
  trigger: 官杀力量相当、难以自然取一之时
  logic: 择其中有力可用者留之，另一者去之；忌两头并存
