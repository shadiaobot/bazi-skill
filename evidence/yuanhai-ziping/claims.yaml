- id: c-yhr-0227
  domain: D12
  title: 论父：偏财为父，忌比劫木局与死绝刑冲
  source_id: src-yuanhai-ziping
  location: 第 144 章 · 论父
  quote: '"偏财是父，乃印绶之官星也。如甲日以戊为父，再见甲寅字或木局全，或临死绝冲刑之地，主克父也。不然主离异、不睦或疾病伤残。若得庚字、申字救庶，无大害。"'
  rule: 父以偏财（印之官星）定位。甲日以戊为父：再见甲寅或木局全（比劫夺财）、或父星临死绝冲刑之地， 主克父，否则主离异、不睦、疾病伤残；得庚、申（金制木）可救而无大害。 父星临生旺贵人、天月德者主有贵；临杀地则父死他乡；居衰败受制墓绝之地则父平常。
  trigger: 偏财为父，被比劫夺或临死绝冲刑
  logic: 父星旺相且有救 → 得力；被夺、被冲、临死绝 → 克父或父平常
  boundary: 眉批以甲日示范，其余日干须"仿此"类推；不得当事实断言
  limits: 眉批以甲日示范，其余日干须"仿此"类推；不得当事实断言
  novelty: new
  relates: []
  tags:
