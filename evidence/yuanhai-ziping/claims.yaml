- id: c-yhr-0331
  domain: D06
  title: 妖祥赋：先日干次月令，正贵忌刑冲
  source_id: src-yuanhai-ziping
  location: 第 184 章 · 妖祥赋
  quote: '"先要取其日干，次则详其月令，年时共表其吉凶……五行正贵，忌刑冲克破之乡。四柱支干，喜三合六合之地。寅申巳亥，乃财官印绶长生；辰戌丑未，系禄马印星寄库。"'
  rule: 起手顺序为日干→月令→年时；正贵忌刑冲克破、喜三合六合；寅申巳亥为财官印长生、辰戌丑未为禄马印寄库。
  trigger: 开始一次完整推演时
  logic: 定日干与月令 → 再合年时 → 最后看刑冲合会
  boundary: 与第 75 章起手顺序一致，可互证
  limits: 与第 75 章起手顺序一致，可互证
  novelty: new
  relates: []
  tags:
