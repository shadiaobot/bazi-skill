- id: c-yhr-0229
  domain: D12
  title: 论妻妾：正财为妻、偏财为妾及其克应条件
  source_id: src-yuanhai-ziping
  location: 第 146 章 · 论妻妾
  quote: '"正财为正妻；偏财，妾也。……财衰败墓绝，主妻有疾不贤，否则年高再嫁。……财多身弱，妻反胜夫；财命有气，妻妾和顺，是得妻力。日坐空亡，难为妻妾。"'
  rule: 妻妾定位：正财为正妻、偏财为妾。甲木见乙木局（亥卯未）伤妻，甲寅亦克妻，并主妻不正； 财衰败墓绝 → 妻有疾不贤或年高再嫁；见癸字 → 妾不正；见己丑未 → 自安。 比肩分夺、财临桃花 → 妻妾私通。日下月下坐财官 → 妻多内助、得妻财。
    偏财得位则妾胜于妻，正财自旺则妻不容妾；官杀重见则妻招干蛊； 财官并美者为人怕妻（见杀尤忌）；财多身弱则妻反胜夫；财命有气则妻妾和顺。 另看孤鸾日、阴差阳错，主克妻或因妻致眷、寒房冷娶、入赘填房。
  trigger: 以正财/偏财分别定位妻妾，察其与比劫、桃花、空亡的关系
  logic: 财旺身能任 → 得妻力；财衰、被夺、临死绝桃花空亡 → 妻有疾/不正/难为妻妾
  boundary: 断语含性别与时代成见（妾、不正、怕妻），须标注时代局限，不作事实判断
  limits: 断语含性别与时代成见（妾、不正、怕妻），须标注时代局限，不作事实判断
