  source_ref: S0-x05
- id: c-yhr-0346
  domain: D06
  title: 官星财气长生镇居于寅申巳亥（四孟凶局）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"官星财气长生，镇居于寅申巳亥……寅申巳亥乃五行长生之地……己用甲为官，亥中有甲木长生，己用壬为财，申中有壬水长生，己用丙为印绶，寅中有丙火长生，此为四孟凶局。"'
  rule: 财官印长生落在寅申巳亥四孟之地本为得地，但若四孟各自引来不同用神，反成「四孟凶局」（书中例判先荣后辱）。
  trigger: 财官印长生俱在四孟之地时
  logic: 验四孟所藏是否分别成官、成财、成印 → 是则结构分散、反主凶
  boundary: 判「凶局」的依据是命例结果（先荣后辱），非规则推演，属待核查
  limits: 判「凶局」的依据是命例结果（先荣后辱），非规则推演，属待核查
