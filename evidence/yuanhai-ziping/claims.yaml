  title: 伤官须见财方可用
  source_id: src-yuanhai-ziping
  location: 第 86 章 · 论伤官
  quote: '"如四柱中虽伤尽官星，身虽旺，若无一点财气，只为贫薄。

    如遇伤官者，须见其财为妙，是财能生官也"'
  rule: 伤尽官星而无财气仍是贫薄之命；伤官格的成立以见财为要件（伤官生财、财再生官）。
  trigger: 伤官格定成格条件时
  logic: 验财星有无 → 无财则不作贵论
  boundary: 财星须透干还是藏支即可，原书未明示
  limits: 财星须透干还是藏支即可，原书未明示
