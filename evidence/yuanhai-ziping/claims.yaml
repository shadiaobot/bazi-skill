  location: 第 206 章 · 四月建巳候诗诀
  quote: '"甲乙如临四月天，水乡木旺振财源，北方火地多凶破，酉又相逢祸便言。眉批：四月巳宫火旺二十二日，庚金生五日，戊土三日。"'
  rule: 巳月火旺22日、庚金5日、戊土3日；甲乙木生巳月得水则振财源，忌北方火地与酉金相逢。
