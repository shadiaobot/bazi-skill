  quote: '"日德金神 月逢土旺 纵有轻名 祖业漂荡 金神带煞 身旺为奇 更行火地 名利当时 甲日金神 偏宜火制 己日金神 何劳火制 六甲生春 时犯金神 水乡不发 土重名真"'
