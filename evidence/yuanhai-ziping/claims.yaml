- id: c-yhr-0255
  domain: D07
  title: 财化为鬼与化鬼为助：水命遇火运、土运的反转
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"凡水命，四柱有土，至火运本是财运，却反为鬼者，以火生土，土克水，是财化为鬼，转福成祸。四柱有金至土运是鬼运，却反为吉者，以土生金，金生水，是化鬼为助气，反祸为福。"'
  rule: 五行通关导致吉凶反转的两例：水命而四柱有土，行火运本是财运，但火生土、土克水， 于是"财化为鬼、转福成祸"；水命而四柱有金，行土运本是鬼运，但土生金、金生水， 于是"化鬼为助气、反祸为福"。 另：水命柱中有寅午戌或纳音火，再行寅午戌为好运；若柱中金火俱有而行水运，则分其福为不好运；
    四柱多土却行木运名曰"损气"，主驳杂，虽有救亦多辛苦。
  trigger: 行运之五行与本命四柱构成通关（生克链）
  logic: 通到用神一路 → 反祸为福；通到克身一路 → 转福成祸
