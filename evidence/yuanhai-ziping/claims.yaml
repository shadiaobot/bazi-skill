- id: c-yhr-0262
  domain: D15
  title: 化之真假与正化偏化：化真名公巨卿，化假孤儿异姓
  source_id: src-yuanhai-ziping
  location: 第 162 章 · 论运化气
  quote: '"天干化合者，秀气。地支合局者，福德。化之真者，名公巨卿。化之假者，孤儿异性。逢龙即化，变作飞龙在天，利见大人。月令生旺，养库临官之地方化。阴阳得合，夫妇匹配，中和之气而化，太过不及皆不能化。"'
  rule: 化气的成立条件与真假判据：天干化合为秀气、地支合局为福德；须月令生旺，或养、库、临官之地方能化； 须阴阳得合、如夫妇匹配、得中和之气而化——太过、不及皆不能化。 化之真者主贵（名公巨卿），化之假者主孤（孤儿异姓，或为僧道）。 另列化之种类：夫从妻化、妻从夫化、正化、偏化、日下自化、转角化（未坤申、丑艮寅）。
    甲日见己字化土、己见甲亦然，谓"化之真"，即正化。
  trigger: 天干成合且月令得气
  logic: 得月令生旺/养库临官 + 阴阳得合 + 无太过不及 → 真化（贵）；否则假化（孤）
  boundary: 真假之间的判据以"中和"表述，无量化；"戊癸化火，南木化午，北不化子"一句文字有讹，须回核
  limits: 真假之间的判据以"中和"表述，无量化；"戊癸化火，南木化午，北不化子"一句文字有讹，须回核
