  - 旺衰
  source_ref: S0-p10
- id: c-yhr-0387
  domain: D08
  title: 官星要纯不要杂，混杂须火制
  source_id: src-yuanhai-ziping
  location: 第 70 章 · 论官杀混杂要制伏
  quote: '"官星要纯不要杂。

    假如甲木用辛金为官，若年是辛，月是酉，时上亦是辛官，虽多但无妨，盖纯一尽好。

    若有金或庚申，则混杂为杀，以伤其身，要行火乡制伏则发福也"'
  rule: 同类官星重复出现无妨（纯一），但正官与七杀并见即混杂，反伤日主； 救法是以食伤（火）制伏混入的杀，行运走制伏之乡反主发福。
  trigger: 八字中正官与七杀同时出现时
  logic: 辨纯杂→混杂则须制（以克官杀之食伤行制伏）→制得力则发福
  boundary: 眉批提醒「金旺无制，则不能为吉」；制伏力度不足时的结论原书未细论
  limits: 眉批提醒「金旺无制，则不能为吉」；制伏力度不足时的结论原书未细论
  novelty: new
  relates: []
  tags:
  - 官杀
  - 制伏
  - 喜忌
  source_ref: S0-p11
- id: c-yhr-0388
  domain: D05
  title: 正官格成立条件与喜忌
  source_id: src-yuanhai-ziping
  location: 第 98 章 · 内十八格-正官格
  quote: '"月内有官星者是也。

    时上兼有财星者，真贵人也。

    怕相冲，忌见伤官七杀，大运亦然。

    喜印绶，喜旺，喜财星，岁运同。

    官星宜露，岂可藏之"'
  rule: 月令见官星即为正官格；时上再有财星为大贵。忌冲、忌伤官七杀混杂， 喜印绶、喜身旺、喜财星；官星宜透干不宜藏支。
  trigger: 月令所藏或月干为正官时
  logic: 先验成格（月内官星）→ 再看护卫（印、财、身旺）与破坏（冲、伤、杀）
  boundary: 「官藏杀浅、露杀非真」的中间态判法原书只给断语未给步骤
  limits: 「官藏杀浅、露杀非真」的中间态判法原书只给断语未给步骤
  novelty: new
  relates: []
  tags:
  - 格局
  - 正官
  source_ref: S0-p12
- id: c-yhr-0389
  domain: D05
  title: 正官多位反不为福
  source_id: src-yuanhai-ziping
  location: 第 77 章 · 正官论
  quote: '"正官或多，反不为福，何以言之？

    盖人之命宜得中和之气，太过与不及同。

    中和之气为福厚，偏党之克为灾殃"'
  rule: 命贵中和，官星过多与不足同样为病；多个官星还会转为杀的效应。
  trigger: 命局官星重复出现（两位以上）时
  logic: 以中和为尺度判断过与不及，过则减分
  boundary: 「多」的判定以天干透出数为准还是含藏支，原书未定
  limits: 「多」的判定以天干透出数为准还是含藏支，原书未定
