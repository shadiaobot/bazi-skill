  source_id: src-yuanhai-ziping
  location: 第 85 章 · 论倒食
  quote: '"夫倒食者，冲财神之谓也，一名吞陷杀。

    用财神大忌见之，用食神亦忌见之……凡命中带此二者，主福寿浅薄"'
  rule: 倒食即枭神夺食，使食神不能生财；用财或用食神之局最忌见之，主福寿浅薄、「财源屡成屡败」。
  trigger: 命局有食神而见偏印（枭）时
  logic: 枭克食 → 食不能生财 → 财源与福寿受损
  boundary: 若枭被制或其位置受限时的补救原书未细论
