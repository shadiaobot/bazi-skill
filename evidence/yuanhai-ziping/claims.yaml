  - 格局
  - 行运
  source_ref: B3-p09
- id: c-yhr-0209
  domain: D14
  title: 玄武当权格：壬癸日得火局为财、四季土为官
  source_id: src-yuanhai-ziping
  location: 第 122 章 · 外十八格-玄武当权格
  quote: '"且如壬癸二日生，值寅午戌火局为财，辰戌丑未为官是也。正是壬寅、壬午、壬戌；癸巳、癸未、癸丑是也。忌冲破，身弱则不吉。……遇刑冲或岁运见之，则不利矣。"'
  rule: 成格：壬癸日（水为玄武），地支成寅午戌火局（财）或见辰戌丑未（官）。具体日柱：壬寅、壬午、壬戌、癸巳、癸未、癸丑。 机理标为"水火既济之理"。 破格：忌冲破；身弱则不吉；岁运见刑冲亦不利。 正文另附一条性情断语：得此格者性温、有智慧、有礼貌、面赤黑、威而不猛。
  trigger: 壬/癸日 + 支成火局或见四季土，且属所列六日之一
  logic: 财官两见 → 成真；身弱、刑冲、岁运冲破 → 不利
  boundary: 性情断语属体系内描述，不可作事实断言；"身弱则不吉"与成格条件的关系未给判定序
  limits: 性情断语属体系内描述，不可作事实断言；"身弱则不吉"与成格条件的关系未给判定序
  novelty: new
  relates: []
  tags:
