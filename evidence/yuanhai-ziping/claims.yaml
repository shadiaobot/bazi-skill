  domain: D05
  title: 五行俱足格：年月日时胎五行金木水火土全
  source_id: src-yuanhai-ziping
  location: 第 138 章 · 外十八格-五行俱足格
  quote: '"此格取年月日时胎，带金木水火土全者是也。甲子年金，戊辰月木，丁巳日土，丁未时水；乙酉年水，壬午月木，辛未日土，丙申时火。此格亦不论官杀，只取五行为全，自有生生不绝之义，化化无穷之理，是亦罕有矣。"'
  rule: 成格：取年月日时（原文并提"胎"）的纳音五行，金木水火土五者齐备。 正文自举两例：甲子年（金）、戊辰月（木）、丁巳日（土）、丁未时（水）；乙酉年（水）、壬午月（木）、辛未日（土）、丙申时（火）。 该格"不论官杀"，只取五行周全，理由为生生不绝、化化无穷。原文自认"罕有"。
  trigger: 见原文条件
  logic: '成格：取年月日时（原文并提"胎"）的纳音五行，金木水火土五者齐备。

