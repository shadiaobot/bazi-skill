  quote: '"男取克干为嗣，女取干生为子，存失皆例，以时分野，当推贫贱富贵之区—假令甲乙生人，以庚辛为子息。"'
  rule: 子女星的取象规则：男命取克日干者为子息（甲乙日以庚辛为子），女命取日干所生者为子（甲乙日以丙丁为子）； 再看时柱落在何分野，按轻重与生旺定子女多少。 正文并给完整判据：看子星在时柱所处之宫——落在长生、沐浴、冠带、临官、帝旺之乡者多嗣且子美丽富贵；
    落在衰、病、死、墓、绝、无气、胎、养或冲刑之乡者子少，且主孤苦贫贱之子； 更看四柱有无克子之星，可断无子。眉批另附男取克干嗣歌与女取干生子歌（逐干列出子星）。 层级标注：断子女数量与贤愚属体系内断言，且以「时柱分野」为唯一变量，不具现代可验证性。
