- id: c-yhr-0277
  domain: D07
  title: 崛起与聚兴：待运而发的两种机理
  source_id: src-yuanhai-ziping
  location: 第 176 章 · 群兴论
  quote: '"盖因柱中日主生气未旺，所用贵神，悉皆得位而成旺，又且合格，奈何日主无力，不能胜任其福，亦劳困淹塞。忽逢运扶，其日干得其强健，用神出呼啸风生，元命用神方为我用。我其乘之，则勃然而兴。"'
  rule: 崛起的机理：日主无力而所用贵神得位成旺且合格，故原局不能任福、劳困淹塞； 忽逢运扶、日干强健，用神方为我用，遂勃然而兴——"衰以遇旺，故迎吉而能崛起"。 聚兴的机理：日主强而四柱杀纯不杂、身杀俱旺，根本无制伏故富贵不成， 唯待运来制伏杀神化为权，方此崛兴（"身旺杀神逢制化为权也"）；如运不至，即常人。
    另有"用神被恶运夺去而后复振"一类，亦归中兴。
  trigger: 原局有用神但日主不能任，或身杀俱旺而无制
  logic: 得运扶身或得运制杀 → 忽然而发；运不至 → 常人
  boundary: 属机理描述，未给"何时得运"的判据，仍依赖行运推演
  limits: 属机理描述，未给"何时得运"的判据，仍依赖行运推演
