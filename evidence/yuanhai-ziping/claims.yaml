  - 遥巳
  source_ref: S0-x16
- id: c-yhr-0357
  domain: D05
  title: 丑遥巳格（辛癸日多逢丑地，忌官星与子午）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"辛癸日多逢丑地，不喜官星；岁时逢子巳二宫，虚名虚利……只辛丑、癸丑二日可用。但要四柱中无一点官星方用此格……丑能破巳，丙午之禄出矣。不要填实巳位，子午羁绊不能遥也。若申酉得一字为好。"'
  rule: 辛丑、癸丑日见丑多，以丑破巳取丙戊为官；须四柱无一点官星，忌填实巳位、忌子午羁绊，得申酉一字为好。
  trigger: 辛丑或癸丑日而丑多时
  logic: 验官星、验填实与羁绊 → 无则成格
  boundary: 「若四柱见了一点官星，乃只一个秀才」——破格后果的描述属断语
  limits: 「若四柱见了一点官星，乃只一个秀才」——破格后果的描述属断语
