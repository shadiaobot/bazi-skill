  source_id: src-yuanhai-ziping
  location: 第 159 章 · 论疾病
  quote: '"木命见庚辛申酉多者，肝胆病。内则惊精、虚怯痨疾、呕血、头晕目眩、痰喘、头风脚气、左瘫右痪、又眼歪斜、风症。筋骨疼痛。外则皮肤乾燥、眼目之疾、发须疏少、颠朴手足损伤之患。"'
  rule: 五行受克以致病的通例：木命见庚辛申酉多者主肝胆病，内症列惊精、虚怯痨疾、呕血、头晕目眩、 痰喘、头风脚气、左瘫右痪、风症、筋骨疼痛；外症列皮肤干燥、眼目之疾、发须疏少、手足损伤。 女则堕胎、血气不调（后者附有现代编者注解）；小儿急慢惊风、夜啼咳嗽。引经作"筋骨疼痛，盖因木被金伤"。
