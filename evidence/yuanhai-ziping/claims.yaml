- id: c-yhr-0430
  domain: D14
  title: 疾病断法：取伤重者与五行过旺过弱
  source_id: src-yuanhai-ziping
  location: 第 159 章 · 论疾病
  quote: '"八字干支五行生克之义，取伤重者而断之。

    五行干支太旺不及俱病"'
  rule: 疾病判断取两个依据：被克最重的那一行（伤重者），以及五行太旺或不及（偏枯）。
  trigger: 推断疾病部位与类型时
  logic: 辨最受伤的五行 → 对应脏腑；兼看五行是否偏枯
  boundary: 脏腑对应表（甲肝乙胆等）为断言而非推导；且作者注明「若木生旺而逢金，亦无此病」，条件性较强
  limits: 脏腑对应表（甲肝乙胆等）为断言而非推导；且作者注明「若木生旺而逢金，亦无此病」，条件性较强
  novelty: new
  relates: []
  tags:
  - 疾病
  - 五行
  source_ref: S0-p55
- id: c-yhr-0431
  domain: D14
  title: 疾病五行分类断法（木命见金克等）
  source_id: src-yuanhai-ziping
  location: 第 159 章 · 论疾病
  quote: '"木命见庚辛申酉多者，肝胆病……火命见水及亥子旺地，主小肠心经之患……土命见木及寅卯旺乡，主胆胃经受伤……金命见火及巳午旺处，主大肠肺经受病……水命

    见土及四季旺月，主膀胱肾经受病"'
  rule: 按日主五行与克它的五行组合，映射到固定的脏腑与症状群（木见金病肝胆、火见水病心小肠、土见木病脾胃、金见火病肺大肠、水见土病肾膀胱）。
  trigger: 按命局五行偏枯推疾病时
  logic: 本命五行 + 过旺的克神 → 对应脏腑系统
  boundary: 明代死因与病名体系，且书中明言有制则可免；不可替代医学诊断
  limits: 明代死因与病名体系，且书中明言有制则可免；不可替代医学诊断
  novelty: new
  relates: []
  tags:
