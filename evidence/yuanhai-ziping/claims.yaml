  title: 日为君主、法运四时：四时旺气与土旺四季
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"假如孟春木旺火生，木能生火也。孟夏火旺土生，火能生土也。孟秋金旺水生，金能生水也。孟冬水旺木生，水能生木也。土旺四季，辰戌丑未月也，故法运四时。"'
  rule: 以日为君，命局须「法运四时」：四季各有一行当旺并顺生下一行——孟春木旺生火、孟夏火旺生土、 孟秋金旺生水、孟冬水旺生木；土则旺于四季（辰戌丑未月）。 正文紧接着给出全年旺日数：春木旺七十二日、夏火旺七十二日、秋金旺七十二日、冬水旺七十二日，
    四季月土各旺一十八日，合计三百六十日以成岁功——这是月令权重分配的量化口径。 下游用途：判断月令得气（task-04）时，可按此把「当令之行的旺日数」量化；土旺四季也解释了辰戌丑未为何兼作土。
  trigger: 评估月令所旺之行与得气程度时
  logic: 定生月所属季节 → 该季旺行得 72 日、四季土各 18 日 → 按比例判断月令之气属谁
  boundary: 七十二与十八日为平均分配，与真实节气长度略有出入；未给日主强弱的具体阈值
