- id: c-yhr-0266
  domain: D15
  title: 照象：木火相照、金水相照，忌见水破
  source_id: src-yuanhai-ziping
  location: 第 168 章 · 神趣八法-照象
  quote: '"照象者，如丙日巳午未年月日，遇时上一位卯木，谓之木火相照，甚吉。如壬癸日申子辰全，遇时上一位金，谓之金水相照，大吉。年干有照者，亦吉。"'
  rule: 照象：日主旺极一方，而在时上（或年干）另得一位相生之字，如丙日柱见巳午未、时上一位卯木（木火相照）； 壬癸日申子辰全、时上一位金（金水相照）。第二解：照为"火土高明之意"—— 日干属戊得寅午戌火局，或地支午火而干有丙生在戊上，谓之照象；柱中不宜见水，
    见水则"土熔火灭"减福力；火在上水在下亦为照象（日丽于天、水底有日，亦能返照）。 两例：戊戌 戊午 丙午 戊戌；丙戌 癸巳 戊午 丁巳。
  trigger: 一方极旺而在年干或时上得一位相生/相照之字
  logic: 得照则吉；照被破（见水等）则减福
  boundary: 两解（木火/金水相照 与 火土高明）取象不同，未统一
  limits: 两解（木火/金水相照 与 火土高明）取象不同，未统一
