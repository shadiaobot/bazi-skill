  title: 四言独步：以日为主、专论财官
  source_id: src-yuanhai-ziping
  location: 第 199 章 · 四言独步
  quote: '"四柱排定 三才次分 年根为本 配合元辰 神煞相绊 轻重较量 先观月令 论格推详 以日为主 专论财官 分其贵贱 妙法多端 独则易取 乱则难明 去留舒配 论格要精"'
  rule: 全书最凝练的操作顺序：排四柱 → 分三才 → 以年根为本 → 看神煞轻重 → 先观月令 → 论格 → 以日为主 → 专论财官 → 分贵贱。并给出判读原则：独则易取、乱则难明；须「去留舒配」。
  trigger: 任何一次完整推演的起手
  logic: 月令 → 格局 → 财官 → 贵贱；神煞仅作轻重较量
  boundary: 「去留舒配」无定义，须结合第 75 章去官留杀
  limits: 「去留舒配」无定义，须结合第 75 章去官留杀
