  title: 四柱得气深浅定发运迟速
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"四柱得气深、迎运便发，得气浅、须交过运始发，得其中气、运至中则发"'
  rule: 命局得气深者交运即发，得气浅者须过完一步运才发，得气中者运过半程发。
  trigger: 判断发迹的具体时点
  logic: 以命局得气深浅对应发运的早晚
  boundary: 「得气深浅」的判定标准未给
