  title: 起变法：变元取时干合处与时支合处（可虚邀）
  source_id: src-yuanhai-ziping
  location: 第 22 章 · 论起变法
  quote: '"取时上天干合处，时下地支合处。

    假如丙寅时，取天干丙与辛合，地支寅与亥合，即辛亥是也。如柱中天干无辛字，地支无亥字，乃只虚邀为是，不必拘泥。"'
  rule: 变元的推法：取时柱天干的合干、时支的合支合成一柱（丙寅时 → 丙辛合、寅亥合 → 变元辛亥）。 关键放宽条件：柱中没有对应的合字时，「只虚邀为是，不必拘泥」——即允许虚邀成柱， 这与第 115、116 章拱贵、拱禄的「虚拱」是同一思路。
    眉批感叹「此等法例，时师罕见」，说明本法在本书中属少见的补断手段，读者须自行判断可信度。
  trigger: 见原文条件
  logic: '变元的推法：取时柱天干的合干、时支的合支合成一柱（丙寅时 → 丙辛合、寅亥合 → 变元辛亥）。

    关键放宽条件：柱中没有对应的合字时，「只虚邀为是，不必拘泥」——即允许虚邀成柱，

    这与第 115、116 章拱贵、拱禄的「虚拱」是同一思路。

    眉'
  boundary: 虚邀所得之字能否同时用于取格、取用，书中未说明；眉批自承此法罕见，无互证章节
  limits: 虚邀所得之字能否同时用于取格、取用，书中未说明；眉批自承此法罕见，无互证章节
