  quote: '"三丘五行，辰戌丑未，若是重见，骨肉刑悲，父母不足，兄弟异离，亲戚情疏，更亏妻子。冲破提纲，多亏父母。或是刑克，或是离异。比劫伤官旺，伤妻更损儿。养子多不孝，乞养总非宜。"'
  rule: 三丘五墓即辰戌丑未，重见者主骨肉刑悲、父母不足、兄弟异离、亲戚情疏、更亏妻子； 冲破提纲则多亏父母（或刑克或离异）；比劫与伤官旺则伤妻损儿；养子多不孝、乞养总非宜。 歌中另有一组女命相关断语：日主七杀带枭食则妻主虚胎小产多、经脉不调成血疾；
    男子枭食重重见、身弱多疫病；女命官旺兼财旺则招贤夫得儿，财官俱损则伤夫克子， 印绶生身而身更旺者为人刑克主贫孤；女命伤官旺而坐伤官者性悍。
  trigger: 命局辰戌丑未重见，或提纲被刑冲
  logic: 三丘五墓重见、提纲被冲 → 六亲受损；比劫伤官旺 → 妻儿受损
