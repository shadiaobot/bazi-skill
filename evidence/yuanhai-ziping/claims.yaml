- id: c-yhr-0334
  domain: D05
  title: 玄机赋：有格不正者败，无格有用者成
  source_id: src-yuanhai-ziping
  location: 第 187 章 · 玄机赋
  quote: '"日干为主，专论财官；月支取格，乃分贵贱。有格不正者败，无格有用者成。有官莫寻格局，有格局不喜官星。"'
  rule: 月支取格以分贵贱；有格而不正者败，无格而有用者反成；有官时不必再寻格局，有格局时则不喜官星。
  trigger: 格局与用神发生冲突时
  logic: 优先看用神是否可用；格名不正是减分项
  boundary: 「有官莫寻格局」与「月支取格」并列，属优先级问题，未给总则
  limits: 「有官莫寻格局」与「月支取格」并列，属优先级问题，未给总则
  novelty: new
  relates: []
  tags:
  - 格局
  - 用神
  - 优先级
  source_ref: B4-p47
- id: c-yhr-0335
  domain: D09
  title: 玄机赋：伤官用印去财、用财去印
  source_id: src-yuanhai-ziping
  location: 第 187 章 · 玄机赋
  quote: '"伤官用印宜去财，伤官用财宜去印。是或伤官财印俱彰，将何发福？身旺者用财，身弱者用印。用财去印，用印去财，方发弥福。正所谓喜者存之，憎者去之。"'
  rule: 伤官格若用印则须去财（财破印），若用财则须去印（印夺食伤之财路）；财印俱见时，以身之旺衰定取舍：身旺用财、身弱用印。
  trigger: 伤官格同时见财与印时
  logic: 先定旺衰 → 身旺取财、身弱取印 → 去另一者为病
  boundary: 与「伤官用财不宜印乡」（第 182 章）一致，互为佐证
  limits: 与「伤官用财不宜印乡」（第 182 章）一致，互为佐证
  novelty: new
  relates: []
  tags:
  - 伤官
  - 财印
  - 取舍
  source_ref: B4-p48
- id: c-yhr-0336
  domain: D14
  title: 相心赋：十神对应的性情取象
  source_id: src-yuanhai-ziping
  location: 第 186 章 · 相心赋
  quote: '"官星恺悌，贵气轩昂……食神善能饮食，体厚而喜讴歌。偏官七杀，势压三公，喜酒色而偏争好斗……枭印当权，使心机而始勤终怠……伤官伤尽，多艺多能，使心机而傲物气高……日德心善，稳厚而作事慈祥。魁罡性严。"'
  rule: 以十神与特殊格对应性情：官星仁厚、食神宽厚好饮食、七杀刚烈好斗、枭印多机心而始勤终怠、伤官多艺傲物、日德慈善、魁罡严敏、金神刚断。
  trigger: 推断性情时
  logic: 以命局主导之神（官/杀/印/食伤/特殊格）对应性格描述
  boundary: 属相术式断言，无法验证；同一人多神并见时如何取舍未给
  limits: 属相术式断言，无法验证；同一人多神并见时如何取舍未给
  novelty: new
  relates: []
  tags:
  - 性情
  - 断语
  - 十神
  source_ref: B4-p49
- id: c-yhr-0337
  domain: D12
  title: 幽微赋：六亲断语组
  source_id: src-yuanhai-ziping
  location: 第 188 章 · 幽微赋
  quote: '"过房入舍，年月冲分。随母从夫，偏财空而印旺。早岁父亡，偏财临死绝杀宫；幼岁母离，只为财多印死。比肩多而兄弟无情，羊刃多而妻宫有损。"'
  rule: 年月相冲主过房入舍；偏财空而印旺主随母从夫；偏财临死绝杀宫主早岁父亡；财多印死主幼岁母离；比肩多兄弟无情、羊刃多妻宫有损。
  trigger: 断六亲具体事件时
  logic: 以所主之神的空、死绝、受克对应亲属遭遇
  boundary: 断语绝对化，且带宗法语境；仅作历史断言
  limits: 断语绝对化，且带宗法语境；仅作历史断言
  novelty: new
  relates: []
  tags:
  - 六亲
  - 断语
  - 时代局限
  source_ref: B4-p50
- id: c-yhr-0338
  domain: D06
  title: 金王赋：克我者为官鬼，身旺当权
  source_id: src-yuanhai-ziping
  location: 第 190 章 · 金王赋
  quote: '"他来克我为官鬼，身旺当权；我去克他为妻财，官强则富。……无财官而有格局，青云得路；无格局而有财官，黄门成名。"'
  rule: 克我者为官鬼（身旺则当权、身弱则为鬼）；我克者为妻财（官强则富）；无财官而有格局者亦可贵，无格局而有财官者亦能成名。
  trigger: 判断财官与格局何者为主时
  logic: 两条路都可成名：格局路线与财官路线
  boundary: 与「专论财官」的口号略有张力，属补充口径
  limits: 与「专论财官」的口号略有张力，属补充口径
