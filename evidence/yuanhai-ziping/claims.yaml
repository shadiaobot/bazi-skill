  - 数目推断
  source_ref: S0-p100
- id: c-yhr-0474
  domain: D13
  title: 阴命赋：先看夫星盛衰、次看子息强弱
  source_id: src-yuanhai-ziping
  location: 第 150 章 · 阴命赋
  quote: '"凡见阴命，先见夫主之盛衰。

    次论身荣，要见子息之强弱。

    夫荣子旺，定知富贵荣华。

    子死夫衰，只是孤单下贱……夫衰身旺，主为廉洁之人；鬼旺身衰，必作孤寒之妇"'
  rule: 女命推法顺序为先看夫星盛衰、次看子息强弱，再论自身荣枯；夫荣子旺为富贵，子死夫衰为孤单下贱，夫衰身旺为廉洁，鬼旺身衰为孤寒。
  trigger: 分析女命时（顺序与男命不同）
  logic: 夫星（官）与子星（食伤）的状态组合 → 四类结论
  boundary: 属明代妇德语境，含「非妓即尼」「淫贱」等时代评价，仅作历史断言记录
  limits: 属明代妇德语境，含「非妓即尼」「淫贱」等时代评价，仅作历史断言记录
  novelty: new
  relates: []
  tags:
  - 女命
  - 顺序
  - 时代局限
  source_ref: S0-p101
