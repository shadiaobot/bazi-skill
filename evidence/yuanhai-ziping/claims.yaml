  title: 干同为兄弟（乙以甲为兄忌庚重，甲以乙为弟畏辛多）
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"干同以为兄弟。如乙以甲为兄，忌庚重也；甲以乙为弟，畏辛多也—此为伤之论。"'
  rule: 比肩劫财即兄弟之星，断法为「忌克我兄弟之干过重」：乙日以甲为兄，忌庚金重（庚克甲）； 甲日以乙为弟，畏辛金多（辛克乙）。克重则「兄弟有克」，即生平不得兄弟之力。 眉批补重要限定：「阳干为兄，亦以阴支为妹，不可止以比肩而分兄弟」——兄弟姊妹的取象不止比肩一途。
    下游用途：断兄弟有无、能否得力时使用（task-14）；须注意其与月柱兄弟宫的配合（见 p-B1-79）。
