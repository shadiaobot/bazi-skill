- id: c-yhr-0278
  domain: D08
  title: 论兴亡：纯杀为用须行制杀运，一入财乡则财能党杀
  source_id: src-yuanhai-ziping
  location: 第 177 章 · 论兴亡
  quote: '"夫人生柱中有纯杀为用也。杀神无制则为白屋穷途之人，或作豪门营干之士。故要逢制杀运，假杀而起，进用朝廷，操权威福，而不可脱制伏运。一入财乡，财能党杀，便兴祸患。"'
  rule: 以杀为用者的兴亡机制：杀无制则贫贱；须逢制杀运方"假杀而起"，得权得福， 且不可脱离制伏之运；一旦入财乡，财能党杀（财生杀），便生祸患。若流年财杀皆旺、杀神相党并合， 轻则倾家徒配、重则刑弃其身。杀刃并见者一一难免此祸。
