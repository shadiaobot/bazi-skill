  rule: 凡六亲星与他干相合，即断"不正"：正印合则母不正、财合则妻不正、偏财合则妾不正、 比肩合则姐妹不正、伤官合则祖母不正、食神合则孙女不正。机理是"合"在他位、两属相争。 正文以甲日为例：见己丑未则与戊（父/妾）相争，又伤癸水，故克母之义显。
  trigger: 六亲星所在之干与其他天干相合
  logic: 六亲星被合 → 该亲"不正"（分心、他属）
