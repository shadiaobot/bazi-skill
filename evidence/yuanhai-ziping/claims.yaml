  quote: '"其法曰：逢官看财，逢杀看印，逢印看官，斯有奥妙不传之法。取四者不偏不倚，生克制化，而遇破休囚为下运。有生有去为福，有助有剥为祸。"'
  rule: 六格法的核心口诀："逢官看财、逢杀看印、逢印看官"——即以相生的关系成格得用。 成立要件是四者不偏不倚、生克制化得宜；行运上"遇破休囚为下运，有生有去为福，有助有剥为祸"。 第 179 章另有一种次序表述："逢官看财，逢财看杀，逢杀看印，逢印着官"，
