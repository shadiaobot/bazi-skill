  source_id: src-yuanhai-ziping
  location: 第 203 章 · 正月建寅候诗诀
  quote: '"正月寅宫原是木，木生火旺土长生，戊兼午未宫中喜，申酉休囚数莫行。眉批：正月甲木二十二日，艮土生三日，丁丙火生主五日，戊土寄生於寅"'
  rule: 寅月甲木司令22日、艮土3日、丙丁火5日；寅月喜火土（午未），忌申酉（金休囚且克木）。
