  rule: 疾病判法的入口是两张对照表：天干内应脏腑（甲肝、乙胆、丙小肠、丁心、戊胃、己脾、庚大肠、辛肺、 壬膀胱、癸肾），天干外应肢体部位（甲头、乙项、丙肩、丁心、戊胁、己腹、庚脐、辛股、壬胫、癸足）。 地支另配部位：子疝气、丑肚腹、寅臂肢、卯目手、辰背胸、巳面齿、午心腹、未脾胸、申咳疾、酉肝腩、
    戌背肺、亥头肝。并附藏象口诀：肝乃肾家苗、胆藏魂、肝藏魄、肾藏精、心藏神、脾藏气。
  trigger: 见原文条件
