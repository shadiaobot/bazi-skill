- id: c-yhr-0268
  domain: D15
  title: 鬼象：日主受杀克，身旺为官、身衰为鬼
  source_id: src-yuanhai-ziping
  location: 第 170 章 · 神趣八法-鬼象
  quote: '"鬼象者及秋金生甲乙日，地支四柱纯金，谓之鬼象。只要鬼生旺运，皆吉。怕见死绝之乡，而支身旺则不吉。"'
  rule: 鬼象：如秋金生甲乙日、地支四柱纯金——日主为杀所克，谓之鬼象；喜行鬼（杀）生旺之运， 怕见死绝之乡，而日主自身旺则不以鬼象论（眉批："甲乙生春遇金为官，秋遇金为鬼，身旺为官，身衰为鬼"）。 第二解：鬼即杀，"须明上下干支，或鬼旺身衰"——乙木以庚为官，若再见辛酉七杀则鬼旺。
    引经断语：身衰鬼旺应肢体伤残，身旺鬼衰定作凶徒，鬼身皆衰则男子飘蓬、女作尼姑； 本身乘旺而逢鬼象返为贵命，旺中有制方为全福；身鬼全彰得刃为制者勇暴而贵显。 命例：癸丑 辛酉 乙亥 辛巳（乙木八月无气、二辛杀旺，主残疾）；戊辰 癸亥 甲申
    庚午（漂流命）。
  trigger: 日主衰弱而杀（鬼）重
  logic: 身旺 → 作官论；身衰 → 作鬼论；鬼旺身衰主伤残，旺中有制则反贵
  boundary: 断语（伤残、凶徒、尼姑）属体系内断言；"身鬼俱强"等组合无量化
  limits: 断语（伤残、凶徒、尼姑）属体系内断言；"身鬼俱强"等组合无量化
