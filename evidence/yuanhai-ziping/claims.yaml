  title: 官杀俱露则借财调解
  source_id: src-yuanhai-ziping
  location: 第 73 章 · 子平举要歌
  quote: '"杀官俱露将何拟，混杂财官取财议"'
  rule: 官杀同时透干时局面复杂，须借财星来权衡论断（财既可生官也可党杀，按书中所论以财为议）。
