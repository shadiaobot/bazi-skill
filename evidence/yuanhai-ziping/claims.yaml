  title: 属象：五行各专一方之气
  source_id: src-yuanhai-ziping
  location: 第 165 章 · 神趣八法-属象
  quote: '"属象者，乃天干甲乙木，地之亥卯未全者是也。水火金土同。又曰：属者，五行各属之意。即主干临何方位，乃东西南北之神也。如寅卯辰乃东方属木，巳午未南方属火，申酉戌西方属金，亥子丑北方属水，各专一方之气。"'
  rule: 属象：天干属某行而地支成该行之局（如甲乙天干配亥卯未全）。第二解强调"方位专属"： 寅卯辰属东方木、巳午未属南方火、申酉戌属西方金、亥子丑属北方水，各专一方之气。 章内两例：壬子 壬子 癸丑 癸丑（二壬夺癸禄，僧道之命）；乙酉
    甲申 乙酉 乙酉（都御史之命）。
