  - 判断中枢
  source_ref: B4-p44
- id: c-yhr-0332
  domain: D12
  title: 络绎赋：六亲位与「杀克」方向
  source_id: src-yuanhai-ziping
  location: 第 185 章 · 络绎赋
  quote: '"年干父兮支母，日干己兮支妻，月干兄兮支弟，时支女兮干儿。後杀克年，父母早丧；前杀克後，子息必亏。"'
  rule: 六亲按柱位细分：年干父、年支母、日干己、日支妻、月干兄、月支弟、时干儿、时支女；后柱之杀克前柱主父母早丧，前柱之杀克后柱主子息亏。
  trigger: 断六亲时
  logic: 按柱位定位亲属 → 按克的方向定受害者
  boundary: 与第 142 章十神取象并行，两套映射并存（柱位 vs 十神）
  limits: 与第 142 章十神取象并行，两套映射并存（柱位 vs 十神）
  novelty: new
  relates: []
  tags:
