- id: c-yhr-0253
  domain: D07
  title: 行运六法：官欲运生、杀欲运制、财欲运扶、印欲运旺、食欲运生
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"损用神者，欲运制之，益用神者，欲运生之。身弱欲运引进旺多。官欲运生，不欲运伤。杀欲运制，不欲运助。财欲运扶，不欲运劫。印欲运旺，不欲运衰。食欲运生，不欲运枭绝。"'
  rule: 行运取舍的总法：有害用神者欲运制之，有益用神者欲运生之，身弱欲运引旺。 逐星口径：官欲运生而不欲运伤；杀欲运制而不欲运助；财欲运扶而不欲运劫； 印欲运旺而不欲运衰；食欲运生而不欲运枭绝。并须对照四柱原有/原无、原轻/原重。
  trigger: 已取用神、定格局
  logic: 以"生/制、扶/劫"四字校准行运喜忌，逐星对照
  boundary: 六条并列时若彼此冲突（如官喜生财、财喜扶而生官），未给优先序
  limits: 六条并列时若彼此冲突（如官喜生财、财喜扶而生官），未给优先序
