  location: 第 72 章 · 二至阴阳相生理
  quote: '"用冬至一阳则有木先生旺之理。则试以甲、乙日生人，在冬至前，阳气未动，木方死绝，其木不甚吉利。若甲、乙日生人，在冬至之後，阳气已生，木乘暖气其命寿禄皆全，只要甲用神入格。"'
  rule: 以二至为界的调候口径：冬至后一阳生，木得暖气，甲乙日生人多吉（「木乘暖气其命寿禄皆全」）， 但仍附条件「只要甲用神入格」；冬至前阳气未动、木方死绝，甲乙日生人则不甚吉利。 同理夏至后阴生，丙丁日生人在冬至前「遇水即灭」、冬至后不甚忌水；庚辛生于夏至后金有气、
    不甚忌火。眉批总结为「冬至後阳生，夏至後阴生，五行各得其气，不为身弱，作中和而论」。 下游用途：这是全书关于寒暖燥湿（调候）最集中一段，与月令取用（第 66 章）、病药（第 282 章）配合使用； 须注意「在冬至之前」与「冬至之後」以节气（非农历月）为界。
  trigger: 判断寒冷／炎热季节出生者的宜忌时
  logic: 先定生年所处的二至分段 → 再看日干五行是否乘暖气／得阴气 → 附条件：仍须用神入格方作吉论
  boundary: 只有木火金三行的例子，水土未提；「用神入格」为前提条件，故本法则不能单独定吉凶
  limits: 只有木火金三行的例子，水土未提；「用神入格」为前提条件，故本法则不能单独定吉凶
