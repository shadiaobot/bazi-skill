  title: 印绶根轻旺中显达、根多旺中不发
  source_id: src-yuanhai-ziping
  location: 第 199 章 · 四言独步
  quote: '"印绶根轻 旺中显达 印绶根多 旺中不发 印绶比肩 喜行财乡 印绶无比 忌见财伤 先财後印 反成其福 先印後财 反成其辱"'
  rule: 印轻者行旺运反显达；印多者行旺运反不发。印遇比肩喜行财运；印无比肩则忌财伤印。财印先后次序决定成败：先财后印为福、先印后财为辱。
  trigger: 印绶格定行运与财印次序时
  logic: 按印根轻重与财印出现次序分流
  boundary: 「先财后印／先印后财」指柱位先后还是运序先后，书中未明
  limits: 「先财后印／先印后财」指柱位先后还是运序先后，书中未明
  novelty: new
  relates: []
  tags:
