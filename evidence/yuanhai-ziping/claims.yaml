- id: c-yhr-0244
  domain: D14
  title: 五行性情取象：木仁、火礼、金义、水智、土信，及太过不及之别
  source_id: src-yuanhai-ziping
  location: 第 158 章 · 论性情
  quote: '"且如木曰曲直，味酸主仁，恻隐之心，慈祥恺悌，济物利民，恤孤念寡，恬静清高。人物清秀体长，面色青白，故云木盛多仁。太过则折，执拗性偏。不及少仁，心生妒意。"'
  rule: 性情以五行为本：木主仁、火主礼、金主义、水主智、土主信，并各配体貌、面色、言动特征。 每行都分三档断：本行得中则见其德（如木盛多仁、金主义而刚毅有决），太过则偏（木太过执拗性偏、 金太过自无仁心好斗贪欲），不及则缺（木不及少仁生妒、金不及多三思少果决悭吝）。
    章末给出日主层面的通则：日干弱则退缩怕羞，日干强则妄诞、执一自傲。 眉批强调取象须四柱不相犯、不杂；若只以日主所属为主则不足，须结合当令与气候（如"秋木凋零"）。
  trigger: 观人性情
  logic: 取五行之性 → 看太过/中和/不及 → 取德性或偏缺
