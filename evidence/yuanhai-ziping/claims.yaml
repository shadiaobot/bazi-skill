  title: 月令建禄忌会煞为凶
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"月令虽逢建禄，且忌会煞为凶……且如甲日用酉月为官星正气，若年时子辰又会起申中庚为七刹，乃甲之鬼贼，故为凶。"'
  rule: 月令建禄本为得地，但若年时会合成煞（如甲用酉为官，子辰会申中庚为杀），则为凶。
  trigger: 月令为建禄而四柱有会煞之组合时
