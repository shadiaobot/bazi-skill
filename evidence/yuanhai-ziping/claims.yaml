  title: 二月建卯：丙丁逢印忌金、甲日喜火土
  source_id: src-yuanhai-ziping
  location: 第 204 章 · 二月建卯候诗诀
  quote: '"丙丁二月身逢印，大怕庚辛酉丑伤，水运敛荣木火旺，西方行运定遭殃。……甲日卯月重逢丑，格中有火不须嫌，再行火土兴财禄，岁运宜金怕水缠。"'
  rule: 卯月乙木旺，为丙丁之印：怕庚辛酉丑伤印、喜水佐与木火、忌西方金运；甲日见丑（财）而有火（食伤）则不为嫌，喜火土、忌水。
  trigger: 生于卯月时
  logic: 按日主（丙丁/甲）分流：印被伤则忌金，食伤生财则喜火土
