  title: 五行生成次序与数序（水一火二木三金四土五）
  source_id: src-yuanhai-ziping
  location: 第 2 章 · 论五行所生之始
  quote: '"太易生水(未有气曰太易)，太初生火(有气未有体曰太初)，太始生木(有形未有质曰太始)，太素生金(有质未有体曰太素)，太极生土(形体已具乃曰太极)。所以，水数一，火数二，木数三，金数四，土数五。"'
  rule: 五行不是并列的，而是按「气—形—质—体」四个成熟度阶段依次生成：水（未有气）→火（有气未有体） →木（有形未有质）→金（有质未有体）→土（形体已具）。因此固定数序为水一、火二、木三、金四、土五。 正文以「一气盘中结」为起点，属宇宙论前提层，不是可验算的规则；但五行数序在下游用于河图式取数与
    纳音推演，故作为编码口径收录。眉批只释义（「混沌胚晕」如鸡子、清浊未分），不改变数序。
  trigger: 见原文条件
