  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"劫财羊刃，切忌时逢，岁运并临，灾殃立至……以戊禄在巳，前一辰见午，午有己土克癸水，此之谓劫财羊刃，故主破财散业，离家失祖，施恩反怨，心性卒暴。"'
  rule: 劫财与羊刃忌在时柱出现，岁运再并临则灾祸立至；主破财散业、离家失祖、心性卒暴等。
