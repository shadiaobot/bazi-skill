  - 专旺
  - 行运
  - 待核查
  source_ref: B3-p14
- id: c-yhr-0212
  domain: D05
  title: 曲直格（仁寿格）：甲乙日支全寅卯辰或亥卯未，忌庚辛
  source_id: src-yuanhai-ziping
  location: 第 127 章 · 外十八格-曲直格
  quote: '"一曰仁寿，二曰青龙。此格以甲乙日取地支寅卯辰或亥卯未木局。要不见庚辛之气，见庚辛即官杀，非此格也。……运喜东方，北方有水，木赖水生，故从其类，主人多仁，忌西方运。"'
  rule: 成格：甲乙日主，地支寅卯辰木方全或亥卯未木局全，且不见庚辛（见庚辛即作官杀论，不成此格）。 别名仁寿、青龙。 行运：喜东方木运；北方有水，木赖水生，亦从其类；忌西方金运。 命例：李总兵 甲寅 丁卯 乙未 丙子。
  trigger: 甲/乙日 + 地支木局全或木方全 + 天干无庚辛
  logic: 行东方、北方 → 吉；行西方金运、见庚辛 → 破
  boundary: 地支见金但天干不见庚辛时如何论，未说明
  limits: 地支见金但天干不见庚辛时如何论，未说明
  novelty: new
  relates: []
  tags:
  - pattern
  - 专旺
  - 行运
  source_ref: B3-p15
- id: c-yhr-0213
  domain: D05
  title: 日德秀气格：天干三乙、地支巳酉丑全
  source_id: src-yuanhai-ziping
