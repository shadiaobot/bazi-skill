  title: 气象取用：以生时干神为气、四柱干神为象，取得地之运
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"看四柱干神得何象，如纯金木水火土，亦为五象，若杂而不入象者不发，发亦不久。如五纯象亦有太过之象，仍详当生月令得地，然後看行运得地不得地而言，不可以遇禄马贵人为得运，遇空亡羊刃劫杀为失运也。"'
  rule: '"象气法"：取生时干神为气、四柱干神为象，由天干五合关系定象名（甲己有土气、乙庚有金气、丙辛有水气 为化象；甲乙丙丁为本象），共列金水象、金土象、金火象、金木象、水木象、火木象、水土象、火土象、 土水象等十种，各有"得地"之支（如金水象运至申酉丑上得地）。
    纯五象者亦可能太过；混杂不入象者不发，发亦不久。并明确反对简单化： "不可以遇禄马贵人为得运，遇空亡羊刃劫杀为失运"。'
