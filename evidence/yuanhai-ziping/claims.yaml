- id: c-yhr-0075
  domain: D12
  title: 宫位断亲：月为兄弟宫、日为妻宫、时为子息宫
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"以月为兄弟。如火命生酉戌亥子月，言兄弟不得力之断—月为兄弟之宫，为男取比和同类便为兄弟之星。"'
  rule: 以四柱宫位断六亲的细则：月为兄弟之宫（以比和同类为兄弟之星；如六丙日人，以丁为弟妹、六丁日人以丙为兄姐）， 若生于酉戌亥子月，因火在酉死、戌墓、亥绝、子胎，故断「兄弟不得力」； 日为妻妾之宫，若日支落冲刑克害之地则克妻妾，轻则疾病；时为子息之宫，子星落死墓绝则子息少。
    尾段总结：年看祖宗、月看兄弟、日看妻妾、时看子息，「论其眷属，审其死绝」。 眉批补：五行旺相之方可作兄弟得力或富贵之断；年月日时皆见财官印绶则祖宗父母荣贵、妻淑子贤。
  trigger: 断六亲时
  logic: 定宫位（年祖上／月父母兄弟／日己身妻／时子息） → 看该宫之星与十二宫状态 → 旺相得力、死绝受损
  boundary: 「妻宫落空刑克害则克妻」的强度未分级；同一宫位兼看父母与兄弟，须与 p-B1-71 统一
