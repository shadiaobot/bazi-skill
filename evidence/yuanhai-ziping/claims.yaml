- id: c-yhr-0214
  domain: D09
  title: 伤官生财格：乙日支成火局，喜火乡财运，怕官乡
  source_id: src-yuanhai-ziping
  location: 第 131 章 · 外十八格-伤官生财格
  quote: '"且如乙日生，地支见寅午戌全，则自以戊己为财。要行火乡财运身旺运，怕官乡，忌刑冲，冲则不吉。"'
  rule: 成格：乙日生，地支寅午戌火局全（火为乙之伤官），火生土，故以戊己为财。 行运：喜火乡、财运、身旺运；怕官乡（官伤相战）；忌刑冲，冲则不吉。 与第 86 章伤官格诸条、第 182 章伤官说互为复述，须在 1.5 合并。
