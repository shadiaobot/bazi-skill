  source_ref: S0-x17
- id: c-yhr-0358
  domain: D05
  title: 拱禄拱贵格：填实则凶
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"拱禄拱贵，填实则凶……乃两位虚拱贵禄之地，四柱不可占了贵禄之宫，则填实不容物矣，只为官星荣显也。……又忌伤了日时，皆拱不住矣。……（眉批：拱禄不宜见真禄，拱贵不宜见真贵，只是暗中虚拱。"'
  rule: 以日时两柱虚拱中间一位贵或禄为拱格；四柱不可出现所拱之字（填实），亦忌刑伤日时，否则「拱不住」；若见真禄真贵则另作别格论。
  trigger: 日时柱可虚夹出贵禄之支时
  logic: 验所拱之位是否被填实或被伤 → 填实则凶
  boundary: 命例中「运行辛丑，除通判……一旦坏了」把填实与行运混论，须分层
  limits: 命例中「运行辛丑，除通判……一旦坏了」把填实与行运混论，须分层
  novelty: new
  relates: []
  tags:
  - 格局
  - 拱禄
  - 拱贵
  source_ref: S0-x18
- id: c-yhr-0359
  domain: D05
  title: 时上偏财格：只一位为贵、别宫忌见
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"时上偏财，别宫忌见……只要时上一位有之，始为贵，若别位有之，便多了，难作偏财而论。要身旺，不要克破，要财运旺即发矣。"'
  rule: 偏财只在时上一位者为贵（又名时马格）；别位再见则不作偏财论；须身旺、不受克破，行财运即发。
  trigger: 时柱见偏财时
  logic: 数位（只一位） → 验身旺与克破 → 定行运（财运发）
  boundary: 命例「丁丑 己酉 丁丑 辛亥」因月支酉丑会局成「别宫忌见」而家业破尽，说明会局亦计作别宫
  limits: 命例「丁丑 己酉 丁丑 辛亥」因月支酉丑会局成「别宫忌见」而家业破尽，说明会局亦计作别宫
  novelty: new
  relates: []
  tags:
