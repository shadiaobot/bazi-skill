- id: c-yhr-0274
  domain: D14
  title: 杂论又诀之杂断：合多主晦、冲多主凶、辰多好斗、时日空亡
  source_id: src-yuanhai-ziping
  location: 第 175 章 · 杂论又诀
  quote: '"刑多者为人不义，合多者疏者亦亲。合多主晦，冲多主凶。辰多好斗，戌多好讼，辰戌魁罡，多凶少吉。时日空亡，难为妻子。交驰驿马，别土离乡。食神干旺，胜似财官。"'
  rule: 一组可独立使用的杂断：刑多者为人不义、合多者疏者亦亲（但合多主晦、冲多主凶）； 辰多好斗、戌多好讼，辰戌魁罡多凶少吉；时日空亡难为妻子；驿马交驰主别土离乡； 食神干旺胜似财官；顺食者食前方丈，倒食者箪食豆羹；食衰枭旺不死也灾。
    另有：马落空亡为操心落魄之人；离祖月令逢冲、过房杀带三刑；母明父暗多是偷生； 财印偏官庶出已定；时杀逢冲、羊刃无制，女多产厄、男犯刑名；二德无破则女贤良、男忠孝。
  trigger: 命局出现上述结构
  logic: 结构 → 对应断语（多为性情、六亲、行止类）
  boundary: 条目式汇编，无统一原理；部分断语（不义、偷生）属道德评判，须标注局限
  limits: 条目式汇编，无统一原理；部分断语（不义、偷生）属道德评判，须标注局限
