  title: 运与运相值的特例：将凡入圣、鸳鸯两两、力停相冲
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"又曰：丁丑人行丁未运，名曰将凡入圣，以假为真，不以退神论。四柱有丁丑丁未者，不在此限。若戊寅人行丁丑运，虽是退神，却有济化为福。若庚辰生人，或庚辰月行乙酉运，乙酉生人，或乙酉月行庚辰运，名曰鸳鸯两两，主发迹，但重叠者不佳。"'
  rule: 若干特定的本命—大运组合：丁丑人行丁未运名"将凡入圣"，不作退神论（四柱原有丁丑丁未者不在此限）； 戊寅人行丁丑运虽属退神却有济化之福；庚辰（生人或月）行乙酉运、或乙酉人行庚辰运名"鸳鸯两两"， 主发迹，但重叠者不佳；乙庚人见酉年月日时则大凶；甲申人行丙寅运名"力停相冲"，主破财争竞；
    丙戌人行辛卯运主钝滞（只宜武人）；丙子人行壬寅运主破财不吉。
  trigger: 本命干支与行运干支构成特定组合
  logic: 组合名目 → 断吉凶（不作退神论 / 济化为福 / 发迹 / 大凶 / 破财）
