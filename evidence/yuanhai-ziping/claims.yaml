  title: 六亲捷要歌：八句六亲断语
  source_id: src-yuanhai-ziping
  location: 第 143 章 · 六亲捷要歌
  quote: '"分禄须伤主馈人，比肩重叠损严亲。正财克母偏财父，夫妇相刑值退神。食神有寿妻多子，偏官多女少麒麟。乘旺伤官嗣必绝，中和印绶自荣身。"'
  rule: 八句一组的六亲断语：分禄伤及主家之妇；比肩重叠损父；正财克母、偏财为父；夫妇相刑者逢退神； 食神主有寿、妻多子；偏官多女少子；伤官乘旺则嗣绝；印绶中和则自身荣显。 眉批限定"以上八句皆主男命刑害之言"，并补两条：有比有刃而过旺无制者克父母刑妻；
