  title: 地支藏遁（地支藏干表）
  source_id: src-yuanhai-ziping
  location: 第 61 章 · 地支藏遁歌
  quote: '"子宫癸水在其中，丑癸辛金己土同，寅宫甲木兼丙戊，卯宫乙木独相逢，辰藏乙戊三分癸，巳中庚金丙戊丛，午宫丁火拼己土，未宫乙己丁其宗，申位庚金壬水戊，酉

    宫辛字独丰隆，戌宫辛金及丁戊，亥中壬甲是真踪"'
  rule: 十二地支各自所藏天干的完整对照：子癸；丑癸辛己；寅甲丙戊；卯乙；辰乙戊癸；巳庚丙戊；午丁己；未乙己丁；申庚壬戊；酉辛；戌辛丁戊；亥壬甲。
