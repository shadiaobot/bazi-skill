  title: 背禄逐马（十干背禄，运至比肩）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"十干背禄，岁时喜见财星，运至比肩，号曰背禄逐马……财为马。禄之向也，为顺；背也，为逆。且如四甲得寅为禄，若遇巳丙为背禄。经曰：背禄主无财之论，主初明后晦，喜财星。"'
  rule: 背禄指日主之禄被克泄而背离（甲禄寅而遇巳丙）；此时喜见财星，若再行比肩之运即「背禄逐马」，主无财、初明后晦、妻散子离。
  trigger: 命局出现背禄结构时
  logic: 验财星与比肩 → 有财为救、比肩分财为凶
  boundary: 「背禄」的定义（禄被克？被泄？）书中只给例证，未给通式
  limits: 「背禄」的定义（禄被克？被泄？）书中只给例证，未给通式
