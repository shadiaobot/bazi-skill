  quote: '"五行正贵，忌刑冲克破之宫……四柱干支，喜三合六合之地……合财为官禄之相从，合刑为刑煞之相压也。"'
  rule: 正气官星（财官印等）忌刑冲克破所填；四柱喜三合六合，合财则官禄相从，合刑则刑煞相压。
