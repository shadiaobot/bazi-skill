- id: c-yhr-0251
  domain: D07
  title: 行运死法：比劫、伤官、七杀、印、财运的十神断语（须随格局喜忌通变）
  source_id: src-yuanhai-ziping
  location: 第 160 章 · 论大运
  quote: '"且如甲乙得寅卯运，名曰劫财、败财，主克父母及克妻，破财争斗之事。行丙丁巳午运名伤官，主克子女，讼事囚系。行庚申辛酉，七杀官乡，主得名，发越太过则灾病恶疾。行壬癸亥子生气印绶运，主吉庆增産。"'
  rule: 以甲乙日为例给出十神行运的对照断语：比劫运（寅卯）主克父母克妻、破财争斗；伤官运（丙丁巳午） 主克子女、讼事囚系；官杀运（庚申辛酉）主得名，但发越太过则灾病恶疾；印绶运（壬癸亥子）主吉庆增产； 财运（辰戌丑未戊己）主名利皆通。
    紧接一句限定："此乃死法，譬喻须随格局喜忌推之，不可执一，妙在识其通变"——即上列断语只是范例。
