  quote: '"日干无气，时逢羊刃不为凶……且如甲申日，卯时为羊刃，此是申中庚金能克卯中乙木，为财为马为妻，虽逢刃不为凶矣。日干弱喜逢刃，有印助显其刃，主福寿，无印主贫。"'
  rule: 日干衰弱时逢羊刃不作凶论：日干弱喜刃帮身，有印助则刃显其用而主福寿，无印则主贫。
