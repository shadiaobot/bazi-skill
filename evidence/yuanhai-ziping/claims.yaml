- id: c-yhr-0352
  domain: D07
  title: 井栏叉格（庚日全逢润下）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"庚日全逢润下，忌壬癸巳午之方，时遇子时，其福减半……只是庚子、庚申、庚辰合水局为贵，何也？……若四柱中须用申子辰全为贵，得三庚金者尤为奇。或戊子，丙辰亦不妨。喜行东方财地，北方伤官，南方火格不为贵，故忌壬癸巳午方。"'
  rule: 庚日见申子辰全（以三庚为奇）为井栏叉格，取申子辰冲寅午戌得财官印；喜东方财地、北方伤官，忌南方火与壬癸巳午，时遇子时福减半。
  trigger: 庚日而地支申子辰全时
  logic: 验申子辰是否全、庚是否多 → 定成格；按方位定行运吉凶
  boundary: 命例中同格一生贵一不贵，作者以「生江南为橘、生江北为柚」作解，属比喻性解释
  limits: 命例中同格一生贵一不贵，作者以「生江南为橘、生江北为柚」作解，属比喻性解释
