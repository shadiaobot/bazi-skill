- id: c-yhr-0230
  domain: D12
  title: 论兄弟姐妹：比肩为兄弟，庚辛克兄伤弟
  source_id: src-yuanhai-ziping
  location: 第 147 章 · 论兄弟姐妹
  quote: '"比肩者，兄弟也。且如甲见甲为兄，乙为弟妹，寅卯亦然。见庚则克兄，见辛则伤弟。甲木旺，主兄姐争财。"'
  rule: 兄弟以比肩定位：甲见甲为兄、见乙为弟妹，见寅卯亦然。见庚克兄、见辛伤弟。 甲木旺则兄姐争财；甲寅乙卯既多则兄弟姐妹不和、争斗是非；见己合甲则兄姐不正，见庚则弟妹不正； 见杀多、乙木得局则杀合乙木而伤甲，故兄不若弟之福。甲木寅月、乙木受制则兄旺弟衰。
    眉批给出阴阳分法："阳见阳为兄弟，阴见阴为姐妹。阴见阳为兄，阳见阴为妹。"
  trigger: 以比肩为兄弟，察比劫与官杀的分布
  logic: 比劫旺 → 争财不和；官杀克比劫 → 伤兄或伤弟；合 → 不正
  boundary: 具体到"兄"与"弟"的分判依赖阴阳，眉批与正文表述不完全一致
  limits: 具体到"兄"与"弟"的分判依赖阴阳，眉批与正文表述不完全一致
