  title: 日贵格：四日、忌刑冲破害与空亡
  source_id: src-yuanhai-ziping
  location: 第 92 章 · 论日贵
  quote: '"日贵者，又即甲午庚牛羊之类。

    只有四日，丁酉 丁亥 癸巳 癸卯耳，最怕刑冲破害……主人纯粹有仁德，有姿色，不傲物，或犯前刑则贫贱。

    刑冲太甚，贵人生怒，反成其祸"'
  rule: 日贵格只有丁酉、丁亥、癸巳、癸卯四日；忌三刑六害、忌空亡、忌魁罡，并须分昼夜贵（日要日贵、夜要夜贵）。主人仁慈有容色；一犯刑冲则转贫贱。
  trigger: 日柱为上述四日时
  logic: 验是否受刑冲害与空亡 → 无破则贵、有破则贫贱
  boundary: 「日贵有时法异同，须分昼夜贵」的具体分法原书未展开
  limits: 「日贵有时法异同，须分昼夜贵」的具体分法原书未展开
  novelty: new
  relates: []
  tags:
  - 格局
  - 日贵
  - 特殊日格
  source_ref: S0-p91
- id: c-yhr-0465
  domain: D10
  title: 日德格：五日及其大忌
  source_id: src-yuanhai-ziping
  location: 第 93 章 · 论日德
  quote: '"日德有五：甲寅、戊辰、丙辰、庚辰、壬戌日是也。

    其福要多而忌刑冲，无破害，恶官星，憎财旺加临会合，怕空亡而忌魁罡，此数者乃格之大忌也……若旺气已衰，运至魁罡，其死必矣"'
  rule: 日德格取甲寅、戊辰、丙辰、庚辰、壬戌五日；忌刑冲破害、恶官星、憎财旺会合、怕空亡、忌魁罡。旺气已衰而运至魁罡者断死；有财官加临则须另寻他格。
  trigger: 日柱为上述五日时
  logic: 验刑冲破害、官星、财旺、空亡、魁罡五项大忌 → 全无则福厚
  boundary: 「日德俱多福必丰厚」中的「多」指日德日重复还是同类贵人叠加，未说明
  limits: 「日德俱多福必丰厚」中的「多」指日德日重复还是同类贵人叠加，未说明
  novelty: new
  relates: []
  tags:
  - 格局
  - 日德
  - 特殊日格
  source_ref: S0-p92
- id: c-yhr-0466
  domain: D10
  title: 日刃格：爱七杀、忌会合、各刃忌正财运
  source_id: src-yuanhai-ziping
  location: 第 94 章 · 论日刃
  quote: '"日刃有戊午、丙午、壬子也。

    与阳刃同法，不喜刑冲破害，不喜会合，兼爱七杀，要行官乡便为贵命。

    若四柱中一来会合，必主奇祸……且如戊日刃在午忌行子正财运。

    壬刃在子，忌行午正财运。

    庚刃在酉，忌行卯正财运"'
  rule: 日刃取戊午、丙午、壬子三日；喜七杀、要行官乡方为贵命、须身旺； 忌刑冲破害、忌会合（四柱一合必主奇祸）、忌行正财运（戊午忌子、壬子忌午、庚刃忌卯、丙午忌子）。
  trigger: 日柱为上述日刃时
  logic: 验是否有杀制、是否身旺、是否被合被冲与行财运 → 定贵贱
  boundary: 「大抵羊刃要身旺，喜有物以去之」——去刃之物的具体取舍未展开
  limits: 「大抵羊刃要身旺，喜有物以去之」——去刃之物的具体取舍未展开
  novelty: new
  relates: []
  tags:
  - 格局
  - 日刃
  - 羊刃
  source_ref: S0-p93
- id: c-yhr-0467
  domain: D10
  title: 魁罡格：运喜身旺、一见财官祸立至
  source_id: src-yuanhai-ziping
  location: 第 95 章 · 论魁罡
  quote: '"夫魁罡者有四：壬辰、庚戌、庚辰、戊戌日是也……运行身旺，发福百端；一见财官，祸患立至……倘日独处，冲者太衆，必是小人，刑责不已，穷必彻骨"'
  rule: 魁罡取壬辰、庚戌、庚辰、戊戌四日；运行身旺则百端发福，一见财官祸患立至；日主孤立而受冲克太多者，主小人刑责、贫穷。
  trigger: 日柱为魁罡时
  logic: 验行运是否助身、命局是否见财官 → 身旺则福、见财官则祸
  boundary: 与「日德忌魁罡」「羊刃忌魁罡」并见，魁罡在不同格中角色相反，属易混处
  limits: 与「日德忌魁罡」「羊刃忌魁罡」并见，魁罡在不同格中角色相反，属易混处
  novelty: new
  relates: []
  tags:
  - 格局
  - 魁罡
  - 特殊日格
  source_ref: S0-p94
- id: c-yhr-0468
  domain: D10
  title: 金神：三时、须制伏入火乡
  source_id: src-yuanhai-ziping
  location: 第 96 章 · 论金神
  quote: '"夫金神者，只有三时，癸酉、己巳、乙丑。

    金神乃破败之神，要制伏，入火乡为胜。

    如四柱中更带羊刃七杀，真贵人也……惧水乡，则非福也。眉"'
  rule: 金神只在癸酉、己巳、乙丑三时；为破败之神，须制伏，喜入火乡；若命带羊刃七杀则为真贵人；忌行水乡。
  trigger: 时柱为上述三时之一时
  logic: 验是否有制（火）、是否带刃杀 → 有制有杀为贵，入水乡则非福
  boundary: 「太刚必折，不有以制之，则宽猛不济」——制的力度要求未量化
  limits: 「太刚必折，不有以制之，则宽猛不济」——制的力度要求未量化
  novelty: new
  relates: []
  tags:
  - 格局
  - 金神
  - 特殊时格
  source_ref: S0-p95
- id: c-yhr-0469
  domain: D05
  title: 时墓：财官之墓在时，须冲开方发
  source_id: src-yuanhai-ziping
  location: 第 97 章 · 论时墓
  quote: '"夫时墓之论，谓财官之墓时论之也。

    要刑冲破害以开啓钥，其人必难发于少年。

    经曰：少年不发库中人。

    也怕有物以压之，如丁用辰为官库，别有戊辰之类制之，则辰不能为官矣"'
  rule: 时墓指财官入墓于时柱：须有刑冲破害作钥匙才能开库发福，故其人多难发于少年（「少年不发库中人」）； 又怕库中之物被压住（如丁以辰为官库而另有戊辰压之），则库中之官不能用。
  trigger: 时支为财官之墓时
  logic: 定墓中所藏 → 验有无刑冲开库 → 验有无压伏之物 → 定发与不发
  boundary: 「压」的判定与第 285 章「库须对冲」的口径需合看（此章允许刑冲破害，彼章强调非冲不开），属待核查
  limits: 「压」的判定与第 285 章「库须对冲」的口径需合看（此章允许刑冲破害，彼章强调非冲不开），属待核查
  novelty: new
  relates: []
  tags:
  - 时墓
  - 墓库
  - 格局
  source_ref: S0-p96
- id: c-yhr-0470
  domain: D12
  title: 六亲捷要歌（男命刑害八句）
  source_id: src-yuanhai-ziping
  location: 第 143 章 · 六亲捷要歌
  quote: '"分禄须伤主馈人，比肩重叠损严亲。

    正财克母偏财父，夫妇相刑值退神。

    食神有寿妻多子，偏官多女少麒麟。

    乘旺伤官嗣必绝，中和印绶自荣身"'
  rule: 男命六亲刑害的口诀式判据：比肩重叠损父、正财克母、偏财为父、食神主有寿多子、偏官主多女少子、伤官乘旺主绝嗣、印绶中和主荣身。
  trigger: 快速判断男命六亲吉凶时
  logic: 按十神状态直接映射六亲结果
  boundary: 眉批注明「以上八句皆主男命刑害之言」；女命须另用取法
  limits: 眉批注明「以上八句皆主男命刑害之言」；女命须另用取法
  novelty: new
  relates: []
  tags:
  - 六亲
  - 口诀
  source_ref: S0-p97
- id: c-yhr-0471
  domain: D12
  title: 论妻妾：正财为妻、偏财为妾及其克应
  source_id: src-yuanhai-ziping
  location: 第 146 章 · 论妻妾
  quote: '"正财为正妻；偏财，妾也。

    ……财衰败墓绝，主妻有疾不贤，否则年高再嫁……比肩分夺，财临桃花，主妻妾私通……财多身弱，妻反胜夫；财命有气，妻妾和顺，是得妻力。

    日坐空亡，难为妻妾"'
  rule: 正财为妻、偏财为妾；财星衰败墓绝主妻有疾不贤或再嫁；比肩分夺、财临桃花主妻妾私通；财多身弱则妻胜夫；财命有气则得妻力；日坐空亡则难为妻妾，并须看孤鸾、阴差阳错之日。
  trigger: 断婚姻妻妾时
  logic: 财星状态（旺衰、墓绝、桃花、空亡）+ 比劫分夺 → 婚姻结果
  boundary: 含明代妻妾制度与「淫贱」评价，属时代性断言，不可作为可移植规则
  limits: 含明代妻妾制度与「淫贱」评价，属时代性断言，不可作为可移植规则
  novelty: new
  relates: []
  tags:
  - 六亲
  - 婚姻
  - 时代局限
  source_ref: S0-p98
- id: c-yhr-0472
  domain: D12
  title: 论子息：七杀为子与「生旺倍加、死绝减半」
  source_id: src-yuanhai-ziping
  location: 第 148 章 · 论子息
  quote: '"七杀者，子也。

    ……男命官杀得地而禀中和者，言其有子，将生成之数断之。

    生旺倍加，死绝减半，太过不及，不以此断……且如甲子之日、甲子之时，庚死於子，死中至老没儿郎"'
  rule: 男命以七杀为子、正官为女（女命以食伤为子女）；官杀得地而中和者有子，子数按「生旺倍加、死绝减半」 折算，太过不及则不作此断；官杀逢墓绝则无子或子少，逢吉曜则子贤，逢孤寡空亡则子不肖。
  trigger: 断子息有无与多寡时
  logic: 官杀的状态（得地/中和/生旺/死绝/入墓）+ 吉凶曜 → 子息数目与质量
  boundary: 「生成之数」「倍加」「减半」的具体基数需查后续长生位数歌，且此类数目推断无验证
  limits: 「生成之数」「倍加」「减半」的具体基数需查后续长生位数歌，且此类数目推断无验证
  novelty: new
  relates: []
  tags:
  - 六亲
  - 子息
  - 数目推断
  source_ref: S0-p99
- id: c-yhr-0473
  domain: D12
  title: 子息数目按长生宫位推断
  source_id: src-yuanhai-ziping
  location: 第 148 章 · 论子息
  quote: '"入墓之时难保双，受气绝中一个子，胎中头女有姑娘，养中三子只留二，长生之位旬中半，合主七个儿子也。

    沐浴一双保吉康，冠带临官三子位，旺中五子自成行，衰中二子病中一"'
  rule: 以子星（七杀）所处的十二长生宫位直接推出子息数目：旺中五子、冠带临官三子、沐浴二子、衰中二子、病中一子、绝中一子、养中三子只留二等。
  trigger: 需要给出子息数目时
  logic: 子星宫位 → 固定数目表
  boundary: 属数目型断法，无验证依据；「八字有一杀一子，二杀二子，无杀无子」另给一套口径，两说需合看
  limits: 属数目型断法，无验证依据；「八字有一杀一子，二杀二子，无杀无子」另给一套口径，两说需合看
  novelty: new
  relates: []
  tags:
