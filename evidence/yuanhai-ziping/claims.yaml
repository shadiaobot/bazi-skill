  quote: '"此格大要生旺，忌死绝，要四柱中有官星为妙。月上印绶最紧，行官印运便发，见财运破印，反为贪财坏印，财运不利也，岁君亦然。"'
  rule: 印绶格的成格与行运口径：印要生旺、忌死绝；四柱有官星为佳；位置以月令印绶最紧。 行运喜官运、印运（官生印、印助身），忌财运——财克印，称"贪财坏印"，岁君（流年）同理。 眉批作"有印无财方是福，喜逢官位怕临财"。
  trigger: 月令（或四柱）成印绶格
  logic: 印生旺 + 有官星 → 成格；行官印运 → 发；行财运 → 破印不利
  boundary: 与后文"印轻行财"等条目的取舍未给统一优先序，须在阶段 1.5 对照
  limits: 与后文"印轻行财"等条目的取舍未给统一优先序，须在阶段 1.5 对照
