  domain: D12
  title: 伤官在四柱的分位断语：年伤父母、月伤兄弟、日伤妻妾、时伤子孙
  source_id: src-yuanhai-ziping
  location: 第 175 章 · 杂论又诀
  quote: '"年上伤官，父母不全；月上伤官，兄弟不完；日上伤官，难为妻妾；时上伤官，子孙无传。岁月伤官劫财，生於贫贱之家；日下时中有财官，先贫後富。"'
  rule: 伤官按四柱分位取断：年上伤官主父母不全、月上主兄弟不完、日上主难为妻妾、时上主子孙无传； 岁月见伤官劫财者生于贫贱之家，日时见财官者先贫后富；岁月财官印绶者生于富贵之家。 又可提炼为时上伤官劫财者先富后贫、伤损子息、无晚福。 眉批补出对应关系："年为祖基、月为父母并兄弟、日为妻妾、时为子女"，并强调"伤官不可犯，
    或有犯者亦富贵子孙昌盛者，其法要有制伏……全在活法"。
  trigger: 伤官所在柱位
  logic: 分位对应六亲 → 取克应对象；有制伏则不全应
  boundary: 眉批明示须"活法"、有制伏者不以此断，即本条为辅助断语
  limits: 眉批明示须"活法"、有制伏者不以此断，即本条为辅助断语
