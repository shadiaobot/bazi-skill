  source_id: src-yuanhai-ziping
  location: 第 69 章 · 论五行墓库财印
  quote: '"丙丁生人以辰为官库，水土库於辰故也。须年月时中有木或亥卯未并寅即清。如无木则土夺丙丁之官，则浊卑而不清，亦不显。"'
  rule: 墓库取官的条件：丙丁日主以辰为官库（因水土同库于辰）；但辰中土会夺丙丁之官， 故须年月时有木、或亥卯未木局、或寅木，格局才「清」；无木则官被土夺，浊卑不清，官亦不显。 眉批补机制：印是生身之木，有木则生火（明内之力）；无木则火生土为盗气。
