  quote: '"甲木乃阳木，也甲见甲为比肩，见庚金为煞，辛金为官，癸水为正印，壬水为偏印，丙火为食神，丁火为伤官，戊土为偏财，己土为正财，皆以阳见阴为正，阳见阳为偏。"'
  rule: 眉批用甲日一例把正偏规则说透：甲见庚（阳见阳）为煞、见辛（阳见阴）为官；见癸为正印、见壬为偏印； 见丙为食神、见丁为伤官；见戊为偏财、见己为正财。总原则是「阳见阴为正，阳见阳为偏」。 这条规则把 p-B1-19 的位置表与十神名对应起来，避免只背顺位而不知正偏。
    下游用途：正官与七杀的处理完全不同（官要纯、杀要制），故正偏判定是喜忌分岔的第一道关口。
