  source_id: src-yuanhai-ziping
  location: 第 66 章 · 论月令
  quote: '"若年月日有吉神，则时归生旺之处。

    若凶神则要归时制伏之乡"'
  rule: 年月日三柱有吉神，时柱宜落在生旺之地以承接；有凶神，时柱宜落在能制伏之地。
  trigger: 判断时柱吉凶归属时
  logic: 按前三柱吉凶的性质选择时柱应有的状态
  boundary: 「生旺之处」「制伏之乡」如何取（就日主还是就吉凶神）未明确
