  - 查表
  source_ref: S0-p04
- id: c-yhr-0381
  domain: D04
  title: 月令藏干按日分取（令神用事分日）
  source_id: src-yuanhai-ziping
  location: 第 15 章 · 论天干生旺死绝
  quote: '"子月宫多取癸水，更有何日生，若初一日生至初十日生，当取壬水，十一日生至三十日生方取癸水，以断令神之用事，不可一例而取"'
  rule: 月令所藏人元并非整月同一字用事：以子月为例，初一到初十取壬水当令， 十一到三十方取癸水；即同一月内按日分段取用神。
  trigger: 取月令用神并需要确定所藏何字当令时
  logic: 按出生日在月内的位置决定当令藏干
  boundary: 其余十一个月各段分界日原书未列，须另行考订
  limits: 其余十一个月各段分界日原书未列，须另行考订
