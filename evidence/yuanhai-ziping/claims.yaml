  source_ref: S0-p78
- id: c-yhr-0454
  domain: D10
  title: 杀刃相济：杀无刃不显、刃无杀不威
  source_id: src-yuanhai-ziping
  location: 第 88 章 · 论羊刃
  quote: '"然杀无刃不显，刃无杀不威，刃杀俱全，非常人有之。

    大要身旺，运行身旺之乡，不要见伤官刃旺运……若命有刃无杀，岁运逢杀旺之乡，乃转生而反成厚福"'
  rule: 七杀与羊刃互为彰显：杀得刃方显其威、刃得杀方成其用，二者俱全者非常人； 但须身旺并运行身旺之乡，忌伤官刃旺之运。命有刃无杀者，岁运逢杀旺反成厚福。
  trigger: 命局同时有羊刃与七杀（或只有其一）时
  logic: 刃杀俱全 → 验身旺与行运 → 无杀者等岁运来杀
  boundary: 与「伤官财旺、身弱杀旺最可忌」并看，多条喜忌需按身旺否分层
  limits: 与「伤官财旺、身弱杀旺最可忌」并看，多条喜忌需按身旺否分层
  novelty: new
  relates: []
  tags:
  - 羊刃
  - 七杀
  - 身旺
  source_ref: S0-p79
- id: c-yhr-0455
  domain: D05
  title: 杂气须刑冲破害开库方发
  source_id: src-yuanhai-ziping
  location: 第 91 章 · 论杂气
  quote: '"杂气者，盖谓辰戌丑未之位也……但库中物皆闭藏，须待有以开其扃钥，方言发福。

    所言开啓钥者，何物也？

    乃刑冲破害耳，如四柱中原有刑冲破害，复行此等运气，则刑冲破害多反伤其福"'
  rule: 杂气指辰戌丑未四库，所藏不纯；库中之物闭藏，须有刑冲破害作钥匙才能取出而发福。 但若四柱原已有刑冲破害，岁运再来同类反伤其福。杂气要财多方为贵命。
  trigger: 月令或命局见辰戌丑未且需取其藏神为用时
  logic: 库中藏神 → 需冲开 → 冲开次数过多反伤福
  boundary: 「冲开几次为度」原书只说「多反伤其福」，无具体数目
  limits: 「冲开几次为度」原书只说「多反伤其福」，无具体数目
  novelty: new
  relates: []
  tags:
  - 杂气
  - 墓库
  - 冲
  source_ref: S0-p80
- id: c-yhr-0456
  domain: D05
  title: 福德秀气专用日主
  source_id: src-yuanhai-ziping
  location: 第 90 章 · 论福德秀气
  quote: '"福德秀气，专用其日主。

    且如乙巳、乙酉、乙丑是也。

    乙用庚官，露出杀喜制，喜印绶，不喜生於八月之中，恐露其杀。

    却喜行印绶官旺运，便能发福"'
  rule: 福德秀气以日柱干支本身立格（乙巳、乙酉、乙丑；丁巳、丁酉、丁丑；己巳、己酉、己丑；癸巳、癸酉、癸丑）， 其喜忌随日干不同：乙喜印绶与官旺运而忌露杀，丁喜官旺运，己忌见火伤金局，癸最不喜火财。
  trigger: 日柱为上述组合时
  logic: 按日干分别套用喜忌；共同点是喜官印旺运、忌杀与伤其用神者
  boundary: 与印绶论「大抵与印绶相似」并见，判据与普通格局的边界不清，属待核查
  limits: 与印绶论「大抵与印绶相似」并见，判据与普通格局的边界不清，属待核查
  novelty: new
  relates: []
  tags:
  - 格局
  - 福德秀气
  source_ref: S0-p81
