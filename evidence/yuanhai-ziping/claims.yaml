- id: c-yhr-0208
  domain: D05
  title: 勾陈得位格：戊己日坐亥卯未（官）或申子辰（财）
  source_id: src-yuanhai-ziping
  location: 第 121 章 · 外十八格-勾陈得位格
  quote: '"此格以戊己日为勾陈，遇亥卯未木局为官、申子辰水局为财地是也。正是戊寅、戊子、戊申；己未、己亥、己卯日是也。忌刑冲杀旺则反生灾矣，岁君大运亦然。"'
  rule: 成格：戊己日（土为勾陈），地支成亥卯未木局（为官）或申子辰水局（为财）。 列出的具体日柱：戊寅、戊子、戊申、己未、己亥、己卯，即日支自坐官或财之支。 破格：忌刑冲；忌杀旺——犯则"反生灾"。岁运同。
  trigger: 戊/己日 + 支成亥卯未或申子辰，且属所列六日之一
  logic: 得官局或财局 → 成；刑冲、杀旺 → 破而生灾
  boundary: 所列日柱与"遇…木局为官"两种表述是并列条件还是择一，正文未明确
  limits: 所列日柱与"遇…木局为官"两种表述是并列条件还是择一，正文未明确
  novelty: new
  relates: []
  tags:
