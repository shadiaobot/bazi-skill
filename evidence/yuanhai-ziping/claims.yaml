  logic: 按十神取固定断语，再以格局喜忌修正
  boundary: 作者自称此段为"死法"，强调不可执一；能力卡须以"喜忌修正"为主、固定断语为辅
  limits: 作者自称此段为"死法"，强调不可执一；能力卡须以"喜忌修正"为主、固定断语为辅
