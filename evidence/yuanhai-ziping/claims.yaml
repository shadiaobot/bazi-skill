  location: 第 178 章 · 宝法第一
  quote: '"子平一法，专以日干为主，而取提纲所用之物为令，次及年月时支以表其端。凡格用月令提纲，勿於傍求年日时为格。今人多不识其法於此，百发百失。……取其月令实事，则以遍求轻重深浅，格局破冲可 也。"'
  rule: 取格的第一法则：以日干为主，取提纲（月令）所用之物为格，再以年月时支辅助表其端； 凡取格必用月令提纲，不得旁求年日时支为格——作者称旁求者"百发百失"。 眉批注"取月令宫中所藏之物，如子宫单取癸水之类"。西山易鉴先生将十格归并为六格
    （官、印、财、杀、食神、伤官）而消息之。
