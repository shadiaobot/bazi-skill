  source_id: src-yuanhai-ziping
  location: 第 84 章 · 论食神
  quote: '"食不喜见官星，忌倒食，恐伤其食神。

    喜财食神相食，独一位见之，此为福人，然多亦不清。

    却喜身旺，不喜印绶，亦恐伤其食神也"'
  rule: 食神（我生之盗气，能生财）：喜财、喜身旺，忌官星、忌倒食（枭神夺食）、不喜印绶（印制食），以独一位为福，多则不清。
  trigger: 食神格定喜忌时
  logic: 按清单核验数量与喜忌神
