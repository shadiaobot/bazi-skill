  - 财官
  - 断语
  source_ref: B4-p51
- id: c-yhr-0339
  domain: D07
  title: 碧渊赋：太过无制者贫贱、不及无扶者夭折
  source_id: src-yuanhai-ziping
  location: 第 191 章 · 碧渊赋
  quote: '"太过无克制者贫贱，不及无生扶者夭折。宜向之而运背，决之贫贱；宜背之而向运，断之困穷。……逢官而看财，见财而富贵……逢杀而看印，遇印以荣华。逢印看官而遇官，十有八贵；逢财忌杀而有杀，十有九贫。"'
  rule: 太过无制则贫贱、不及无扶则夭折；喜向而运背主贫贱、宜背而运向主困穷；逢官看财、逢杀看印、逢印看官——两条生扶链决定贵贱；逢财忌杀而见杀者十有九贫。
  trigger: 判断命局大势与行运方向时
  logic: 先定太过/不及 → 再验有无制扶 → 再按官财印杀的配套断贵贱
  boundary: 「十有八贵」「十有九贫」为经验比例，无来源
  limits: 「十有八贵」「十有九贫」为经验比例，无来源
  novelty: new
  relates: []
  tags:
  - 中和
  - 行运
  - 断语
  source_ref: B4-p52
- id: c-yhr-0340
  domain: D08
  title: 掣要捷驰玄妙诀：「去留舒配」的定义
  source_id: src-yuanhai-ziping
  location: 第 196 章 · 掣要捷驰玄妙诀（眉批）
  quote: '"去留舒配 (眉批：去者，去而不用；留者，留而用之；舒者，屈而抑之；配者，合而成对)而中理，轻重强弱而表正。"'
  rule: 四言独步所称「去留舒配」在此得到定义：去＝弃而不用；留＝保留为用；舒＝屈抑其势；配＝合而成对。
  trigger: 执行「去留舒配」时
  logic: 按四字分别操作：删去、保留、抑制、配对
  boundary: 与第 75 章「去官留杀」互证，可合用
  limits: 与第 75 章「去官留杀」互证，可合用
  novelty: new
  relates: []
  tags:
  - 定义
  - 取用
  - 通变
  source_ref: B4-p53
- id: c-yhr-0341
  domain: D02
  title: 看命起手顺序：年为基本、月为提纲、日为命主、时为分野
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"凡看命先看四柱年月日时，次分天地人三元。干为天元，支作地元，以支中所藏金木水火土为人元。年为基本，月为提纲，日为命主，时为分野。"'
  rule: 先排四柱、分三元（天干/地支/支中藏干）；四柱分工：年为本、月为提纲、日为命主、时为分野。再以日干配合各柱取财官印绶，看有无败伤争斗。
  trigger: 任何命局分析的第一步
  logic: 排盘分元 → 定四柱角色 → 以日干为主取十神 → 察败伤与争斗
  boundary: 「三元」与后文「天地人」的对应关系与第 65 章的根苗花果比喻并见，两套比喻的分工原书未统一
  limits: 「三元」与后文「天地人」的对应关系与第 65 章的根苗花果比喻并见，两套比喻的分工原书未统一
  novelty: new
  relates: []
  tags:
  - 流程
  - 排盘
  source_ref: S0-x01
- id: c-yhr-0342
  domain: D05
  title: 有见不见之形（支中所藏亦可为用）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"有见不见之形，无时不有……或三合六合贵地，虽禄马、妻财、子孙、父母、兄弟皆是有见不见之形，无时而不有也。此论生旺制克衰绝，只是支中所藏之造化也。"'
  rule: 命局中未直接出现的字，可以通过支中所藏、三合六合等方式「暗取」，故称「见不见之形」；禄马、六亲都可由此推。
  trigger: 命局表面缺少某神（官、财、禄等）时
  logic: 由冲、合、刑从支中引出所需之字，再看其旺衰制克
  boundary: 眉批提示「正财独则易取，乱则难取」——暗取的前提是不杂乱，杂乱则难取
  limits: 眉批提示「正财独则易取，乱则难取」——暗取的前提是不杂乱，杂乱则难取
  novelty: new
  relates: []
  tags:
  - 暗取
  - 通变
  - 取用
  source_ref: S0-x02
- id: c-yhr-0343
  domain: D08
  title: 神煞混杂须轻重较量、去留取一
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"神煞相伴，轻重较量……若神杀混杂，看入节气深浅，或有去官留杀，或去杀留官，四柱或岁运亦当知轻重较量。"'
  rule: 吉神与七杀并见时，按节气深浅与轻重权衡，采取「去官留杀」或「去杀留官」的处置，不可两存。
  trigger: 命局官杀混杂或吉凶神并见时
  logic: 看当令深浅定谁得气 → 保留有力者、制去无力者
  boundary: 「轻重较量」的具体量化标准未给
  limits: 「轻重较量」的具体量化标准未给
  novelty: new
  relates: []
  tags:
  - 官杀
  - 去留
  - 通变
  source_ref: S0-x03
- id: c-yhr-0344
  domain: D08
  title: 时上一位贵格（时逢七杀未必为凶）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"若乃时逢七杀，见之未必为凶。月制干强，其杀反为权印……只有一位，方可为贵，别位不要再见，始为清贵。若年月上再见之反为辛苦艰难之命。要日干生旺，不畏刑害、阳刃。"'
  rule: 时上七杀只一位、日干生旺、月上有制伏者，杀反化为权印而为贵；若年月再见七杀则为辛苦艰难之命。四柱原无制伏者要行制伏运，原有制伏者要行官旺运。
  trigger: 时柱见七杀时
  logic: 数位数（只一位） → 验日干生旺 → 验制伏有无 → 定行运方向
  boundary: 与第 80 章「作时上七杀却不怕羊刃」呼应，但此处又说「不畏刑害、阳刃」，两处口径需合并理解
  limits: 与第 80 章「作时上七杀却不怕羊刃」呼应，但此处又说「不畏刑害、阳刃」，两处口径需合并理解
  novelty: new
  relates: []
  tags:
  - 七杀
  - 时柱
  - 格局
  source_ref: S0-x04
- id: c-yhr-0345
  domain: D05
  title: 杂气财官印绶格：藏蓄四库、看透干与节气浅深
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"财官印绶全备，藏蓄于四季之中……须看四柱天元透出何字为福。次分节气浅深，若杀旺官少要制伏，喜财。若主旺相冲，要行财运库旺。大抵福聚之地不可破。"'
  rule: 辰戌丑未四库各藏财官印绶等物；成格须看天干透出何字为福、节气浅深、杀旺官少则须制伏而喜财；库为「福聚之地」不可破。
  trigger: 月令或四柱见辰戌丑未且藏神为财官印时
  logic: 看透干 → 分节气浅深 → 定制伏与行运（财运、库旺）
  boundary: 「福聚之地不可破」与「墓库须刑冲破害开钥」并见：破与冲开的界限原书未明，属待核查
  limits: 「福聚之地不可破」与「墓库须刑冲破害开钥」并见：破与冲开的界限原书未明，属待核查
  novelty: new
  relates: []
  tags:
  - 杂气
