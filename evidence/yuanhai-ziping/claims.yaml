  source_id: src-yuanhai-ziping
  location: 第 86 章 · 论伤官（眉批引伤官诗诀）
  quote: '"伤官诗诀，火土伤官宜伤尽，金水伤官要见官，木火伤官官有旺，土金官去反成官，惟有水木伤官格，财官两见始为欢"'
  rule: 伤官的处理随日主五行不同而分五类：火土宜伤尽、金水宜见官、木火官须旺、土金官去反成官、水木财官两见方吉。
  trigger: 判定伤官格的具体取用时
  logic: 按日主五行归类，套用对应的伤官处理口径
  boundary: 五类口径彼此的差异理由原书未论证，属口诀性质
