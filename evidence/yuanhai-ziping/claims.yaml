  quote: '"要天干三个乙字，地支巳酉丑全，更有丙子、壬子、辛卯、丁酉日亦是秀气，怕冲克，大运同。"'
  rule: 成格：天干透三个乙字，且地支巳酉丑全；另列丙子、壬子、辛卯、丁酉日亦属秀气。 破格：怕冲克，大运同此判据。 该章原文极短，未给成格机理与喜行运说明。
  trigger: 天干三乙 + 地支巳酉丑全；或日柱为丙子/壬子/辛卯/丁酉
