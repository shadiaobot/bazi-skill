  title: 论子息：男取七杀为子、辛酉为女，及长生十二宫断子数
  source_id: src-yuanhai-ziping
  location: 第 148 章 · 论子息
  quote: '"如甲见庚申是子，辛酉是女。……入墓之时难保双，受气绝中一个子，胎中头女有姑娘，养中三子只留二，长生之位旬中半，合主七个儿子也。沐浴一双保吉康，冠带临官三子位，旺中五子自成行，衰中二子病中一。"'
  rule: 男命以七杀为子、以官为女（甲见庚申为子、辛酉为女）；女命取伤官为子、食神为女。 子数按子星所处的长生十二宫位读取，逐位有固定数目口诀（见 formula）。 原文并给"自子数至亥，依此推之"的操作提示，即按日柱地支逆/顺数至子星之位而取宫。
  trigger: 见原文条件
