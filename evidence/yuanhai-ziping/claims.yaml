  title: 寸金搜髓歌：财官与身旺衰的四种组合断语
  source_id: src-yuanhai-ziping
  location: 第 180 章 · 寸金搜髓论-搜髓歌
  quote: '"四柱专一论财官，身旺财官多富贵。若还身旺财官损，只是朝求暮讨儿。财官旺时日主旺，紫袍金带有何疑。财官旺而日主弱，运行身旺最为奇。日主旺而财官弱，运入财官利名驰。"'
  rule: 以"财官旺衰 × 日主旺衰"作四象限断法：身旺而财官亦旺 → 富贵；身旺而财官受损 → 贫（朝求暮讨）； 财官旺而日主弱 → 最喜行身旺之运；日主旺而财官弱 → 喜行财官之运。 开篇给出起手次序："造化先须看日主，後把提纲分次第"。
  trigger: 评估富贵层次与行运方向
  logic: 身与财官俱旺 → 富贵；一方不足 → 以行运补足该方
  boundary: 未给"旺/弱/损"的量化门槛，需与旺衰判断章合并
  limits: 未给"旺/弱/损"的量化门槛，需与旺衰判断章合并
