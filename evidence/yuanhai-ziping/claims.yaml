- id: c-yhr-0463
  domain: D05
  title: 刑合之义与「见不见之形」取贵
  source_id: src-yuanhai-ziping
  location: 第 89 章 · 论刑合
  quote: '"刑合者，刑中带有合者是也。

    如人命犯之，多因酒色丧家成病，至於耽迷不醒，乃神迷之也……是乃癸用戊官，戊禄在巳，不见巳字，但见寅刑，但巳酉丑合，此乃见不见之形，所以贵也"'
  rule: 刑合指地支既相刑又相合；犯之主酒色迷乱、丧家成病。但同一个机制也能取贵： 官星之禄虽不现于命局，可通过「刑」把它引出、通过「合」把它拢住，即所谓「见不见之形」， 是合禄合格之类奇格的原理。
  trigger: 命局地支刑合并见，或官禄不现而需用刑合引取时
  logic: 辨是「实犯」（刑合过重主酒色之祸）还是「暗取」（刑来合去取官为贵）
  boundary: 眉批称「此格不用官星，只是暗中刑来合去，取官为贵」；两类结果的分界条件原书未量化
  limits: 眉批称「此格不用官星，只是暗中刑来合去，取官为贵」；两类结果的分界条件原书未量化
  novelty: new
  relates: []
  tags:
  - 刑合
  - 格局
  - 取贵
  source_ref: S0-p90
- id: c-yhr-0464
