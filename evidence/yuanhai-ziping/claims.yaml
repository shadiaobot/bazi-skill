- id: c-yhr-0392
  domain: D12
  title: 月令有用神，主祖/亲/子得力
  source_id: src-yuanhai-ziping
  location: 第 66 章 · 论月令
  quote: '"假令月令有用神，得父母力。

    年有用神，得祖宗力。

    时有用神，得子孙力。

    反此则不得力"'
  rule: 用神位于月柱主得父母之力、位于年柱主得祖宗之力、位于时柱主得子孙之力；反之则不得其力。
  trigger: 需要断六亲助力时
  logic: 按用神所在柱位映射到对应亲属
  boundary: 与第 142 章六亲取象（以十神定亲）并见，两者关系未说明
  limits: 与第 142 章六亲取象（以十神定亲）并见，两者关系未说明
