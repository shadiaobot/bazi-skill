- id: c-yhr-0353
  domain: D09
  title: 伤官格总则：伤尽、原有官星则祸重
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"若逢伤官月建，如凶处未必为凶……伤官之法，务要伤尽而不为祸。四柱若原有官星，伤之尤重；原无官星，伤之则轻。若三合会起伤官之杀及运行伤官之地，其祸不可言也。故伤官见官，为祸百端。若当生年有伤官七杀，为祸最重。"'
  rule: 伤官格须伤尽方不祸；四柱原有官星者被伤则祸重，原无官星则祸轻；三合会起伤官或行伤官运则祸不可言；年柱带伤官七杀者「福基受伤，终身不可除去」，月时见者反可发福。
  trigger: 月令或四柱见伤官时
  logic: 先看有无官星 → 再看柱位（年重月时轻） → 再看岁运是否引动
  boundary: 与第 86 章互证，但「年重月时轻」的分级理由未论证
  limits: 与第 86 章互证，但「年重月时轻」的分级理由未论证
  novelty: new
  relates: []
  tags:
  - 伤官
  - 柱位
  - 禁忌
  source_ref: S0-x13
- id: c-yhr-0354
  domain: D05
  title: 正倒飞天禄马格（忌官星亦嫌羁绊）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"内有正倒禄飞，忌官星亦嫌羁绊……乃丁巳得巳字多，冲出亥中壬水为丁官星，乃正飞天禄马格也。若辛日得亥字多，冲出巳中丙火为辛官星，乃是倒飞天禄马也。柱中有壬癸辰巳，皆是官星羁绊也。"'
  rule: 丁巳日巳多冲出亥中壬水为官（正飞天禄马）；辛日亥多冲出巳中丙火为官（倒飞天禄马）；柱中忌见官星与羁绊之物（壬癸辰巳），见则减分。
  trigger: 丁巳日巳多或辛日亥多时
  logic: 以多字暗冲取官 → 验有无羁绊与明现官星 → 有则破
  boundary: 命例中「露官星则斯为下矣」，但「羁绊」的具体范围因格而异
  limits: 命例中「露官星则斯为下矣」，但「羁绊」的具体范围因格而异
  novelty: new
  relates: []
  tags:
  - 格局
  - 飞天禄马
  - 暗冲
  source_ref: S0-x14
- id: c-yhr-0355
  domain: D05
  title: 刑合格（六癸日时逢寅位，怕戊己与申）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"六癸日时逢寅位，岁月怕戊己二方……以六癸日为主星，用戊土为正气官星，喜逢寅时，用巳中戊土，癸日得官星……若四柱有戊字、己字，又怕庚金伤甲字，刑坏了寅字，忌申字。"'
  rule: 癸日甲寅时，以寅刑巳取巳中戊土为官（刑合格）；忌四柱见戊己（官星明现）、忌庚伤甲、忌申（刑坏寅）。
  trigger: 癸日生甲寅时
  logic: 验有无戊己透干、有无庚与申 → 有则功名蹭蹬
  boundary: 书中命例（己卯 乙亥 癸未 甲寅）年上露己即屡科不第，为例证
  limits: 书中命例（己卯 乙亥 癸未 甲寅）年上露己即屡科不第，为例证
  novelty: new
  relates: []
  tags:
