- id: c-yhr-0348
  domain: D04
  title: 印绶格：月生日干、忌财坏印、忌行死绝
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"月生日干无天财，乃印绶之名……大要生旺，忌死绝，若四柱中元有官星尤好。忌见财气，格行官运则发，若行财旺乡，贪财坏印，祸患百端，行死绝运必受其伤。"'
  rule: 月令生扶日干而无财星破印者为印绶格；喜官星、喜生旺，忌财（贪财坏印）与死绝之运。
  trigger: 月令为印且四柱无财时
  logic: 验有无官星与财星 → 定行运（官运发、财运破、死绝运伤）
  boundary: 命例「丙辰 甲午 己未 丁卯」被判极刑，作者归因于「印生逢死绝之运，又见壬来破印」，属事后归因
  limits: 命例「丙辰 甲午 己未 丁卯」被判极刑，作者归因于「印生逢死绝之运，又见壬来破印」，属事后归因
