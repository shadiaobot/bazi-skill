  title: 根苗花果：年为根、月为苗、日为花、时为果（兼年祖上、月父母、日己身）
  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"以年为根，月为苗，日为花，时为果。又择四柱之中，以年为祖上，则知世代宗派盛衰之理。月为父母，则知亲荫名利有无之类。以日为己身，当推其干。"'
  rule: 四柱的分工与宫位：年为根（祖上、世代宗派盛衰）、月为苗（父母、亲荫名利有无）、日为花（己身）、 时为果（子息）。正文并给配套口径：看年月中先有财官印绶为「根苗先有气」，再看日时开花结果； 引经「根在苗先，实在花後」；日干弱则求气旺之藉（赖），日干旺而太过则反嫌气旺、损财伤妻。
    眉批补：年为祖上根基田宅之宫，忌四柱刑冲破害伤及生年。 下游用途：这是全书宫位断六亲（task-14）与断层次（task-17）的读取顺序总纲，与第 65 章「以日为主」互为表里。
