  title: 十二支相冲（以支中暗害为冲，逢合则不冲）
  source_id: src-yuanhai-ziping
  location: 第 9 章 · 论十二支相冲
  quote: '"子午相冲，

    寅申相冲，

    卯酉相冲，

    辰戌相冲，

    巳亥相冲，

    丑未相冲。

    (子宫癸水，午宫丁火，水能克火之故也。寅宫甲木，申宫庚金，因金克木之故也。以支中暗害为冲，余仿此。)"'
  rule: 六组相冲：子午、寅申、卯酉、辰戌、巳亥、丑未。正文给出理据：冲的本质是支中所藏天干相克 （子宫癸水克午宫丁火、寅宫甲木被申宫庚金克），即「以支中暗害为冲」——冲不是方位对立， 要用藏干相克解释。 眉批补关键例外：「相冲者但得有逢合则不能冲」——命局有合牵绊时冲力可解。这使冲的判断变成
    两步：先列冲对，再查是否有合。 下游用途：用神不可冲（第 280 章「用之为禄不可冲」）、开库须冲（第 285、97 章）、 岁运相冲吉凶（第 160 章）都以此为基础。
