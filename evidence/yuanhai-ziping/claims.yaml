  logic: 纯一不杂 → 格成
  boundary: 无喜忌、无行运、无破格条件；证据极薄，1.5 阶段须标注为低置信
  limits: 无喜忌、无行运、无破格条件；证据极薄，1.5 阶段须标注为低置信
