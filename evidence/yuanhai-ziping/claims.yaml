  title: 犯岁君的解救条件与神煞叠加
  source_id: src-yuanhai-ziping
  location: 第 161 章 · 论太岁吉凶
  quote: '"有救则吉，乃八字庚辛酉巳丑金局也。经云：戊己愁逢甲乙，干头需要庚辛或丙丁火局焚木，有灾勿咎，效此推之。或得己和甲亦解之。大抵太岁不可伤之，相生者吉，乃五行有救，其年反必为财。"'
  rule: '"有救"的三种形态：①以克犯岁君之五行相制（戊己逢甲乙，须干头有庚辛，或以丙丁火局焚木）； ②以合化解（"或得己和甲亦解之"）；③太岁与日主相生。有救则其年反主为财。 叠加判据：犯岁君之年再逢勾绞、空亡、咸池、宅墓、病符、死符、白虎、羊刃诸煞同临，则祸患百出，
    须神煞加临轻重推之；日干虽不克岁，若运克岁君、加岁运冲刑或羊刃冲合，主破耗丧事， 得贵人禄马解救则稍吉。'
  trigger: 犯岁君
  logic: 见制、见合、见相生 → 有救；再叠凶煞 → 加重
  boundary: 解救三法的优先序未定；原文"戊己愁逢甲乙"一句断句含混，须回核
  limits: 解救三法的优先序未定；原文"戊己愁逢甲乙"一句断句含混，须回核
