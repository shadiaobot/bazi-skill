  source_ref: B3-p36
- id: c-yhr-0228
  domain: D12
  title: 论母：正印为母，逢财与桃花沐浴之断
  source_id: src-yuanhai-ziping
  location: 第 145 章 · 论母
  quote: '"正印者，乃生我之身也。如甲日以癸为母，遇己丑本主克母。……如印长生，主母慈淑寿长，益夫和子。母如临羊刃杀地，或值墓绝，孤寡，主母不贤，或有残疾不睦。"'
  rule: 正印为母。甲日以癸为母，遇己丑（土克水）即主克母，见多则主母嫁二夫；戊（母之夫）失地或被克主母伤前夫； 戊受生或印临桃花沐浴主母有外情。印长生则母慈淑寿长、益夫和子； 母临羊刃杀地或值墓绝、孤寡则主母不贤或有残疾不睦。眉批注"桃花即咸池煞，主淫"。
  trigger: 以正印为母，观其生克与所临神煞
  logic: 印逢财、临死绝 → 克母/母不贤；印长生、得生助 → 母慈寿
  boundary: 断语涉及亲属德行，属体系内断言；须在能力卡中标注不作事实预测
  limits: 断语涉及亲属德行，属体系内断言；须在能力卡中标注不作事实预测
