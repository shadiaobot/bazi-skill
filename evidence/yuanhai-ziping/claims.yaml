  title: 十二月建丑：己土18日，火土救、水乡困
  source_id: src-yuanhai-ziping
  location: 第 214 章 · 十二月建丑候诗诀
  quote: '"甲子生居丑月中，无根金水不嫌凶，再行金水声名显，火土相逢破本宗。眉批：十二月丑宫，癸水五日，辛金库七日，己土十八日。"'
  rule: 丑月己土18日、辛金库7日、癸水5日；甲子生丑月虽无根，金水来不嫌凶、再行金水反显名，逢火土则破格。
  trigger: 生于丑月时
  logic: 丑为湿土金库 → 金水得根则喜，火土燥烈则忌
  boundary: 与「土旺喜木疏」通则相反方向，须按丑为湿土的特殊性理解
