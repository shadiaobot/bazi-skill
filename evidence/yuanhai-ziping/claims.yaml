  source_ref: S0-x15
- id: c-yhr-0356
  domain: D05
  title: 子遥巳格（甲子日再逢子时）
  source_id: src-yuanhai-ziping
  location: 第 75 章 · 喜忌篇
  quote: '"甲子日再逢子时，畏庚辛申酉丑午……甲用辛官，辛禄在酉，二子为甲木之印绶。子中癸水遥合巳中丙戊，合动酉位之辛为甲之官星……喜壬癸亥子月，忌庚申辛酉，乃金来伤甲木。午字来冲子字，是羁绊则不能去遥合矣。"'
  rule: 甲子日见子多，以子遥合巳、合动酉中辛为官；喜壬癸亥子月，忌庚辛申酉（金伤甲）与丑午（羁绊）。
  trigger: 甲子日而子多时
  logic: 验所忌诸字是否出现 → 出现则不成格或转祸
  boundary: 命例中「年上有申中庚金冲克甲」即转祸罢官，属个案
  limits: 命例中「年上有申中庚金冲克甲」即转祸罢官，属个案
  novelty: new
