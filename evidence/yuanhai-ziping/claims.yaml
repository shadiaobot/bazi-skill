  title: 月令司令分日诀（天地干支暗藏总诀）
  source_id: src-yuanhai-ziping
  location: 第 59 章 · 论天地干支暗藏总诀
  quote: '"立春念三丙火用，余日甲木旺提纲。

    惊蛰乙木未用事，春分乙木正相当。

    清明乙木十日管，後来八日癸水详。

    谷雨前三戊土盛，其中土旺要消详"'
  rule: 逐节气列出该月内「何字当令、当令几日」的细表（如立春后23日丙火用事、余日甲木旺提纲； 清明乙木十日、后八日癸水；谷雨前三日戊土盛……）。这是对第 15 章「月令藏干按日分取」的通用展开。
