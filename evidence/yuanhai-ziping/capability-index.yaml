- id: c-yh-0004
  domain: D04
  title: 取用神与忌法（用之某神不可某）
  source_id: src-yuanhai-ziping
  location: 第 65、66、73、75、76 章、第 160 章眉批、第 280 章（论八字撮要法）
  quote: 用之为官不可伤。用之为财不可劫。用之为印不可破。用之为食不可夺。用之为禄不可冲
  rule: 用神自月令所藏取，若命局另有更重之病则以病处定药；定后用「用之为官不可伤、为财不可劫、为印不可破、为食不可夺、为禄不可冲」逐条查忌。
  trigger: 取用神（以月令所藏为用，或以病处定药）
  logic: 用神自月令所藏取，若命局另有更重之病则以病处定药；定后用「用之为官不可伤、为财不可劫、为印不可破、为食不可夺、为禄不可冲」逐条查忌。
  boundary: '**不适用**：只问某结构处置（转 `guansha-hunza` 或 `shangguan-ge`）；要求预测具体事件与时间。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
