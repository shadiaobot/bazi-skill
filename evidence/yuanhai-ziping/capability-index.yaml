# 《渊海子平》能力卡导入（每卡一条 claim，证据取自卡片 R 段）

- id: c-yh-0001
  domain: D01
  title: 四柱排盘与起运（年上起月、日上起时、大运顺逆与三日折一岁）
  source_id: src-yuanhai-ziping
  location: 第 18 章（年上起月例）、第 19 章（日上起时例）、第 55 章（起大运法）、第 61 章（地支藏遁歌）
  quote: 甲己之年丙作首，乙庚之岁戊为头，丙辛之岁寻庚上，丁壬壬位顺行流，若言戊癸何方发，甲寅之上好追求
  rule: 先按节气定月、按年干起月、按日干起时排出四柱，再按阳男阴女顺行、三日折一岁起大运并判交运时刻。
  trigger: 由出生时间排出四柱（年月日时干支）
  logic: 先按节气定月、按年干起月、按日干起时排出四柱，再按阳男阴女顺行、三日折一岁起大运并判交运时刻。
  boundary: '**不适用**：非八字体系的排盘（紫微、六壬、择日）；纯问吉凶断语；要求预测具体事件时间。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
  - sizhu-qiyun

- id: c-yh-0002
  domain: D02
  title: 十神定位（阴阳同异定正偏）与六亲映射
  source_id: src-yuanhai-ziping
  location: 第 65 章（论日为主）、第 77–87 章各论眉批对照表、第 142 章（六亲总论）
  quote: 大抵贵贱寿夭死生，皆不出於五者。倘有妄立格局，从列其名而无实用，其飞天禄马、倒冲、井栏叉即伤官
  rule: 以日干为我，按五行生克与阴阳同异标注十神：同类为比劫、我生为食伤、我克为财、克我为官杀、生我为印。
  trigger: 给一个命局标注十神（正官、七杀、正财、偏财、正印、偏印、食神、伤官、比肩、劫财）
  logic: 以日干为我，按五行生克与阴阳同异标注十神：同类为比劫、我生为食伤、我克为财、克我为官杀、生我为印。
  boundary: '**不适用**：直接由十神给吉凶结论（需先用神与格局）；用十神判断现实人物品行。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
  - shishen-dingwei

- id: c-yh-0003
  domain: D03
  title: 日主旺衰与月令司令分日
  source_id: src-yuanhai-ziping
  location: 第 15 章（论天干生旺死绝）、第 59 章（天地干支暗藏总诀）、第 67 章（论生旺）、第 76 章（继善篇）、第 179 章（宝法第二眉批）
  quote: 但逢长生、冠带、临官、帝旺为吉，但逢沐浴、衰、病为不吉也。至於死、绝，如无救助者直为凶矣。胞胎受气亦为半吉，养亦如之
  rule: 先查十干在支的十二长生定强度，再按出生日在节气内的段次取月令当令之气，最后以全局校核得令得地与太过不及。
  trigger: 判断日主旺衰（身强身弱、得令得地与否）
  logic: 先查十干在支的十二长生定强度，再按出生日在节气内的段次取月令当令之气，最后以全局校核得令得地与太过不及。
  boundary: '**不适用**：直接由旺衰推出用神或吉凶（须转下一层能力）；把旺衰当作命运优劣的结论。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
