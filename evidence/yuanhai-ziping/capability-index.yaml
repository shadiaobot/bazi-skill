- id: c-yh-0005
  domain: D05
  title: 格局判定（内十八格、外十八格与杂气墓库）
  source_id: src-yuanhai-ziping
  location: 第 91、97、99–118、123–141、178–180 章
  quote: 子平一法，专以日干为主，而取提纲所用之物为令，次及年月时支以表其端。凡格用月令提纲，勿於傍求年日时为格。今人多不识其法於此，百发百失
  rule: 先以月令提纲取格，再按「原局有无官星本体」的门槛判内十八格奇格，按地支成局判外十八格专旺，最后校填实、刑冲、透干与开库条件。
  trigger: 判断命局属于哪个格局（内十八格/外十八格/杂气/特殊日格）
  logic: 先以月令提纲取格，再按「原局有无官星本体」的门槛判内十八格奇格，按地支成局判外十八格专旺，最后校填实、刑冲、透干与开库条件。
  boundary: '**不适用**：只问用神或旺衰（转对应卡）；把格局当性格类型；用格局预测具体事件。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
