- id: c-yh-0007
  domain: D07
  title: 大运、太岁与流年推演
  source_id: src-yuanhai-ziping
  location: 第 160 章（论大运）、第 161 章（论太岁吉凶）、第 174 章（论征太岁）、第 285、286 章（动静说、盖头说）
  quote: 子平之法，大运看支，岁君看干，交运同接木……月令者，运元也，行运就月上起
  rule: 大运看地支、岁君看天干，交运换甲与四维转角为关口；再按行运十神断法与岁运生克判断逐年吉凶，并考虑根基厚薄对恶运的缓冲。
  trigger: 推演大运吉凶与十年变化
  logic: 大运看地支、岁君看天干，交运换甲与四维转角为关口；再按行运十神断法与岁运生克判断逐年吉凶，并考虑根基厚薄对恶运的缓冲。
  boundary: '**不适用**：只排盘或只取用神；要求预测具体事件（哪年结婚、哪年生病、哪年亡故）。'
