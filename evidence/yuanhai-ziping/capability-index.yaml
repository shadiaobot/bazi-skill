- id: c-yh-0016
  domain: D15
  title: 从格与化气（含神趣八法八象）
  source_id: src-yuanhai-ziping
  location: 第 130、132 章、第 162–172 章、第 258、295 章
  quote: 化象者，乃甲乙日生人，在辰戌丑未月，天干有一己字合甲字，谓之甲己化土。喜行火运。如逢甲木生旺，逢化不成，反为不吉……均破格不成
  rule: 先判从化为本：日主无根可从、合而月令得气可化；不成再论财官，末论格局；八象（类、属、从、化、照、返、鬼、伏）各有判据与喜忌。
  trigger: 判断命局是否成从格（从财、从杀、从金等）
  logic: 先判从化为本：日主无根可从、合而月令得气可化；不成再论财官，末论格局；八象（类、属、从、化、照、返、鬼、伏）各有判据与喜忌。
  boundary: '**不适用**：普通正格取格（转 `geju-panding`）；无根无合、无成局可言的普通命局。'
