- id: c-yh-0009
  domain: D09
  title: 伤官格处理（伤尽、见财、见官）
  source_id: src-yuanhai-ziping
  location: 第 86 章（论伤官）、第 175 章（杂论又诀）、第 223 章（伤官诗诀）
  quote: 伤官见官，为祸百端，若非疾病伤躯，必当官讼囚系，子丧妻伤。伤官见官，元有者重，元无者轻
  rule: 伤官须伤尽或见财方可用；原局有官者重、无官者轻；分柱位取断（年伤父母、月伤兄弟、日伤妻妾、时伤子孙）。
  trigger: 判断伤官格的可用条件（伤尽、见财、见官）
  logic: 伤官须伤尽或见财方可用；原局有官者重、无官者轻；分柱位取断（年伤父母、月伤兄弟、日伤妻妾、时伤子孙）。
  boundary: '**不适用**：无伤官结构的普通格局；要求预测法律纠纷、疾病、子女命运的具体结果。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
