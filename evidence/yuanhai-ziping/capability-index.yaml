  quote: 羊刃对宫即飞刃。甲生人，羊刃在卯，酉飞刃；乙生人，羊刃在辰，戌飞刃；丙生人，羊刃在午，子飞刃……癸生人，羊刃在丑，未飞刃
  rule: 按日干查羊刃表（对宫为飞刃），杀刃相济须身旺且得印；日刃、日贵、日德、魁罡、金神各有查法与其自身格局中的喜忌。
