- id: c-yh-0008
  domain: D08
  title: 官杀混杂与制伏
  source_id: src-yuanhai-ziping
  location: 第 70、77、78、79、80 章、《喜忌篇》（第 75 章）
  quote: 官星要纯不要杂。假如甲木用辛金为官，若年是辛，月是酉，时上亦是辛官，虽多但无妨，盖纯一尽好。若有金或庚申，则混杂为杀，以伤其身，要行火乡制伏则发福也
  rule: 官星贵纯忌杂：正官与七杀并见即混杂，须以食伤制伏或合去，且制伏不可太过；行制伏之乡反主发福。
  trigger: 判断官杀是否混杂及其轻重
  logic: 官星贵纯忌杂：正官与七杀并见即混杂，须以食伤制伏或合去，且制伏不可太过；行制伏之乡反主发福。
  boundary: '**不适用**：无官杀并见的普通命局（转 `geju-panding`）；要求预测具体官职、诉讼或疾病。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
