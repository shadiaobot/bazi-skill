- id: c-yh-0006
  domain: D06
  title: 病药诊断与富贵贫贱层次
  source_id: src-yuanhai-ziping
  location: 第 173、176、177、180 章、第 282–286 章
  quote: 何以为之病？原八字中原有所害之神也；何以为之药？如八字原有所害之字，而得一字以去之之谓也
  rule: 找出克害用神之字为病、能去此害之字为药，按病药配比定层次；再以群兴五类与兴亡条件判何时兴、因何败。
  trigger: 病药诊断（病在哪、药为何、药多药少、行运取中）
  logic: 找出克害用神之字为病、能去此害之字为药，按病药配比定层次；再以群兴五类与兴亡条件判何时兴、因何败。
  boundary: '**不适用**：只问某字含义或某年吉凶；用户要求预测婚期、病名、生死、成败时点。'
  limits: 由能力卡 R/I/E/B 六段承载；本条为合并预演用的能力级摘要
  novelty: new
  relates: []
  tags:
