  failure_mode: '羊刃之命行财运或岁运再逢杀刃时，仍按「财为养命之源」「杀刃成格」作吉断。

    '
  mechanism: '羊刃之凶在于叠加：眉批点出财旺三合为「大忌」，原文另指出命内原有杀刃而岁运重见者

    「其过非常」。这与「刃杀俱全非常人有之」的成格条件不矛盾——成格看配置得当，叠加看是否过极。

