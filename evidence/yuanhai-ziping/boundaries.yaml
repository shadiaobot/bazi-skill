  location: 第 258 章 · 化气诗诀（page 576）
  quote: '"六乙坐亥多逢木，庚金相会透时干，干生无火方成化，又恐金多反作难。……丁壬化木入金乡，苟禄蝇营空自忙，气喘残伤无足取，眼前骨肉亦参商。……乙庚最怕火炎阳，志气消磨主不良，寅午重逢为下格，随缘奔走觅衣粮。"'
  failure_mode: '见天干相合即断化气成格；不核化神是否得月令之地（寅时、亥卯月提），

    也不核有无破化之神（金多、火炎、土重）。

    '
  mechanism: '眉批逐组给出条件与破法（「丁壬化木喜行东方运，忌庚辛金破木伤，化之若无，主其人不恶疾，也骨肉伤残」）——

    化而不真则不成格，只作下格论。

    '
  bound_to:
  - 化气与神趣八法（task-18）
  tags:
