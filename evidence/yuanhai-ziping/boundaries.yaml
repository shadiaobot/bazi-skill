  location: 第 261 章 · 克妻诗诀（page 582）
  quote: '"天干透露弟兄多，财绝官衰旺太过，月令又逢身旺地，青春年少哭娇娥。……当生四柱有财星，羊刃逢时定克刑，岁逢运行妻眷绝，妻宫频见损年龄。"'
  failure_mode: '断婚姻吉凶只取「妻星（财）有无」，不核比劫多寡、身旺太过、

    羊刃在时、岁运合冲妻宫等条件。

    '
  mechanism: '克妻的成立需要条件叠加：兄弟（比劫）多而财被夺、身旺太过而财绝、

    羊刃居时、岁运再冲。单独一项不足以定论。

    '
