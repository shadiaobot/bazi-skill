  location: 第 234 章 · 飞天禄马诗诀（page 528）
  quote: '"最忌绊神兼论合，官星填实祸当途，运重岁轻消息取，用神不损上天衢。……七杀官星休要犯，丑字相逢绊若何，天地人元重见土，克其子丑不兴波。……丙丁高位激江湖，岁运无官入仕途，专禄荣名皆逐意，片言投合动皇都。"'
  failure_mode: '见飞天禄马等暗冲暗合之格即断富贵；不检查：（1）所冲之宫是否被填实，

    （2）是否有绊神合住，（3）官星是否显露，（4）岁运是否来冲。

    '
  mechanism: '这类奇格靠「暗冲暗合」取官，故最怕填实（冲之目标已现，暗冲作废）、

    怕绊合（合住关键的冲神）、怕官星明现（不再需要暗取）。

    '
  bound_to:
  - 取格（task-05）
  tags:
  - counter-example
  - qige
  - tianshi
  - banshen
  source_ref: ce-B5-36
- id: b-yhr-0141
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 235 章 · 六乙鼠贵诗诀（page 530）
  quote: '"乙日须逢丙子时，如无午破贵尤奇，四柱忌逢申酉丑，若无官杀拜丹墀。……六乙生人时遇鼠，官星又带复如此，庚辛申酉马牛欺，一位逢之为丐子。"'
  failure_mode: '见乙日得子时即断「聚贵」；不核午字冲破、四柱申酉丑、庚辛申酉显露这些条件，

    甚至出现「一位逢之为丐子」的反向结论。

    '
  mechanism: '眉批「用此格者忌冲子，不宜见午字去冲……见庚申辛酉四字则减分数，岁运亦忌，

    凡遇见官只作别格断之」——该格对官星显露极度敏感，条件不满足即降格或反贱。

    '
  bound_to:
  - 取格（task-05）
  tags:
  - counter-example
  - qige
  - shuguizhu
  source_ref: ce-B5-36b
- id: b-yhr-0142
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 236 章 · 合禄诗诀（page 532）
  quote: '"甲丙卯寅兼巳字，四营岁运怕同宫。……大忌寅来伤秀气，若逢春夏惹灾连。"'
  failure_mode: '见合禄格即断清贵；不核合神是否被刑坏（甲乙丙巳刑坏申、丙伤庚字），

    也不核生在春夏与岁运同宫之忌。

    '
  mechanism: '眉批「四柱有甲乙字，丙字、巳字，刑坏了申，丙伤庚字，则减分数，岁君大运亦然」——

    奇格的取官工具（合神）被破坏则格不成。

    '
  bound_to:
  - 取格（task-05）
  tags:
  - counter-example
  - helu
  - yaosi
  source_ref: ce-B5-37
- id: b-yhr-0143
