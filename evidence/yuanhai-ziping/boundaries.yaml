  location: 第 27 章 · 论三奇贵人（眉批）
  quote: “三星要顺，倒乱者非，日为一腐三矣”
  failure_mode: '只要甲戊庚（或乙丙丁、壬癸辛）三字齐现即作三奇格，不检查三字出现的次序。

    '
  mechanism: '眉批引程思之说定「三星要顺，倒乱者非」，《壶中子》亦以「三奇倒乱，吕望为王头钓专」讥其无用。

    次序是本格成立条件的一部分。

    '
