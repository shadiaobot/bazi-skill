- id: b-yhr-0034
  domain: D01
  source_id: src-yuanhai-ziping
  location: 第 58 章 · 论节候歌（眉批）
  quote: '"此以立春日为始，或正月一二三四五六，立春又不问内增二日，只以节义为始，且立春为节，雨水为候，又为节气，逐月仿此。"'
  failure_mode: '以农历新年（正月初一）作为年柱的起点，或在正月内按日期先后判断年柱归属，

    不以立春的交节时刻为界。

    '
  mechanism: '眉批写死：以立春日为始，且月内日期无关，「只以节义为始」。每一月以「节」的交接时刻划界，

    「气」不承担分界功能。立春前后的年柱与月柱同时受影响。

    '
  bound_to:
  - 四柱排盘（task-01）
  tags:
  - counter-example
  - paipan
  - jieqi
  source_ref: ce-B1-34
- id: b-yhr-0035
  domain: D06
  source_id: src-yuanhai-ziping
  location: 第 65 章 · 论日为主
  quote: '"有坏其用神则要制之，不要益之。论命者切不可泥之月令消详，故表而出之。"'
  failure_mode: '取用神时只看月令所藏，不从全局找破坏用神之字；或反其道而行，见用神受损即行生扶。

    '
  mechanism: '原文在给出「以日为主，年为本，月为提纲，时为辅佐」之后，要求先看日主旺衰、再看地支成局、

    最后看月令何者旺，并特别点出：坏用神者「要制之，不要益之」，且「切不可泥之月令」。

    月令是权重的最大项，不是唯一项。

    '
  bound_to:
  - 取用神与忌法（task-06）
  - 病药（task-07）
  tags:
