  location: 第 83 章 · 论偏财
  quote: '"而偏财者，乃衆人之财也，只恐兄弟姐妹而夺之，则福不全。若无官星，祸患百出。"'
  failure_mode: '见偏财即断财丰，不查四柱有无官星镇压，也不看比肩劫财是否分夺；或以为「偏财好出亦不惧藏」

    便无需护财。

    '
  mechanism: '偏财的来源性质是「众人之财」，故其成立条件与正财不同：须有官星镇压、须不被兄弟分夺。

    原文另有一层限定：财盛而身弱者，行官乡「既被财之盗气，复被官之克身，非惟不发禄，亦防祸患」。

    '
  bound_to:
