  location: 第 288 章 · 气象篇（page 675）
  quote: '"执实者，用一而不通也。……局中之物不可过於有情，若过於有情则牵迷不能自脱，外无所见矣。……凡柱中得自然之物为妙，若用力扶持，终不为美。"'
  failure_mode: '三种典型误断：（1）用一而不通（执实），（2）局中过于有情（牵迷不能自脱），

    （3）用神局中不见而强以食伤比肩冲合来凑（过于用力）。

    '
  mechanism: '自然之物为妙：有情太过则志不远达，用力扶持则成就艰难。

    这三条是「牵合成局」类推断的反面清单。

