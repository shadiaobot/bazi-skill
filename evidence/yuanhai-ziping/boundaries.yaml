  location: 第 243 章 · 拱禄拱贵诗诀（page 546）
  quote: '"所拱之位怕填实，又怕伤官在月支，羊刃重重来格破，如无此破贵无疑。……两绊本身非是我，拱藏一位虚中好，不宜填实见官星，更忌官星当克破。"'
  failure_mode: '见拱禄拱贵即断腰金衣紫；不核所拱之位是否已被填实（虚拱才成）、

    月支是否伤官、是否羊刃重重。

    '
  mechanism: '眉批「宜虚拱，不要填实，相绊刑冲破害皆拱不成矣」——虚拱是可失效的机制性条件，

    一旦填实则格败。

    '
