- id: b-yhr-0065
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 84 章 · 论食神
  quote: '"食不喜见官星，忌倒食，恐伤其食神。喜财食神相食，独一位见之，此为福人，然多亦不清。却喜身旺，不喜印绶，亦恐伤其食神也。"'
  failure_mode: '见食神即断财厚食丰、有子有寿，不查是否见官、见枭（倒食）、见印；也不管食神是一位还是多位。

    '
  mechanism: '原文给食神列出的忌与喜成对：忌官星（官克食）、忌倒食（枭克食）、不喜印绶（亦伤食）、

    喜财、喜身旺、喜独一位。神名相同而配置不同，结论相反。

    '
  bound_to:
  - 十神喜忌（task-03 / task-06）
  - 六亲子息（task-14）
