  quote: '"夫女人有旺夫伤子者何，此法皆时上推之。时为归宿之地，夫子二星引归於时，夫星生旺，子呈衰败是也。"'
  failure_mode: '判女命只用「官为夫、食为子」的名称，不把两星引归到时上核其旺衰；

