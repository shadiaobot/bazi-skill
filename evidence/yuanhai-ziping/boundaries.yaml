- id: b-yhr-0001
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 8 章 · 论十二支三合（眉批）
  quote: '"合局者为贵，但得五行相顺。"'
  failure_mode: '看到申子辰、亥卯未、寅午戌、巳酉丑成局，即判为贵格，不再检查所化之行与日主、月令是否相顺；

    成局反而成了所化之行的忌神时仍作吉断。

    '
  mechanism: '三合只是「取用为局入格」的入口（正文：「凡看命以三合取用为局入格」），眉批另加一道门槛：

    成局为贵的前提是五行相顺。缺了这道校核，成局就从结构信息变成了吉凶结论。

    '
  bound_to:
  - 格局判定（task-05）
  - 旺衰与用神取舍（task-04 / task-06）
  tags:
  - counter-example
  - dizhi
  - sanhe
  - geju
  source_ref: ce-B1-01
- id: b-yhr-0002
  domain: D07
  source_id: src-yuanhai-ziping
  location: 第 9 章 · 论十二支相冲（眉批）
  quote: '"相冲者但得有逢合则不能冲。"'
  failure_mode: '命中见子午、寅申、卯酉、辰戌、巳亥、丑未即断为凶冲，忽略其中一支已被合住、冲力被削弱的情形。

    '
  mechanism: '冲的实质是支中所藏之干相克（正文：「以支中暗害为冲」）。既然冲由支中所藏发动，

    则合能牵制其力；眉批给出的这条限定，是对「冲必凶」的机械断法的直接否定。

    '
  bound_to:
  - 刑冲合害的权重判断（task-05 / task-11）
  - 大运流年与原局的冲合叠加（task-13）
  tags:
  - counter-example
  - dizhi
  - chong
  - he
  source_ref: ce-B1-02
- id: b-yhr-0003
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 10 章 · 论十二支相穿（眉批）
  quote: '"相穿为害，犯此者损六亲，不作困蹇而论。"'
  failure_mode: '见子未、丑午、寅巳、卯辰、申亥、酉戌六组相穿，即断为「事业受阻、诸事不顺」，

    把专指六亲损耗的机制当成了运途阻滞。

    '
  mechanism: '眉批明确划界：相穿的落点是六亲（父母兄弟夫妻子女）受损，与「困蹇」（事业运途迟滞）

    是两个不同的输出通道。混同之后，六亲断语落空、运途断语又没有依据。

    '
  bound_to:
  - 六亲推断（task-14）
  - 刑冲合害的落点区分（task-11）
  tags:
  - counter-example
  - dizhi
  - chuan
  - liuqin
  source_ref: ce-B1-03
- id: b-yhr-0004
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 14 章 · 论六十花甲子纳音并注解（眉批）
  quote: '"壬子、癸丑桑柘(音同折)木—子属水，丑属金，火方生木，金则伐之，犹桑柘方生，人便以戕伐，故曰桑柘木也。"'
  failure_mode: '把纳音当成「五行名号」记下来（如桑柘木属木），随后按五行通例套用喜忌；

    忽略该纳音在眉批里各有专属的喜忌（如桑柘木「喜水相养，见金无功」）。

    '
  mechanism: '本章每组纳音的眉批都是独立的一条喜忌口径。以桑柘木为例：木方生即遭金伐，故金无功、

    水相养——这与「木喜水润、忌金斫」的通例方向一致，但具体到「无功」与「忌」的区别仍要按本组眉批为准。

    若只记名号，等于把六十组专属喜忌压成五个五行通例。

    '
  bound_to:
  - 纳音取象（第 74 章「子平之法……不用纳音」，须与本章并置看待）
  - 干支字义与取象类断语
  tags:
  - counter-example
  - nayin
  - xiang
  source_ref: ce-B1-04
- id: b-yhr-0005
  domain: D03
  source_id: src-yuanhai-ziping
  location: 第 15 章 · 论天干生旺死绝（眉批）
  quote: '"但逢长生、冠带、临官、帝旺为吉，但逢沐浴、衰、病为不吉也。至於死、绝，如无救助者直为凶矣。"'
  failure_mode: '查十二长生表时只取「长生、临官、帝旺」三处作为得力依据，把沐浴、衰、病、死、绝一律当普通位置跳过，

    不再区分吉、不吉与凶三档。

    '
  mechanism: '眉批把十二宫分成三档：吉（长生、冠带、临官、帝旺）、不吉（沐浴、衰、病）、凶（死、绝，无救助者）。

    胎、养为半吉。跳过档位会让旺衰判断只剩一端，后面的取用与格局随之偏斜。

    '
  bound_to:
  - 日主旺衰判断（task-04）
  - 用神与病药（task-06 / task-07）
  tags:
  - counter-example
  - changsheng
  - wangshuai
  source_ref: ce-B1-05
- id: b-yhr-0006
  domain: D04
  source_id: src-yuanhai-ziping
  location: 第 15 章 · 论天干生旺死绝
  quote: '"子月宫多取癸水，更有何日生，若初一日生至初十日生，当取壬水，十一日生至三十日生方取癸水，以断令神之用事，不可一例而取，则推合不准矣。"'
  failure_mode: '取月令用神时以整月为单位取固定的一个藏干（子月一律取癸），不按出生日在节气内的段次细分，

    导致当令之气取错。

    '
  mechanism: '月令之力按日分段轮值：子月初一至初十壬水当令、十一日起癸水当令。原文直接把「一例而取」

    与「推合不准」等同，说明这不是精度问题，而是口径错误。

    '
  bound_to:
  - 月令司令分日（task-04）
  - 取用神（task-06）
  tags:
  - counter-example
  - yueling
  - shenqi
  source_ref: ce-B1-06
- id: b-yhr-0007
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 16 章 · 天干五阳通变 / 第 17 章 · 天干五阴通变
  quote: '"癸乙丁乙辛 为枭神，偏印，倒食，主克子。"'
  failure_mode: '阴干日主仍按阳干通变表取十神，或以为阴阳两表只是同一张表的重复，

    结果枭神、败财、伤官这些条目在阴干命局里取错位置。

    '
  mechanism: '五阳、五阴各有一张通变表，同一位次上的神名并不对称：阳干表列「劫财败财、剋父及妻」，

    阴干表则把「甲丙戊庚壬」列为「败财逐马」、把「癸乙丁乙辛」列为枭神（主克子）。

    取十神时须先看日干阴阳，再决定读哪一张表。

    '
  bound_to:
  - 十神定位（task-03）
  - 六亲映射（task-14）
  tags:
  - counter-example
  - shishen
  - yinyang
  source_ref: ce-B1-07
- id: b-yhr-0008
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 22 章 · 论起变法
  quote: '"如柱中天干无辛字，地支无亥字，乃只虚邀为是，不必拘泥。"'
  failure_mode: '命局出现丙时，即据「丙辛合」推出辛、据「寅亥合」推出亥，把虚邀所得之干支当作实有，

    据此继续论财官与格局。

    '
  mechanism: '起变法取时上干支的合处（丙寅时→辛亥），但原文限定：柱中本无辛、无亥时，所合只是「虚邀」，

    不行实质作用。把虚邀当实有，等于凭想象往命局里添加干支。

    '
  bound_to:
  - 格局判定（task-05）
  - 十神与财官标注（task-03）
  tags:
  - counter-example
  - tiangan
  - xuyao
  source_ref: ce-B1-08
- id: b-yhr-0009
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 24 章 · 论起王堂天乙贵人
  quote: '"十干临十支皆贵人所临之方，惟辰戌二宫贵人不临，殊不知辰戌乃魁罡恶曜之地，天乙不临，所以不为贵也。"'
  failure_mode: '按贵人歌诀查到贵人所临之支后，直接断为「命带天乙贵人」，不论该支是否落在辰、戌。

    '
  mechanism: '十干贵人表中本就不含辰戌，理由是辰戌为魁罡恶曜之地，天乙不临。这是查表本身自带的排除条件，

    不是附加解释；忽略它会把「不临」读成「临」。

    '
  bound_to:
  - 神煞查表（task-12）
  tags:
