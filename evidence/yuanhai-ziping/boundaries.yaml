  location: 第 260 章 · 刑冲诗诀（page 580）
  quote: '"比肩羊刃日时逢，若问年令父道凶，父母干支相会合，财星健旺寿如松。……克夫那堪妻又伤，堪居道院共僧房，闲身作保防连累，财破妻灾事几场。"'
  failure_mode: '判六亲只按「某十神为某亲」的映射表下结论，

    不检查该亲的宫位是否被比肩羊刃刑冲、是否被会合所救。

    '
  mechanism: '眉批「大抵克妻尽于羊刃，防财上见之。又财官食神死绝，财者，妻也，财死则妻死」——

    克应是「宫位受刑冲 + 财星死绝」的合成判断，不是单点映射。

    '
  bound_to:
