  location: 第 74 章 · 详解定真论
  quote: '"岂得有金在海中，火在炉中之说。世有不肖之说，未遇明师，道听途说，错论古道，迷误後人，焉能中理。"'
  failure_mode: '用纳音名号（海中金、炉中火等）作为论命依据，把「甲子乙丑为金」当作结论直接套用喜忌，

    不回到日干与四柱干支的生克。

    '
  mechanism: '原文先给出纳音的推算过程（以大衍之数除减后按五行相生取用），说明纳音之名是推演所得之

    「喻」，然后明确「子平之法……不用纳音，专以生日天元为主」。把比喻当作结论，等于换了一套坐标。

    '
  bound_to:
