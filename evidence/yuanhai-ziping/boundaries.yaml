  location: 第 291 章 · 元理赋（page 704）
  quote: '"此论日干与岁君相犯祸福。若日犯岁君，以岁为用神者无咎……身旺者凶，弱者无咎。日与运俱犯，方主大凶，五行有救，则减分数，最怕天冲地击。"'
  failure_mode: '见日犯岁君（日干与太岁相冲克）即断大凶；

    原文的条件是：岁为用神则无咎、身旺者凶弱者无咎、日运俱犯方大凶、有救则减分。

    '
  mechanism: '岁运相犯的吉凶由「用神、身强弱、是否俱犯、有无救」四项共同决定。

    '
  bound_to:
