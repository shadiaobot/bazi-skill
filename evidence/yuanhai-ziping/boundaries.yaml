  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 91 章 · 论杂气（眉批）
  quote: '"杂气官星在月宫，天干透露始为丰，财多官星刑冲破，切忌干支压伏重。"'
  failure_mode: '见月支为辰戌丑未即按杂气格取用，不论库中所藏财官印是否透出天干，

    也不看是否被干支压伏。

    '
  mechanism: '杂气一格的核心是「透出」：库中同藏数神，须依四柱中透出之字「随其所出而言其吉凶」

    （正文）。不透则无所取；眉批另加「天干透露始为丰」与「切忌干支压伏重」两道限定。

    '
  bound_to:
  - 墓库与杂气（task-11）
  - 十神定位（task-03）
