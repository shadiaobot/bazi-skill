  location: 第 253 章 · 福德格诗诀（page 565）
  quote: '"阴土逢蛇金与牛，名为福德号貔貅，火来侵克非为美，名利空空一旦休。……阴火相临巳酉丑，生居丑月寿难长，更兼名利多成败，破耗荒淫禄不昌。"'
  failure_mode: '见福德格（己巳、己丑、己酉；丁巳、丁酉、丁丑；癸巳、癸丑、癸酉；辛巳、辛丑、辛酉；乙巳、乙丑、乙酉）

    即断前程；忽略火来侵克、六月（丑月）生、合多等破格条件。

    '
  mechanism: '福德格按日干分五组，每组喜忌不同（眉批逐组列出「忌见丙丁寅戌午」「不爱见合」等），

    不分日干统一断语必然出错。

    '
