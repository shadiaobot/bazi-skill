  location: 第 283 章 · 雕枯旺弱四病说类（page 645）
  quote: '"苟王之不琢，虽曰荆山之美，则为无用之王也；金之不炼，虽曰丽水之良，则为无用之金也。人之八字，大概类此。"'
  failure_mode: '见四柱「纯然无杂」（见官星未曾有伤官、见财星未曾有比劫、见印绶未曾有财星、见食伤未曾有印绶）

    即断为美；原文以此为未琢之玉、未炼之金，判为无用。

    '
  mechanism: '八字「贵有雕」：去留舒配、有制有化才成器；

    全无冲克的结构缺少可用之机，反而无所成就。

    〔引文「王」疑为「玉」之误，见 source/text-issues.md 第 283 章条〕

    '
  bound_to:
