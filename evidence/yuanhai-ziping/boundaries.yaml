  location: 第 55 章 · 论起大运法（眉批）
  quote: '"如正月初一子时生，上四刻仍作上年十二月，夜子时生下四刻方作正月初一子时推正，谓神仙难断夜子时。"'
  failure_mode: '遇到子时出生者，直接按「子时属次日」或「子时属当日」一刀切定日柱，

    不做上四刻／下四刻的分段，也不声明这一处存在不可判定性。

    '
  mechanism: '眉批把子时切成两段：上四刻仍作前一日，下四刻方作次日，并自认「神仙难断夜子时」。

    既然作者本人承认此处难断，输出就应给出并列候选而非单一答案。

    '
  bound_to:
