  quote: '"凡女命，生年生日同一位者克夫，嫁同音同年者庶几。生年生日带六甲者，名曰带甲，主克夫，月共日俱带者亦然。如甲午年生，再遇甲午日，十有九克夫，谓之金神带甲，此例尤紧。"'
