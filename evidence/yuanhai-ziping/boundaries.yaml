  location: 第 257 章 · 天元一气诗诀（page 573）
  quote: '"四重阳水四重寅，离坎交争旺气赢，运至火乡成富贵，往来须忌对提刑。……戊土重逢午字多，天元一字得中和，英豪特达功名好，见子冲来没奈何。"'
  failure_mode: '见四柱干支一气即断位至三公；不核往来对提之刑、见子之冲，

    也不看是否需要火乡/水乡行运才能成富贵。

    '
  mechanism: '眉批列举诸一气命例并注明条件（丁未「忌水」、丙申「行北方南方运好」）——

    一气之局的成败在于行运方向与是否遭遇提刑冲夺。

    '
  bound_to:
