  quote: '"命前一辰为花钗煞，後一辰为桃花煞，本生上见之，全而不偏，是为同犯，主为娼优，得三奇不在此论。天乙住处曰贵人，旺气住处曰喜神，本生上带之而又同宫，是为争窠，主为淫奔之妾，落空亡不在此论。"'
