  quote: '"乃若一阳解冻，三伏生寒，阳刚不中，亢则害也，刚而能柔，吉之道也。……此象亢阳无制，更不包藏阴物，而运又行东南。则阳刚失中，必主於害"'
  failure_mode: '把阳刚有力当作吉；原文判亢阳无制者阳刚失中必主害，

    须「刚而能柔」方为吉道（五阳生于阴月、干支夹合阴柔、运道行阴柔之乡）。

    '
  mechanism: '刚柔互济是成器条件；单边之刚无阴物包藏则无收束，

    与《五行生克赋》「独刚而无柔则不能生变」一致。

    '
