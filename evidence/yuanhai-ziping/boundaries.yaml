- id: b-yhr-0177
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 278 章 · 五行生克赋（page 616）
  quote: '"金沉水岂能克木。……且如甲木喜庚金为煞，若有金，又在申子辰之局，谓之金沉水底，水盛金沉，安能克其木哉？此为遇而不遇之名象也。"'
  failure_mode: '见官杀（如甲喜庚为煞）在柱即断「有煞可用」；不核该煞是否落在申子辰水局中而沉没，

    金沉则不能克木，属「遇而不遇」。

    '
  mechanism: '克神的实际作用取决于其所在的环境：金入水局则沉，名义上的克制不能实现。

    这种结构与「有制则吉」的乐观判断互为反面。

    '
