- id: b-yhr-0018
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 38 章 · 论十干学堂（眉批）
  quote: '"有此者主人聪明、通达、登科及第。犯空亡，教授之职。"'
  failure_mode: '五行命见对应之支即断「聪明及第」；不查该支是否落空亡，把「教授之职」这一降档结论略去。

    '
  mechanism: '眉批给出的是分档结论：学堂成立主聪明登第，犯空亡则降为教书授业之职。

    分档存在，说明空亡是这一格的折扣条件，不是无关变量。

    '
