  location: 第 79 章 · 论偏官即七杀
  quote: '"如有一杀，而制伏二三，复行制伏之运，反不作福。何以言之？盖尽法无民，虽猛如狼，不能制伏矣，是又不可专言制伏。"'
  failure_mode: '见七杀即建议加强制伏（加食伤、行制伏之运），不先数制伏之神的数量；

    一杀而制伏已多时，仍按「制伏越多越好」行事。

