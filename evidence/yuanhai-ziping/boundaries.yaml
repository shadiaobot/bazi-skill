  location: 第 252 章 · 炎上格诗诀（page 563）
  quote: '"夏火炎天焰焰高，局中无水是英豪，运行本地方成器，一举峥嵘夺锦饱。……火多炎上去冲天，玄武无侵富贵全，一路东方行好运，簪缨头顶带腰悬。"'
  failure_mode: '见丙丁火全巳午未即断炎上；不核是否见水（玄武无侵是条件）、

    也不核身旺与怕冲（眉批「忌金水，喜东南要身旺怕冲」）。

    '
  mechanism: '专旺之格的吉断句本身携带条件（「局中无水」「玄武无侵」），

    把条件句读成无条件吉断即出错。

    '
