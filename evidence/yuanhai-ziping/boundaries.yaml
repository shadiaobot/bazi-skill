  location: 第 265 章 · 带疾诗诀（page 589）
  quote: '"戊己生时气不全，伤官时月见留连，必当头面有亏损，脓血之灾苦少年。……日主加临戊己生，支辰火局气熏蒸，冲刑克破当残疾，发秃那堪眼不明。……丙丁火旺疾难防，四柱休囚辰巳方，水火相生来此地，哑中风疾喑中亡。"'
  failure_mode: '把疾病断语直接当作医学结论使用；书中映射（脓血、发秃、眼目、哑风）

    建立在明代病名与死因分布上，与当代疾病结构不具可比性。

    '
  mechanism: '疾病断法由五行—脏腑—症候的固定映射推出，属体系内推演；

    眉批「火气炎上若盛，伤其目」即为该映射的样例，无统计证据。

    '
