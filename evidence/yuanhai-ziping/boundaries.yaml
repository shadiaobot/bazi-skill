  location: 第 87 章 · 论劫财（眉批）
  quote: '"甲见乙为败财，乙见甲为劫财；丙见丁为败财，丁见丙为劫财；戊见己为败财，己见戊为劫财；庚见辛为败财，辛见庚为劫财；壬见癸为败财，癸见壬为劫财。"'
  failure_mode: '把同类相见的比劫一律按「劫财」处理，不区分阳见阴为败财、阴见阳为劫财，

    也不顾原文给出的克应差异（败财主克妻害子，劫财主破耗防小人、不克妻）。

    '
  mechanism: '本章正文先写「五阳见五阴为败财，主克妻害子。五阴见五阳为劫财，主破耗，防小人，不克妻」，

    眉批再逐干列出对照。取哪一名，直接决定六亲断语的落点。

    '
  bound_to:
