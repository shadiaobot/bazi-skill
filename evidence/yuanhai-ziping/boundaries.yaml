  location: 第 74 章 · 详解定真论
  quote: '"以月为兄弟。如火命生酉戌亥子月，言兄弟不得力之断—月为兄弟之宫，为男取比和同类便为兄弟之星。"'
  failure_mode: '按四柱中比肩、劫财的个数推断兄弟多少与助力，

    不把月柱作为兄弟之宫、并按月令所处的长生阶段（死、墓、绝、胎）判断得力与否。

    '
  mechanism: '原文先定「月为兄弟之宫」，再按月令断：酉月火死、戌月火入墓、亥月火绝气、子月火怀胎，

    故火命生此四月主兄弟不得力。眉批补一句限定：五行旺相之方可作兄弟得力或富贵之断。

    数星与看宫是两条不同的依据。

    '
  bound_to:
