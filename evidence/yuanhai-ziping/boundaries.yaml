  location: 第 277 章 · 胎养诗诀（page 613）
  quote: '"胎养须宜细审详，半凶半吉两相当，贵神相会应为福，恶杀重逢见祸殃。"'
  failure_mode: '见胎、养宫位即按吉凶定论；诗中明言「半凶半吉两相当」，

    吉凶取决于会遇的是贵神还是恶杀。

    '
  mechanism: '长生十二宫提供的是强度刻度，不是吉凶符号；符号由会遇之神决定。

    这与「以纳音长生断寿夭」的做法正相反。

