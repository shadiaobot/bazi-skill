  quote: '"紧用字样却远在后，或被别字闲神占先隔了，若无伤犯，须得岁运生扶方为全美。"'
  failure_mode: '判定用神只看是否在四柱出现，不看其位置先后与被闲神隔占；

    隔占之局须待岁运生扶才全美，直接断吉即高估。

    '
  mechanism: '字面有先后之分，用神被闲神占先则其作用被截断，属「位置性损伤」。

