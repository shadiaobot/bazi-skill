  location: 第 284 章 · 损益生长四药说类（page 648）
  quote: '"如木之生於亥，根气犹枯也，未可以木为旺也。如火之生於寅，气焰犹寒，未可以火旺也。又可财官印临於生地，未可以财官印为旺也。"'
  failure_mode: '把长生之地判为旺（或据长生诗诀的吉断语下结论）；

    原文明确「未可以木为旺也」「未可以财官印为旺也」。

    '
  mechanism: '生是气之始，根气犹枯、气焰犹寒，「凡气之不足，故贵济有生之药」——

    长生位仍属需要资助的不及状态。

    '
