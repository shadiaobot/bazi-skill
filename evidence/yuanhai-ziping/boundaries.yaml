  location: 第 74 章 · 详解定真论
  quote: '"世之谈玄命者，皆古法，往往多以年为主，则可知万亿同者矣。"'
  failure_mode: '沿用唐法以年柱为主体（或以年生干支的太岁尊神为断命核心），

    据此得出同年生人命运相同的结论。

    '
  mechanism: '原文的对比对象是李虚中旧法与子平新法：以年为主会导致同年生者结论雷同，

    故子平改为以生日天元为主、配合八字干支与支中所藏人元分辨财官印杀。

    用年为主，等于把体系的核心坐标换回了被取代的那一套。

    '
