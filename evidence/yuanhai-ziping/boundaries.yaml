  - rigui
  - kongwang
  source_ref: ce-B2-27
- id: b-yhr-0080
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 93 章 · 论日德
  quote: '"若有财官加临，别寻他格，方能免非横之祸。若旺气已衰，运至魁罡，其死必矣。"'
  failure_mode: '日柱为甲寅、戊辰、丙辰、庚辰、壬戌即断日德厚福，不看是否有财官加临（此时须另寻他格）；

    也不管行运是否落于魁罡。日德之忌在书中被逐条列明：恶官星、憎财旺、怕空亡、忌魁罡。

    '
  mechanism: '原文把日德写成有条件的格：无破害、无财官加临方成立；一旦财官加临，原格不纯，

    须「别寻他格」才能免祸。行运见魁罡对已衰旺气者是致命的（「其死必矣」），对未发福者尚可（休囚即好）。

    '
  bound_to:
  - 特殊日格（task-10）
  - 大运流年（task-13）
  tags:
  - counter-example
  - ride
  - kuigang
  source_ref: ce-B2-28
- id: b-yhr-0081
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 94 章 · 论日刃
  quote: '"若四柱中一来会合，必主奇祸。……且如戊日刃在午忌行子正财运。壬刃在子，忌行午正财运。庚刃在酉，忌行卯正财运。"'
  failure_mode: '日刃之命（戊午、丙午、壬子）见地支会合仍按合局成格论；行运见对宫正财之运

    （戊日午刃行子运等）仍按「财为养命之源」作吉断。

    '
  mechanism: '日刃与羊刃同法：不喜刑冲破害，亦不喜会合。原文举例逐日列出忌行之运，落点正是冲刃之对宫正财。

    另一层是「大抵羊刃要身旺，喜有物以去之」——刃需有物制去方为福，否则为其所累。

    '
  bound_to:
  - 羊刃与特殊日格（task-10）
  - 大运流年（task-13）
  tags:
  - counter-example
  - riren
  - yangren
  - dayun
  source_ref: ce-B2-29
- id: b-yhr-0082
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 95 章 · 论魁罡（眉批）
  quote: '"运行身旺，发福百端；一见财官，祸患立至。……大凡四柱日多同，贵气斯来在此中，日主独逢冲克重，财官显露祸无穷。"'
  failure_mode: '日柱为壬辰、庚戌、庚辰、戊戌即断魁罡贵格，或在行运见财官时仍作发福论；

    日主孤立而冲克重亦按成格断。

    '
  mechanism: '眉批把魁罡的成立条件写成两端：四柱中日主同类多（贵气在其中），行运身旺则发福；

    反之日主独逢冲克、财官显露则祸无穷。原文对应的表述是「一见财官，祸患立至」。

    '
  bound_to:
  - 特殊日格（task-10）
  - 大运流年（task-13）
  tags:
  - counter-example
  - kuigang
  - caiguan
  source_ref: ce-B2-30
- id: b-yhr-0083
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 96 章 · 论金神（眉批）
  quote: '"甲午时上见金神，杀不相居真贵人，木火运中必发福，如逢金水必伤身。"'
  failure_mode: '时柱为癸酉、己巳、乙丑即断金神贵格，不查是否带羊刃七杀（真贵人的条件），

    也不看行运进入火乡还是水乡。

    '
  mechanism: '金神是「破败之神」，其用法依原文是「要制伏，入火乡为胜」；眉批进一步给出两端：

    带杀者方为真贵人、木火运发福、逢金水伤身。若不给出制伏与行运方向，等于只取了神名。

    '
  bound_to:
  - 特殊日格（task-10）
  - 大运流年（task-13）
  tags:
  - counter-example
  - jinshen
  - dayun
  source_ref: ce-B2-31
- id: b-yhr-0084
  domain: D07
  source_id: src-yuanhai-ziping
  location: 第 97 章 · 论时墓
  quote: '"要刑冲破害以开啓钥，其人必难发于少年。……也怕有物以压之，如丁用辰为官库，别有戊辰之类制之，则辰不能为官矣，如此难作好命。"'
  failure_mode: '见时柱为财官之墓即断库中有财官可发，不查是否有物压制库门（如丁日辰库又见戊辰）；

    也不顾「少年不发库中人」这一时序限定。

    '
  mechanism: '本章给出两个条件：一是须刑冲破害开钥，二是须无物压之。压与被压同见时，

    库「不能为官」，且「必乃有物以破其戊，虽得之发福亦浅」——即使后来破了压制物，福也有限。

    '
  bound_to:
  - 墓库与杂气（task-11）
  - 大运流年（task-13）
  tags:
  - counter-example
  - shimu
  - kaiku
  source_ref: ce-B2-32
- id: b-yhr-0085
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 98 章 · 内十八格-正官格（眉批）
  quote: '"正气官星，切忌刑冲，多则论杀，一位名真。官藏杀浅，露杀非真。今则为破，事恐不成。"'
  failure_mode: '正官格中官星多位仍按正官论，不做「多则论杀」的转换；

    官藏支而杀浅、杀透而官藏这类混合情形亦按正官成格断。

    '
  mechanism: '眉批给出的量化分界是「一位名真」：官星超过一位即性质转为杀，处置方式随之改变

    （杀须制伏）。另有「官藏杀浅、露杀非真」一句，说明透藏方向影响格局真伪。

    '
  bound_to:
  - 格局判定（task-05）
  - 官杀混杂（task-08）
  tags:
  - counter-example
  - zhengguan
  - toucang
  source_ref: ce-B2-33
- id: b-yhr-0086
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 99 章 · 内十八格-杂气财官格
  quote: '"辰、戌、丑、未为四季财官，印绶居杂气，干头透出格为真，用财多为尊贵，杂气自来就不纯，不逢也出始为宗。"'
  failure_mode: '见辰戌丑未之月即取杂气财官格，不看所藏财官印是否透出天干；

    或把杂气格与普通财官格按同一强度处理（原文称杂气「不能纯一，故少力」）。

    '
  mechanism: '原文把成立条件写在「透」字上：干头透出格为真。并另给出两处限定：

    一是杂气本身不纯、力弱，二是身强财旺方能生官禄、行运逢冲刑方如开库取宝。

    '
  bound_to:
  - 墓库与杂气（task-11）
  - 格局判定（task-05）
  tags:
  - counter-example
  - zaqi
  - tougan
  source_ref: ce-B2-34
- id: b-yhr-0087
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 100 章 · 内十八格-月上偏官格（眉批）
  quote: '"亦不要行官乡，岁君亦然，为太过而反成其祸。须要行制伏得地之运方发，与时偏官相似。"'
  failure_mode: '月上偏官之命，年月时再叠见七杀时，仍建议行偏官旺运；

    或把身弱而杀重的命例按「杀旺则贵」下断。

    '
  mechanism: '原文先给通则「要行偏官旺运」，再给例外：若年时上又有偏官，则转为「不要行官乡」，

    因为太过反成祸，须行制伏之运。命例中王镇抚杀神太重、水多火微，行卯运合戌虽名火局，

    实为湿木不生无焰之火，结果于丁卯运中而死。

    '
  bound_to:
  - 格局判定（task-05）
  - 官杀混杂与制伏（task-08）
  tags:
