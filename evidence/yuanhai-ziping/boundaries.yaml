  quote: '"四柱纯阴，生於十月，空绝五行之根，日干又见衰弱，而无强健之气，纵遇和暖之乡，终难发达。四柱纯火，生於夏至之前，火性燥烈，岁运中乍遇水激，不惟不能制，而反致害矣"'
  failure_mode: '对极寒极燥之局按常法救济：见纯阴衰弱即断「行南方和暖运可发」，

    见纯火燥烈即断「得水制则吉」。原文判二者皆不应验。

    '
  mechanism: '过寒者根已空绝，和暖不能复荣；过燥者性已烈，水激反致害

    （「过於寒薄，和暖处终难奋发。过於燥烈，水激处反有凶灾」）。

    '
