  location: 第 276 章 · 胞胎诗诀（page 611）
  quote: '"绝中逢生少人知，却去当生命里推，反本还元直细辨，忽然迍否莫猜疑。……胎神一位难为绝，克陷妻奴家道劣，不惟朝暮走忙忙，羊食狼贪无以别。"'
  failure_mode: '见绝宫即断凶、见胞胎即断吉；诗中要求「反本还元直细辨」，

    并给出胎神一位反致克陷妻奴的反向结论。

    '
