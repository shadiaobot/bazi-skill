  location: 第 292 章 · 明通赋（page 711）
  quote: '"是故得局朝元，非富则贵，犯垣破局，非夭则贫。……犯垣如子贵忌丑未克破，午冲破，卯刑破之类。一子二午破尽一半，得半福。破局如申子辰忌寅午戌冲破之类，大凶，若用星虚成飞天禄马格反贵，余仿此。"'
  failure_mode: '见三合成局或朝元即断富贵，不核犯垣破局的冲刑克破；

    也不核破的倍数（一子二午破尽一半得半福）。

    '
  mechanism: '局与元有专属忌神（子忌丑未午卯、申子辰忌寅午戌），

    破的程度按数量计，且有例外（虚成飞天禄马反贵）。

