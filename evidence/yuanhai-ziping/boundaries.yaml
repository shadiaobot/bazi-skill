  quote: '"《独步》云：辰戌丑未四库之局，寅申巳亥四生之局，子午卯酉四败之局。……或以子午为天地之基柱，卯酉为日月之门户，是指其地而遗其理也。"'
  failure_mode: '用地支的名相（四库、四生、四败、天地基柱、日月门户）直接推吉凶；

    原文明确批评此举为「指其地而遗其理」。

    '
  mechanism: '地支名相只是其位置的比喻，其得失须由所包藏的人元与节气浅深定，

    这正是「支干有不见之形，无中取有」的要求。

