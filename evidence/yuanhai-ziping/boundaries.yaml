    结果制过则杀不成权，反致贫薄灾殃。

    '
  mechanism: '制伏是配平而非消灭：杀被制尽则贵气无从出，须财旺以「苏醒」杀星。

    「制伏无过」是判准，制神多于杀星即是病。

