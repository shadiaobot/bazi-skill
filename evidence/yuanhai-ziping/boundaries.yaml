  source_id: src-yuanhai-ziping
  location: 第 283 章 · 雕枯旺弱四病说类（page 645）
  quote: '"但贵其有根而枯也，不贵其有苗而枯也。苟若官星无根，则官从何出？财星无根，财从何生？是以财官印绶，贵有根而枯之病也。或若无根，而自为之枯焉，则亦非矣。"'
  failure_mode: '见「枯」（官贵有枯，行官旺地即贵）即断富贵；

    原文限定须为「有根而枯」，无根而枯不成立。

    '
  mechanism: '枯是待时而发的状态，其前提是根；无根则待时亦无物可发。

    与 B5「固用不如固本」同理。

    '
  bound_to:
