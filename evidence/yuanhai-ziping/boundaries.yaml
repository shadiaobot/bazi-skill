  location: 第 160 章 · 论大运
  quote: '"出癸入甲，如返汗之人，多主不吉。

    古语云：伤寒换阳，行运换甲，换过是人，换不过是鬼……此乃转角接木。

    东南西北，四方转角谓之接木，格局凶者死，格局善者灾，老人大忌"'
  failure_mode: 交运过渡的年份（换甲、四维转角）被当作最危险的关口：格局凶者主死，格局善者亦有灾，老年尤忌。
  mechanism: 比喻为「接木」——新旧两段之气衔接不畅，根基受撼。
  bound_to:
  - 大运重地支、交运同接木（第 160 章）
