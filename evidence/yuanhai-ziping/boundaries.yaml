  quote: '"大抵水寒不流、木寒不发、土寒不生、火寒不烈、金寒不熔，皆非天地之正气也。……上谓五行生非其时，况人禀之，亦犹是也。"'
  failure_mode: '按各干喜忌表逐条查对而不看全局寒暖：水寒则不能流、木寒则不能发，

