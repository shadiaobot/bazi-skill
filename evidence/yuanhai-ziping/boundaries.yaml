- id: b-yhr-0066
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 84 章 · 论食神
  quote: '"此命三见乙为食，见巳酉丑合金局为印绶，又有三乙化为伤官，癸用乙为食神，被金局来克乙木，再被三乙并卯旺克我官，所以名利都无成也。"'
  failure_mode: '见食神三位齐透即断「食神有气胜财官」，不数其数、不查是否被合局之金来克、也不看是否化为伤官。

    '
  mechanism: '原文此例的机制是三重叠：三乙为食神（多）、巳酉丑合金局（印）来克乙木（食神被伤）、

    三乙并卯化为伤官克官。三条叠加，故名利无成。眉批另有一句通则：「若是反伤来夺食，忙忙辛苦祸千般」。

    '
  bound_to:
