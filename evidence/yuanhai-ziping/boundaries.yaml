- id: b-yhr-0026
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 49 章 · 论四大空亡
  quote: '"如当生命中不犯，行运至水者亦为犯也。"'
  failure_mode: '按句中所缺之行核对原局四柱，原局不见缺行即判「不犯四大空亡」，不继续查大运是否行到该行。

    '
  mechanism: '原文把犯与不犯分作两层：原局见缺行是「正犯」，原局不见而大运行至该行「亦为犯也」。

    只查第一层，等于把时间轴上的触发点漏掉。

    '
  bound_to:
