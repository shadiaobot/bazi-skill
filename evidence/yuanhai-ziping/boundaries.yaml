  location: 第 284 章 · 损益生长四药说类（page 648）
  quote: '"损者。损其有余也。然木生震位，正木气当权也。金産兑宫，正金神之得位。当权者不宜资助，得位者不必生扶。"'
  failure_mode: '见到某五行或某十神当权得位，仍按「生扶为吉」加助（水又滋、土又培），

    形成有余更益之病。

    '
  mechanism: '四药中的「损」针对有余：当权者与得位者不需要资助；

    官星有余则损官，财有余则损财。

    '
