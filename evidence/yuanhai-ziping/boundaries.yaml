  failure_mode: '论妻妾时只看财星有无，不看日支（妻妾之宫）是否落在空、刑、克、害之地。

    '
  mechanism: '原文先把妻妾的坐标定在日支：「以生日支辰为妻妾之宫，无所克之物为吉。若在空刑克害之地，

    则克妻妾，不然重婚再娶，克之轻者，主疾病。」眉批另补三类日柱的具体克应。

    财星与妻宫是两个不同的判据，缺一则结论不完整。

