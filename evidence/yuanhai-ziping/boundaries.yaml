  location: 第 71 章 · 论五行生克制化各有所喜所害例
  quote: '"此乃身弱遇鬼，得物以化之则吉，如甲日被金杀来伤，若时上一位壬癸水或申子辰解之，即能化凶为吉。"'
  failure_mode: '见身弱逢官杀，只想到比劫帮身或印星生身，忽略原文给出的另一条路径：

    以官杀所生之行（如金杀生水、水又生木）作通关，把「克」转成「生」。

    '
  mechanism: '原文在罗列「金衰遇火必见销熔」等五组「以弱遇强必败」的情形之后，紧接着给出化解法：

    身弱遇鬼时得物以化之则吉。眉批点出机制——「官与鬼一也，身旺逢之为官，身弱遇之为鬼」，

    同一克制之力因身之强弱而变名，故名之与制之都不是唯一解。

    '
  bound_to:
  - 官杀与制伏（task-08）
  - 病药配伍（task-07）
  tags:
