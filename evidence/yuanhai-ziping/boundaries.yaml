  location: 第 287 章 · 王井奥诀（page 655）
  quote: '"其用神最忌损犯，兼怕分窃，不宜太过与不及。如太过之物本不好了，或岁运又来生扶，即是倾覆坏了。如木则折、水则倾、土则崩、火则一发而灭、金则折损。"'
  failure_mode: '只看「用神可否得到生扶」，不核其本身是太过还是不及；

    对已太过的用神再加岁运生扶，即倾覆坏灭。

    '
  mechanism: '用神最忌三者：损犯、分窃、太过不及；太过者的解药是损而非益。

    与 S0 已登记的「药多药少」同属配平机制。

    '
  bound_to:
