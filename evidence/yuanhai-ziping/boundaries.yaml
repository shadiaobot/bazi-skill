  quote: '"若用伤官须要静，此是子平万法宗。伤官最怕为官运，伤官尤喜见财星。印绶好杀嫌财旺，羊刃怕冲宜合迎。比肩要逢七杀制。七杀喜见食神刑。有禄怕见官星到。食神最喜偏财临。"'
