  quote: '"苟得五行恬和，又紧要福气聚集於日时上，乃佳。盖日为夫，时为子，一切福神加於日时上，须因夫子而贵。……若日时二位福力不紧，乃常命也。如福聚月胎之上，只是生於富贵之家，终不为夫之福。"'
