  - shensha
  - tianyi
  source_ref: ce-B1-09
- id: b-yhr-0010
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 24 章 · 论起王堂天乙贵人（眉批）
  quote: '"言本乃主天之神而曰天乙，临之方有恶煞相浑，或落空亡之地，不为贵也。"'
  failure_mode: '查到天乙贵人所在之支即作吉断，不再看该支是否同处凶煞或落空亡。

    '
  mechanism: '眉批给出两道失效条件：恶煞相浑、落空亡。贵人是加成项而非决定项，

    所临之地本身不吉时，贵人之力无从发挥。

    '
  bound_to:
