- id: b-yhr-0134
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 229 章 · 魁罡诗诀（page 518）
  quote: '"魁罡四日最为先，叠叠相逢掌大权，庚戌庚辰怕官显，壬戌壬辰畏财连。……柱有刑冲兼破害，一贫彻骨受答鞭。……日主独逢冲克重，财官显露祸无穷。"'
  failure_mode: '见庚辰、庚戌、壬辰、壬戌即断「掌大权」；不核该日是否被官显、财连、

    刑冲破害所伤，也不看是否重叠或独逢冲克。

    '
  mechanism: '魁罡为刚烈之日，其福要求在「日加重者」与身旺无伤的条件下；

    官财显露或刑冲到位立刻转为彻骨之贫。

    '
  bound_to:
  - 特殊日格（task-10）
  tags:
  - counter-example
  - kuigang
  - geju
  source_ref: ce-B5-31
- id: b-yhr-0135
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 230 章 · 时墓诗诀（page 520）
  quote: '"财官藏蓄四时辰，年少相冲可进身，不遇相冲遭压伏，果然不发少年人。……要知何物能开库，刑冲破害是钥匙，露出财官方得用，身衰鬼墓甚危痴。"'
  failure_mode: '把时上辰戌丑未一律判为「财官入库，当贵」，不问是否开钥、

    不问日主是否身衰（身衰则鬼墓危及自身）。

    '
  mechanism: '眉批「术人不知墓库之分别……库者遇冲开取而用之，墓者纵冲开取亦无用焉」——

    墓与库性质不同：库为有气可开之物，墓为绝气无用之物；

    且「官墓不显其荣，财墓不用於此，印墓不得为信」，须冲开才可用。

    '
  bound_to:
  - 墓库、杂气、时墓判断（task-11）
  tags:
  - counter-example
  - shimu
  - muku
  - chong
  source_ref: ce-B5-32
- id: b-yhr-0136
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 231 章 · 杂气财官诗诀（page 522）
  quote: '"杂气财官在月宫，天干透露始为丰，财多官旺宜冲破，切忌干支压伏重。……四季财官月内藏，刑冲克制要相当，太过不及皆成祸，运到财乡是吉祥。"'
  failure_mode: '见杂气格即求刑冲开库，忽略「刑冲克制要相当」——

    压制太过与不足（压伏重、冲制不足）同样是祸；也忽略须天干透露才算成格。

    '
  mechanism: '杂气格的成立有两端：干头透露（格真）与刑冲分量适中（钥匙适度）。

    任一端失当即为祸，而不是「冲开即吉」。

    '
  bound_to:
  - 墓库、杂气、时墓判断（task-11）
  - 取格（task-05）
