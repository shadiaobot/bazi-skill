- id: b-yhr-0092
  domain: D07
  source_id: src-yuanhai-ziping
  location: 第 107 章 · 内十八格-合禄格（眉批）
  quote: '"此格取秋冬生者为妙，李武翼命虽是多庚，却被年干出丙字伤了秀气，行乙巳运不合，流年再见壬戌失职矣。"'
  failure_mode: '见庚申时即按合禄格取引出的官星，不查四柱是否有丙火克庚（伤引合之媒介）、

    巳字刑申（坏引合之支），也不看生月是否当令。

    '
  mechanism: '合禄格的通路是庚合卯中乙木（或申合巳中戊土），故通路上的每个环节都是条件：

    引合之媒介（庚）被克、被引之支（申）被刑，格局即减分。原文另有一层：癸日合禄格

    「生在秋冬富贵人……若生春夏惹灾连」。

    '
  bound_to:
  - 格局判定（task-05）
  - 大运流年（task-13）
  tags:
