  location: 第 90 章 · 论福德秀气
  quote: '"不喜生於八月之中，恐露其杀。……亦不要露杀杂其官，为寿不耐久。"'
  failure_mode: '按日柱属福德秀气即断吉，不查生月是否为该日柱的所忌之月（乙、丁不喜八月，癸不喜四月），

    也不查是否露杀杂官、是否见火伤金局。

    '
  mechanism: '本章对四组日柱逐一给出忌月与忌神：乙巳乙酉乙丑忌八月（露杀）、丁巳丁酉丁丑忌八月（火死酉）

    且忌露杀杂官、己巳己酉己丑忌见火（伤金局）、癸巳癸酉癸丑忌四月（水绝于巳）与火财。

    福德秀气是「专用其日主」的格局，条件按日柱分列，不能通用。

    '
