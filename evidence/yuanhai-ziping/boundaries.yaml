- id: b-yhr-0077
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 91 章 · 论杂气
  quote: '"所言开啓钥者，何物也？乃刑冲破害耳，如四柱中原有刑冲破害，复行此等运气，则刑冲破害多反伤其福。"'
  failure_mode: '见辰戌丑未之库即断「待岁运刑冲开库」，不先核对原局是否已有刑冲破害；

    原局已破而复行刑冲之运时，仍按「逢冲即开」作吉断。

    '
  mechanism: '原文把开库写成先验条件的命题：库中物闭藏，须刑冲破害方开；但若四柱原有刑冲破害，

    再行同类运气则「刑冲破害多反伤其福」。故开库不是单向增益，须先看原局是否已开。

    '
