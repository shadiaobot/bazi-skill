- id: b-yhr-0088
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 101 章 · 内十八格-时上偏财格（眉批）
  quote: '"只要时上一位，不要多。而三处不要再见财，却怕冲，与月上偏官一同。……月偏财是衆人财，最怕干支兄多来。身强财旺皆为福，若归官星足为灾。"'
  failure_mode: '时柱见偏财即断财格，不数财星出现的处所，也不看四柱比劫是否众多、是否冲克时支。

    '
  mechanism: '时上偏财格的成立条件是「只一位」：时上一位，年月日三处不再见财。眉批另给出两条：

    比劫多则分夺（侯知府例中身弱而财分，反得中和）、财归官星则足为灾。

    '
  bound_to:
  - 格局判定（task-05）
  - 财星与比劫（task-06 / task-14）
  tags:
  - counter-example
  - piancai
  - shizhu
