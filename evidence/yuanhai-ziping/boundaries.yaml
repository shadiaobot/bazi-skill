  location: 第 291 章 · 元理赋（page 704）
  quote: '"羊刃格不喜岁运刑冲，小人不可犯，如八字既有羊刃，多煞制伏，行羊刃岁运亦凶，元有财者更重，带伤冲刑战斗，主祸出不测。经云：羊刃冲合岁君，勃然祸至是也。"'
  failure_mode: '认为羊刃既已有煞制伏便无虞；

    原文指出有制者行羊刃岁运亦凶，且原有财者更重。

    '
  mechanism: '羊刃的凶应由岁运触发（刑冲战斗），制伏只解决命局层面；

    与 B5「羊刃冲合岁君，勃然祸至」为同一条。

