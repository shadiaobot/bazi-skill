  location: 第 86 章 · 论伤官
  quote: '"如四柱中虽伤尽官星，身虽旺，若无一点财气，只为贫薄。如遇伤官者，须见其财为妙，是财能生官也。"'
  failure_mode: '按「伤官务要伤尽」执行到极致，只求官星不留一点，忽略原文同时要求的财气一路。

    '
  mechanism: '伤尽官星只是消除了祸源，不构成富贵。原文给出的完整路径是伤官—财—官：

    财能生官，故须见财方可用。缺财则虽伤尽、身旺，「只为贫薄」。

