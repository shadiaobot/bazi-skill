  location: 第 285 章 · 动静说（page 650）
  quote: '"是以天干之动，只能攻得天干之动，不能攻地支之静也，明矣。……但虽不能攻人，而亦有摇动震惊之意，但不能作实祸也。"'
  failure_mode: '用运上天干之克去论八字地支之力（或用地支之克去论天干），

    或把「不能实攻」误读成「完全无影响」。

    '
  mechanism: '透出于上者为动、配藏于下者为静，动攻动、静攻静；

    跨层之间只有「摇动震惊之意」，不作实祸。

