  location: 第 287 章 · 王井奥诀（page 655）
  quote: '"又云：太岁一年之领袖，诸神之主宰，极有用处。只因徐子平“以日为主，专取财官”，误了后人多少错会了义。"'
  failure_mode: '把「以日为主」理解成只看日干、只看财官，忽略年干统摄与「时如权衡，分毫加减」的分工，

    也不看岁君（太岁）的权重。

    '
  mechanism: '原文以称具为喻分工：「年如称钩，绾起其物；月如称紧，提起纲纽；日如衡身，星两不差；

    时如称锤，轻重加减」——四柱各司其职，凡把一处当作全部依据即是「错会了义」。

    '
