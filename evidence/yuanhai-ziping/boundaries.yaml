  location: 第 287 章 · 王井奥诀（page 656）
  quote: '"过于清则或寒或薄，过于厚则或浊或滞，过于华丽则或轻或浮，过于肆逸则或流或荡，过于有情则或滥或淫，过于孤介则独立不能容物，过于刚勇则或暴或燥而无涵养，过于柔懦则或愚或钝而无作为，过于执实则拘局而只知有己，过于轩豁则图谋广而秀不能实。"'
  failure_mode: '把单一取向（清、厚、华丽、有情、刚勇等）的极致当作吉；

    原文为每一项都给出过则生病的反结果。

    '
  mechanism: '体制的判断是「气象规模」的方向性平衡：任一品格推到极端即转为缺陷，

    与病药说中「太过与不及同」同理。

