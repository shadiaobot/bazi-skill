  quote: '"如壬癸生人，四柱是辰戌丑未巳午，天干不露官星与杀，则官杀暗藏於中为多。若四柱原有制伏为好，若无制伏，须行水运与三合木局亦好。"'
  failure_mode: '天干不见官杀即判「无官杀」，不查地支藏干中官杀是否已多；或虽查出多，也不给出除清的办法。

    '
  mechanism: '本章的题目就是官星太过：官杀可以全部藏在支中成势。原文随即给出两条处置路径——

    原局有制伏、或行水运与三合木局（木克土制官）。只看天干，会把过重的官杀读成没有官杀。

