  location: 第 241 章 · 归禄格诗诀（page 542）
  quote: '"归禄逢财名利全，干头不忌透财源，身强无破平生好，大怕行运遇比肩。……日禄归时格最良，怕官嫌杀喜身强，若见比肩分劫禄，刑冲破害更难当。"'
  failure_mode: '见日禄归时即断「青云得路」；不核是否见官星（有官则非此格）、

    是否行比肩分禄之运、是否被刑冲破害。

    '
  mechanism: '眉批「四柱无一点官星，方是此格。若有官星，则非此格……行见官运亦凶」——

    归禄以「无官」为成立条件，且最怕比劫分禄。

    '
  bound_to:
