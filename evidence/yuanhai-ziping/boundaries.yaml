  quote: '"当生本末体用相称，运扶身太过，或困其用神，亦不中也。"'
  failure_mode: '见行运扶助日主即为吉运；

    原文指出本末体用本已相称时，运扶身太过或困用神皆为失中。

    '
  mechanism: '行运的价值是「适扶用神、抑其福气」的配平，而非单向扶身。

    与《病药说》「一味中和」的批评同源。

    '
