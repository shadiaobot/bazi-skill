  - shensha
  - yuede
  source_ref: ce-B1-14
- id: b-yhr-0015
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 34 章 · 论十干禄（眉批）
  quote: '"可得爵禄也，官得势而亨通谓之禄。最喜生旺，最忌休囚，如有禄者必得羊刃以卫之方可言福。"'
  failure_mode: '查到日干之禄（甲禄在寅等）即断为有禄得爵、一生衣食；不看禄所落之支是生旺还是休囚，

    也不看有无羊刃护卫。

    '
  mechanism: '本章正文自问「凡人命带禄，或凶或吉，或贵或贱，何以论之」，随即引《天乙妙旨》

    「禄马贵人无准托」与《源髓歌》「若无吉煞加助时，定知破祖多浮劣」。眉批进一步给出两个必要条件：

    禄须生旺（忌休囚）、须有羊刃卫之，方可言福。

    '
  bound_to:
  - 神煞查表（task-12）
  - 羊刃与特殊日格（task-10）
  tags:
  - counter-example
  - shensha
  - lu
  - yangren
  source_ref: ce-B1-15
