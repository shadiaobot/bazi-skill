  domain: D07
  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  quote: '"行辛酉运，乃见官星则凶。……凡伤官见财格忌见官星，只喜见财，若财格要见。大忌壬水克火，则火不能生甲木之土财也。"'
  failure_mode: '财格行运见到官星仍按「官能生财」「财官相生」作吉断，不区分用财与用官是两条不同的路线。

    '
  mechanism: '原文明确该命「格取戊土为财」，其运喜忌随之确定：忌见官星、只喜见财。

    同段还指出更大的忌是壬水克火（印），火被克则不能生土财。取何者为用，决定忌的宾语。

    '
  bound_to:
