  location: 第 283 章 · 雕枯旺弱四病说类（page 645）
  quote: '"然犹畏弱之无根，所谓根在苗先也。弱而有根，则官星虽弱而可致其旺，财星虽弱而可致其强。"'
  failure_mode: '见某神弱即断「行旺乡可发」；原文要求先有根，

    无根之弱不能靠行运补起来。

    '
  mechanism: '「弱则有旺之基」的前提是有根（根在苗先）；

    这与「枯须有根」「用不如固本」构成同一组条件。

