  location: 第 288 章 · 气象篇（page 674）
  quote: '"故古之论命，研究精微，则由体而该用。分之论命，拘泥格局。遂执假而失真。是必先观气象规模，乃富贵贫贱之纲领。次论用神出处，尽死生穷达之精微。"'
  failure_mode: '先套格局名目再论命（拘泥格局），导致「执假而失真」；

    原文要求先观气象规模，再论用神出处。

    '
  mechanism: '气象是纲领、用神是精微、格局只是命名；次序颠倒则判断被名目绑架。

    这是本块对「格局优先」最直接的方法论批评。

    '
