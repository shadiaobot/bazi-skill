  quote: '"玄武当权妙人神，日干壬癸坐财星，官星若也居门户，无破当为大用人。"'
  failure_mode: '见壬癸日坐财星（玄武当权）即断大用；

    原文该句自带两个前提：官星须居门户、须「无破」。

    眉批另加限定「正是壬寅、壬午、壬戌；癸巳、癸未、癸丑六者」，未核日柱即用格。

    '
  mechanism: '诗诀多为「条件+吉断」的复合句，只读后半句即变成无条件吉断；

    本条与 ce-B5-40c（勾陈得位忌刑冲）为同一模式的两个实例。

    '
