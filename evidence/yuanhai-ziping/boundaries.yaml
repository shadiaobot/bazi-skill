- id: b-yhr-0019
  domain: D04
  source_id: src-yuanhai-ziping
  location: 第 39 章 · 论十干食禄
  quote: '"不食空亡羊刃杀，不食休囚并死绝。食生食旺食贵神，食印食财别优劣。"'
  failure_mode: '见食神即按「食神主福寿」断吉，不查食神所落之地是否为空亡、羊刃、七杀或休囚死绝，

    也不区分食神与印、财同现时的优劣。

    '
  mechanism: '歌诀把食神的取用分成两段：先列四类不可食之地（空亡、羊刃、杀、休囚死绝），

    再列可食之地（生、旺、贵神）。机制在上段——同一位食神落点不同，结论方向不同。

    '
  bound_to:
  - 十神喜忌（task-03 / task-06）
  - 神煞与空亡（task-12）
  tags:
