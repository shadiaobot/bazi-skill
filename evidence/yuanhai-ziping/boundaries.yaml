  location: 第 283 章 · 雕枯旺弱四病说类（page 645）
  quote: '"然或官星太旺者，宜行伤官运以去其官星；财星太旺者，宜行比劫运以去财星；印星太旺者，宜行财星运以破其印星；日干太旺者，宜行官杀运以制其日主。一理如是，百理皆然。"'
  failure_mode: '把「旺」一律当作优势而加以生扶；

    原文对太旺者给出反向处理（去官、去财、破印、制日主），即「贵有旺之病」。

    '
  mechanism: '旺与弱都是病名，须以损/益两条药法对应；

    同一位十神的行运方向在其太旺与不足时相反。

    '
  bound_to:
