- id: b-yhr-0094
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 112 章 · 内十八格-归禄格（眉批）
  quote: '"日禄归时格最良，怕官嫌杀喜身强，若见比肩分劫禄，刑冲破害更难当。"'
  failure_mode: '时支归禄即断归禄格，不查四柱是否见官杀、是否被刑冲破害、是否有比肩劫财分夺禄星。

    '
  mechanism: '归禄的成立限于「禄归时上」这一条件本身：官杀见之则「难归」，比肩劫财见之则分禄，

    刑冲破害则伤禄。眉批把这四类都列为折扣项，唯一的方向性偏好是身强。

    '
  bound_to:
