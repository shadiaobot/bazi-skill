  location: 第 256 章 · 杀重有救诗诀（page 571）
  quote: '"丙临申位逢阳水，月逢戌土反长年，若有吉神来救助，方知安乐寿绵绵。……丙临申位火无焰，阳水逢之命不坚，若得土来相救助，管教福寿得长年。"'
  failure_mode: '见杀重只说「有救则吉」，不落实救神（土）是否真在四柱；

    已见阳水克火而仍行壬运。

    '
  mechanism: '眉批「忌行壬运，行壬运必死。若以戊土克壬水，水不能克火，以土救之」——

    救神必须是可指认的干支，否则该结构就是命不坚。

    '
