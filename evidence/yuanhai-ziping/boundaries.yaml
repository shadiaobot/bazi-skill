- id: b-yhr-0024
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 47 章 · 论六甲空亡（眉批）
  quote: '"空亡对宫孤虚，火空则发，水空则脱，金空则响，木空则折，土空则陷。"'
  failure_mode: '把空亡当作单一结论（力量减弱、吉神落空即不吉），不按五行分开看。

    金、火逢空有发声发动之象，木、土逢空才是折陷，水逢空在本书两处又有相反说法。

    '
  mechanism: '眉批按五行各给一名象，说明空亡的后果随所空之行的不同而不同。

    本条与第 142 章「金空则鸣、火空则发、水空则流……木空则朽、土空则崩」并存，

    水、金两处口径需并列标注，不可擅自择一。

    '
  bound_to:
  - 神煞查表（task-12）
  - 用神与病药（task-06 / task-07）
  tags:
  - counter-example
  - kongwang
