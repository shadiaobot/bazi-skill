  quote: '"凡脆虚浮嫩之气，休废败绝之乡，得支干夹扶，暂合而发于一时。倘遇岁运将赞助之神伤坏或抑扬，其无气则易败而不长久。"'
  failure_mode: '见「得支干夹扶、暂时发越」即断富贵长久；

    原文指出脆虚浮嫩之气所发者易败，须看赞助之神是否被岁运伤坏。

    '
  mechanism: '发的持久性取决于气的质地（是否脆虚、是否在休废之乡）与赞助之神的稳定，

    与是否显露无关：「故不在露，其干支中隐藏有气得生，反远大也」。

    '
