- id: b-yhr-0014
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 28 章 · 论月德贵人
  quote: '"其法从寅起，丙甲壬庚，逐月顺数，周而复始，亦须在日上见之，更有福神助为吉。"'
  failure_mode: '按生月查得月德天干后，只要四柱任意一处出现该干就作月德贵人；

    或虽日上见之，却不顾是否另有福神相助。

    '
  mechanism: '原文为月德设了两个条件：一是须在日上见，二是更有福神助方为吉。

    只见到干支即下「一生逢凶化吉」的结论，是把两个条件都略去。

    '
  bound_to:
  - 神煞查表（task-12）
  tags:
