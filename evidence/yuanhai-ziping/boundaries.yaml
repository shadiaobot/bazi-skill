  quote: '"浊者，混也。乃五行失位，水土互伤，其身太旺，正夫不显，偏夫外杂，柱多分别，无财官印食，为下贱低浊或娼妓婢妾、淫巧之人。……娼者，妓也。乃身旺夫绝，官衰食盛，食柱中不见官煞，或有而伤官伤尽，或官煞混杂而食神盛旺，此必娼妓之命"'
  failure_mode: '把八格中的浊、滥、娼、淫四格用作人格与身份判断；

    这四格的定义本身以「夫星不显/偏夫外杂/食盛夫绝」为技术条件，但结论是道德与身份标签。

    '
  mechanism: '技术上可核的是结构条件（夫星显隐、官煞多寡、食神盛衰），

    不可核的是由此推出的「娼妓婢妾」身份——属时代伦理评价。

    '
