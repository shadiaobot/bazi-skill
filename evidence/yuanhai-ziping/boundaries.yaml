  location: 第 280 章 · 论八字撮要法
  quote: '"若有七杀须要制，制伏太过反为凶"'
  failure_mode: 见到七杀就一味制伏，制之过度则把可用的力量制死，格局反成凶。
  mechanism: 七杀在身旺时是权，制尽则失去可依托的结构；与病药说「药多药少」同源。
  bound_to:
  - 病重得药与病轻药重的层次判法（第 282 章）
