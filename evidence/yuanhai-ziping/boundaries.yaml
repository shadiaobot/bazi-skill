- id: b-yhr-0020
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 41 章 · 论拱禄（眉批）
  quote: '"戊丙禄在巳，辰午虚拱巳禄，忌见填实，只要虚为贵。"'
  failure_mode: '见戊辰与丙午（或丁巳与己未）两柱即断拱禄成格，不看柱中是否另有巳字把虚拱填实。

    '
  mechanism: '拱禄的成立前提是「虚拱」：辰午之间空出巳位，靠两柱夹拱取禄。原文限定

    「前後相拱，只此四位，其余不是」，眉批再加一句「忌见填实」。填实之后拱所依凭的虚位不存在，

    格局随之破。

    '
  bound_to:
  - 格局判定（task-05）
  - 禄与神煞（task-12）
  tags:
  - counter-example
