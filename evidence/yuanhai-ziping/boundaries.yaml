  quote: '"又有生而不生，旺而不旺，此为凶，乃先吉也。有死而不死，绝而不绝，此为吉，乃先凶也。如水见戊申土，此生而不生，见庚子土，此旺而不旺，遇此多成而反败，因喜而反忧。"'
  failure_mode: '按生旺死绝的名称定吉凶；原文给出四个反例（生而不生、旺而不旺、死而不死、绝而不绝），

