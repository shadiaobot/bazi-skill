  location: 第 287 章 · 王井奥诀（page 655）
  quote: '"有气乃当时也，看八字内外明暗干支。……有情乃合气也，如甲见己、丙见辛、丁见壬之类，中间干支明暗有合，皆取此为最切也。"'
  failure_mode: '把当时（有气）与相合（有情）混为一谈：前者是得令，后者是合气，

    两者的取用与速度不同，混用会误判吉凶的缓急。

    '
  mechanism: '原文并列两种「切」：有气者急（当时为至急），有情者切（合气为最切）。

    两者不看则取用失据。

    '
  bound_to:
