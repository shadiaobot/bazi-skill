  location: 第 218 章 · 偏官诗诀（page 495）
  quote: '"杀神元有制神伤，制伏身强福禄昌，如见制伏先有损，反将富贵变灾殃。……偏官制伏太过时，贫儒生此更何疑，岁时若遇财旺地，杀星苏醒发权威。"'
