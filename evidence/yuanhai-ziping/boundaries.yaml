  location: 第 196 章 · 掣要捷驰玄妙诀
  quote: '"官杀混杂，身弱则贫；官杀两停，合杀而贵。"'
  failure_mode: 见官杀混杂就想「制伏」，但制不动时仍按贵命论。
  mechanism: 混杂之克神力量分散又叠加，弱身无从承受；只有合去其中一者才恢复纯一。
  bound_to:
