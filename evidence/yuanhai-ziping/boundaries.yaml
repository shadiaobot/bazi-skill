  source_id: src-yuanhai-ziping
  location: 第 85 章 · 论倒食
  quote: '"夫倒食者，冲财神之谓也，一名吞陷杀。用财神大忌见之，用食神亦忌见之。"'
  failure_mode: '命中以财或食神为用，行运或原局见枭神（倒食）仍按「印绶生身」作吉断，不辨倒食专冲财神。

    '
  mechanism: '原文把倒食定义为冲财神之神：甲见壬，壬克丙，丙不能生土财，食神之力即断。

    故以财为用或以食神为用时，见之皆为忌。此层关系在「印为生我之母」的通例里看不出来。

    '
  bound_to:
