- id: b-yhr-0030
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 53 章 · 论天罗地网（眉批）
  quote: '"戌亥为天罗，辰巳为地网。惟水火土命忌，金木命不犯。男忌天罗，女忌地网。"'
  failure_mode: '见戌亥即断天罗、见辰巳即断地网，不论命主五行（金木命本不犯）与性别（男忌天罗、女忌地网），

    也不看是否并见恶杀。

    '
  mechanism: '本章自己先给了两套取法（一说辰为天罗、戌为地网；一问「何以见戌与亥为天罗，辰与巳为地网」），

    眉批随后限定适用范围：水火土命才忌，金木不犯；男忌天罗、女忌地网。范围之外的命局不应套用此断。

    '
  bound_to:
