- id: b-yhr-0013
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 27 章 · 论三奇贵人
  quote: '"既有日月星，地支须得戌亥为天门，方得为奇。若无戌亥，须有日月星而无天门，则不为奇矣。"'
  failure_mode: '见甲戊庚三干即断天上三奇，不看地支是否有戌亥；见乙丙丁即断地下三奇，不看是否有乙木为核心。

    '
  mechanism: '三奇是「三干 + 地支条件」的合成格：天上三奇须得戌亥天门，且地支再见丑卯酉巳即失效

    （「则三光失明，奇不得时也」）；地下三奇须以乙木为主，「若无则不吉」。

    '
  bound_to:
  - 神煞查表（task-12）
  - 格局判定（task-05）
  tags:
