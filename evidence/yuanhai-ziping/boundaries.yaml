  quote: '"江湖死水安能克，惟怕成林木作殃。"'
  failure_mode: '按「水克火」把水当作丙火的主要忌神，同时把木（印）当作生扶救应；

    实际书中判断恰好相反：水不能克丙，木盛才是真正的忌。

    '
  mechanism: '丙为太阳，江湖之水不能灭其光；眉批「须忌木盛则蔽之」——木为蔽日之物，

    林木成片则光被遮。生扶（印）在此处成为病源，不是药。

    '
  bound_to:
  - 印绶格与生扶类判断（task-06）
  - 日主喜忌表（task-04）
