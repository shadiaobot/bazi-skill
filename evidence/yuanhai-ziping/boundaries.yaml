  quote: '"凡观男命，先观日主之盛衰，次察财官之强弱。日主旺，财官得地，一生福禄优游。日干衰，财官败绝，一世贫穷到老。日主旺而财官衰，遇财官发福。财官旺而日主弱，运行身旺驰名。"'
