  source_id: src-yuanhai-ziping
  location: 第 82 章 · 论正财
  quote: '"此命丙日见三申为财，岂不美哉。……盖嫌日弱，火病申死酉，乃为无气，运行酉方金乡，身弱太甚，财旺生鬼，败克其身，故不能胜其财，所以贫也。"'
  failure_mode: '见财星当令、财局成，即断财旺致富；不核日主在月令的旺衰，也不看行运是否加重身弱。

    '
  mechanism: '原文以两命对举：丁日身坐财地而身有根（丁得木库居未、巳酉丑金局），能任其财，宜乎巨富；

    丙日三申财旺而日主火病申、死酉，身弱太甚，财旺生鬼，因而致贫。同是财旺，日主强弱决定方向。

    '
  bound_to:
  - 旺衰与财（task-04 / task-06）
  - 综合层次（task-17）
  tags:
