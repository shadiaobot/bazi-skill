  location: 第 274 章 · 衰病死诗诀（page 607）
  quote: '"纳音衰病死重逢，成败之中见吉凶，若得吉神来救助，变灾为福始亨通。……衰病两逢兼值死，世人至老无妻子，不惟衣食不丰隆，灾病绵绵终损己。"'
  failure_mode: '以长生十二宫（尤其纳音长生）单点定吉凶：见长生、冠带、临官、帝旺即吉，

    见沐浴、衰、病、死即凶，不问有无吉神救助与恶杀重逢。

    '
  mechanism: '眉批「五行以此比人之至六七十，由老衰弱而又死命中遇此，主人孤苦之断」——

    宫位只是比喻刻度，吉凶尚须视会遇之神而定。

    '
