- id: b-yhr-0089
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 102 章 · 内十八格-时上一位贵格
  quote: '"夫一位贵者，推只时上只见一位方为贵，或年月日又有，反为辛苦劳役之人也。"'
  failure_mode: '时柱见七杀即断时上一位贵格，不数年月日是否另有杀星；或在多处见杀时仍按贵格论。

    '
  mechanism: '本格的名字即条件：只有「一位」方可为贵。原文把重复出现的后果写成「反为辛苦劳役之人」，

    并另给出命局自身的条件（本身自旺，如甲乙日生于正二月）。眉批的诗诀同样以「切忌身弱并刑害」

    作出限定。

    '
  bound_to:
