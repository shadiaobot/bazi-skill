  location: 第 74 章 · 详解定真论
  quote: '"假如一命，乙酉年、壬午月、壬午日、癸卯时。壬癸以丙丁为财，午月自恃财旺之，丁逢火禄之乡，壬癸胎元绝之地，为身弱不能任重财。见壬癸为比肩分财，故因妻以致祸，卒死牢狱之中。"'
  failure_mode: '见财星当令、财多，即断为富贵；不先核对日主能否任财，

    也不看比肩分财时的实际走向。

    '
  mechanism: '原文以对举的两例给出判据：己未年戊辰月甲寅日癸酉时，财旺身强，「财多官旺，则多称意」；

    乙酉年壬午月壬午日癸卯时，壬癸胎元绝地、身弱不能任重财，又有壬癸比肩分财，

    结果是「因妻以致祸，卒死牢狱之中」。同是财旺，身之强弱决定方向。

    '
