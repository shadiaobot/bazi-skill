  location: 第 285 章 · 动静说（page 650）
  quote: '"盖其库中，锁钥甚牢，真要戍字运来冲开之，就如有了锁匙，开了其锁，而放出戊土乙木癸水出来。如丑字就要未字冲，别物不能攻之。故曰杂气财官喜见冲，正此意也。"'
  failure_mode: '见库即断「喜见冲」，不问是哪一个字来冲；

    原文限定：辰须戌冲、丑须未冲，别物不能攻（如寅中甲木不能破辰中之戊）。

    '
  mechanism: '库为「锁钥甚牢」的封藏结构，只有对宫之冲才构成开钥；

    非对宫的刑克只能摇动而不能开启。

    〔引文「戍」为「戌」的刊本混用字，保留原字〕

