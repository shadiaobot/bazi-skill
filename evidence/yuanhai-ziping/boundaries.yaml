  location: 第 104 章 · 内十八格-倒冲格（眉批）
  quote: '"此格要四柱中全无官星合，是用合时中官来取贵，若实见之不入此格。"'
  failure_mode: '按倒冲格取冲出的官星，却不知四柱若已实见官星即不入此格；

    也不查冲神是否被合字绊住（丙日用午冲子，见未字则午不能去冲）。

    '
  mechanism: '眉批把成立条件写成排除式：须四柱全无官星，实见之即不入此格。原文另给出绊神：

    丙日见未则午不能冲子，丁日见辰则巳不能冲亥，并说明「大忌癸字并子字，则减分数，岁君大运亦然」。

    '
  bound_to:
  - 格局判定（task-05）
  - 大运流年（task-13）
  tags:
