  location: 第 82 章 · 论正财
  quote: '"如果格成从财，却喜身愈弱，财极强之运，助身反为不美。"'
  failure_mode: '把「财多身弱须帮身」的通则套到已入从财格的命局上，行印比扶身之运，或建议增强日主。

    '
  mechanism: '从财格的前提是舍身从财：日主已成顺从之势，此时再帮身即为反本，破坏格局。

    本条与「日主有根不可弃」互为边界——先判是否真从，再从则不可助身。

    '
  bound_to:
