    与第 54、88 章「五阳有刃，五阴无刃」的口径并存，须标出处使用。

    '
  mechanism: '吉断句的前提（合起财马旺）是该断的成立条件；

    而「何者为刃」在本书内部存在两说（见 PIPELINE_STATE 已登记的第 5 条冲突）。

