- id: b-yhr-0040
  domain: D08
  source_id: src-yuanhai-ziping
  location: 第 70 章 · 论官杀混杂要制伏
  quote: '"官星要纯不要杂。假如甲木用辛金为官，若年是辛，月是酉，时上亦是辛官，虽多但无妨，盖纯一尽好。"'
  failure_mode: '凡见官星重复出现（年辛、月酉、时辛）即判为「官多身弱、混杂须制」，

    不区分重复的是同一性质的正官，还是掺入了七杀。

    '
  mechanism: '原文把「多」与「杂」分开：同为辛金官星重复出现，性质统一，属「纯一尽好」；

    只有掺入庚金（或申中庚）这类七杀，才构成混杂并须行火乡制伏。

    把多当杂会给出方向相反的行运建议（制伏 vs 不需制）。

    '
  bound_to:
