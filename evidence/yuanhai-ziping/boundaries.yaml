  location: 第 282 章 · 病药说（page 643）
  quote: '"假如人八字中，四柱纯土，水日干则为杀重身轻；如金日干，则为土厚埋金；火日干，则为晦火无光；木日干，则为财多身弱；土日干，则为比肩太重。是则土为诸格之病，俱喜木为医药，以去其病也。"'
  failure_mode: '把「病」当成固定字（见土即断土为病、见某神即断某神为病），

    不看该字相对日干处于何种十神位置。

    '
  mechanism: '同一个土在五个日干下分别成杀、成印（埋金）、成晦火、成财、成比肩，

    病名与后果随之不同；故「病」必须相对日干命名，不能绝对认定。

    '
