  location: 第 282 章 · 病药说（page 643）
  quote: '"若病重而得药，大富大贵之人也。病轻而得药，略富略贵之入也。无病而无药，不富不贵之人也。"'
  failure_mode: '以「四柱无损伤、日干得中和」判为吉命；

    原文的对应结论是「此是平常人也」——无病无药不富不贵。

    '
  mechanism: '贵贱来自病药的张力（有病方为贵，无伤不是奇）；

    均衡本身不产生层次，这也是「中和」被病药说修正的原因。

    '
