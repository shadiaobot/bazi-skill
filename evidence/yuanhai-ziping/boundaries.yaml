  failure_mode: '把禄马、贵人、食神、印绶等吉神叠加当作加分；原文判三四件泛滥即「不归一」，

    贵气多反而分散。

    '
  mechanism: '贵气的效力来自专一（用一件则精神严切），烦杂则精神分散；

    与「用神一字…苗不秀，秀不实」同属「专则成、杂则败」机制。

