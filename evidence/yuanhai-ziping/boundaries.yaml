  location: 第 215 章 · 十干体象（page 487）
  quote: '"乙木根荄种得深，只宜阳地不宜阴。漂浮最怕多逢水，刻斫何须苦用金。南去火炎灾不浅，西行土重祸犹侵。"'
  failure_mode: '把「木」视为一类，用甲木的喜忌套乙木：误以为乙木同样喜火泄秀、喜水生扶；

    结果是水多、火炎、金斫、土重四种情形都判反。

    '
  mechanism: '眉批称乙木「宜阳地不宜阴」。乙木为连根柔弱之木，漂（水多）、斫（金多）、炎（火多）、

    埋（土重）皆为伤；其喜忌表与甲木不对称，须逐干查体象歌，不可按五行类归。

    '
  bound_to:
  - 十干体象查表（task-04）
  - 日主喜忌与用神取舍（task-06）
  tags:
  - counter-example
  - wuxing
  - yi-mu
  - body-image
