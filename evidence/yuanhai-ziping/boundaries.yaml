  location: 第 282 章 · 病药说（page 643）
  quote: '"宜将以上各火做一处看，或为病，或非病。又或地支虽又有别物，且不必看，若再看别物，则混杂不明，故曰：从重者论。此理是看命下手法处。"'
  failure_mode: '把四柱每个字平铺并列地逐一论断；原文判此举为「混杂不明」，

    要求先把同类之气合看、确定何者为重，再往下推。

    '
  mechanism: '看命的起手是先聚类（如所有火字做一处看）再定病与非病；

    从重者论提供优先序，避免多变量互相抵消。

    '
  bound_to:
