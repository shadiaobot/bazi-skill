  source_id: src-yuanhai-ziping
  location: 第 233 章 · 时上一位贵诗诀（page 526）
  quote: '"元无制伏运须见，不怕刑冲多杀攒，若是身衰惟杀旺，定知此命是贫寒。"'
  failure_mode: '时上偏官按「制伏为权」断贵，不论日主强弱；身衰而杀旺者仍按贵断。

    '
  mechanism: '眉批引「杀重身轻，终身有损，一见制伏却为贵」——同一结构在身强与身弱下符号相反；

    原犯鬼轻者反不宜再制。

    '
  bound_to:
  - 七杀格（task-08）
  tags:
