  location: 第 103 章 · 内十八格-飞天禄马格
  quote: '"庚日以子冲午中丁火为官星，若四柱中有丁字并午字，则减分数，岁君亦忌。"'
  failure_mode: '见子多即按飞天禄马取冲出的官星，不查四柱是否另有官星本体（丁字并午字）把冲取之路堵住；

    也不把岁君与大运的同类情形计入。

    '
  mechanism: '本格取的是「冲出来的虚官」，故本体一见即减分数。原文给的命例正是反面：

    「壬子 壬子 壬子 丙午」，「又不合见午时重官星，就又贫极，为乞丐之命也」。

    '
  bound_to:
