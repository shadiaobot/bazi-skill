  location: 第 283 章 · 雕枯旺弱四病说类（page 645）
  quote: '"若木不木而金不金，旺不旺而弱不弱，则五行之质有亏矣。何以考人祸福也哉？……若其旺弱之相参，斯其下矣。"'
  failure_mode: '在旺衰模糊之局（既不算旺也不算弱、五行之质不纯）仍照常下断语；

    原文判此类为「下矣」，即无从考祸福。

    '
  mechanism: '旺衰是判断的前提量，量不清则后续取用、病药全部失去基准。

    '
  bound_to:
