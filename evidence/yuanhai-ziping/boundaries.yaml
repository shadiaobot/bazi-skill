- id: b-yhr-0033
  domain: D01
  source_id: src-yuanhai-ziping
  location: 第 56 章 · 论行小运法（眉批）
  quote: '"小运之法，男从丙寅方，取三阳之义，女从壬申，乃从三阴之喜。一年一岁，男顺女逆数，尽物甲从头又数。"'
  failure_mode: '把小运按大运的顺逆规则（阳男阴女顺行）来排，或男女同一起点、同一方向；

    也有把胎元、小运与纳音一起套用者——本章与小运并列，第 74 章却称「子平之法，不用胎元小运」。

    '
  mechanism: '小运的起法与大运无关：不论阴阳，男一岁起丙寅顺行，女一岁起壬申逆行，一年一岁。

    眉批给出的是取象理由（男取三阳、女取三阴），不是阴阳年干推顺逆。

    '
  bound_to:
  - 起运（task-02）
  - 冲突登记（第 74 章 与第 20、21、56 章并存的胎元小运纳音问题）
  tags:
