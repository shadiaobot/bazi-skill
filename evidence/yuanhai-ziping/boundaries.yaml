    不知甲木成器靠金（栋梁金得用），火多则焚身为灰炭。

    '
  mechanism: '眉批作「甲木之肖枝，别刚柔刚，忌生扶，炭火为自焚之象」——甲为阳木，其成器路径是庚金斧斫，

    而非火泄。火为「自焚」，故甲木的忌神与「木生火为秀」的常法相反。

    '
  bound_to:
