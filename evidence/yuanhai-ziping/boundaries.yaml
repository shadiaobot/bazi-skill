  - yongshen
  - yueling
  source_ref: ce-B1-35
- id: b-yhr-0036
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 65 章 · 论日为主
  quote: '"倘有妄立格局，从列其名而无实用，其飞天禄马、倒冲、井栏叉即伤官。"'
  failure_mode: '把飞天禄马、倒冲、井栏叉等名目另立为与十神体系并列的独立格局，按名目记忆成格条件，

    不再追问它们与十神的关系。

    '
  mechanism: '本章把贵贱寿夭全部归入五类十神（官杀、财、印、食伤、比劫），并指出这些奇格名目

    「即伤官」——是伤官的变体，不是第六类关系。按名目立格会失去与其他能力共用的判断坐标系。

    '
  bound_to:
