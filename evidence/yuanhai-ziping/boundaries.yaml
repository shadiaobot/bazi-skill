  location: 第 270 章 · 沐浴诗诀（page 599）
  quote: '"沐浴凶神切忌之，多成多败少人知，男人值此应孤独，女命逢之定别离。……咸池无禄号桃花，酒色多因败坏家，更被凶神来克破，疾赢病死莫咨嗟。"'
  failure_mode: '以长生十二宫中的沐浴位（并牵连桃花/咸池）直接断人品与家声；

    书中自己给出反例句「沐浴那堪吉位逢……读书必定登科甲，莫比诸神例作凶」，

    说明单宫位不可作独立断语。

    '
  mechanism: '眉批「沐浴，五行强以见弱之地……沐浴又为桃花杀同看，子午卯酉全之局也主淫乱」——

    此处把宫位与神煞叠加，容易产生道德化结论，须与吉神会遇条件合看。

    '
