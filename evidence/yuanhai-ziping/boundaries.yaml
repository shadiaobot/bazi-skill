- id: b-yhr-0021
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 43 章 · 论暗禄（眉批）
  quote: '"此四柱无禄，却为贵命，乃是暗藏禄马，人不能见之，为大贵。"'
  failure_mode: '查遍四柱不见日干之禄，即按「无禄」断为平常或贫薄；

    不看有无与禄相合之支（暗禄）、或夹禄之两支（夹禄）在暗中承禄。

    '
  mechanism: '禄可以通过六合被引入命局：甲禄在寅，寅与亥合，故甲见亥为暗禄；

    乙禄在卯，卯与戌合，故乙见戌为暗禄。眉批据此把「四柱无禄」与「贵命」直接并置，

    说明无禄不等于无贵。

    '
  bound_to:
  - 神煞查表（task-12）
  - 格局判定（task-05）
