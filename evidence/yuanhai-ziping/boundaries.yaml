  location: 第 89 章 · 论刑合
  quote: '"刑合者，刑中带有合者是也。如人命犯之，多因酒色丧家成病，至於耽迷不醒，乃神迷之也。"'
  failure_mode: '见刑合结构即按「刑中带合、暗取官贵」作吉断，不区分原文所分的两层：

    合禄合格取的是「见不见之形」（隐藏而取），刑合明摆于命中者主凶。

    '
  mechanism: '原文以合禄合格作对照：癸用戊官、戊禄在巳，不见巳字而见寅刑与巳酉丑合，是「见不见之形，所以贵也」；

    而「如此者，皆见於前，所以凶也」——同一组机制显隐不同，结论相反。命例中两造皆因酒色丧家致病乃至亡身。

    '
  bound_to:
