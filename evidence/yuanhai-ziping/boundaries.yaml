  quote: '"凡遇绝处，不可便指为凶，盖凶处亦有吉神相扶。……凡人命衰弱或刑伤破害，不能成用者，必欲吉神扶佐，成我之福，又观相我之神势力轻重何如，若无根失令或自受伤，先用求助相吉之神何如。"'
  failure_mode: '（1）见绝处即判凶；（2）只说「有吉神相救」而不核救助之神自身是否有根得令。

    原文举甲日夏生得壬癸亥子相我，但水先受火土耗克，故「不能为我之福」，

    须求金转生水——救神本身也要被救。

    '
  mechanism: '救应的有效性是二阶判断：先核救神的力量，再核救神的来源。

    '
