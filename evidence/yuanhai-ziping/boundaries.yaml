  location: 第 262 章 · 克子诗诀（page 583）
  quote: '"五行四柱有伤官，子息初年必不安……印绶重叠克子断，子息难养谁为伴……时逢七杀本无儿，此理人当仔细推，干上食神支又合，须知有子贵而奇。"'
  failure_mode: '以「时柱有无官杀」单一条件断子息；不核伤官、印重、纯阳偏印、

    日主衰旺等书中列出的多重条件，也不区分男女取子之法。

    '
  mechanism: '眉批「时干支有官杀又生旺必有子。印绶重则母多，母多则灭子……女人以官为夫，以食为子，

    伤官则伤夫，有伤必主害至」——子息的推断是条件叠加，且男女取象不同。

    '
