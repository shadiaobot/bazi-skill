  location: 第 291 章 · 元理赋（page 697）
  quote: '"金赖土生，土多金埋。土赖火生，火多土焦。火赖木生，木多火炽。木赖水生，水多水漂。水赖金生，金多水浊。"'
  failure_mode: '把「生」当作单向增益：见印多即断身旺得助、见财多即断富；

    原文在本赋开篇即列出生者反为害的五组结果。

    '
  mechanism: '生克各有太过不及之害，「以上言太过不及，各有其害如此，见五行四柱不可不中和也」——

    同一组生克关系在过量时符号反转。

    〔引文「水多水漂」「水能生水」两处疑为「水多木漂」「水能生木」之误，「士重木折」疑为「土重木折」，见本块文本问题〕

    '
  bound_to:
