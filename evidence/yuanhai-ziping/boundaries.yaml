  quote: '"岁与日辰力虚薄不专，被吉凶神煞播弄，随气动荡，精神被其所役，自家主张无定，多是凶煞……建业立事，虽有偶成，岂不害物损人也哉。"'
  failure_mode: '对身局薄弱之命只按神煞吉断；原文指出薄局会被吉凶神煞来回播弄，

    主张无定，偶成之事亦伴损害。

    '
  mechanism: '神煞的效力取决于命局的承载能力：「大器镃基」者遇恶煞反能助威，

    薄才体局者则被恶煞役使——同一个神煞依局之厚薄得相反结果。

    '
