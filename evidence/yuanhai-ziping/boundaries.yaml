  location: 第 250 章 · 稼穑诗诀（page 559）
  quote: '"戊己生居四季中，辰戌丑未要全逢，喜逢财地嫌官杀，运到东方定有凶。……财星待遇堪为福，官杀如临有祸缠。"'
  failure_mode: '见戊己土全辰戌丑未即断稼穑之贵；不核官杀是否临局、

