  quote: '"脱此辈忌见此辈，化斯神喜见斯神。……假如甲己化土，脱木气而从妻家，若见甲乙寅卯未亥，皆我比肩，则有原旺之借，岂无恋哉，况比刃又能争合我财，使甲己不能相成，反有离间之恨也。……大怕空亡见煞，比肩争妒，不成名卿巨公，则为孤儿异姓矣。"'
  failure_mode: '从化成象之局再逢原气（比肩）即在所忌，仍按成格断；

    原文判比肩争合使我财被夺、化象不成，「反有离间之恨」。

    '
  mechanism: '「脱此辈忌见此辈」：从化以脱离本气为条件，

    本气复见即形成回头之恋，与从格「最忌日主得根比肩」同源。

