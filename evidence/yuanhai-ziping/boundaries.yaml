  - shangguan
  - qisha
  source_ref: ce-B5-17
- id: b-yhr-0121
  domain: D04
  source_id: src-yuanhai-ziping
  location: 第 219 章 · 印绶诗诀（page 496）
  quote: '"印绶干支喜自然，功名富豪禄高迁，若逢财运来伤印，退职休官免祸惩。……印绶如经死绝乡，怕财仍旧怕空亡，逢之定主多凶祸，落水火刑自缢伤。"'
  failure_mode: '印格行财运时按「财官双美」断吉，不知财正是印之忌（贪财坏印）；

    也忽略印入死绝乡后又见财、空亡的叠加。

    '
  mechanism: '印有专属忌法（怕财、怕空亡、怕死绝），与「用之某神不可某」的忌法体系一致；

    忌神到位的岁运是降级信号而非升级信号。

    '
  bound_to:
  - 印绶格（task-06）
  - 用神不可伤的忌法（task-06）
  tags:
  - counter-example
  - yinshou
  - caixing
  - yongshen
  source_ref: ce-B5-18
- id: b-yhr-0122
  domain: D09
  source_id: src-yuanhai-ziping
  location: 第 219 章 · 印绶诗诀（page 497）
  quote: '"印绶重重享见成，食神只恐暗相刑，早年若不归泉世，孤苦离乡宿疾萦。……印绶干头重见比，如行运助必伤身，莫言此格无奇妙，印入财乡福禄真。"'
  failure_mode: '见印重、见现成之福即判吉；不知印重会暗损食神（子息与寿元之神），

    干头再见比劫而岁运再助则反伤身。

    '
  mechanism: '印与食神互为消长（印克食伤），印多则食受损；比劫本为助身，

    在印重之局再助反而过旺致伤——救应过量同样是病。

    '
  bound_to:
  - 印绶格（task-06）
  - 食神/伤官格（task-09）
  tags:
  - counter-example
  - yinshou
  - shishen
  - bijie
  source_ref: ce-B5-19
- id: b-yhr-0123
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 220 章 · 正财诗诀（page 498）
  quote: '"正财切忌劫财神，破害刑冲不可论，岁运那堪逢刃地，命延不死也遭迍。……身衰财旺还知夭，官盛身强福禄来。……财神忌透只宜藏，身旺逢之大吉昌，切忌比劫相遇值，一生名利被分张。"'
  failure_mode: '见财星成局即断富；不论身之强弱、不论劫刃是否分夺、

    不论财星宜藏不宜透，也不检查刑冲破害。

    '
  mechanism: '正财的可用性取决于三件事：身能否任财（身衰财旺反主夭）、财是否被劫夺（劫财、羊刃）、

    财的藏透格局（透则易被分张）。三项任缺其一即由富转败。

    '
  bound_to:
  - 财格判定（task-05）
  - 羊刃与特殊日格（task-10）
  tags:
  - counter-example
  - caixing
  - jiecai
  - yangren
  source_ref: ce-B5-20
- id: b-yhr-0124
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 221 章 · 偏财诗诀（page 500）
  quote: '"月偏财是衆人财，最忌干支兄弟来，身强财旺皆为福，若带官来足妙哉。……若见偏财遇劫星，田园破尽苦还贫，伤妻损妾多遭辱，食不相资困在陈。"'
  failure_mode: '把偏财与正财同法处理，忽略偏财属「众人财」，比劫同位即分夺；

    在劫星显露时仍断田园丰厚。

    '
  mechanism: '眉批「偏财主外方财，忌兄弟姐妹分夺其财食，若身旺财旺极其富矣」——

    偏财的成败在于能否独占（有无比劫劫夺），且须官星以「享之」。

    '
  bound_to:
  - 财格判定（task-05）
  - 六亲推断与某亲受克（task-14）
  tags:
  - counter-example
  - piancai
  - bijie
  source_ref: ce-B5-21
- id: b-yhr-0125
  domain: D09
  source_id: src-yuanhai-ziping
  location: 第 222 章 · 食神诗诀（page 502）
  quote: '"食神有气胜财官，先要他强旺本干，若是反伤来夺食，忙忙辛苦祸千般。……切忌枭来明灭福，最嫌冲去暗消除。……食神生旺喜生财，日主刚强福禄来，身弱食多反为害，或逢印绶不生灾。"'
  failure_mode: '见食神即断福寿；不检查（1）枭神（偏印）夺食，（2）食神被冲，

    （3）日主是否够强以任食之泄。

    '
  mechanism: '食神须「强旺本干」方可用：身弱而食多则泄气过度为害；

    偏印夺食是明确的破格机制（明灭福）。

    '
  bound_to:
  - 食神/伤官格处理（task-09）
  - 旺衰判定（task-04）
  tags:
  - counter-example
  - shishen
  - xiaoshen
  source_ref: ce-B5-22
- id: b-yhr-0126
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 223 章 · 伤官诗诀（page 504）
  quote: '"伤官不尽又逢官，斩绞徒流祸百端，月犯父子无全美，日犯自己主伤残。……年上伤官最可嫌，重则伤身寿不延，伤官伤尽生财贵，财绝逢官祸必连。"'
  failure_mode: '见伤官格即断「伤尽为大贵人」，不在四柱中逐位核查官星是否真的一点不见；

    官星存在于月、日、年任一位，判断符号都由吉转凶。

    '
  mechanism: '眉批「若四柱无一点官星，谓之伤尽」——「伤尽」是可核查的硬条件；

    伤官的凶应还按宫位分（月犯父子、日犯自己、时伤子息、居太岁招横祸）。

    '
  bound_to:
  - 伤官格处理（task-09）
  - 六亲推断（task-14）
  tags:
  - counter-example
  - shangguan
  - jianguan
  source_ref: ce-B5-23
- id: b-yhr-0127
  domain: D09
  source_id: src-yuanhai-ziping
  location: 第 223 章 · 伤官诗诀（page 505）
  quote: '"伤官伤尽最为奇，尤恐伤多反不宜，此格局中千变化，推寻需要用心机。……壬水伤官怕木浮，见官见杀反为仇，再行财旺生官地，财禄无亏得到头。……癸水伤官怕见官，最嫌戊己透天干，再行财旺生官地，世事纷劳祸百端。"'
  failure_mode: '把「伤官伤尽最为奇」当通例，忽略「伤多反不宜」，并用同一套喜忌

    处理十天干的伤官（例如癸水伤官最忌见官，庚金伤官反喜见官）。

    '
  mechanism: '伤官喜忌逐干不同（金水伤官要见官、火土伤官宜伤尽、庚金伤官喜见官、

    癸水伤官怕见官）；眉批亦指「惟火土忌之最紧」。

    '
  bound_to:
  - 伤官格处理（task-09）
  tags:
  - counter-example
  - shangguan
  - tiangan
  source_ref: ce-B5-24
- id: b-yhr-0128
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 224 章 · 羊刃诗诀(劫财)（page 507）
  quote: '"羊刃存时莫看凶，身轻反助却为福，单嫌岁月重相见，莫把生时作怒宫。……时逢羊刃喜偏官，若见财星祸百端，岁运相冲并相合，勃然灾祸又临门。"'
  failure_mode: '见羊刃即断凶（或见刃即断贵），不检查：（1）身轻时刃反为助，

    （2）年月重见之害，（3）见财之祸，（4）冲合岁君之灾。

    '
  mechanism: '羊刃与身强弱、与财官的关系共同决定吉凶：身轻得刃反助，时刃喜偏官制；

    但刃见财必争，刃被岁君冲合则「勃然祸至」。眉批逐条给出这些条件。

    '
  bound_to:
  - 羊刃与特殊日格（task-10）
  - 大运太岁交互（task-13）
  tags:
  - counter-example
  - yangren
  - yun
  source_ref: ce-B5-25
- id: b-yhr-0129
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 224 章 · 羊刃诗诀(劫财)（page 508）
  quote: '"比肩阳刃格非常，要见官星与杀乡，元辰若无官杀制，再行比劫祸难当。……财星轻弱刃刚强，身旺之乡大不祥，凤寡鸾孤寒夜怨，等闲妻克两三场。……不宜阳刃天干露，岁运相逢事事凶。"'
  failure_mode: '见身旺、比劫多即断「身强有力」；未注意阳刃格须官杀为制，

    无制而再行比劫则祸难当，且财轻刃强直接对应财（妻）受损。

    '
  mechanism: '阳刃是「禄前一位」之气，力量须有出口（官杀制）；无制则刚烈伤人伤财，

    并反噬本身所克之财。天干露刃再逢岁运则为叠加。

    '
  bound_to:
  - 羊刃与特殊日格（task-10）
  - 六亲推断克应条件（task-14）
  tags:
  - counter-example
  - yangren
  - bijie
  - keqi
  source_ref: ce-B5-26
- id: b-yhr-0130
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 225 章 · 刑合诗诀（page 510）
  quote: '"六癸日生时甲寅，假名刑合亦非真，月令若加亥子位，伤官格内倒推寻。……癸日生人时甲寅，最嫌四柱带官星，若无戊己庚申字，壮岁荣华达帝京。"'
  failure_mode: '见到「癸日甲寅时」即套刑合格断贵，未先核月令（加亥子则改按伤官格）、

    也未核四柱是否带官星与戊己庚申等破格字。

    '
  mechanism: '眉批「若四柱有子不是此论。或寅申冲破，则不吉……若庚寅刑不成」——

    格局名先有资格条件，条件不足时该名目不成立（假名），须退回按本格（伤官）推。

    '
  bound_to:
  - 外十八格取格（task-05）
  tags:
  - counter-example
  - waishiba-ge
  - quge
  source_ref: ce-B5-27
- id: b-yhr-0131
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 226 章 · 日贵诗诀（page 512）
  quote: '"日贵支干一位同，空亡大忌带官冲，仁慈广德多姿色，会合财星空自崇。……癸丁蛇卯届猪鸡，官被刑冲祸必随，纯粹施为有仁德，尊崇富贵出希奇。"'
  failure_mode: '见日支恰为贵人位（癸卯、癸巳、丁酉、丁亥）即断贵，未检查空亡与刑冲破害；

    也不看日贵须干支同气、会合财星则空自崇。

    '
  mechanism: '眉批「只忌刑冲破害则伤贵人」——神煞吉星的效力依附于结构完整，

    被冲即伤，其吉不能独立成立。

    '
  bound_to:
  - 特殊日格（task-10）
  - 神煞查法（task-12）
  tags:
  - counter-example
  - riguiren
  - shensha
  source_ref: ce-B5-28
- id: b-yhr-0132
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 227 章 · 金神诗诀（page 514）
  quote: '"甲午时上见金神，杀刃相临真贵人，火木运中财禄发，如逢金水必伤身。……性多狠暴才明敏，遇水相生立困穷，制伏运行逢火局，超迁贵显禄千锺。"'
  failure_mode: '见金神（癸酉、己巳、乙丑时）即断贵；不核四柱是否真有火制、

    也不把忌水运列入断语。

    '
  mechanism: '眉批「四柱要火制之为贵……忌水运」：金神的贵气同样以制神到位为前提，

    水行则困穷，水运伤身。

    '
  bound_to:
  - 特殊日格（task-10）
  tags:
  - counter-example
  - jinshen
  - geju
  source_ref: ce-B5-29
- id: b-yhr-0133
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 228 章 · 日德诗诀（page 516）
  quote: '"日德不喜见魁罡，化成杀曜最难当，局中重见须还疾，运限逢之必定亡。……日德重重免祸殃，官星切忌见财乡，更无冲破空刑物，堪作朝中一栋梁。"'
  failure_mode: '把日德当清贵之格即断富贵；未检查：（1）是否与魁罡并见（化成杀曜），

    （2）是否重见，（3）是否落空亡，（4）官星是否逢财乡。

    '
  mechanism: '眉批「日德乃清贵之神，又遇魁罡恶曜则伤其贵……日德怕空亡，乃本身落空」——

    清贵之神须结构洁净，任一条被破坏则该格不成立。

    '
  bound_to:
  - 特殊日格（task-10）
  - 神煞查法（task-12）
  tags:
