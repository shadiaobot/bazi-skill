  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 35 章 · 论驿马（眉批）
  quote: '"有马必要鞍，必要闸方好。"'
  failure_mode: '查到驿马所在之支即断为「驿马入命，主奔波升迁」，不看是否另有鞍、栏相配。

    '
  mechanism: '眉批把驿马写成一组配伍：马前为栏、马后为鞍，「无鞍不能乘，无栏不能止，皆无用也」。

    单有马不带鞍栏，按眉批就是「无用」，不足以成吉断。

    '
  bound_to:
  - 神煞查表（task-12）
  tags:
