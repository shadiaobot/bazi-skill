  location: 第 263 章 · 运晦诗诀（page 585）
  quote: '"到此难留隔宿钱，求之劳碌又熬煎。若还财聚主克妻，又是官灾又舌缠。……劫财羊刃两头居，外面光华内本虚。官杀两头俱不出，少年夭折漫嗟吁！"'
  failure_mode: '按「比劫助身」把劫刃当补益，忽略运晦局中劫刃两头之害

    （破财、克妻、官灾、口舌）与官杀不出所致的少年夭折。

    '
  mechanism: '劫财羊刃在两端而官杀不见，是力量无处宣泄且反复争夺财利的结构，

    其表面光华与内里亏虚相反。

    '
