  quote: '"露官藏杀方为福，露杀藏官是祸胎。"'
  failure_mode: '只要官星与杀星同时出现，即按同一口径断吉凶，不区分何者透干、何者藏支。

    '
  mechanism: '歌诀把同一结构按透藏方向分成两种结果：官透杀藏为福，杀透官藏为祸。

    原文释义给出的机制是「官露则清高，为人显达。杀露则凶狠，为人急暴」——

    透出者对性格与处境的塑造占主导。

