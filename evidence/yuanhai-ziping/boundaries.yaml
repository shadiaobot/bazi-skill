  location: 第 254 章 · 弃命从财诗诀（page 567）；第 255 章 · 弃命从杀诗诀（page 569）
  quote: '"日干无气满盘财，弃命相从是福胎，运旺财官皆福贵，如芬相助反为灾。……阳水重逢阳土戈，无根何处被刑磨，格中有贵须还显，切忌官星破局多。"'
  failure_mode: '对从格仍按常法求扶身（比印相助），或忽略从杀格行运到南方、日主见根、

    见官运这些破格条件；把从财格的「破印」当作可用。

    '
  mechanism: '眉批「弃命从杀格者只用丙丁己三日火命，复要行运北方，又忌见官运，行南方见根者必凶」——

    从格是例外许可：日主无根是前提，任何扶根、见官的动作都使例外失效。

    '
