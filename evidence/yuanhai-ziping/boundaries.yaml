  location: 第 287 章 · 王井奥诀（page 657）
  quote: '"欲化真象，如丁壬化木之类，万一妒合争战未成者，忽至运中却资助本象具体，乘其本象财官等贵，则弃其本象之真，逐其末节之气。"'
  failure_mode: '见到合化之象即按化象推，忽略「妒合争战」使化未成；

    真正失当的是在化象未成时弃本象而逐末节之气。

    '
  mechanism: '本象与化象是本末关系：化未真则本象仍在，判断须回到本象；

    与「化气失局有伤，论显荣者万无二三」互为印证。

    '
