  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 233 章 · 时上一位贵诗诀（page 526）
  quote: '"时上偏官一位逢，身强杀浅怕刑冲，假如月上又重见，辛苦独劳百事空。……时上偏官喜刃冲，身强制伏禄丰隆。正官若也来相会，身弱财生主困穷。"'
  failure_mode: '把「时上一位贵」当见到时上偏官即成立；不核年月是否重见（重见则辛苦劳碌、百事空），

    也不核正官来会与身弱财生这两种反向情形。

    '
  mechanism: '眉批「其要时上一位，不要多，而三处不要重见，却怕冲……若年月又有反贱，辛苦劳碌之人」——

    该格的成立依赖唯一性与身强，两者任一不满足即改判。

    '
  bound_to:
  - 取格（task-05）
  tags:
  - counter-example
  - pianguan
  - shizhu
  source_ref: ce-B5-34b
- id: b-yhr-0139
