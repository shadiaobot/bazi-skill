- id: b-yhr-0239
  domain: D15
  source_id: src-yuanhai-ziping
  location: 第 287 章 · 王井奥诀（page 656）
  quote: '"人八字中，全无财官等件贵气，有安然奋发富贵者何？盖以相生之气，自立成象也，生意滔滔，有不尽之情，高远坚实如此。"'
  failure_mode: '以「无财官即不成器」为定则；原文给出反例：相生之气自立成象者亦可富贵，

    本象配本、化象配化各有成立路径。

    '
  mechanism: '「象」是比财官更上位的结构判据；财官只是象的一种载体。

    只数财官会漏掉成象之局，也会把有财官而象败之局误判为吉。

    '
