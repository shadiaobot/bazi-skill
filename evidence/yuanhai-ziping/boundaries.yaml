  source_id: src-yuanhai-ziping
  location: 第 81 章 · 论印绶
  quote: '"经曰：有官无印，即非真官；有印无官，反成其福。……盖印绶畏财，主人括囊。"'
  failure_mode: '命局有官星即作真官贵断，不查是否有印绶；或见印又有财，仍按印绶得力论，

    不辨财能破印这一层。

    '
  mechanism: '原文给出的成立条件写成对举两句：官须有印才成真官，印无须官反能成福；

    而印绶最畏的是财，财多则印受克。官、印、财三者之间的关系是联动的，不是各自单独记分。

    '
  bound_to:
