  quote: '"金人遇庚申、辛酉为五离煞，若生秋月，逢水则化金之毒，为金白水清造化，逢火则制金之刚，为煅成锋利之器柱，无火无水是谓顽金，主早年酒色，瘵(音同债)痢身死"'
