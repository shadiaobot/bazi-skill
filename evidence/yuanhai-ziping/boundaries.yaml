- id: b-yhr-0017
  domain: D14
  source_id: src-yuanhai-ziping
  location: 第 37 章 · 论华盖
  quote: '"华盖本为吉，凡人命中得之，多主孤寡，纵贵亦不免为孤独也，遇之多为僧道术论。"'
  failure_mode: '把华盖列入「命中吉神」清单，断为聪明、贵显，抹去其主孤寡的一面；

    或在看到出家、修道、术数倾向时改口称之为凶。

    '
  mechanism: '原文自己给出了两面的并列：本为吉星，但主孤寡，纵贵亦不免孤独。《壶中子》称其为

    「艺术之星，主孤」。按单一吉凶归类都会丢掉一半信息。

    '
  bound_to:
