  location: 第 81 章 · 论印绶
  quote: '"最怕行印绶死绝运或运临死绝，复有物以窃之，即入黄泉，不可疑也。"'
  failure_mode: '行运判断只看该运是否为印绶之运，不看印绶是否落于死绝之地，也不看是否有他物来窃其气。

    '
  mechanism: '原文把这一条写成复合条件：印绶运 + 死绝 + 有物窃之，三者叠加，结论极重（「即入黄泉」）。

    只取第一项就给出吉断，与原文的三重条件不符。

    '
