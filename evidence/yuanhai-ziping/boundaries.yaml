- id: b-yhr-0037
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 66 章 · 论月令
  quote: '"若年月日有吉神，则时归生旺之处。若凶神则要归时制伏之乡。"'
  failure_mode: '年柱断祖业、月柱断父母、时柱断子孙，逐柱独立下结论；

    不看前半三柱的吉凶对时柱落点的要求。

    '
  mechanism: '原文给的是联动规则：年月日有吉神，时柱应落生旺以承接；有凶神，时柱应落制伏之乡以化解。

    时柱上的吉凶神又受前三柱生克。逐柱独立断，等于放弃了这套制衡关系。

    '
  bound_to:
  - 六亲推断（task-14）
  - 柱位分工（task-03）
  tags:
  - counter-example
  - zhugwei
  - liuqin
  source_ref: ce-B1-37
- id: b-yhr-0038
  domain: D04
  source_id: src-yuanhai-ziping
  location: 第 68 章 · 又论五行生旺衰绝吉凶
  quote: '"如议命岂可拘於生旺之说，且丙寅属火而绝於亥，本为不好，孰不知亥中有木为印绶而生丙火，丙日亥时乃多贵格矣。"'
  failure_mode: '查表得某干落生旺即断吉、落衰绝即断凶，不看地支所藏是否另有生扶或耗泄，

    也不看该位置在具体格局中的作用。

    '
  mechanism: '原文举两例反证：丙火绝于亥，但亥藏甲木为丙之印绶，故丙日亥时（丙寅日亥时一类）多贵；

    戊土旺于巳且建禄，但巳藏庚金为食伤，反伤戊土官星，故戊日巳时官终不显。

    作者由此把「十有九失」归因于拘泥此说，并给出结论「当以活法推之」。

    '
  bound_to:
  - 旺衰判断（task-04）
  - 用神与官星（task-06 / task-08）
  tags:
  - counter-example
  - wangshuai
  - changsheng
  - huofa
  source_ref: ce-B1-38
- id: b-yhr-0039
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 69 章 · 论五行墓库财印（眉批）
  quote: '"印者，生身之木，有木则生火，明内之力。无木则火生土为盗气，有木则助，木克土之故。"'
  failure_mode: '见丙丁日主遇辰支即断「官库在辰，主贵」；不查年月时中是否有木（或亥卯未、寅）来生火助身，

    结果把浊而卑之局判成清贵。

    '
  mechanism: '正文写明清浊条件：丙丁以辰为官库，须年月时中有木或亥卯未并寅则清；

    「如无木则土夺丙丁之官，则浊卑而不清，亦不显」。眉批给出机制——无木则火生土只是盗气，

    有木则木克土、护住官星。

    '
  bound_to:
  - 墓库与杂气（task-11）
  - 印与官（task-03 / task-06）
  tags:
  - counter-example
  - muku
