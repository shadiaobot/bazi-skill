- id: b-yhr-0072
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 88 章 · 论羊刃
  quote: '"如命中有刃，不可便言凶。大率与七杀相似，凡有刃者，多主富贵人，却喜偏官七杀。……若命有刃无杀，岁运逢杀旺之乡，乃转生而反成厚福。"'
  failure_mode: '命中查出羊刃即断刑伤灾祸，不查是否有杀相配、是否身旺，也不看岁运是否补上了所缺的那一半。

    '
  mechanism: '羊刃的判据与七杀同构：刃杀俱全方能成用（「杀无刃不显，刃无杀不威」）。

    命有刃无杀者，岁运补杀反成厚福；反之有杀无刃者，岁运补刃亦可。单看一端的「有刃」不足以定凶。

    '
