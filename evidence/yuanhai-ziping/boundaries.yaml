  location: 第 46 章 · 论帝座（眉批）
  quote: '"子平云，帝座逢虚见不肖有是。"'
  failure_mode: '按纳音旺处取到帝座即断「帝座主儿女官」，不看帝座之支是否落空亡（虚）。

    '
  mechanism: '帝座由时柱纳音旺处取得（如甲子时纳音金、金旺于酉，帝座在酉），主儿女与官。

    眉批补出折扣条件：帝座逢虚，主见不肖之子。虚位与实位结论不同，须先辨虚实。

    '
  bound_to:
