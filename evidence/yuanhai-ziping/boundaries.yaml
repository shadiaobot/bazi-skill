  quote: '"有化而不化之由，聚而不聚之机，合而不合之类，秀而不秀之实。化而不化损於贵，聚而不聚损於财，合而不合损於官，秀而不秀损於福。"'
  failure_mode: '按名目判定化、聚、合、秀成立；原文列出四组「名目成立而实效不成立」的情形，

    并各自对应受损对象（贵、财、官、福）。

    '
  mechanism: '「不化而化之因，不聚而聚之机」——机制上有可逆的两面，

    名目与实效须分开核验。

    '
