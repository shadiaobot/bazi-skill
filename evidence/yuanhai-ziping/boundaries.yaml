  location: 第 284 章 · 损益生长四药说类（page 648）
  quote: '"如财官属木，则长养在寅卯辰之方，此木气方敷也，如是则贵行金运以克之，则与长生之木理不同也。"'
  failure_mode: '对同一五行在不同宫位套用同一行运方向；原文强调

    「长生二字，衰旺之不同，故行运有喜生喜克之异」——生位喜生、长位喜克。

    '
  mechanism: '行运方向由该神所处的宫位阶段决定（生、长、旺、衰各不相同），

    单一方向（如「木喜水」）不成立。

    〔引文「走以长生二字」疑为「盖以／是以长生二字」之误，见本块文本问题记录〕

