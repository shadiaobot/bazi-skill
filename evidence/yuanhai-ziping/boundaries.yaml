  location: 第 216 章 · 十二支体象（page 490）
  quote: '"超凡入圣唯逢午，破禄伤提独虑申。……祸见六冲应落叶，喜逢三合便成林。若归日时秋金重，更向西行患不禁。"'
  failure_mode: '把地支判断压缩成「三合则吉、六冲则凶」，忽略各支体象自带的专属忌：

    寅忌申（破禄伤提）、卯在日时遇秋金重而更行西方则患不禁、燥木不南奔。

    '
  mechanism: '每支各有体象与当令之气，其忌神是按自身气机给出的，与通用合冲规则并行；

    只取通用规则会漏掉方向性禁忌。

