  location: 第 291 章 · 元理赋（page 697）
  quote: '"强金得水，方挫其锋。强水得木，方泄其势。强木得火，方化其顽。强火得土，方止其焰。强土得金，方制其害。"'
  failure_mode: '对旺神只作「旺则可用」的判断，不给它找出口（泄或制）；

    原文要求每一强旺之气都须有对应的泄制之物才算成器。

    '
  mechanism: '强神的出路是「泄其势」或「制其害」，无出口则刚气自伤；

    这是 B7「满局金气无火制必验」「旺者宜制」的同一机制。

    '
