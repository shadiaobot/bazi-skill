  location: 第 268 章 · 女命诗诀（page 595）
  quote: '"财官印绶三般物，女命逢之必旺夫，不犯杀多无混杂，身强制伏有称呼。……合多切忌桃花犯，劫比桃花大不良。……飞天禄马井栏叉，女命逢之福不佳，只好为偏并作妓，有财方可享荣华。"'
  failure_mode: '把女命篇的断语（旺夫、孤贫、作偏作妓、桃花不良）当作可移植规则使用；

    这些判断以「以官为夫、身柔为吉」为前提，是明代婚姻制度的投影。

    '
  mechanism: '眉批「女命以官为夫，有伤官则伤其夫……桃花主淫」——

    术语映射本身携带宗法—性别等级假设，脱离该制度后不再成立。

    '
