  location: 第 242 章 · 六阴朝阳诗诀（page 544）
  quote: '"辛日单单逢戊子，六阴贵格喜朝阳，丙丁巳午休填实，岁运轮逢一例评。……六阴行运喜西方，临在东方也吉昌，若到北方凶且畏，南离冲破主灾殃。"'
  failure_mode: '见辛日戊子时即断六阴朝阳；不核丙丁巳午是否填实（有火即是官星，不用此格）、

    也不看行运北方的反向结果。

    '
  mechanism: '眉批「以我动丙火为辛之官，暗合取贵，无官星方用此例……有火即是官星，不用此格」——

    暗合的成立以官星不现为前提。

    '
  bound_to:
