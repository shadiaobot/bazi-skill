  location: 第 251 章 · 曲直格诗诀（page 561）
  quote: '"甲乙生人寅卯辰，又名仁寿两堪许，亥卯未全嫌白帝，若逢坎地必荣身。……木从木类正为奇，秋令逢之事不宜，得此清高仁且寿，水源相会福元齐。"'
  failure_mode: '见甲乙木成局即断曲直仁寿；不核是否逢秋令、是否见金（白帝）。

