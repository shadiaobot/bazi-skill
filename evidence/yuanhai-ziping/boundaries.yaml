  location: 第 237 章 · 子遥巳诗诀（page 534）
  quote: '"甲临子字日时全，拟作蟾宫折桂仙，丑绊午冲官杀显，反为淹滞祸绵绵。……不喜庚辛申酉出，丑来相绊亦非宜，更嫌午字相冲害，运入官乡旺处奇。"'
  failure_mode: '见甲子日甲子时即断「遥巳」取贵；不核丑字绊住子、午字冲破子、

    以及庚辛申酉官杀显露使遥合不成。

    '
  mechanism: '眉批「或有丑字合子字则遥不成反成下格」——遥合的成立依赖子字保持自由，

    被合住或被冲破即格败。

    '
  bound_to:
