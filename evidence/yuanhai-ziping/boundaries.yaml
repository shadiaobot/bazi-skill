  quote: '"干与支同，如甲寅之类，虽然强健，无他残疾，多主损财伤妻。"'
  failure_mode: '见甲寅、乙卯这类干支同类者，只按「干支一气、比肩帮身」断为身强有力，

    不断其损财伤妻的一面；或以「有他格」为名绕过这层。

    '
  mechanism: '原文的分析是分层的：干支同名者确实强健无残疾，但由于比劫同类夺财，

    多主损财伤妻；若年月日时另有他格或财官印，可改判贵显有权，若三元无他格、

    四柱又无财官印而反生气旺之月日，则「此命主穷必彻骨，克妻多数，终身无依」。

    强健与富贵不是同一件事。

    '
  bound_to:
