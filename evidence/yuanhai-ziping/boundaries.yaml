  quote: '"印轻怕行财运，主恶死或血疾……凡坐杀者，不可行杀旺运"'
  failure_mode: 印星轻弱再行财运（财破印），主凶死或血疾；日主坐七杀者再行杀旺运亦凶。
  mechanism: 用神被岁运直接破坏，且被破坏者恰是护身之神。
