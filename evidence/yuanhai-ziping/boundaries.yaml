- id: b-yhr-0022
  domain: D12
  source_id: src-yuanhai-ziping
  location: 第 45 章 · 论垣城（眉批）
  quote: '"子平云，垣城合马女非为，主妻私奔，不可不究。"'
  failure_mode: '只要日支与驿马之支同见，就照「垣城合马主淫」下断；不逐步核对

    日干长生之位（垣城）与日支三合局驿马之位是否真的成合。

    '
  mechanism: '垣城成立要两步同时满足：一是取日干的长生为垣城，二是取日支所属三合局的驿马，

    二者相合方成。原文举例甲辰日生亥时：甲长生在亥，申子辰马在寅，亥与寅合，两个条件才凑齐。

    缺任一步即不成立，直接套断语会把大量普通命局判成此格。

    '
  bound_to:
  - 六亲推断（task-14）
  - 神煞查表（task-12）
  tags:
