- id: b-yhr-0394
  domain: D06
  source_id: src-yuanhai-ziping
  location: 第 282 章 · 病药说
  quote: '"盖人之造化，虽贵中和，若一味中和，则安得探其消息，而论其休咎也……愚尝……屡以中和而究人之造化，十无一二有验"'
  failure_mode: 只用「中和」一把尺子断命，遇无病无药的平常命局便无从下手，作者自陈十次难准一二。
  mechanism: 中和只能解释「不偏」，无法解释为何有人贵有人平；缺少「病—药」这一层结构信息。
  bound_to:
  - 病药说（第 282 章）
  - 中和（第 77 章）
