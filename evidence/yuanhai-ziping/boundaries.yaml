  location: 第 266 章 · 寿元诗诀（page 591）
  quote: '"寿星明朗寿元长，偏印逢之不可当，妻妾不来相救助，命如衰草值秋霜。……丙临申位逢阳水，定见天年未可知，透出干头壬癸水，其人必定死无疑。"'
  failure_mode: '把「必定死无疑」类断语作为可执行输出：书中以纳音寿元为参照，

    其「必死」条件（无土相救）与当代语境无关，属历史断言。

    '
  mechanism: '眉批「寿元，五行纳音所取为……丙申日，忌水行运又逢壬水者，无土相救必死」——

    这是体系内的死局判定，无任何外部效度证据，且涉及不可逆结论。

    '
