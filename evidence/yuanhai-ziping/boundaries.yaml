  quote: '"大运不宜与太岁相克相冲，相冲者凶……岁冲克运者吉，运克岁者凶，格局不吉者死"'
  failure_mode: 大运与太岁相冲相克为凶，尤以「运克岁」为凶、格局不佳者主死。
  mechanism: 岁为君主、运为臣属，臣克君为逆，故凶；反向则吉。
