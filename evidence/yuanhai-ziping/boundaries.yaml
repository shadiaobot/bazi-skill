  location: 第 238 章 · 丑遥巳格诗诀（page 536）
  quote: '"辛癸二日逢遇丑，便是官星暗入宫，申酉喜来临一字，忌逢巳午子垣凶。"'
  failure_mode: '见辛丑、癸丑日即断遥巳取官，不核子字是否合住丑字、是否逢巳午。

    '
  mechanism: '眉批「辛用丑遥巳中丙为官，癸用丑遥巳中戊土为官，忌子字合住丑字则不能遥也」——

    遥神的自由度是成格条件，且喜申酉一字相临。

    '
