  quote: '"身弱杀强无制神，多生灾祸不堪论，那堪更入官强地，带疾遭刑丧此身。"'
  failure_mode: '见偏官有制即断权贵，不看日主强弱；身弱杀强又无制神时仍按吉断，

    并把岁运入官强地视为「得地」。

