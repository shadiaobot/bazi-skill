  location: 第 240 章 · 井栏叉格诗诀（page 540）
  quote: '"庚日全逢申子辰，井栏叉格制官星，局中无火方成贵，破动提纲祸亦刑。……丙丁巳午岁运逢，失禄破财须且畏。"'
  failure_mode: '见庚日申子辰水局即断井栏叉成格；不核局中是否见火（丙丁巳午），

    也不核提纲是否被破动。

    '
  mechanism: '眉批「只是暗冲寅午戌，若柱中有一寅一午一戌，亦非此格，则无贵矣」——

    暗冲之格最忌目标字填实，一见即格败。

    '
