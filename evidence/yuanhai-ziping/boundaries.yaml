  quote: '"福满须防有祸，凶多未必无祯。……柱中原有官煞转生印旺，不遇财伤食神泄气为贵，运行比印旺地，生扶太过，福满处岂无祸生，是以君子怕处其盛也。"'
  failure_mode: '见用印生身得力、又行比印旺地即断福上加福；

