  quote: '"又诀云：凡论女命，只用月支中财官印三件为奇。第一论印，无财损印……休咎忌财喜官。第二论官，亦看何支中所藏，一位为奇。一忌官多，二忌伤重，三忌带合，四忌杀混，五忌日主柔弱。……第三论财，取月支中为要，财不要多，只宜一位"'
  failure_mode: '对女命不作「取月支财官印三件」的逐项核验，也不列官星的五忌；

    原文给出明确的检查表：印忌财损、官忌多/伤重/带合/杀混/日主柔弱、财宜一位。

    '
  mechanism: '这是本块最可操作的一段（检查表式判据），其技术层（一位为奇、五忌）可提取；

    但结论层仍以「官为夫、食为子」为前提，属时代局限范围。

    〔引文「又诀」疑为「口诀」之误，见 source/text-issues.md〕

