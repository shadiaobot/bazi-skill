  location: 第 286 章 · 盖头说（page 652）
  quote: '"凡有所害之物，露出头面，便是动物，就能作害。……盖因壬癸水盖盖在申酉头上，是壬癸水盖了头，便不好也。"'
  failure_mode: '只核地支所藏之病神/福神，不问天干（头面）是否透出：

    作者判「支中所藏之物……不足为轻重」，藏在内者不足畏，透出者方能作害；

    反之福神被盖则「出头不得」不能作福。

    '
  mechanism: '干支分层：天干为头面（动物）、地支为肚腹（所藏），

    以盖头之字定该支当年能否为害或为福，是逐年断的话语权所在。

