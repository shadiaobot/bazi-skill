  location: 第 72 章 · 二至阴阳相生理（眉批）
  quote: '"冬至後阳生，夏至後阴生，五行各得其气，不为身弱，作中和而论。"'
  failure_mode: '对冬至、夏至前后出生的同类命局（如丙丁日见水、庚辛日见火）给出同一结论，

    不按二至后的阴阳转换调整忌神口径。

    '
  mechanism: '原文按二至分段：甲乙日生于冬至前，木方死绝，「其木不甚吉利」；生于冬至后，

    阳气已生，「木乘暖气其命寿禄皆全」。丙丁冬至前遇水即灭，冬至后不甚忌水；

    庚辛生于夏至后「金有气不甚忌火」。眉批的概括是：二至后五行各得其气，不再作身弱论。

    '
  bound_to:
