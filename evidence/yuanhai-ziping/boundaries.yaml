  quote: '"如推贵命先从胎息之吉日，相生扶者贵，相克者贫"'
  failure_mode: '取胎息（日主天干之合、地支之合）后，按「相克者贫」直接下贫贱断语，

    也不理会第 74 章「子平之法，不用胎元小运，不用纳音」的排除口径。

    '
  mechanism: '胎息一条在本版里存在两处口径：第 20、21、22、23 章分别给出胎元、息、变、通四法，

    第 74 章则明确子平之法不用胎元小运。眉批的「相克者贫」只在这套方法内部成立，

    把它当成全书通则，会与以日为主的坐标系冲突。两处并存须标注，不得据一处下结论。

