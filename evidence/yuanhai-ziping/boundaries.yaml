- id: b-yhr-0027
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 50 章 · 论十恶大败（眉批）
  quote: '"取日干上见之方是，四柱有吉神多，身旺若有，未可便作十恶论。"'
  failure_mode: '日柱落在甲辰、乙巳、壬申等十日之内，即照「仓库金银化作尘」下断，

    不看四柱是否吉神众多、日主是否身旺。

    '
  mechanism: '原文先限定取法（须以日干上见方是，其余柱位见之未可便作十恶论），

    再由眉批给出回旋条件：吉神多、身旺者「未可便作十恶论」。同一日柱在不同命局中的轻重不同。

    '
  bound_to:
