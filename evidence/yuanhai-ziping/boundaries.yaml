  source_id: src-yuanhai-ziping
  location: 第 218 章 · 偏官诗诀（page 495）
  quote: '"伤官七杀命中嫌，制伏调和可作权，日弱又无制伏者，兢兢如抱虎而眠。"'
  failure_mode: '见伤官、七杀并见仅按「伤官驾杀」「杀刃相济」等名目断贵，

    未检查日主强弱与是否真有制伏调和。

    '
  mechanism: '伤官七杀同时出现是「命中嫌」，只有在有制伏调和时才转化为权；

    日弱无制则整个结构处于高风险，名为抱虎而眠。

    '
  bound_to:
  - 伤官格处理（task-09）
  - 七杀制伏（task-08）
  tags:
