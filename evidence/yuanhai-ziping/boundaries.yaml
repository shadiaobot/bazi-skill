- id: b-yhr-0025
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 48 章 · 论截路空亡
  quote: '"以日取时见之方是，以年在日时论者非也。"'
  failure_mode: '取截路空亡时以年干配时支、或以其他柱位组合来查，查到即断凶，查不到即作无事。

    '
  mechanism: '原文把取法写死：须以日干配时支。举例说明「假如甲子日见申酉时乃为正犯，其余者见之非也」——

    同样的申酉时，配在别的日柱上不算犯。取法错了，命中与不中都会误判。

    '
  bound_to:
  - 神煞查表（task-12）
  tags:
