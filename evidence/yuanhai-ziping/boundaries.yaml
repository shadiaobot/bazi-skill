- id: b-yhr-0011
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 25 章 · 起天官贵人（眉批）
  quote: '"天官要天元庸秀，无伤纳音和而福助，乃为吉。喜福神者，财官印也。逢恶杀不吉。"'
  failure_mode: '按年干查得天官贵人所在地支即断为「必作朝廷显代人」，不看日主是否有伤、

    也不看是否逢恶杀。

    '
  mechanism: '眉批把天官贵人的成立条件写成一组合取：天元秀、无伤、纳音和、有财官印等福神助，

    且不逢恶杀。原文歌诀「必作朝廷显代人」是对全部条件齐备者的结论，不是查表即得。

    '
  bound_to:
