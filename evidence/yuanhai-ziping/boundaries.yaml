- id: b-yhr-0093
  domain: D05
  source_id: src-yuanhai-ziping
  location: 第 108 章 · 内十八格-子遥巳格
  quote: '"以子合丑绊位，不能遥合巳动丙合辛，无贵。"'
  failure_mode: '见甲子日（或甲子时）即按子遥巳格取官，不查是否有丑字绊住、庚申七杀、辛字官星，

    也不看有无午字冲子。

    '
  mechanism: '遥合通路要求子空出来去遥巳；子与丑合即被绊住，通路中断。原文以两命对举：

    赵知府（丙寅 壬辰 甲子 甲子）成格而贵，另一例「己丑 甲戌 甲子 甲子」

    因丑绊而终为平常人。

    '
  bound_to:
  - 格局判定（task-05）
  - 合与绊的权重（task-11）
  tags:
