- id: b-yhr-0079
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 92 章 · 论日贵（眉批）
  quote: '"日贵支干一位同，空亡大忌带刑冲，仁慈积德多姿色，会合财星空不空。"'
  failure_mode: '日柱为丁酉、丁亥、癸巳、癸卯即断日贵，不查该支是否落空亡、是否带刑冲、是否见魁罡；

    也不分昼夜贵。

    '
  mechanism: '本章给的成立条件是「贵神要聚於日」且不受破坏：运行怕空亡、不要魁罡、最怕刑冲破害，

    并且「日贵有时法异同，须分昼夜贵」——日生用日贵、夜生用夜贵。眉批以诀语把空亡与刑冲列为大忌。

    '
  bound_to:
  - 特殊日格（task-10）
  - 空亡（task-12）
  tags:
