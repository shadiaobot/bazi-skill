- id: b-yhr-0032
  domain: D03
  source_id: src-yuanhai-ziping
  location: 第 55 章 · 论起大运法（眉批）
  quote: '"如初一日午时生，若卯时立春，便作正月；若寅时生，未还交节，作上提十二月节推命。"'
  failure_mode: '以农历月序（或月内日期）定月柱，不核对出生时辰是否已过交节时刻，

    把同一日之内先后出生的两人当作同一个月令。

    '
  mechanism: '眉批判定月柱的分界是节气的交替时刻，精确到时辰：同日午时生在卯时立春之后即作正月，

    寅时生未交节则仍作上一月。月柱取错会连锁影响旺衰、用神、格局与起运。

    '
  bound_to:
  - 四柱排盘（task-01）
  - 月令司令（task-04）
  tags:
