  location: 第 239 章 · 壬骑龙背诗诀（page 538）
  quote: '"壬骑龙背喜非常，寅字辰多转发扬，大忌官星来破格，刑冲须见寿元伤。……壬寅不及壬辰日，四柱壬辰字要多，辰字多兮官杀重，寅多可比石崇过。"'
  failure_mode: '见壬辰日辰多即断「骑龙背」大贵；不核官星是否显露（见官则不为此格）、

    是否被刑冲、以及辰多官重与寅多之富两种情形的分别。

    '
  mechanism: '眉批「此以辰冲戌中丁戊为壬之财官……正谓辰多则贵，寅多着富……

    若见官星，不为此格」——该格靠暗冲取财官，官星明现即破格。

    '
