- id: b-yhr-0137
  domain: D10
  source_id: src-yuanhai-ziping
  location: 第 232 章 · 时上偏财诗诀（page 524）
  quote: '"时上偏财一位佳，不逢冲破享荣华，破财劫刃还无遇，富贵双全比石家。……时上偏财遇劫星，田园破尽苦还贫，伤妻损妾多遭辱，食不相资困在陈。"'
  failure_mode: '见时上偏财即断富贵，不检查是否被冲破、是否同时出现劫刃；

    也不核「一位」是否真的只有一位。

    '
  mechanism: '时上偏财的价值在于「一位」：冲破则伤财，劫刃则分夺，

    「破财劫刃还无遇」是成格前提而非附带条件。

    '
  bound_to:
