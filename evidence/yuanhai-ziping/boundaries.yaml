  location: 第 278 章 · 五行生克赋（page 616）
  quote: '"火隔水不能熔金。……四柱又见壬水，以克其火，则火不能熔金，使其金仍为坚刚之气，亦不可以言贵。"'
  failure_mode: '见到官杀（克神）或食伤（制神）在柱，即断定「有制则吉」「有官则贵」；

    不核该克神/制神是否被沉、被隔而失去作用（遇而不遇）。

    '
  mechanism: '五行之克需要相遇条件：金入申子辰水局则沉而不克木；

    火被壬水隔断则不能熔金。名目上的制克若无实效，不能改判吉凶。

    '
  bound_to:
