  quote: '"此一段，须要先看四支，一一将所藏干气提豁出来细推。何者党众，何者力寡，何旺何弱，何轻何重，方明得用神吉凶道理。不去一一提豁，大纲昏蔽，难以忖度取舍。"'
  failure_mode: '跳过四个地支的藏干拆解直接下断语或取用神；

    原文判此举为「大纲昏蔽」，取舍无从依据。

    '
  mechanism: '地支是「四位支神至切者，视天干为尤切」，其力势须逐支提豁（含冲拱刑合起何神）才能定量。

