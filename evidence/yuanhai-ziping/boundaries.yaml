  location: 第 291 章 · 元理赋（page 704）
  quote: '"财印混杂，终为受困。偏正错乱，必致伤身。……官煞混杂，有去留亦吉，若错乱则伤身为凶。"'
  failure_mode: '把「财官印食俱全」当作吉；原文对混杂与错乱给出受困、伤身的结论，

    并区分「有去留的混杂」（可吉）与「错乱」（凶）。

    '
  mechanism: '混杂可救（去留），错乱不可救；两者是不同强度的问题，

    与「贵气不欲烦杂」同一机制。

