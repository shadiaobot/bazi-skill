  location: 第 278 章 · 五行生克赋（page 615）
  quote: '"太阳火，忌林木为仇。……此言丙火生於春夏，通木盛者忌之，秋冬不忌。"'
  failure_mode: '用「母旺则子强」的通则，把木盛一律当作丙火的助力；

    忽略该书给的季节限定：春夏木盛蔽日，秋冬不忌。

    '
  mechanism: '五行之生受季节与遮蔽效应制约；同一组合在春夏与秋冬符号相反。

    这是把通则条件化的实例，也是本书要求「通变」的具体落点。

