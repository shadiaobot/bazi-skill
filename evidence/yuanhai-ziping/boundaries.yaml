  source_id: src-yuanhai-ziping
  location: 第 74 章 · 详解定真论
  quote: '"若生於戌亥子时，则是金水分野，火绝之地，则生子息少矣。当主孤独贫贱之子，不然僧道、过房、螟蛉之种矣。"'
  failure_mode: '只按「男取克干为嗣、女取干生为子」找出子星即断子息多少，

    不看子星在时柱所处的十二长生阶段（长生至帝旺为多，衰病死墓绝为少）。

    '
  mechanism: '原文把两步写在一起：先定子星，再看「生时在何宫」——「宫分若在长生、沐浴、冠带、临官、

    帝旺之乡，定其多嗣……若在衰病死墓绝，无气胎养冲刑之乡，定主子少」。

    并给出对照命例：六庚日午时生（火之分野）主多子且贵显，生于戌亥子时（金水分野、火绝）则子息少。

    '
  bound_to:
