- id: b-yhr-0028
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 51 章 · 论四废日
  quote: '"今人以春见庚辛，夏见壬癸，秋见甲乙，冬见丙丁为废者，皆非也。囚死，囚而无用谓之废。"'
  failure_mode: '按「当令之行克所见之行」的粗略办法定四废：春见庚辛、夏见壬癸、秋见甲乙、冬见丙丁即断为废。

    '
  mechanism: '原文点名批评这种流行做法，并给出真正的判据：须是「囚死」——该五行既囚又死方谓之废，

    故四废只有庚申、壬子、甲寅、丙午四日。宽泛的「见相克之干」会把大量普通日柱判成废日。

    '
  bound_to:
  - 神煞查表（task-12）
  - 旺衰与月令（task-04）
  tags:
  - counter-example
  - shensha
  - sifei
  - wangshuai
  source_ref: ce-B1-28
- id: b-yhr-0029
  domain: D11
  source_id: src-yuanhai-ziping
  location: 第 52 章 · 论天地转杀
  quote: '"地转取纳音为是，其日最忌，上官受职、出行商贾、造作、嫁娶，必主凶。命逢此日，必主夭折。"'
  failure_mode: '把天地转杀当作「略有不吉」的普通凶日，仍照常用作行事择日；

    或只按天干定天转，漏掉以纳音定地转一层。

    '
  mechanism: '原文把天转（旺气连天干）与地转（旺气连纳音）分开，并明确「地转取纳音为是」——

    取法错一层，凶日就查不出来。对四类大事的判断是「必主凶」，不是倾向性的不利。

    '
  bound_to:
  - 神煞查表（task-12）
  - 择日类用法（本书明示不属本体系者须另判）
  tags:
  - counter-example
