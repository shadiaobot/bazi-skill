    在失令或水湿之局仍按「印重身旺」断富贵。

    '
  mechanism: '丁为烛灯之火：得时能化千斤铁，失令连一寸金也熔不动；

    湿木不生火，柴少反可引燃。生扶是否有效取决于燥湿与月令，而非印的多少。

    '
