# 《命理约言》新主张（第一批：总法/格局/用神/月令）

- id: c-my-0001
  domain: D04
  title: 用神即扶抑之神，且须递归调整
  source_id: src-mingli-yueyan
  location: 第 9 章 · 看用神法
  quote: |
    "看用神之法，不过扶抑而已。凡若者宜扶，扶之者即用神也。扶之太过，抑其扶者为用神。扶之不及，扶其扶者为用神。"
  rule: |
    用神就是「扶抑之神」：该扶者扶之、该抑者抑之；但扶得太过则改为抑制那个「扶」的力量，
    扶得不及则再加生扶。强者同理反向操作。
  trigger: 取用神时
  logic: 判日主强弱 → 定扶或抑 → 检查是否过头或不足 → 递归调整用神
  boundary: 仅限正格；合化、一气两神、暗冲暗合另有法
  limits: 与《子平真诠》五法（扶抑/病药/调候/专旺/通关）相比更简化，只取扶抑一线
  novelty: contradicts
  relates: [D03]
  tags: [用神, 扶抑, 重定义]

- id: c-my-0002
  domain: D04
  title: 四层用神：日主、六神、原局、行运
  source_id: src-mingli-yueyan
  location: 第 9 章 · 看用神法
  quote: |
    "是故有日主之用神也。有六神之用神焉。六神之互相扶抑者是也。……有原局之用神焉。局中本俱之扶抑是也。更有行运之用神焉，运中补足之扶抑是也。"
  rule: |
    用神分四层：扶抑日主者、调和六神之间者、原局本有者、行运补足者；行运之用神服务于原局之用神。
  trigger: 判断「用神」指哪一层时
  logic: 先定日主所需 → 再看六神之间 → 再看原局与行运
  boundary: 「用神无破为吉，有助则更吉；有损为凶，无救则更凶」
  limits: 这是四本书里对「用神」层级最明确的表述，可直接用于统一术语
  novelty: new
  relates: [D07]
  tags: [用神, 层级, 术语]

- id: c-my-0003
  domain: D05
  title: 正格六类、变格六类与兼格体系
  source_id: src-mingli-yueyan
  location: 第 7 章 · 看格局法
  quote: |
    "格局有正有变，正者五行之常理也。曰正官，曰偏官，曰印，曰财，曰食神，曰伤官。变者五行之常理，而取用则异矣，曰从，曰化，曰一行得气，曰两神成象，曰暗冲，曰暗合。"
  rule: |
    格局分正格六类（官、杀、印、财、食、伤）与变格六类（从、化、一行得气、两神成象、暗冲、暗合）；
    正格皆可相兼（官兼印/财、印财兼官杀、食伤兼印财），变格须极真。
  trigger: 定格局分类时
  logic: 先判正/变 → 再判兼格 → 变格另核纯度
  boundary: 「从化须极真，一行两神须无杂，暗冲暗合须至当，俱勿依稀妄取」
  limits: 与渊海内外十八格相比更简、更系统性；与子平真诠「格名不可恃」形成张力
  novelty: new
  relates: [D15]
  tags: [格局, 分类, 兼格]

- id: c-my-0004
  domain: D05
  title: 取格顺序：本气透干 → 所藏 → 别干势盛
  source_id: src-mingli-yueyan
  location: 第 5 章 · 看命总法一
  quote: |
    "如月支本气透于天干，寅透甲，午透丁，即取为格……若本气未透遭克，则寅不用甲，而用所藏之丙戊……若所藏之神，又不通遭克则不用月支，而用别干之势盛力旺者为格。"
  rule: |
    取格三级顺序：① 月支本气透干即取为格；② 本气未透或遭克，取所藏之神；③ 所藏又不通，则取别干势盛者。
    禄、刃、比劫不论在干在支，皆不取格，只作日干之助。
  trigger: 定格局时
  logic: 本气透干 → 所藏 → 别干；禄刃比劫排除
  boundary: 合化、一气两神、暗冲暗合不在此例
  limits: 与渊海「月令取格」一致，但把「透干优先」写成了明确顺序
  novelty: extends
  relates: [D04]
  tags: [取格, 顺序, 透干]

- id: c-my-0005
  domain: D03
  title: 月令先取当令、次看得势；党众则衰月亦旺
  source_id: src-mingli-yueyan
  location: 第 11 章 · 看月令法一
  quote: |
    "格局先取当令，次要得势……或党多援众，则秋木亦旺，势孤克众，则春木亦弱。"
  rule: |
    旺衰先看月令当令，次看得势（党众）；即使生于休囚之月，党多援众亦可转旺；反之当令而势孤亦可转弱。
  trigger: 判旺衰时
  logic: 月令 → 节气细分（惊蛰后谷雨前尤旺）→ 党众多少
  boundary: 「生本月之气，反不能任克」——引用张楠之说：当令之月反不耐克，只可一二点克神
  limits: 与渊海「月令为提纲」一致，本书补出节气细分与党众修正
  novelty: extends
  relates: [D04]
  tags: [旺衰, 月令, 党众]

- id: c-my-0006
  domain: D03
  title: 批评「运必不可冲月令」
  source_id: src-mingli-yueyan
  location: 第 11 章 · 看月令法一
  quote: |
    "旧书谓行运必不可冲月令，冲必不利，夫人生六十岁左右，不论顺逆，运无不冲令者，多有安富尊荣，岂皆不利乎？"
  rule: |
    旧说「行运必不可冲月令」不成立：人六十岁左右，无论顺逆运都必然冲过月令，其中多有安富尊荣者。
    只有「原命止恃此令神而令神本弱」时，冲月令才真正不利。
  trigger: 行运冲月令时
  logic: 先看格局是否恃月令之神 → 恃且弱则忌冲，否则不必忌
  boundary: 令神强旺者不畏冲；格局另有主者亦不以冲月令为断
  limits: 与渊海「提纲有用，最怕刑冲」正面相左，是第四本书的重要批评
  novelty: contradicts
  relates: [D07]
  tags: [月令, 冲, 冲突]

# 第二批：干支论（76、78、85、88）

- id: c-my-0007
  domain: D02
  title: 十干象物比喻当尽辟，只以阴阳取用
  source_id: src-mingli-yueyan
  location: 第 76 章 · 天干论
  quote: |
    "甲乙一木也，丙丁一火也……即分别取用，不过阳刚阴柔，阳健阴顺而已。命家作为歌赋，比喻失伦。……论断诸干如此之类，不一而足，当尽辟之。"
  rule: |
    甲乙同为一木、丙丁同为一火，区别只在阳刚阴柔；以「甲为栋梁、乙为藤萝」一类象物比喻论命属失伦，应当全部废除。
    取用只看生克与制化。
  trigger: 遇到以十干象物比喻断命时
  logic: 回到阴阳与生克，不按比喻取象
  boundary: 「只以阴阳取用，先看生克，随看制化」
  limits: 与渊海大量使用象物比喻（如甲为栋梁）相左
  novelty: contradicts
  relates: [D14]
  tags: [十干, 象物, 辟谬]

- id: c-my-0008
  domain: D02
  title: 阳不堪受克、阴不甚畏克；阴易从、阳难从
  source_id: src-mingli-yueyan
  location: 第 76 章 · 天干论
  quote: |
    "惟阳不堪受克，阴不甚畏克。阴易于他从，阳难于他从。此则少为异耳。"
  rule: |
    阳干不耐克、阴干不甚畏克；阴干容易顺从他人（从格），阳干难以从。
  trigger: 判日主阴阳与其承受克制的差异时
  logic: 阳干 → 更怕克、更难从；阴干 → 较耐克、更易从
  boundary: 这是阴阳干唯一实质差异；其余取用两者相同
  limits: 与《神峰通考》「六阴多作从化、六阳不能从化」相呼应，互为佐证
  novelty: contradicts
  relates: [D15]
  tags: [阴阳, 从格, 承克]

- id: c-my-0009
  domain: D02
  title: 分合与争合；见庚乙则各以煞劫论，不作妒合
  source_id: src-mingli-yueyan
  location: 第 78 章 · 干合论
  quote: |
    "所忌分合，如甲合己而又见一甲，己合甲而又见一己是也。又忌争合，如甲合己，而又见一己，己合甲而又见一甲是也。"
  rule: |
    合有两忌：分合（同一方重复出现，如甲合己又见一甲）与争合（对方重复，如甲合己又见一己）。
    若甲合己而见庚乙，则庚以煞论、乙以劫论，不再作妒合。
  trigger: 天干出现多重合时
  logic: 数同类之干 → 分合/争合 → 其他克合者按其十神本义论
  boundary: 「日遇合神，即无奋争，亦寻常未贵」，仍须合四柱观
  limits: 旧说取露干合支中暗干者「不可从」
  novelty: new
  relates: [D04]
  tags: [合, 争合, 分合]

- id: c-my-0010
  domain: D04
  title: 贪合使喜忌失效：癸日畏己得甲合之则不为祸
  source_id: src-mingli-yueyan
  location: 第 78 章 · 干合论
  quote: |
    "若癸日畏己，得甲合之，则贪合而不为癸祸。壬日爱己，遭甲合之，则贪合而不为壬福。"
  rule: |
    被合去的字不再按其本来喜忌起作用：癸日畏己土，甲合己则己不为祸；壬日爱己土，甲合己则己不为福。
    喜忌随合而变。
  trigger: 命局有合去喜神或忌神时
  logic: 判断该字是否被合去 → 合去则不参与喜忌
  boundary: 「喜忌之法，宜仿此意而推」——可类推到其他干
  limits: 与渊海「贪合忘官」同源，但本书给出正反两面
  novelty: extends
  relates: [D05]
  tags: [合, 喜忌, 贪合]

- id: c-my-0011
  domain: D03
  title: 相妙于旺、休甚于囚
  source_id: src-mingli-yueyan
  location: 第 85 章 · 五行旺相休囚论
  quote: |
    "然相妙于旺，旺则极盛之物，其退反速，相则方长之气，其进无涯也。休甚于囚，囚则既极之势，必将渐生，休则方退之神，未能遽复也。"
  rule: |
    在旺相休囚四级中，「相」（将旺未旺）优于「旺」（极盛易退）；「休」（初退）比「囚」（退极将生）更不利。
  trigger: 比较五行所处阶段时
  logic: 按「相 > 旺 > 囚 > 休」的趋势排序（对喜神而言）
  boundary: 对忌神则相反：喜旺相、忌休囚
  limits: 与渊海十二长生「长生冠带临官帝旺为吉」的排序不同，本书按进退趋势排序
  novelty: contradicts
  relates: [D04]
  tags: [旺相休囚, 趋势, 冲突]

- id: c-my-0012
  domain: D02
  title: 覆载论：干以载支为切、支以覆干为切
  source_id: src-mingli-yueyan
  location: 第 88 章 · 支干覆载论
  quote: |
    "取用干支之法，干以载之之支为切，支以覆之之干为切。如喜甲而载以寅卯亥子则生旺，载以申酉则克败矣。"
  rule: |
    天干看它所坐之地支是否生旺（载），地支看压它的天干是否生扶（覆）；
    干通根于支则根坚，支受荫于干则荫盛；反之受冲克则根拔、荫衰。
  trigger: 判断某干支的实际效力时
  logic: 干看坐支 → 支看盖干 → 判生旺或克败
  boundary: 「显然吉神而失其吉，确乎凶神而不为凶，皆是故也」
  limits: 与渊海「盖头说」互补：渊海讲天干压制，本书讲干支互载
  novelty: extends
  relates: [D03]
  tags: [覆载, 通根, 干支]

# 第三批：神煞论的辨析（94 贵人、97 空亡、99 纳音）

- id: c-my-0013
  domain: D11
  title: 天乙贵人是逐日临方，非十干各有固定贵位
  source_id: src-mingli-yueyan
  location: 第 94 章 · 贵人论
  quote: |
    "说者误以为十干之贵人，又误为十干各有阴贵阳贵，将贵人有十二矣。……当以夏至从丑起，冬至从未起为是。"
  rule: |
    天乙贵人按日逐位移动：夏至后自丑起逆行、冬至后从未起顺行，某干之日贵人临某一方；
    并非十干各有固定贵位，更不是十二个贵人。辰为天罗、戌为地网，贵人不临。
  trigger: 查天乙贵人时
  logic: 定日干 → 按夏至/冬至定顺逆起点 → 得当日贵人所临之支
  boundary: 命中有该支才算贵人正临；「贵人头上载财官」只是助吉一端，不可遽言贵格
  limits: 与渊海第 24 章「甲戊兼牛羊」的固定表不同，本书认为旧歌是「互文见意」被误读
  novelty: contradicts
  relates: [D05]
  tags: [神煞, 贵人, 冲突]

- id: c-my-0014
  domain: D11
  title: 空亡有真空半空：按得时失时打折，反对五行分空
  source_id: src-mingli-yueyan
  location: 第 97 章 · 空亡论
  quote: |
    "失时为真空，得时为半空。如命中吉神真空，则吉减十之七，半空则吉神减十之三。……夫空犹无也，有火斯发，无火何发乎？有金斯鸣，无金何鸣乎？五行勿分可也。"
  rule: |
    空亡分真空（失时）与半空（得时）：吉神真空则吉减七成、半空减三成；凶神同理。
    有扶助则真空降为半空；逢冲克则半空升为真空。空就是无，不必再按五行分「火空则发、金空则鸣」。
  trigger: 命局见空亡时
  logic: 判真空/半空 → 按吉凶神打折 → 再看出扶助或冲克
  boundary: 运逢原空之神为「填实」，不作愈空；原无而运遇者亦以空论
  limits: 直接裁决《渊海子平》第 47 章与第 142 章的「空亡五行吉凶」两说：本书认为无需分五行
  novelty: contradicts
  relates: [D05]
  tags: [空亡, 裁决, 冲突]

- id: c-my-0015
  domain: D11
  title: 纳音当置而不用
  source_id: src-mingli-yueyan
  location: 第 99 章 · 纳音论
  quote: |
    "尝考二法，虽理有可通，但吉凶颇多矛盾……不若置纳音而讲子平氏之术，较为直接简当。"
  rule: |
    纳音法（生年纳音为主、月日时纳音为辅）与子平日干法并用时吉凶常相矛盾，且纳音古法失传；
    论命应置纳音而专讲子平。
  trigger: 命局以纳音断吉凶时
  logic: 以日干五行生克为主，不参纳音
  boundary: 作者承认纳音「理有可通」，只是不宜混用
  limits: 与渊海专列纳音章相左；与神峰通考「纳音谬说」同阵营
  novelty: contradicts
  relates: [D05]
  tags: [纳音, 辟谬, 冲突]

# 第四批：十神各论与变局（20、21、28、33、34、42）

- id: c-my-0016
  domain: D08
  title: 看官先论日干强弱，官有二忌三忌
  source_id: src-mingli-yueyan
  location: 第 20 章 · 看正官法
  quote: |
    "看官之法，先论日干强弱。日干强则当扶官，日干若，则当扶日。……切忌有二：一曰冲破，一曰伤官。须忌有三：一曰食众暗损，一曰印众泄气，一曰时归死绝。"
  rule: |
    看正官先判日干强弱：日强扶官、日弱扶日；再论官星得时得势（当月令又透干为上）。
    官格二忌为冲破与伤官，三忌为食众暗损、印众泄气、时归死绝；官强遇五忌只减贵气，官弱遇则坏。
  trigger: 命局见正官时
  logic: 日干强弱 → 官星得时得势 → 逐条核五忌
  boundary: 官星太多须食伤制之，但「不作煞论」
  limits: 与渊海「正官忌刑冲破害」一致，本书把忌分为二忌三忌两级
  novelty: extends
  relates: [D04]
  tags: [正官, 忌法]

- id: c-my-0017
  domain: D08
  title: 反驳神峰「月令官星必无可用之理」
  source_id: src-mingli-yueyan
  location: 第 20 章 · 看正官法
  quote: |
    "若神峰张楠年时虚官可用，月令官星必无可用之理，此偏激之见，不足深信。"
  rule: |
    张楠（神峰通考）认为月令官星无可用之理、只年时虚官可用；陈素庵直斥此为偏激之见，不足深信。
  trigger: 引用神峰通考的「月上官无用」说时
  logic: 回到「日干能任财官」的总原则判断，不按官星位置一刀切
  boundary: 本书仍承认「日主无气、满局皆官」当弃命从之（从官）
  limits: 四书中关于正官的第一处正面交锋：神峰 vs 约言，采用后者
  novelty: contradicts
  relates: [D05]
  tags: [正官, 争论, 裁决]

- id: c-my-0018
  domain: D08
  title: 看煞：强弱定是否须制，制/合/化三法
  source_id: src-mingli-yueyan
  location: 第 21 章 · 看偏官法
  quote: |
    "看煞之法，先论日干强弱，日干强，则一点煞星亦可不制，日干弱，则不问煞之多寡，必须制之。……制之用食伤，食较有力，合之用刃劫，刃较有势，化之用印，偏正同功。"
  rule: |
    七杀是否须制取决于日干强弱：日强一点煞可不制，日弱则不论多寡必须制。
    处置三法：食伤制（食较有力）、刃劫合（刃较有势）、印绶化（偏正同功）。
  trigger: 命局见七杀时
  logic: 日干强弱 → 选制/合/化 → 煞太旺则制化两用（须食神配正印）
  boundary: 「身煞两停，行运宁可扶身」；阴日以制化为急
  limits: 与神峰「制杀不如化杀」部分一致（都重化），但本书保留制与合
  novelty: extends
  relates: [D04]
  tags: [七杀, 制化, 强弱]

- id: c-my-0019
  domain: D09
  title: 伤官不论真假，当论强弱（反驳神峰真假伤官）
  source_id: src-mingli-yueyan
  location: 第 28 章 · 看伤官法
  quote: |
    "旧又有以当令为真伤官，不当令为假伤官……不知伤官无论真假，当论强弱，强则制之……弱则复之。"
  rule: |
    旧说以当令为真伤官、不当令为假伤官；本书认为伤官不必分真假，只看强弱——
    伤官强则制之，弱则扶之。
  trigger: 判伤官格时
  logic: 判伤官强弱 → 强则制（印运为上、帮身次之）、弱则扶（伤食运为上、比劫次之）
  boundary: 伤官见官须分情况：身弱伤强有印可见官；身强财弱有比劫可见官；否则不可见
  limits: 直接反驳《神峰通考》第 17 章的真假伤官说，四书在 D09 上出现正面冲突
  novelty: contradicts
  relates: [D04]
  tags: [伤官, 真假, 争论]

- id: c-my-0020
  domain: D15
  title: 从局五类：从官、从煞、从财、从食、从伤
  source_id: src-mingli-yueyan
  location: 第 33 章 · 看从局法
  quote: |
    "凡看日主无根，满柱皆官则当从官，满柱皆煞则当从煞，满柱皆财则当从财，满柱皆食则当从食，满柱皆伤则当从伤。若满柱皆印绶，则无从理。"
  rule: |
    从局不止从财从煞：日主无根时，满柱皆官/煞/财/食/伤各从其神；唯满柱皆印无从理（印皆生身，旺甚无依）。
  trigger: 判从格时
  logic: 验日主无根 → 定所从之神 → 从神生旺则吉、受克或日主逢根则凶
  boundary: 「弃命」之名不当——从乃不弃，如驭马舟，顺其势而为我用
  limits: 比渊海、子平真诠的从财/从杀两类更宽，属本书的扩展
  novelty: extends
  relates: [D05]
  tags: [从格, 五类]

- id: c-my-0021
  domain: D15
  title: 化局以日主为主，合月时乃化，余干自合不算
  source_id: src-mingli-yueyan
  location: 第 34 章 · 看化局法
  quote: |
    "若世术于日干之外，余干见甲己二字，辄云化土，可作土用……夫化局以日主为主，合月时乃化，即合年亦不在化例。"
  rule: |
    化局只认日干与月干或时干相合；合年、或其余天干自相合，皆不作化局论。
  trigger: 命局出现天干相合时
  logic: 认合者是否为日干 → 合的是月/时干 → 才论化
  boundary: 辰戌丑未全见反不能化（四支互相冲掣）；化局不真而行运助化亦能荣达，运过则不利
  limits: 批评旧书「某局生某月则化」不尽然，并指出其自相矛盾之处
  novelty: contradicts
  relates: [D05]
  tags: [化局, 日主, 条件]

- id: c-my-0022
  domain: D06
  title: 贵贱看清贵二气，按分数定爵位
  source_id: src-mingli-yueyan
  location: 第 42 章 · 看贵贱法
  quote: |
    "阴阳有清气有贵气，人命兼得之，方享功名爵禄。凡日主高朗秀异，有拔俗出尘之相，所用格局纯粹清澈，条例井然，此清气也。日主尊严端重，有居高临众之相，所用格局，整肃宏远，规模涣然，此贵气也。"
  rule: |
    贵贱看「清」「贵」二气：日主高朗秀异 + 格局纯粹清澈 = 清气；日主尊严端重 + 格局整肃宏远 = 贵气。
    二气兼得方享功名爵禄，并按得气分数定爵位高低。
  trigger: 判断命局层次与贵贱时
  logic: 判清气（秀异纯粹）与贵气（尊严宏远）各得几分 → 对应爵禄
  boundary: 清而不贵只居闲曹、贵而不清或非科目；「似清而实浊、似贵而实贱」须细看
  limits: 分数划分是定性描述，无量化方法；批评旧书「任某官司某事」的断法
  novelty: new
  relates: [D04]
  tags: [贵贱, 清浊, 层次]

# 第五批：六亲（40）、性情（51）、疾病（52）、女命（53）、小运（101）

- id: c-my-0023
  domain: D12
  title: 旧六亲取法有十悖，改以印为父母、食伤为子女
  source_id: src-mingli-yueyan
  location: 第 40 章 · 看六亲法一
  quote: |
    "旧取正印生我为母，偏财克正印为父，我所克之财为妻，财所生之官煞为子。命家封为定法，实则悖戾多端……今定男以印为父母，食神伤官为子，我克之财为妻。"
  rule: |
    旧法（正印母、偏财父、财为妻、财生官杀为子）有十处悖戾，如「财为我所克，安能生我」「官煞克我，岂肯为我之子」。
    新定：男以印为父母、食伤为子女、我克之财为妻；女以印为父母翁姑、食伤为子女、官煞为夫；印不分偏正。
  trigger: 断六亲时
  logic: 以生我者为父母、我生者为子女、我克者为妻（男）、克我者为夫（女）
  boundary: 「命常有无印而父母贵寿者」——仍须合日主根气与全局
  limits: 与渊海、子平真诠的「偏财为父、七杀为子」正面冲突，是 D12 最大分歧
  novelty: contradicts
  relates: [D02]
  tags: [六亲, 重定义, 冲突]

- id: c-my-0024
  domain: D14
  title: 性情先看气势与取用，不以五行直断
  source_id: src-mingli-yueyan
  location: 第 51 章 · 看性情法
  quote: |
    "旧分五行抡人性情。此不可拘。……须先看柱中神情气势，或正大，或光显，或纯厚，或英发，皆贤人也。……然后以五行推之。"
  rule: |
    旧以五行论性情不可拘泥（木未必仁、金未必杀）；应先看命局神情气势（正大/光显/纯厚/英发为贤，偏驳/晦昧/刚戾/卑琐为不贤），
    再看取格取用是否中正显白，最后才以五行辅助推断。
  trigger: 推性情时
  logic: 气势 → 取格取用的清浊 → 五行辅助
  boundary: 神煞只作一端（二德多善、贵人多贤、空亡多虚、劫煞多暴），执一端必不验
  limits: 与渊海「五行配五常」的直断法冲突，本书要求先看整体气象
  novelty: contradicts
  relates: [D05]
  tags: [性情, 气势, 冲突]

- id: c-my-0025
  domain: D14
  title: 疾病看命局气象，不以某行直断
  source_id: src-mingli-yueyan
  location: 第 52 章 · 看疾病法
  quote: |
    "旧分五行，论人疾病，未尝不合于理。但人身脏腑经络，五行具全，人命柱中运中，五行未必全备，必以某行断其病，亦不尽然。须看日主及所用格局，或朗健，或中和，或平顺，皆无疾病之命。"
  rule: |
    人身五行俱全而命局未必全备，单以某行断病不成立；应先看日主与格局气象：
    朗健、中和、平顺者无病；晦弱、驳杂、乖戾者有疾。再兼看太过于不及与运中五行。
  trigger: 推疾病时
  logic: 命局气象 → 太过/不及 → 干支对应部位（以意消息）
  boundary: 干支配头目手足等「皆当以意消息之」，不可机械对应
  limits: 与渊海「五行配脏腑直断」相左，本书明确反对单行断病
  novelty: contradicts
  relates: [D03]
  tags: [疾病, 气象, 冲突]

- id: c-my-0026
  domain: D13
  title: 女命喜柔静，但须随强弱调整；一官之说非绝对
  source_id: src-mingli-yueyan
  location: 第 53 章 · 看女命法一
  quote: |
    "凡看女命，喜柔不喜刚，喜静不喜动……此大法也。然日主过弱，亦宜生之助之，夫子太旺，亦须损之泄之。……至旧书论女命，止许一官，不宜重见，此始两干两支，重见非宜耳。"
  rule: |
    女命大法喜柔静、恶刚动，夫子喜旺喜生、财印喜和、贵合喜少；但日主过弱仍须生助、夫子太旺仍须损泄。
    旧书「只许一官」并非绝对：官带禄有制则吉，官煞两遇而能去留得法亦无害。
  trigger: 分析女命时
  logic: 先按柔静大法 → 再看强弱调整 → 再核去留
  boundary: 「勿泥旧书妄造神煞」；贞邪顺戾只就五行与格局取断
  limits: 与渊海「女命只取一官」部分相左，本书给出「重见非宜但非绝对」的分寸
  novelty: contradicts
  relates: [D11]
  tags: [女命, 一官, 冲突]

- id: c-my-0027
  domain: D01
  title: 小运之说不可凭，作者主张削去
  source_id: src-mingli-yueyan
  location: 第 101 章 · 小运论
  quote: |
    "若小运则不论何年何月，所生男女，具起丙寅壬申，其理不确。……况有大运及流年，头绪己多，更加以小运，纷纭愈甚矣，故削之。"
  rule: |
    小运不分出生年月，男俱起丙寅、女俱起壬申，理据不足；且大运与流年已足够，再加小运只会更乱，故本书删去小运。
  trigger: 是否排小运时
  logic: 只用大运与流年；不排小运
  boundary: 作者也提到「从生时起小运」的旧法，同样判为「生造之说」
  limits: 与渊海第 56 章、神峰通考第 66 章都保留小运直接冲突——D01 出现第三种立场
  novelty: contradicts
  relates: [D07]
  tags: [小运, 删法, 冲突]
